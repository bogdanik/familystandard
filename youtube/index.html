<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FS Event System</title>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; font-family: sans-serif; color: #fff; overflow: hidden; }

    /* Idle-экран для зрителей (Заставка) */
    #idle-screen { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 10; display: flex; align-items: center; justify-content: center; background: #0a0a0a; }
    #idle-screen h1 { color: #333; font-size: 5vw; letter-spacing: 10px; text-transform: uppercase; }

    /* Главный плеер зрителя */
    #viewer-screen { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 20; display: none; background: #000; }
    #viewer-player { width: 100%; height: 100%; border: none; pointer-events: none; }

    /* UI Авторизации */
    #login-btn { position: absolute; top: 20px; right: 20px; z-index: 30; background: transparent; border: 1px solid #333; color: #555; padding: 10px 15px; border-radius: 8px; cursor: pointer; }
    #pin-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; background: #111; padding: 30px; border-radius: 12px; border: 1px solid #333; text-align: center; }
    #pin-modal input { width: 100%; padding: 15px; font-size: 20px; text-align: center; margin-bottom: 15px; background: #000; border: 1px solid #444; color: #fff; }
    #pin-modal button { width: 100%; padding: 15px; background: #d90429; color: #fff; border: none; font-size: 16px; cursor: pointer; font-weight: bold; }

    /* Пульт Ведущего */
    #host-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 50; background: #121212; padding: 20px; flex-direction: column; gap: 15px; }
    .input-row { display: flex; gap: 10px; }
    .input-row input { flex: 1; padding: 15px; font-size: 16px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
    .input-row button { padding: 0 20px; background: #d90429; color: #fff; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; }
    
    #host-monitor { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    .btn-clear { padding: 15px; background: #1a1a1a; color: #ff4d4d; border: 1px solid #333; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: auto; }
    .status-text { color: #888; font-size: 14px; text-align: center; }
  </style>
</head>
<body>

  <!-- Заставка -->
  <div id="idle-screen"><h1>Family Standard</h1></div>

  <!-- Кнопка и Модалка -->
  <button id="login-btn" onclick="document.getElementById('pin-modal').style.display='block'">Host</button>
  <div id="pin-modal">
    <input type="password" id="pin" placeholder="ПИН-КОД" maxlength="4">
    <button onclick="auth()">ВОЙТИ</button>
  </div>

  <!-- Экран Зрителя -->
  <div id="viewer-screen">
    <div id="viewer-player"></div>
  </div>

  <!-- Пульт -->
  <div id="host-screen">
    <div class="status-text" id="status">Откройте приложение YouTube, скопируйте ссылку и вернитесь сюда</div>
    
    <div class="input-row">
      <input type="text" id="manual-link" placeholder="Или вставьте ссылку вручную...">
      <button onclick="handleManualLink()">Play</button>
    </div>

    <div id="host-monitor">
      <div id="host-player"></div>
    </div>

    <div class="btn-clear" onclick="clearScreen()">Остановить и показать заставку</div>
  </div>

  <script>
    const SERVER_URL = "https://familystandard.onrender.com";
    const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
    
    let isHost = false;
    let vPlayer, hPlayer;
    let currentHostId = null;

    // Регулярка, которая вытаскивает ID из любых ссылок Ютуба
    function extractId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|.*embed\/))([^&?]{11})/);
      return match ? match[1] : (url.length === 11 ? url : null);
    }

    // --- Авторизация ---
    function auth() {
      socket.emit('auth_pin', { pin: document.getElementById('pin').value });
    }

    socket.on('auth_result', (data) => {
      if (data.success) {
        isHost = true;
        document.getElementById('pin-modal').style.display = 'none';
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('host-screen').style.display = 'flex';
        initHostPlayer();
      } else {
        alert("Неверный ПИН");
      }
    });

    // --- Инициализация плееров (Строго по документации YouTube API) ---
    function onYouTubeIframeAPIReady() {
      vPlayer = new YT.Player('viewer-player', {
        playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'rel': 0 },
        events: {
          'onReady': () => console.log("Viewer ready")
        }
      });
    }

    function initHostPlayer() {
      hPlayer = new YT.Player('host-player', {
        playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0 },
        events: {
          'onReady': (e) => e.target.mute(), // Ведущий не слышит звук
          'onStateChange': onHostStateChange
        }
      });
    }

    // --- Логика Ведущего ---
    function playOnHost(videoId) {
      if (!videoId || videoId === currentHostId) return;
      currentHostId = videoId;
      hPlayer.loadVideoById(videoId);
      document.getElementById('status').innerText = `Играет: ${videoId}`;
    }

    function handleManualLink() {
      const val = document.getElementById('manual-link').value;
      playOnHost(extractId(val));
      document.getElementById('manual-link').value = '';
    }

    function clearScreen() {
      socket.emit('clear_screen');
      if (hPlayer && hPlayer.stopVideo) hPlayer.stopVideo();
      currentHostId = null;
      document.getElementById('status').innerText = "Экран очищен";
    }

    // Отслеживаем паузы/перемотки на пульте и шлем на сервер
    function onHostStateChange(event) {
      if (!isHost) return;
      const vid = hPlayer.getVideoData().video_id;
      const time = hPlayer.getCurrentTime();
      
      if (event.data === YT.PlayerState.PLAYING) {
        socket.emit('host_action', { videoId: vid, action: 'play', time: time });
      } else if (event.data === YT.PlayerState.PAUSED) {
        socket.emit('host_action', { videoId: vid, action: 'pause', time: time });
      }
    }

    // --- МАГИЯ: Автоматическое чтение буфера обмена ---
    // Как только ведущий свернул Ютуб и открыл пульт, ссылка берется сама
    window.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible' && isHost) {
        try {
          const text = await navigator.clipboard.readText();
          const vid = extractId(text);
          if (vid && vid !== currentHostId) {
            playOnHost(vid);
          }
        } catch (err) {
          console.log("Clipboard read denied or empty");
        }
      }
    });

    // --- Логика Зрителя (Прием команд) ---
    socket.on('sync', (data) => {
      if (isHost) return;

      const vScreen = document.getElementById('viewer-screen');
      const idleScreen = document.getElementById('idle-screen');

      // Если пришла команда очистки
      if (!data.videoId) {
        vScreen.style.display = 'none';
        idleScreen.style.display = 'flex';
        if (vPlayer && vPlayer.stopVideo) vPlayer.stopVideo();
        return;
      }

      // Показываем плеер
      vScreen.style.display = 'block';
      idleScreen.style.display = 'none';
      document.getElementById('login-btn').style.display = 'none';

      // Управляем видео
      if (data.action === 'play') {
        const url = vPlayer.getVideoUrl();
        if (!url || !url.includes(data.videoId)) {
          vPlayer.loadVideoById(data.videoId, data.time);
        } else {
          vPlayer.seekTo(data.time, true);
          vPlayer.playVideo();
        }
      } else if (data.action === 'pause') {
        vPlayer.pauseVideo();
      }
    });
  </script>
</body>
</html>
