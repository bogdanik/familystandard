<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Standard Event</title>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; font-family: 'Roboto', 'Arial', sans-serif; color: #fff; }

    /* --- ЗАСТАВКА ЗРИТЕЛЕЙ --- */
    #idle-screen { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; }
    .fs-text { font-size: 5vw; font-weight: 300; color: #aaa; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; text-align: center; }
    .yt-logo-container { font-size: 8vw; font-weight: 700; color: #fff; letter-spacing: -2px; display: flex; align-items: center; }
    .yt-logo-red { background-color: #FF0000; color: #fff; padding: 0.5vw 2vw; border-radius: 1.5vw; margin-left: 5px; line-height: 1.1; }

    /* --- ВХОД ХОСТА --- */
    #login-btn { position: absolute; top: 15px; right: 15px; z-index: 30; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }
    #pin-modal { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 40; background: #181818; padding: 25px 20px; border-radius: 12px; border: 1px solid #333; text-align: center; width: 90%; max-width: 320px; }
    #pin-modal input { width: 100%; padding: 15px; font-size: 20px; text-align: center; margin-bottom: 15px; background: #000; border: 1px solid #444; color: #fff; border-radius: 8px; letter-spacing: 5px; }
    #pin-modal button { width: 100%; padding: 15px; background: #FF0000; color: #fff; border: none; font-size: 16px; cursor: pointer; font-weight: bold; border-radius: 8px; }

    /* --- ПЛЕЕР ЗРИТЕЛЯ --- */
    #viewer-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 20; background: #000; }
    #viewer-player { width: 100%; height: 100%; border: none; pointer-events: none; }

    /* --- ПУЛЬТ ВЕДУЩЕГО --- */
    #host-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 50; background: #0f0f0f; overflow-y: auto; }
    .host-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 15px; min-height: 100%; }
    
    .status-text { color: #aaa; font-size: 14px; text-align: center; font-weight: bold; }

    /* Ввод ссылки */
    .input-row { display: flex; gap: 8px; width: 100%; }
    .input-row input { flex: 1; min-width: 0; padding: 14px 10px; font-size: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
    .input-row button { padding: 0 15px; background: #FF0000; color: #fff; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    
    /* Монитор */
    #host-monitor { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #282828; }
    #host-player { width: 100%; height: 100%; border: none; }

    /* ПАНЕЛЬ УПРАВЛЕНИЯ */
    .control-panel { background: #151515; border: 1px solid #222; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    
    .seek-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .seek-row button { padding: 15px; background: #222; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.1s; }
    .seek-row button:active { background: #444; transform: scale(0.95); }

    .dashed-line { border: none; border-top: 2px dashed #444; margin: 5px 0; }

    .play-row button { width: 100%; padding: 20px; background: #FF0000; color: #fff; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-transform: uppercase; transition: 0.1s; }
    .play-row button.is-playing { background: #333; border: 1px solid #555; }
    .play-row button:active { transform: scale(0.98); }

    .stop-row { display: flex; justify-content: center; margin: 10px 0; }
    .btn-stop-square { width: 70px; height: 70px; background: #FF0000; border: none; border-radius: 8px; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 15px rgba(255,0,0,0.3); transition: 0.1s; }
    .btn-stop-square:active { transform: scale(0.9); box-shadow: none; }

    .vol-label { font-size: 12px; color: #888; text-align: center; text-transform: uppercase; margin-top: 10px; }
    .vol-row { display: flex; justify-content: space-between; gap: 5px; }
    .vol-row button { flex: 1; padding: 12px 0; background: #222; border: 1px solid #333; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
    .vol-row button.active { background: #fff; color: #000; border-color: #fff; }
  </style>
</head>
<body>

  <!-- Заставка Зрителя -->
  <div id="idle-screen">
    <div class="fs-text">Family Standard</div>
    <div class="yt-logo-container">You<span class="yt-logo-red">Tube</span></div>
  </div>

  <button id="login-btn" onclick="document.getElementById('pin-modal').style.display='block'">Host</button>
  
  <div id="pin-modal">
    <input type="password" id="pin" placeholder="ПИН" maxlength="4">
    <button onclick="auth()">ВОЙТИ</button>
  </div>

  <!-- Экран Зрителя -->
  <div id="viewer-screen">
    <div id="viewer-player"></div>
  </div>

  <!-- Пульт Ведущего -->
  <div id="host-screen">
    <div class="host-container">
      <div class="status-text" id="status">Вставьте ссылку на видео</div>
      
      <div class="input-row">
        <!-- Ссылка теперь не удаляется после нажатия -->
        <input type="text" id="manual-link" placeholder="Ссылка (например из 'Поделиться')...">
        <button onclick="handleManualLink()">Подготовить</button>
      </div>

      <!-- Монитор на телефоне -->
      <div id="host-monitor">
        <div id="host-player"></div>
      </div>

      <!-- Панель управления -->
      <div class="control-panel">
        <div class="seek-row">
          <button onclick="hostSeek(-10)">⏪ -10с</button>
          <button onclick="hostSeek(10)">+10с ⏩</button>
        </div>

        <hr class="dashed-line">

        <div class="play-row">
          <button id="btn-play-pause" onclick="togglePlayPause()">▶ PLAY</button>
        </div>

        <div class="stop-row">
          <!-- Красный квадрат для сброса -->
          <button class="btn-stop-square" onclick="clearScreen()">⏹</button>
        </div>

        <div class="vol-label">Уровень громкости</div>
        <div class="vol-row">
          <button id="vol-3" onclick="hostSetVolume(3)">3</button>
          <button id="vol-10" onclick="hostSetVolume(10)">10</button>
          <button id="vol-30" onclick="hostSetVolume(30)">30</button>
          <button id="vol-60" onclick="hostSetVolume(60)">60</button>
          <button id="vol-100" class="active" onclick="hostSetVolume(100)">100</button>
        </div>
      </div>
      
    </div>
  </div>

  <script>
    const SERVER_URL = "https://familystandard.onrender.com";
    const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
    
    let isHost = false;
    let vPlayer, hPlayer;
    let currentHostId = null;
    let currentVol = 100; // Текущая громкость для передачи
    let smoothVolInterval; // Интервал для плавной громкости

    function extractId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|.*embed\/))([^&?]{11})/);
      return match ? match[1] : (url.trim().length === 11 ? url.trim() : null);
    }

    // --- АВТОРИЗАЦИЯ ---
    function auth() {
      socket.emit('auth_pin', { pin: document.getElementById('pin').value });
    }

    socket.on('auth_result', (data) => {
      if (data.success) {
        isHost = true;
        document.getElementById('pin-modal').style.display = 'none';
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('host-screen').style.display = 'block';
        initHostPlayer();
      } else {
        alert("Неверный ПИН-код");
      }
    });

    // --- ПЛЕЕРЫ ---
    function onYouTubeIframeAPIReady() {
      vPlayer = new YT.Player('viewer-player', {
        playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'rel': 0, 'origin': window.location.origin }
      });
    }

    function initHostPlayer() {
      if (hPlayer) return;
      hPlayer = new YT.Player('host-player', {
        playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0, 'origin': window.location.origin },
        events: {
          'onReady': (e) => { e.target.mute(); }, // Хост всегда без звука
          'onStateChange': onHostStateChange
        }
      });
    }

    // --- ЛОГИКА ПУЛЬТА ---
    function handleManualLink() {
      const val = document.getElementById('manual-link').value;
      const vid = extractId(val);
      
      if (vid && hPlayer) {
        currentHostId = vid;
        // Подготавливаем видео (выводит обложку), не стираем ссылку из инпута
        hPlayer.cueVideoById(vid); 
        document.getElementById('status').innerText = `Готово! Нажмите Play`;
      }
    }

    // Универсальная кнопка-переключатель Play/Pause
    function togglePlayPause() {
      if (!hPlayer || !currentHostId) return;
      const state = hPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        hPlayer.pauseVideo();
      } else {
        hPlayer.playVideo();
      }
    }
    
    // Перемотка
    function hostSeek(seconds) {
      if (!hPlayer || !currentHostId) return;
      let newTime = Math.max(0, hPlayer.getCurrentTime() + seconds);
      hPlayer.seekTo(newTime, true);
      emitHostAction();
    }

    // Установка громкости (отправка на сервер)
    function hostSetVolume(vol) {
      currentVol = vol;
      // Обновляем визуал кнопок
      document.querySelectorAll('.vol-row button').forEach(b => b.classList.remove('active'));
      document.getElementById('vol-' + vol).classList.add('active');
      emitHostAction(); // Моментально шлем зрителям
    }

    // Кнопка СБРОСА (красный квадрат)
    function clearScreen() {
      socket.emit('clear_screen');
      if (hPlayer && hPlayer.stopVideo) hPlayer.stopVideo();
      currentHostId = null;
      document.getElementById('status').innerText = "На экранах заставка";
      updatePlayButtonUI(YT.PlayerState.PAUSED);
    }

    function onHostStateChange(event) {
      if (!isHost) return;
      if (document.hidden && event.data === YT.PlayerState.PAUSED) return; // Защита от блокировки телефона
      
      updatePlayButtonUI(event.data);
      emitHostAction();
    }

    // Обновление цвета и текста главной кнопки Play/Pause
    function updatePlayButtonUI(state) {
      const btn = document.getElementById('btn-play-pause');
      if (state === YT.PlayerState.PLAYING) {
        btn.innerText = '⏸ PAUSE';
        btn.classList.add('is-playing');
        document.getElementById('status').innerText = `Трансляция активна`;
      } else {
        btn.innerText = '▶ PLAY';
        btn.classList.remove('is-playing');
        if(currentHostId) document.getElementById('status').innerText = `Пауза`;
      }
    }

    // Отправка данных на сервер (хитро склеиваем state и громкость)
    function emitHostAction() {
      if (!hPlayer || !currentHostId) return;
      const state = hPlayer.getPlayerState() === YT.PlayerState.PLAYING ? 'play' : 'pause';
      const time = hPlayer.getCurrentTime();
      // Отправляем action в формате "play|100" чтобы не трогать Python-скрипт
      socket.emit('host_action', { videoId: currentHostId, action: `${state}|${currentVol}`, time: time });
    }

    // --- ПЛАВНАЯ ГРОМКОСТЬ (ДЛЯ ЗРИТЕЛЕЙ) ---
    function smoothVolumeTransition(targetVol) {
      if (!vPlayer || !vPlayer.getVolume) return;
      
      let current = vPlayer.getVolume();
      if (current === targetVol) return;
      
      clearInterval(smoothVolInterval);
      
      smoothVolInterval = setInterval(() => {
        current = vPlayer.getVolume();
        let diff = targetVol - current;
        
        if (Math.abs(diff) <= 2) {
          vPlayer.setVolume(targetVol);
          clearInterval(smoothVolInterval);
        } else {
          vPlayer.setVolume(current + Math.sign(diff) * 2);
        }
      }, 40); // 40мс * ~50 шагов = 2 секунды на плавное затухание/нарастание
    }

    // --- ЛОГИКА ПРИЕМА ДАННЫХ ЗРИТЕЛЯМИ ---
    socket.on('sync', (data) => {
      // 1. Возврат состояния для пульта ведущего (если перезагрузил страницу)
      if (isHost) {
        if (data.videoId && data.videoId !== currentHostId) {
          currentHostId = data.videoId;
          if (hPlayer && hPlayer.cueVideoById) {
            const parts = data.action.split('|');
            const actionStr = parts[0];
            if (actionStr === 'play') {
              hPlayer.loadVideoById(data.videoId, data.time);
            } else {
              hPlayer.cueVideoById(data.videoId, data.time);
            }
          }
        }
        return;
      }

      // 2. Обработка экрана зрителя
      const vScreen = document.getElementById('viewer-screen');
      const idleScreen = document.getElementById('idle-screen');

      // Сброс экрана (красный квадрат)
      if (!data.videoId) {
        vScreen.style.display = 'none';
        idleScreen.style.display = 'flex';
        if (vPlayer && vPlayer.stopVideo) vPlayer.stopVideo();
        return;
      }

      // Расшифровываем склеенную команду: "play|30" -> action: "play", volume: 30
      const parts = data.action.split('|');
      const actionStr = parts[0];
      const volTarget = parts.length > 1 ? parseInt(parts[1]) : null;

      // Запускаем плавную смену громкости
      if (volTarget !== null) {
        smoothVolumeTransition(volTarget);
      }

      idleScreen.style.display = 'none';
      document.getElementById('login-btn').style.display = 'none';
      vScreen.style.display = 'block';

      if (actionStr === 'play') {
        const url = vPlayer.getVideoUrl && vPlayer.getVideoUrl();
        if (!url || !url.includes(data.videoId)) {
          vPlayer.loadVideoById(data.videoId, data.time);
        } else {
          vPlayer.seekTo(data.time, true);
          vPlayer.playVideo();
        }
      } else if (actionStr === 'pause') {
        vPlayer.pauseVideo();
      }
    });
  </script>
</body>
</html>
