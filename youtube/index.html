<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Standard Event</title>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; font-family: 'Roboto', 'Arial', sans-serif; color: #fff; }

    /* --- ГЛОБАЛЬНЫЕ КНОПКИ ПОВЕРХ ВСЕГО --- */
    /* Левая полупрозрачная кнопка сброса (Всегда у всех) */
    #reset-btn { position: absolute; top: 15px; left: 15px; z-index: 9999; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); color: rgba(255,255,255,0.3); padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: 0.2s; }
    #reset-btn:active { background: rgba(255,0,0,0.2); color: #ff4d4d; }

    /* Правая кнопка Host */
    #login-btn { position: absolute; top: 15px; right: 15px; z-index: 9999; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 8px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; }

    /* --- ЗАСТАВКА --- */
    #idle-screen { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; }
    .fs-text { font-size: 5vw; font-weight: 300; color: #aaa; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; text-align: center; }
    .yt-logo-container { font-size: 8vw; font-weight: 700; color: #fff; letter-spacing: -2px; display: flex; align-items: center; }
    .yt-logo-red { background-color: #FF0000; color: #fff; padding: 0.5vw 2vw; border-radius: 1.5vw; margin-left: 5px; line-height: 1.1; }

    /* --- ПЛЕЕР ЗРИТЕЛЯ --- */
    #viewer-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 20; background: #000; }
    #viewer-player { width: 100%; height: 100%; border: none; pointer-events: none; }

    /* --- ПУЛЬТ ВЕДУЩЕГО --- */
    #host-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 50; background: #0f0f0f; overflow-y: auto; }
    .host-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 20px 15px; display: flex; flex-direction: column; min-height: 100%; }
    
    .status-text { color: #aaa; font-size: 14px; text-align: center; font-weight: bold; margin-bottom: 10px; }

    /* Инпут */
    .input-row { display: flex; gap: 8px; width: 100%; margin-bottom: 15px; }
    .input-row input { flex: 1; min-width: 0; padding: 14px 10px; font-size: 15px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
    .input-row button { padding: 0 15px; background: #222; color: #fff; border: 1px solid #333; font-weight: bold; border-radius: 8px; cursor: pointer; white-space: nowrap; }
    
    /* Монитор (Кастомный) */
    #host-monitor { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #282828; pointer-events: none; margin-bottom: 15px; }
    #host-player { width: 100%; height: 100%; border: none; }

    /* --- ГЛАВНАЯ ПАНЕЛЬ: УПРАВЛЕНИЕ В 1 СТРОКУ --- */
    .control-row { display: flex; justify-content: space-between; gap: 8px; width: 100%; margin-bottom: 20px; }
    .control-row button { flex: 1; padding: 18px 0; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.1s; }
    .control-row button:active { background: #333; transform: scale(0.95); }
    
    /* Play/Pause */
    .control-row .btn-play { background: #FF0000; border-color: #FF0000; font-size: 20px; }
    .control-row .btn-play.is-playing { background: #333; border-color: #555; }
    
    /* Красный квадрат (Stop) */
    .control-row .btn-stop { background: #1a1a1a; font-size: 22px; color: #FF0000; }

    /* --- ГРОМКОСТЬ --- */
    .vol-label { font-size: 12px; color: #888; text-align: center; text-transform: uppercase; margin-bottom: 8px; }
    .vol-row { display: flex; justify-content: space-between; gap: 5px; }
    .vol-row button { flex: 1; padding: 12px 0; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
    .vol-row button.active { background: #fff; color: #000; border-color: #fff; }

    /* --- ЛОГОТИП ВНИЗУ ПУЛЬТА --- */
    .host-footer { margin-top: auto; padding-top: 30px; padding-bottom: 10px; display: flex; flex-direction: column; align-items: center; opacity: 0.5; }
    .host-footer .fs-text { font-size: 16px; margin-bottom: 5px; letter-spacing: 2px; }
    .host-footer .yt-logo-container { font-size: 24px; }
    .host-footer .yt-logo-red { padding: 2px 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <!-- Глобальные кнопки -->
  <button id="reset-btn" onclick="globalReset()">Сброс</button>
  <button id="login-btn" onclick="auth()">Host</button>

  <!-- Заставка Зрителя -->
  <div id="idle-screen">
    <div class="fs-text">Family Standard</div>
    <div class="yt-logo-container">You<span class="yt-logo-red">Tube</span></div>
  </div>

  <!-- Экран Зрителя -->
  <div id="viewer-screen">
    <div id="viewer-player"></div>
  </div>

  <!-- Пульт Ведущего -->
  <div id="host-screen">
    <div class="host-container">
      <div class="status-text" id="status">Вставьте ссылку на видео</div>
      
      <div class="input-row">
        <!-- Ссылка остается в инпуте -->
        <input type="text" id="manual-link" placeholder="Вставьте ссылку...">
        <button onclick="handleManualLink()">Подготовить</button>
      </div>

      <!-- Монитор (Кастомный, Ютуб-кнопки отключены) -->
      <div id="host-monitor">
        <div id="host-player"></div>
      </div>

      <!-- УПРАВЛЕНИЕ В 1 СТРОКУ -->
      <div class="control-row">
        <button onclick="hostSeek(-10)">-10с</button>
        <button id="btn-play-pause" class="btn-play" onclick="togglePlayPause()">▶</button>
        <button class="btn-stop" onclick="globalReset()">🟥</button>
        <button onclick="hostSeek(10)">+10с</button>
      </div>

      <!-- ГРОМКОСТЬ -->
      <div class="vol-label">Уровень громкости на экранах</div>
      <div class="vol-row">
        <button id="vol-3" onclick="hostSetVolume(3)">3</button>
        <button id="vol-10" onclick="hostSetVolume(10)">10</button>
        <button id="vol-30" onclick="hostSetVolume(30)">30</button>
        <button id="vol-60" onclick="hostSetVolume(60)">60</button>
        <button id="vol-100" class="active" onclick="hostSetVolume(100)">100</button>
      </div>

      <!-- ЛОГОТИП ВНИЗУ ПУЛЬТА -->
      <div class="host-footer">
        <div class="fs-text">Family Standard</div>
        <div class="yt-logo-container">You<span class="yt-logo-red">Tube</span></div>
      </div>
      
    </div>
  </div>

  <script>
    const SERVER_URL = "https://familystandard.onrender.com";
    const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
    
    let isHost = false;
    let vPlayer, hPlayer;
    let preparedId = null;  // Видео, которое готово к запуску
    let currentHostId = null; // Видео, которое сейчас играет
    let currentVol = 100;
    let smoothVolInterval;

    function extractId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|.*embed\/))([^&?]{11})/);
      return match ? match[1] : (url.trim().length === 11 ? url.trim() : null);
    }

    // --- 1. АВТОРИЗАЦИЯ В 1 КЛИК ---
    function auth() {
      // Отправляем просто пустой запрос, ПИН больше не нужен
      socket.emit('auth_pin', {});
    }

    socket.on('auth_result', (data) => {
      if (data.success) {
        isHost = true;
        document.getElementById('login-btn').style.display = 'none'; // Хост прячет кнопку входа от себя
        document.getElementById('host-screen').style.display = 'block';
        initHostPlayer();
      }
    });

    // --- 2. ПЛЕЕРЫ (Кастомный режим: controls = 0) ---
    function onYouTubeIframeAPIReady() {
      vPlayer = new YT.Player('viewer-player', {
        playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1, 'origin': window.location.origin }
      });
    }

    function initHostPlayer() {
      if (hPlayer) return;
      hPlayer = new YT.Player('host-player', {
        playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1, 'origin': window.location.origin },
        events: {
          'onReady': (e) => { e.target.mute(); },
          'onStateChange': onHostStateChange
        }
      });
    }

    // --- 3. ГЛОБАЛЬНЫЙ СБРОС (Для кнопки "Сброс" и квадрата "🟥") ---
    function globalReset() {
      socket.emit('clear_screen');
      if (hPlayer && hPlayer.stopVideo) hPlayer.stopVideo();
      if (vPlayer && vPlayer.stopVideo) vPlayer.stopVideo();
      
      currentHostId = null;
      preparedId = null;
      
      const statusEl = document.getElementById('status');
      if (statusEl) statusEl.innerText = "Экран сброшен (Заставка)";
      
      updatePlayButtonUI(YT.PlayerState.PAUSED);
    }

    // --- 4. ЛОГИКА ПУЛЬТА ---
    function handleManualLink() {
      const val = document.getElementById('manual-link').value;
      const vid = extractId(val);
      
      if (vid && hPlayer) {
        preparedId = vid; // Запоминаем, но не запускаем
        document.getElementById('status').innerText = `Готово к запуску! Нажмите ▶`;
        
        // Если видео уже играло, очищаем его, чтобы старт был с нуля, но саму ссылку оставляем
        if (currentHostId !== preparedId && currentHostId !== null) {
          socket.emit('clear_screen');
          currentHostId = null;
        }
      }
    }

    function togglePlayPause() {
      if (!hPlayer || !preparedId) return;
      
      const state = hPlayer.getPlayerState();
      
      // Если уже играет -> ставим на паузу
      if (state === YT.PlayerState.PLAYING) {
        hPlayer.pauseVideo();
      } else {
        // Если новое видео -> загружаем жестко по клику (гарантирует запуск)
        if (currentHostId !== preparedId) {
          currentHostId = preparedId;
          hPlayer.loadVideoById(currentHostId);
        } else {
          // Если то же самое видео -> просто снимаем с паузы
          hPlayer.playVideo();
        }
      }
    }
    
    function hostSeek(seconds) {
      if (!hPlayer || !currentHostId) return;
      let newTime = Math.max(0, hPlayer.getCurrentTime() + seconds);
      hPlayer.seekTo(newTime, true);
      emitHostAction(); // Моментально отправляем зрителям
    }

    function hostSetVolume(vol) {
      currentVol = vol;
      document.querySelectorAll('.vol-row button').forEach(b => b.classList.remove('active'));
      document.getElementById('vol-' + vol).classList.add('active');
      emitHostAction();
    }

    function onHostStateChange(event) {
      if (!isHost) return;
      // Защита от авто-паузы телефона при блокировке экрана
      if (document.hidden && event.data === YT.PlayerState.PAUSED) return; 
      
      updatePlayButtonUI(event.data);
      emitHostAction();
    }

    function updatePlayButtonUI(state) {
      const btn = document.getElementById('btn-play-pause');
      if (state === YT.PlayerState.PLAYING) {
        btn.innerText = '⏸';
        btn.classList.add('is-playing');
        document.getElementById('status').innerText = `Трансляция активна`;
      } else {
        btn.innerText = '▶';
        btn.classList.remove('is-playing');
        if (currentHostId) document.getElementById('status').innerText = `Пауза`;
      }
    }

    function emitHostAction() {
      if (!hPlayer || !currentHostId) return;
      const state = hPlayer.getPlayerState() === YT.PlayerState.PLAYING ? 'play' : 'pause';
      const time = hPlayer.getCurrentTime();
      socket.emit('host_action', { videoId: currentHostId, action: `${state}|${currentVol}`, time: time });
    }

    // --- ПЛАВНАЯ ГРОМКОСТЬ ЗРИТЕЛЕЙ ---
    function smoothVolumeTransition(targetVol) {
      if (!vPlayer || !vPlayer.getVolume) return;
      let current = vPlayer.getVolume();
      if (current === targetVol) return;
      
      clearInterval(smoothVolInterval);
      smoothVolInterval = setInterval(() => {
        current = vPlayer.getVolume();
        let diff = targetVol - current;
        if (Math.abs(diff) <= 2) {
          vPlayer.setVolume(targetVol);
          clearInterval(smoothVolInterval);
        } else {
          vPlayer.setVolume(current + Math.sign(diff) * 2);
        }
      }, 40);
    }

    // --- 5. ПРИЕМ КОМАНД ЗРИТЕЛЯМИ ---
    socket.on('sync', (data) => {
      // 1. Восстановление сессии для Ведущего (если обновил страницу)
      if (isHost) {
        if (data.videoId && data.videoId !== currentHostId) {
          currentHostId = data.videoId;
          preparedId = data.videoId;
          if (hPlayer && hPlayer.loadVideoById) {
            const actionStr = data.action.split('|')[0];
            if (actionStr === 'play') {
              hPlayer.loadVideoById(data.videoId, data.time);
            }
          }
        }
        return;
      }

      // 2. Экраны Зрителей
      const vScreen = document.getElementById('viewer-screen');
      const idleScreen = document.getElementById('idle-screen');

      // Если глобальный сброс
      if (!data.videoId) {
        vScreen.style.display = 'none';
        idleScreen.style.display = 'flex';
        // Возвращаем кнопку Host зрителям (вдруг кто-то захочет перехватить пульт)
        document.getElementById('login-btn').style.display = 'block';
        if (vPlayer && vPlayer.stopVideo) vPlayer.stopVideo();
        return;
      }

      // Распаковка команды
      const parts = data.action.split('|');
      const actionStr = parts[0];
      const volTarget = parts.length > 1 ? parseInt(parts[1]) : null;

      // Громкость
      if (volTarget !== null) smoothVolumeTransition(volTarget);

      // Показ видео
      idleScreen.style.display = 'none';
      document.getElementById('login-btn').style.display = 'none'; // Скрываем Host, чтобы не мешало смотреть
      vScreen.style.display = 'block';

      if (actionStr === 'play') {
        const url = vPlayer.getVideoUrl && vPlayer.getVideoUrl();
        if (!url || !url.includes(data.videoId)) {
          vPlayer.loadVideoById(data.videoId, data.time);
        } else {
          vPlayer.seekTo(data.time, true);
          vPlayer.playVideo();
        }
      } else if (actionStr === 'pause') {
        vPlayer.pauseVideo();
      }
    });
  </script>
</body>
</html>
