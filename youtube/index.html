<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Standard Event</title>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0f0f0f; font-family: 'Roboto', 'Arial', sans-serif; color: #fff; }

    #reset-btn { position: absolute; top: 12px; left: 12px; z-index: 9999; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }
    #reset-btn:active { background: rgba(255,0,0,0.3); color: #fff; }
    #login-btn { position: absolute; top: 12px; right: 12px; z-index: 9999; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

    /* ЗАСТАВКА */
    #idle-screen { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0f0f0f; }
    .fs-text { font-size: 5vw; font-weight: 300; color: #aaa; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; text-align: center; }
    .yt-logo-container { font-size: 8vw; font-weight: 700; color: #fff; letter-spacing: -2px; display: flex; align-items: center; }
    .yt-logo-red { background-color: #FF0000; color: #fff; padding: 0.5vw 2vw; border-radius: 1.5vw; margin-left: 5px; line-height: 1.1; }

    /* ПЛЕЕР ЗРИТЕЛЯ */
    #viewer-screen { opacity: 0; visibility: hidden; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 20; background: #000; transition: opacity 0.2s ease; }
    #viewer-player { width: 100%; height: 100%; border: none; pointer-events: none; }

    /* МЕНЮ ПОИСКА НА БОЛЬШОМ ЭКРАНЕ */
    #search-viewer-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 15; background: #080808; flex-direction: column; padding: 4vw; }
    .sv-title { font-size: 3vw; color: #fff; margin-bottom: 3vw; font-weight: 300; text-align: center; letter-spacing: 2px; }
    .sv-title span { font-weight: bold; color: #FF0000; }
    .sv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; flex: 1; align-items: center; }
    .sv-card { background: #151515; border-radius: 1vw; overflow: hidden; position: relative; border: 2px solid #282828; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .sv-card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .sv-card .sv-info { padding: 1.5vw; }
    .sv-card .sv-video-title { font-size: 1.6vw; color: #fff; font-weight: bold; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    .sv-badge { position: absolute; top: 0; left: 0; background: #FF0000; color: #fff; font-size: 3.5vw; font-weight: bold; padding: 0.5vw 2vw; border-bottom-right-radius: 1vw; z-index: 2; box-shadow: 2px 2px 15px rgba(0,0,0,0.5); }

    /* ПУЛЬТ ВЕДУЩЕГО */
    #host-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 50; background: #0f0f0f; overflow-y: auto; }
    .host-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; min-height: 100%; }
    
    .input-row { display: flex; gap: 8px; width: 100%; margin-bottom: 10px; }
    .input-row input { flex: 1; min-width: 0; padding: 12px 10px; font-size: 14px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; }
    .input-row button { padding: 0 14px; background: #222; color: #fff; border: 1px solid #333; font-weight: bold; border-radius: 8px; cursor: pointer; }
    
    #host-monitor { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #282828; pointer-events: none; margin-bottom: 8px; }
    #host-player { width: 100%; height: 100%; border: none; }

    .control-row { display: flex; justify-content: space-between; gap: 8px; width: 100%; margin-bottom: 15px; margin-top: 10px; }
    .control-row button { flex: 1; padding: 16px 0; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.1s; }
    .control-row button:active { background: #333; transform: scale(0.95); }
    .control-row .btn-play { background: #FF0000; border-color: #FF0000; font-size: 18px; }
    .control-row .btn-play.is-playing { background: #333; border-color: #555; }
    .control-row .btn-stop { background: #1a1a1a; font-size: 16px; color: #FF0000; border-color: #333; }

    .vol-label { font-size: 11px; color: #888; text-align: center; text-transform: uppercase; margin-bottom: 6px; }
    .vol-row { display: flex; justify-content: space-between; gap: 5px; margin-bottom: 20px; }
    .vol-row button { flex: 1; padding: 10px 0; background: #1a1a1a; border: 1px solid #333; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; font-size: 12px; }
    .vol-row button.active { background: #fff; color: #000; border-color: #fff; }

    .dashed-line { border-top: 2px dashed #333; margin-bottom: 15px; }
    .search-pagination { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .search-pagination button { padding: 10px 15px; background: #222; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .search-pagination button:disabled { opacity: 0.3; cursor: not-allowed; }
    .search-pagination span { font-size: 13px; color: #aaa; font-weight: bold; }
    
    .search-grid-host { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    .search-card-host { background: #1a1a1a; border: 1px solid #333; border-radius: 8px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
    .search-card-host:active { border-color: #ff0000; }
    .search-card-host img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .search-card-host .info { padding: 8px; font-size: 11px; }
    .search-card-host .title { font-weight: bold; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .search-card-host .badge { position: absolute; background: #ff0000; color: #fff; font-size: 13px; font-weight: bold; padding: 2px 8px; border-bottom-right-radius: 8px; z-index: 2; }

    .host-footer { margin-top: auto; padding-top: 20px; padding-bottom: 10px; display: flex; flex-direction: column; align-items: center; opacity: 0.4; }
    .host-footer .fs-text { font-size: 3.5vw; margin-bottom: 3px; letter-spacing: 2px; }
    .host-footer .yt-logo-container { font-size: 5vw; }
    .host-footer .yt-logo-red { padding: 2px 8px; border-radius: 6px; }
  </style>
</head>
<body>

  <button id="reset-btn" onclick="globalHardReset()">Сброс</button>
  <button id="login-btn" onclick="auth()">Host</button>

  <div id="idle-screen">
    <div class="fs-text">Family Standard</div>
    <div class="yt-logo-container">You<span class="yt-logo-red">Tube</span></div>
  </div>

  <div id="viewer-screen">
    <div id="viewer-player"></div>
  </div>

  <div id="search-viewer-screen">
    <div class="sv-title" id="sv-title">Запрос: <span>...</span></div>
    <div class="sv-grid" id="sv-grid"></div>
  </div>

  <div id="host-screen">
    <div class="host-container">
      
      <div class="input-row">
        <input type="text" id="manual-link" placeholder="Прямая ссылка...">
        <button onclick="handleManualLink()">Подготовить</button>
      </div>

      <div id="host-monitor">
        <div id="host-player"></div>
      </div>

      <div class="control-row">
        <button onclick="hostSeek(-10)">-10с</button>
        <button id="btn-play-pause" class="btn-play" onclick="togglePlayPause()">▶</button>
        <button class="btn-stop" onclick="clearScreen()">🟥</button>
        <button onclick="hostSeek(10)">+10с</button>
      </div>

      <div class="vol-label">Громкость</div>
      <div class="vol-row">
        <button id="vol-3" onclick="hostSetVolume(3)">3</button>
        <button id="vol-10" onclick="hostSetVolume(10)">10</button>
        <button id="vol-30" onclick="hostSetVolume(30)">30</button>
        <button id="vol-60" onclick="hostSetVolume(60)">60</button>
        <button id="vol-100" class="active" onclick="hostSetVolume(100)">100</button>
      </div>

      <div class="dashed-line"></div>
      <div class="input-row">
        <input type="text" id="search-query" placeholder="Поиск (например: Градусы Голая)..." onkeydown="if(event.key==='Enter') performSearch()">
        <button id="search-btn" onclick="performSearch()">Найти</button>
      </div>
      
      <div class="search-pagination" id="search-pagination" style="display:none;">
        <button id="page-prev" onclick="changeSearchPage(-1)">◀ Назад</button>
        <span id="page-info">Стр. 1</span>
        <button id="page-next" onclick="changeSearchPage(1)">Вперед ▶</button>
      </div>
      
      <div class="search-grid-host" id="search-results-host"></div>

      <div class="host-footer">
        <div class="fs-text">Family Standard</div>
        <div class="yt-logo-container">You<span class="yt-logo-red">Tube</span></div>
      </div>
      
    </div>
  </div>

  <script>
    const SERVER_URL = "https://familystandard.onrender.com";
    const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
    
    let isHost = false;
    let vPlayer, hPlayer;
    let vPlayerReady = false; 
    let hPlayerReady = false;

    let preparedId = null;  
    let currentHostId = null; 
    let currentVol = 100;
    let smoothVolInterval;

    let allSearchResults = [];
    let currentSearchPage = 0;
    let currentQuery = "";

    function extractId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|.*embed\/))([^&?]{11})/);
      return match ? match[1] : (url.trim().length === 11 ? url.trim() : null);
    }

    function auth() { socket.emit('auth_pin', {}); }
    
    socket.on('auth_result', (data) => {
      if (data.success) {
        isHost = true;
        // Очищаем экраны зрителей, чтобы пульт ведущего не перекрывался
        document.getElementById('idle-screen').style.display = 'none';
        document.getElementById('viewer-screen').style.opacity = '0';
        document.getElementById('viewer-screen').style.visibility = 'hidden';
        document.getElementById('search-viewer-screen').style.display = 'none';
        
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('host-screen').style.display = 'block';
        
        initPlayersIfReady();
      } else {
        alert("ОШИБКА: Сервер отклонил запрос! Убедись, что новый app.py загружен на Render и запущен.");
      }
    });

    function globalHardReset() { socket.emit('full_reset'); }

    function initPlayersIfReady() {
      if (window.YT && window.YT.Player) {
        if (!vPlayer) {
          vPlayer = new YT.Player('viewer-player', {
            playerVars: { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1, 'origin': window.location.origin },
            events: { 'onReady': () => { vPlayerReady = true; } }
          });
        }
        if (isHost && !hPlayer) {
          hPlayer = new YT.Player('host-player', {
            playerVars: { 'autoplay': 0, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1, 'origin': window.location.origin },
            events: {
              'onReady': (e) => { e.target.mute(); hPlayerReady = true; },
              'onStateChange': onHostStateChange
            }
          });
        }
      }
    }
    function onYouTubeIframeAPIReady() { initPlayersIfReady(); }
    setInterval(initPlayersIfReady, 500); 

    function handleManualLink() {
      const vid = extractId(document.getElementById('manual-link').value);
      if (vid && hPlayerReady) {
        preparedId = vid;
        if (currentHostId !== preparedId && currentHostId !== null) {
          socket.emit('clear_screen');
          currentHostId = null;
        }
      }
    }

    function togglePlayPause() {
      if (!hPlayerReady || !preparedId) return;
      const state = hPlayer.getPlayerState();
      if (state === YT.PlayerState.PLAYING) {
        hPlayer.pauseVideo();
      } else {
        if (currentHostId !== preparedId) {
          currentHostId = preparedId;
          hPlayer.loadVideoById(currentHostId);
        } else {
          hPlayer.playVideo();
        }
      }
    }
    
    function hostSeek(seconds) {
      if (!hPlayerReady || !currentHostId) return;
      let newTime = Math.max(0, hPlayer.getCurrentTime() + seconds);
      hPlayer.seekTo(newTime, true);
      emitHostAction(); 
    }

    function hostSetVolume(vol) {
      currentVol = vol;
      document.querySelectorAll('.vol-row button').forEach(b => b.classList.remove('active'));
      document.getElementById('vol-' + vol).classList.add('active');
      emitHostAction();
    }

    function clearScreen() {
      socket.emit('clear_screen');
      if (hPlayerReady && hPlayer.stopVideo) hPlayer.stopVideo();
      currentHostId = null;
      updatePlayButtonUI(YT.PlayerState.PAUSED);
    }

    function onHostStateChange(event) {
      if (!isHost) return;
      if (document.hidden && event.data === YT.PlayerState.PAUSED) return; 
      updatePlayButtonUI(event.data);
      emitHostAction();
    }

    function updatePlayButtonUI(state) {
      const btn = document.getElementById('btn-play-pause');
      if (state === YT.PlayerState.PLAYING) {
        btn.innerText = '⏸'; btn.classList.add('is-playing');
      } else {
        btn.innerText = '▶'; btn.classList.remove('is-playing');
      }
    }

    function emitHostAction() {
      if (!hPlayerReady || !currentHostId) return;
      const state = hPlayer.getPlayerState() === YT.PlayerState.PLAYING ? 'play' : 'pause';
      const time = hPlayer.getCurrentTime();
      socket.emit('host_action', { videoId: currentHostId, action: `${state}|${currentVol}`, time: time });
    }

    async function performSearch() {
      const q = document.getElementById('search-query').value.trim();
      if (!q) return;
      currentQuery = q;
      
      const btn = document.getElementById('search-btn');
      btn.innerText = '⏳';
      
      try {
        const res = await fetch(`${SERVER_URL}/api/search?q=${encodeURIComponent(q)}`);
        allSearchResults = await res.json();
        currentSearchPage = 0;
        renderSearchPage();
      } catch (e) {
        alert('Ошибка при поиске');
      }
      btn.innerText = 'Найти';
    }

    function changeSearchPage(dir) {
      currentSearchPage += dir;
      renderSearchPage();
    }

    function renderSearchPage() {
      const grid = document.getElementById('search-results-host');
      const pag = document.getElementById('search-pagination');
      
      grid.innerHTML = '';
      if (allSearchResults.length === 0) {
        pag.style.display = 'none';
        grid.innerHTML = '<div style="color:#888; text-align:center; padding:10px; grid-column:span 2;">Ничего не найдено</div>';
        return;
      }

      pag.style.display = 'flex';
      document.getElementById('page-prev').disabled = currentSearchPage === 0;
      document.getElementById('page-next').disabled = (currentSearchPage * 6 + 6) >= allSearchResults.length;
      document.getElementById('page-info').innerText = `Стр. ${currentSearchPage + 1}`;

      const start = currentSearchPage * 6;
      const slice = allSearchResults.slice(start, start + 6);

      slice.forEach((item, idx) => {
        const num = idx + 1;
        const card = document.createElement('div');
        card.className = 'search-card-host';
        card.onclick = () => hostPlaySearchResult(item.videoId);
        card.innerHTML = `
          <div style="position:relative;">
            <div class="badge">${num}</div>
            <img src="${item.thumbnail}" alt="thumb">
          </div>
          <div class="info">
            <div class="title">${item.title}</div>
            <div style="color:#888; margin-top:2px;">${item.duration}</div>
          </div>
        `;
        grid.appendChild(card);
      });

      socket.emit('host_search', { query: currentQuery, results: slice });
    }

    function hostPlaySearchResult(vid) {
      preparedId = vid;
      currentHostId = vid;
      if (hPlayerReady) hPlayer.loadVideoById(vid);
    }

    function smoothVolumeTransition(targetVol) {
      if (!vPlayerReady || !vPlayer.getVolume) return;
      let current = vPlayer.getVolume();
      if (current === targetVol) return;
      clearInterval(smoothVolInterval);
      smoothVolInterval = setInterval(() => {
        current = vPlayer.getVolume();
        let diff = targetVol - current;
        if (Math.abs(diff) <= 2) {
          vPlayer.setVolume(targetVol); clearInterval(smoothVolInterval);
        } else {
          vPlayer.setVolume(current + Math.sign(diff) * 2);
        }
      }, 40);
    }

    socket.on('force_reload', () => { window.location.reload(true); });

    socket.on('sync', (data) => {
      if (isHost) {
        if (data.mode === 'idle') {
           document.getElementById('manual-link').value = '';
           document.getElementById('search-query').value = '';
           currentHostId = null;
           preparedId = null;
           if (hPlayerReady && hPlayer.stopVideo) hPlayer.stopVideo();
           updatePlayButtonUI(YT.PlayerState.PAUSED);
        } else if (data.mode === 'video' && data.videoId) {
           if (data.videoId !== currentHostId) {
             currentHostId = data.videoId;
             preparedId = data.videoId;
             if (hPlayerReady) hPlayer.loadVideoById(data.videoId, data.time);
           }
        }
        return; 
      }

      const idleScreen = document.getElementById('idle-screen');
      const vScreen = document.getElementById('viewer-screen');
      const sScreen = document.getElementById('search-viewer-screen');

      if (data.mode === 'idle') {
        vScreen.style.opacity = '0'; vScreen.style.visibility = 'hidden';
        sScreen.style.display = 'none';
        idleScreen.style.display = 'flex';
        document.getElementById('login-btn').style.display = 'block';
        if (vPlayerReady && vPlayer.stopVideo) vPlayer.stopVideo();
      } else if (data.mode === 'search') {
        vScreen.style.opacity = '0'; vScreen.style.visibility = 'hidden';
        idleScreen.style.display = 'none';
        document.getElementById('login-btn').style.display = 'none';
        
        document.getElementById('sv-title').innerHTML = `Запрос: <span>${data.searchQuery}</span>`;
        const grid = document.getElementById('sv-grid');
        grid.innerHTML = '';
        
        data.searchResults.forEach((item, idx) => {
          const num = idx + 1;
          const card = document.createElement('div');
          card.className = 'sv-card';
          card.innerHTML = `
            <div class="sv-badge">${num}</div>
            <img src="${item.thumbnail}">
            <div class="sv-info">
              <div class="sv-video-title">${item.title}</div>
            </div>
          `;
          grid.appendChild(card);
        });

        sScreen.style.display = 'flex';
        if (vPlayerReady && vPlayer.pauseVideo) vPlayer.pauseVideo();
      } else if (data.mode === 'video') {
        idleScreen.style.display = 'none';
        sScreen.style.display = 'none';
        document.getElementById('login-btn').style.display = 'none';
        vScreen.style.opacity = '1'; vScreen.style.visibility = 'visible';

        if (!vPlayerReady) return; 

        const parts = data.action.split('|');
        const actionStr = parts[0];
        const volTarget = parts.length > 1 ? parseInt(parts[1]) : null;

        if (volTarget !== null) smoothVolumeTransition(volTarget);

        if (actionStr === 'play') {
          const url = vPlayer.getVideoUrl && vPlayer.getVideoUrl();
          if (!url || !url.includes(data.videoId)) {
            vPlayer.loadVideoById(data.videoId, data.time);
          } else {
            vPlayer.seekTo(data.time, true);
            vPlayer.playVideo();
          }
        } else if (actionStr === 'pause') {
          vPlayer.pauseVideo();
        }
      }
    });
  </script>
</body>
</html>
