<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Standard Event</title>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #080808; font-family: 'Roboto', 'Arial', sans-serif; color: #fff; }

    /* ГЛОБАЛЬНЫЕ КНОПКИ */
    #reset-btn { position: absolute; top: 12px; left: 12px; z-index: 9999; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: 0.2s; }
    #reset-btn:active { background: rgba(255,0,0,0.3); color: #fff; border-color: #ff0000; }
    #login-btn { position: absolute; top: 12px; right: 12px; z-index: 9999; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #888; padding: 6px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; }

    /* ЗАСТАВКА */
    #idle-screen { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #080808; }
    .fs-text { font-size: 5vw; font-weight: 300; color: #aaa; letter-spacing: 3px; margin-bottom: 10px; text-transform: uppercase; text-align: center; }
    .yt-logo-container { font-size: 8vw; font-weight: 700; color: #fff; letter-spacing: -2px; display: flex; align-items: center; }
    .yt-logo-red { background-color: #FF0000; color: #fff; padding: 0.5vw 2vw; border-radius: 1.5vw; margin-left: 5px; line-height: 1.1; }

    /* ПЛЕЕР ЗРИТЕЛЯ */
    #viewer-screen { opacity: 0; visibility: hidden; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 20; background: #000; transition: opacity 0.3s ease; }
    #viewer-player { width: 100%; height: 100%; border: none; pointer-events: none; }

    /* --- НОВЫЙ ДИЗАЙН МЕНЮ ПОИСКА НА ЭКРАНАХ --- */
    #search-viewer-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 15; background: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%); flex-direction: column; justify-content: center; align-items: center; padding: 4vh 4vw; }
    
    .sv-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; width: 100%; max-width: 85vw; max-height: 75vh; }
    
    .sv-card { background: #000; border-radius: 1vw; overflow: hidden; position: relative; border: 0.2vw solid #333; box-shadow: 0 1vw 3vw rgba(0,0,0,0.6); aspect-ratio: 16/9; }
    .sv-card img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    /* Градиент и инфо внутри карточки */
    .sv-overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0) 100%); padding: 4vw 1.5vw 1vw 1.5vw; display: flex; justify-content: space-between; align-items: flex-end; gap: 1vw; z-index: 2; }
    .sv-video-title { font-size: 1.6vw; color: #fff; font-weight: bold; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; text-shadow: 1px 1px 4px #000; flex: 1; }
    .sv-badge { font-size: 2.5vw; font-weight: bold; color: rgba(255, 255, 255, 0.4); line-height: 1; text-shadow: 1px 1px 3px rgba(0,0,0,0.8); }
    
    .sv-title { font-size: 3vh; color: #888; text-transform: uppercase; letter-spacing: 3px; margin-top: 4vh; }
    .sv-title span { font-weight: bold; color: #fff; font-size: 3.5vh; margin-left: 10px; }

    /* ПУЛЬТ ВЕДУЩЕГО */
    #host-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 50; background: #0a0a0a; overflow-y: auto; }
    .host-container { width: 100%; max-width: 500px; margin: 0 auto; padding: 15px; display: flex; flex-direction: column; min-height: 100%; }
    
    .input-row { display: flex; gap: 8px; width: 100%; margin-bottom: 12px; }
    .input-row input { flex: 1; min-width: 0; padding: 14px 12px; font-size: 15px; background: #111; border: 1px solid #333; color: #fff; border-radius: 8px; }
    .input-row button { padding: 0 16px; background: #222; color: #fff; border: 1px solid #444; font-weight: bold; border-radius: 8px; cursor: pointer; }
    .input-row button:active { background: #444; }
    
    #host-monitor { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; pointer-events: none; margin-bottom: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    #host-player { width: 100%; height: 100%; border: none; }

    .timeline-box { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-bottom: 15px; background: #111; padding: 12px; border-radius: 8px; border: 1px solid #222; }
    .timeline-box input[type=range] { width: 100%; accent-color: #FF0000; cursor: pointer; }
    .time-display { display: flex; justify-content: space-between; font-size: 12px; color: #888; font-family: monospace; font-weight: bold; }

    .control-row { display: flex; justify-content: space-between; gap: 8px; width: 100%; margin-bottom: 15px; }
    .control-row button { flex: 1; padding: 16px 0; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.1s; }
    .control-row button:active { background: #333; transform: scale(0.95); }
    .control-row .btn-play { background: #FF0000; border-color: #FF0000; font-size: 18px; }
    .control-row .btn-play.is-playing { background: #222; border-color: #555; }
    .control-row .btn-stop { background: #1a1a1a; font-size: 16px; color: #FF0000; border-color: #333; }

    .vol-row { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 25px; }
    .vol-row button { flex: 1; padding: 12px 0; background: #111; border: 1px solid #333; border-radius: 6px; color: #888; font-weight: bold; cursor: pointer; font-size: 13px; }
    .vol-row button.active { background: #fff; color: #000; border-color: #fff; }

    /* НОВЫЙ ДИЗАЙН КАРТОЧЕК НА ПУЛЬТЕ (По аналогии со зрителями) */
    .dashed-line { border-top: 2px dashed #222; margin-bottom: 20px; }
    .search-pagination { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .search-pagination button { padding: 12px 18px; background: #1a1a1a; color: #fff; border: 1px solid #333; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .search-pagination button:disabled { opacity: 0.3; cursor: not-allowed; border-color: transparent; }
    .search-pagination span { font-size: 14px; color: #aaa; font-weight: bold; }
    
    .search-grid-host { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .search-card-host { background: #111; border: 1px solid #333; border-radius: 8px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; position: relative; aspect-ratio: 16/9; transition: 0.1s; }
    .search-card-host:active { border-color: #ff0000; transform: scale(0.98); }
    .search-card-host img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; top: 0; left: 0; z-index: 1; }
    
    .search-card-host .overlay { position: absolute; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0) 100%); padding: 25px 8px 8px 8px; display: flex; justify-content: space-between; align-items: flex-end; gap: 5px; z-index: 2; }
    .search-card-host .title { font-weight: bold; color: #fff; font-size: 11px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; text-shadow: 1px 1px 3px #000; }
    .search-card-host .badge { color: rgba(255,255,255,0.4); font-size: 14px; font-weight: bold; line-height: 1; }

    .host-footer { margin-top: auto; padding-top: 30px; padding-bottom: 15px; display: flex; flex-direction: column; align-items: center; opacity: 0.3; }
    .host-footer .fs-text { font-size: 14px; margin-bottom: 4px; letter-spacing: 2px; }
    .host-footer .yt-logo-container { font-size: 20px; }
    .host-footer .yt-logo-red { padding: 2px 8px; border-radius: 6px; }
  </style>
</head>
<body>

  <button id="reset-btn" onclick="globalHardReset()">Сброс</button>
  <button id="login-btn" onclick="auth()">Host</button>

  <div id="idle-screen">
    <div class="fs-text">Family Standard</div>
    <div class="yt-logo-container">You<span class="yt-logo-red">Tube</span></div>
  </div>

  <div id="viewer-screen">
    <div id="viewer-player"></div>
  </div>

  <div id="search-viewer-screen">
    <div class="sv-grid" id="sv-grid"></div>
    <div class="sv-title" id="sv-title">Запрос: <span>...</span></div>
  </div>

  <div id="host-screen">
    <div class="host-container">
      
      <div class="input-row">
        <input type="text" id="manual-link" placeholder="Прямая ссылка...">
        <button onclick="handleManualLink()">Подготовить</button>
      </div>

      <div id="host-monitor">
        <div id="host-player"></div>
      </div>

      <div class="timeline-box">
        <input type="range" id="seek-bar" min="0" max="100" value="0" step="0.1" oninput="onSeekBarScrub(this.value)">
        <div class="time-display">
          <span id="time-curr">0:00</span>
          <span id="time-dur">0:00</span>
        </div>
      </div>

      <div class="control-row">
        <button onclick="hostSeek(-10)">-10с</button>
        <button id="btn-play-pause" class="btn-play" onclick="togglePlayPause()">▶</button>
        <button class="btn-stop" onclick="clearScreen()">🟥</button>
        <button onclick="hostSeek(10)">+10с</button>
      </div>

      <div class="vol-row">
        <button id="vol-3" onclick="hostSetVolume(3)">3</button>
        <button id="vol-10" onclick="hostSetVolume(10)">10</button>
        <button id="vol-30" onclick="hostSetVolume(30)">30</button>
        <button id="vol-60" onclick="hostSetVolume(60)">60</button>
        <button id="vol-100" class="active" onclick="hostSetVolume(100)">100</button>
      </div>

      <div class="dashed-line"></div>
      
      <div class="input-row">
        <input type="text" id="search-query" placeholder="Поиск на YouTube..." onkeydown="if(event.key==='Enter') performSearch()">
        <button id="search-btn" onclick="performSearch()">Найти</button>
      </div>
      
      <div class="search-pagination" id="search-pagination" style="display:none;">
        <button id="page-prev" onclick="changeSearchPage(-1)">◀ Назад</button>
        <span id="page-info">Стр. 1</span>
        <button id="page-next" onclick="changeSearchPage(1)">Вперед ▶</button>
      </div>
      
      <div class="search-grid-host" id="search-results-host"></div>

      <div class="host-footer">
        <div class="fs-text">Family Standard</div>
        <div class="yt-logo-container">You<span class="yt-logo-red">Tube</span></div>
      </div>
      
    </div>
  </div>

  <script>
    const SERVER_URL = "https://familystandard.onrender.com";
    const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });
    
    let isHost = false, vPlayerReady = false, hPlayerReady = false;
    let vPlayer, hPlayer, preparedId = null, currentHostId = null, currentVol = 100;
    let smoothVolInterval, progressTimer = null, allSearchResults = [], currentSearchPage = 0, currentQuery = "";

    function extractId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|.*embed\/))([^&?]{11})/);
      return match ? match[1] : (url.trim().length === 11 ? url.trim() : null);
    }

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return "0:00";
      sec = Math.floor(sec);
      const m = Math.floor(sec / 60); const s = sec % 60;
      return m + ":" + (s < 10 ? "0" : "") + s;
    }

    function auth() { socket.emit('auth_pin', {}); }
    
    socket.on('auth_result', (data) => {
      if (data.success) {
        isHost = true;
        document.getElementById('idle-screen').style.display = 'none';
        document.getElementById('viewer-screen').style.opacity = '0';
        document.getElementById('viewer-screen').style.visibility = 'hidden';
        document.getElementById('search-viewer-screen').style.display = 'none';
        document.getElementById('login-btn').style.display = 'none';
        document.getElementById('host-screen').style.display = 'block';
        initPlayersIfReady();
      }
    });

    function globalHardReset() { socket.emit('full_reset'); }

    // ЖЕСТКАЯ НАСТРОЙКА YOUTUBE IFRAME (Отключение субтитров)
    const PLAYER_VARS = { 'autoplay': 1, 'controls': 0, 'disablekb': 1, 'rel': 0, 'modestbranding': 1, 'cc_load_policy': 0, 'iv_load_policy': 3, 'origin': window.location.origin };

    function initPlayersIfReady() {
      if (window.YT && window.YT.Player) {
        if (!vPlayer) vPlayer = new YT.Player('viewer-player', { playerVars: PLAYER_VARS, events: { 'onReady': () => { vPlayerReady = true; } } });
        if (isHost && !hPlayer) hPlayer = new YT.Player('host-player', {
          playerVars: { ...PLAYER_VARS, 'autoplay': 0 },
          events: { 'onReady': (e) => { e.target.mute(); hPlayerReady = true; }, 'onStateChange': onHostStateChange }
        });
      }
    }
    function onYouTubeIframeAPIReady() { initPlayersIfReady(); }
    setInterval(initPlayersIfReady, 500); 

    function handleManualLink() {
      const vid = extractId(document.getElementById('manual-link').value);
      if (vid && hPlayerReady) {
        preparedId = vid;
        if (currentHostId !== preparedId && currentHostId !== null) { socket.emit('clear_screen'); currentHostId = null; }
      }
    }

    function togglePlayPause() {
      if (!hPlayerReady || !preparedId) return;
      if (hPlayer.getPlayerState() === YT.PlayerState.PLAYING) hPlayer.pauseVideo();
      else currentHostId !== preparedId ? (currentHostId = preparedId, hPlayer.loadVideoById(currentHostId)) : hPlayer.playVideo();
    }
    
    function hostSeek(seconds) {
      if (!hPlayerReady || !currentHostId) return;
      hPlayer.seekTo(Math.max(0, hPlayer.getCurrentTime() + seconds), true);
      emitHostAction(); 
    }

    function onSeekBarScrub(val) {
      if (!hPlayerReady || !currentHostId) return;
      hPlayer.seekTo(parseFloat(val), true);
      document.getElementById('time-curr').innerText = formatTime(val);
      emitHostAction();
    }

    function startProgressLoop() {
      stopProgressLoop();
      progressTimer = setInterval(() => {
        if (hPlayerReady && hPlayer.getCurrentTime && currentHostId) {
          const curr = hPlayer.getCurrentTime(), dur = hPlayer.getDuration() || 100;
          const sb = document.getElementById('seek-bar');
          sb.max = dur; sb.value = curr;
          document.getElementById('time-curr').innerText = formatTime(curr);
          document.getElementById('time-dur').innerText = formatTime(dur);
        }
      }, 500);
    }
    function stopProgressLoop() { if (progressTimer) clearInterval(progressTimer); }

    function hostSetVolume(vol) {
      currentVol = vol;
      document.querySelectorAll('.vol-row button').forEach(b => b.classList.remove('active'));
      document.getElementById('vol-' + vol).classList.add('active');
      emitHostAction();
    }

    function clearScreen() {
      socket.emit('clear_screen');
      if (hPlayerReady && hPlayer.stopVideo) hPlayer.stopVideo();
      currentHostId = null;
      updatePlayButtonUI(YT.PlayerState.PAUSED);
      document.getElementById('seek-bar').value = 0;
      document.getElementById('time-curr').innerText = '0:00';
    }

    function onHostStateChange(event) {
      if (!isHost) return;
      if (document.hidden && event.data === YT.PlayerState.PAUSED) return; 
      updatePlayButtonUI(event.data);
      emitHostAction();
    }

    function updatePlayButtonUI(state) {
      const btn = document.getElementById('btn-play-pause');
      if (state === YT.PlayerState.PLAYING) { btn.innerText = '⏸'; btn.classList.add('is-playing'); startProgressLoop(); }
      else { btn.innerText = '▶'; btn.classList.remove('is-playing'); stopProgressLoop(); }
    }

    function emitHostAction() {
      if (!hPlayerReady || !currentHostId) return;
      socket.emit('host_action', { videoId: currentHostId, action: `${hPlayer.getPlayerState() === YT.PlayerState.PLAYING ? 'play' : 'pause'}|${currentVol}`, time: hPlayer.getCurrentTime() });
    }

    async function performSearch() {
      const q = document.getElementById('search-query').value.trim();
      if (!q) return;
      currentQuery = q;
      const btn = document.getElementById('search-btn');
      btn.innerText = '⏳';
      try {
        const res = await fetch(`${SERVER_URL}/api/search?q=${encodeURIComponent(q)}`);
        allSearchResults = await res.json();
        currentSearchPage = 0;
        renderSearchPage();
      } catch (e) { alert('Ошибка сервера'); }
      btn.innerText = 'Найти';
    }

    function changeSearchPage(dir) { currentSearchPage += dir; renderSearchPage(); }

    function renderSearchPage() {
      const grid = document.getElementById('search-results-host');
      const pag = document.getElementById('search-pagination');
      grid.innerHTML = '';
      if (allSearchResults.length === 0) {
        pag.style.display = 'none';
        grid.innerHTML = '<div style="color:#888; text-align:center; padding:10px; grid-column:span 2;">Ничего не найдено.</div>';
        return;
      }
      pag.style.display = 'flex';
      document.getElementById('page-prev').disabled = currentSearchPage === 0;
      document.getElementById('page-next').disabled = (currentSearchPage * 6 + 6) >= allSearchResults.length;
      document.getElementById('page-info').innerText = `Стр. ${currentSearchPage + 1}`;

      const slice = allSearchResults.slice(currentSearchPage * 6, currentSearchPage * 6 + 6);
      slice.forEach((item, idx) => {
        const card = document.createElement('div');
        card.className = 'search-card-host';
        card.onclick = () => { preparedId = item.videoId; currentHostId = item.videoId; if (hPlayerReady) hPlayer.loadVideoById(item.videoId); };
        card.innerHTML = `
          <img src="${item.thumbnail}">
          <div class="overlay">
            <div class="title">${item.title}</div>
            <div class="badge">${idx + 1}</div>
          </div>`;
        grid.appendChild(card);
      });
      socket.emit('host_search', { query: currentQuery, results: slice });
    }

    function smoothVolumeTransition(targetVol) {
      if (!vPlayerReady || !vPlayer.getVolume) return;
      let current = vPlayer.getVolume();
      if (current === targetVol) return;
      clearInterval(smoothVolInterval);
      smoothVolInterval = setInterval(() => {
        current = vPlayer.getVolume();
        let diff = targetVol - current;
        if (Math.abs(diff) <= 2) { vPlayer.setVolume(targetVol); clearInterval(smoothVolInterval); } 
        else vPlayer.setVolume(current + Math.sign(diff) * 2);
      }, 40);
    }

    socket.on('force_reload', () => { window.location.reload(true); });

    socket.on('sync', (data) => {
      if (isHost) {
        if (data.mode === 'idle') {
           document.getElementById('manual-link').value = ''; document.getElementById('search-query').value = '';
           document.getElementById('seek-bar').value = 0; document.getElementById('time-curr').innerText = '0:00';
           currentHostId = null; preparedId = null;
           if (hPlayerReady && hPlayer.stopVideo) hPlayer.stopVideo();
           updatePlayButtonUI(YT.PlayerState.PAUSED);
        } else if (data.mode === 'video' && data.videoId && data.videoId !== currentHostId) {
             currentHostId = data.videoId; preparedId = data.videoId;
             if (hPlayerReady) hPlayer.loadVideoById(data.videoId, data.time);
        }
        return; 
      }

      const idl = document.getElementById('idle-screen'), vSc = document.getElementById('viewer-screen'), sSc = document.getElementById('search-viewer-screen');
      if (data.mode === 'idle') {
        vSc.style.opacity = '0'; vSc.style.visibility = 'hidden'; sSc.style.display = 'none'; idl.style.display = 'flex';
        document.getElementById('login-btn').style.display = 'block';
        if (vPlayerReady && vPlayer.stopVideo) vPlayer.stopVideo();
      } else if (data.mode === 'search') {
        vSc.style.opacity = '0'; vSc.style.visibility = 'hidden'; idl.style.display = 'none'; document.getElementById('login-btn').style.display = 'none';
        document.getElementById('sv-title').innerHTML = `Запрос: <span>${data.searchQuery}</span>`;
        const grid = document.getElementById('sv-grid'); grid.innerHTML = '';
        data.searchResults.forEach((item, idx) => {
          const card = document.createElement('div'); card.className = 'sv-card';
          card.innerHTML = `
            <img src="${item.thumbnail}">
            <div class="sv-overlay">
              <div class="sv-video-title">${item.title}</div>
              <div class="sv-badge">${idx + 1}</div>
            </div>`;
          grid.appendChild(card);
        });
        sSc.style.display = 'flex';
        if (vPlayerReady && vPlayer.pauseVideo) vPlayer.pauseVideo();
      } else if (data.mode === 'video') {
        idl.style.display = 'none'; sSc.style.display = 'none'; document.getElementById('login-btn').style.display = 'none';
        vSc.style.opacity = '1'; vSc.style.visibility = 'visible';
        if (!vPlayerReady) return; 

        const parts = data.action.split('|'), actionStr = parts[0], volTarget = parts.length > 1 ? parseInt(parts[1]) : null;
        if (volTarget !== null) smoothVolumeTransition(volTarget);

        if (actionStr === 'play') {
          const url = vPlayer.getVideoUrl && vPlayer.getVideoUrl();
          (!url || !url.includes(data.videoId)) ? vPlayer.loadVideoById(data.videoId, data.time) : (vPlayer.seekTo(data.time, true), vPlayer.playVideo());
        } else if (actionStr === 'pause') { vPlayer.pauseVideo(); }
      }
    });
  </script>
</body>
</html>
