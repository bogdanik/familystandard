<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family Standard YouTube Control</title>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #080808; font-family: -apple-system, sans-serif; color: #fff; }

    #bg-canvas { position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 1; }

    /* Окно авторизации */
    #pin-modal { position: absolute; z-index: 100; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(18, 18, 18, 0.95); padding: 25px; border-radius: 16px; text-align: center; width: 85%; max-width: 320px; border: 1px solid #2a2a2a; backdrop-filter: blur(12px); }
    #pin-modal input { width: 100%; padding: 12px; font-size: 24px; text-align: center; border-radius: 10px; border: 1px solid #333; background: #111; color: #fff; margin: 15px 0; letter-spacing: 6px; }
    #pin-modal button { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; background: #ff0000; color: white; border: none; border-radius: 10px; cursor: pointer; }

    /* Полноэкранный показ для Зрителей */
    #viewer-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 10; }
    #viewer-screen iframe { width: 100%; height: 100%; border: none; }

    /* Полноценный YouTube-интерфейс для Ведущего */
    #host-screen { display: none; position: absolute; top:0; left:0; width: 100%; height: 100%; z-index: 50; background: #0f0f0f; flex-direction: column; }
    #host-yt-iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div id="pin-modal">
    <h3>Управление Экраном</h3>
    <input type="password" id="pin-input" placeholder="ПИН" maxlength="4" pattern="\d*">
    <button onclick="submitPin()">Войти как Ведущий</button>
  </div>

  <!-- Экран Зрителей -->
  <div id="viewer-screen">
    <div id="viewer-player"></div>
  </div>

  <!-- Полноценный YouTube для Ведущего -->
  <div id="host-screen">
    <iframe id="host-yt-iframe" src="about:blank"></iframe>
  </div>

  <script>
    const RENDER_SERVER_URL = "https://familystandard.onrender.com";

    const socket = io(RENDER_SERVER_URL, {
      transports: ['websocket', 'polling']
    });

    let isHost = false;
    let viewerPlayer;

    // --- 1. Анимация Canvas ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let particles = Array.from({length: 30}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 3 + 1,
      dx: (Math.random() - 0.5) * 0.7,
      dy: (Math.random() - 0.5) * 0.7
    }));

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(255, 0, 0, 0.4)';
      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.dx; p.y += p.dy;
        if(p.x < 0 || p.x > canvas.width) p.dx *= -1;
        if(p.y < 0 || p.y > canvas.height) p.dy *= -1;
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // --- 2. Вход Ведущего ---
    function submitPin() {
      const pin = document.getElementById('pin-input').value;
      socket.emit('auth_pin', { pin });
    }

    socket.on('auth_result', (data) => {
      if (data.success) {
        isHost = true;
        document.getElementById('pin-modal').style.display = 'none';
        document.getElementById('host-screen').style.display = 'flex';
        
        // Открываем полноценный открытый интерфейс YouTube
        const iframe = document.getElementById('host-yt-iframe');
        iframe.src = "https://piped.video";

        // Отслеживаем изменения ссылки внутри интерфейса
        setInterval(() => {
          try {
            const currentUrl = iframe.contentWindow.location.href;
            if (currentUrl.includes('/watch?v=')) {
              const urlParams = new URLSearchParams(currentUrl.split('?')[1]);
              const videoId = urlParams.get('v');
              const time = parseFloat(urlParams.get('t') || 0);

              socket.emit('host_control', { videoId: videoId, action: 'play', time: time });
            }
          } catch(e) {
            // Игнорируем cross-origin ошибки при навигации
          }
        }, 1000);

      } else {
        alert(data.message);
      }
    });

    // --- 3. Плеер Зрителя ---
    function onYouTubeIframeAPIReady() {
      viewerPlayer = new YT.Player('viewer-player', {
        height: '100%',
        width: '100%',
        playerVars: { 'autoplay': 1, 'controls': 0, 'rel': 0 }
      });
    }

    // --- 4. Прием синхронизации у Зрителей ---
    socket.on('sync_to_viewers', (data) => {
      if (isHost) return;

      const viewerScreen = document.getElementById('viewer-screen');
      viewerScreen.style.display = 'block';

      if (data.action === 'play') {
        const currentUrl = viewerPlayer.getVideoUrl();
        if (!currentUrl || !currentUrl.includes(data.videoId)) {
          viewerPlayer.loadVideoById(data.videoId, data.time);
        } else {
          // Перемотка на нужное время
          viewerPlayer.seekTo(data.time, true);
          viewerPlayer.playVideo();
        }
      } else if (data.action === 'pause') {
        viewerPlayer.pauseVideo();
      }
    });
  </script>
</body>
</html>
