<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Свадебный Сценарий — Юра & Маргарита</title>
    <style>
        /* iOS Core Styles & Dark Glassmorphism Aesthetic */
        :root {
            --ios-bg: #000000;
            --ios-card-bg: rgba(255, 255, 255, 0.09);
            --ios-card-border: rgba(255, 255, 255, 0.18);
            --ios-accent: #0A84FF;
            --ios-gold: #FFD60A;
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --ios-text: #FFFFFF;
            --ios-text-secondary: rgba(255, 255, 255, 0.65);
            --ios-blur: blur(30px) saturate(190%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--ios-bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: var(--ios-text);
        }

        /* Hyperspace Canvas Background */
        #canvas-hyperspace {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 680px;
            margin: 0 auto;
            padding: 12px 14px 16px 14px;
            gap: 12px;
        }

        /* Header Bar */
        .ios-header {
            background: var(--ios-card-bg);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--ios-card-border);
            border-radius: 20px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .couple-names {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF 0%, #FFD60A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .event-subtitle {
            font-size: 11px;
            color: var(--ios-text-secondary);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-pin-toggle {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-pin-toggle.unlocked {
            border-color: rgba(48, 209, 88, 0.5);
            color: var(--ios-green);
            background: rgba(48, 209, 88, 0.15);
        }

        /* TOP NAVIGATION CONTROLS */
        .top-nav-panel {
            background: var(--ios-card-bg);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--ios-card-border);
            border-radius: 22px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .nav-buttons-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .btn-ios {
            flex: 1;
            height: 44px;
            border-radius: 16px;
            border: none;
            background: var(--ios-accent);
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 600;

            align-items: center;
            justify-content: center;
            gap: 4px;

            color: #FFFFFF;

            font-size: 12px;
            font-weight: 700;
            color: var(--ios-text-secondary);
            min-width: 75px;
            text-align: center;
            letter-spacing: 0.3px;

        /* Hourly Jump Bar */
        .hour-tabs-scroll {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

            display: none;
        }

            border-radius: 10px;
            font-size: 12px;

            color: #FFFFFF;

        .progress-bar-wrap {

            height: 4px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;

        .time-badge-row {
            display: flex;
            align-items: center;
            justify-content: space-between;

        .time-badge {

            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--ios-text-secondary);
            font-weight: 700;
            margin-bottom: 4px;

        .section-text {

            line-height: 1.48;
            color: rgba(255, 255, 255, 0.92);

        /* Speech Box */
        .speech-box {

            border: 1px solid rgba(255, 214, 10, 0.45);
            border-radius: 16px;
            padding: 14px;
            animation: fadeInSpeech 0.3s ease;

        @keyframes fadeInSpeech {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .speech-header {
            font-size: 11px;
            font-weight: 700;
            color: var(--ios-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .speech-content {
            font-size: 14px;
            line-height: 1.5;
            color: #FFF8E7;
            font-style: italic;

        /* Question Box */
        .question-box {
            background: rgba(48, 209, 88, 0.12);
            border: 1px solid rgba(48, 209, 88, 0.45);
            border-radius: 16px;
            padding: 14px;
            animation: fadeInSpeech 0.3s ease;

        .question-header {
            font-size: 11px;
            font-weight: 700;
            color: var(--ios-green);
            text-transform: uppercase;

            margin-bottom: 6px;

        /* PIN Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(16px);

            pointer-events: auto;

        .pin-modal {

            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.2);

            gap: 10px;

</head>

    <script>
        /* ===================================================
           1. MATHEMATICAL HYPERSPACE CANVAS ANIMATION
           =================================================== */
        const canvas = document.getElementById('canvas-hyperspace');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;
        const numParticles = 240;
        const particles = [];
        const speed = 14;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = (Math.random() - 0.5) * width * 2;
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = initial ? Math.random() * width : width;
                this.px = 0;
                this.py = 0;
                this.color = `hsl(${195 + Math.random() * 45}, 100%, ${70 + Math.random() * 25}%)`;
            }

            update() {
                this.z -= speed;
                if (this.z <= 0) {
                    this.reset();
                }
            }

            draw() {
                const k = 260 / this.z;
                const sx = this.x * k + centerX;
                const sy = this.y * k + centerY;

                if (sx < 0 || sx >= width || sy < 0 || sy >= height) {
                    this.reset();
                    return;
                }

                const size = Math.max(0.5, (1 - this.z / width) * 2.8);
                
                if (this.px !== 0 && this.py !== 0) {
                    ctx.beginPath();
                    ctx.moveTo(this.px, this.py);
                    ctx.lineTo(sx, sy);
                    ctx.strokeStyle = this.color;
                    ctx.lineWidth = size;
                    ctx.globalAlpha = Math.min(1, (1 - this.z / width) * 1.6);
                    ctx.stroke();
                }

                this.px = sx;
                this.py = sy;
                ctx.globalAlpha = 1;
            }
        }

        for (let i = 0; i < numParticles; i++) {
            particles.push(new Particle());
        }

        function animateHyperspace() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.24)';
            ctx.fillRect(0, 0, width, height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
            }

            requestAnimationFrame(animateHyperspace);
        }

        animateHyperspace();

                speech: "«Друзья! Сегодня звучало очень много правильных, душевных и важных слов от родителей, братьев, свидетелей и друзей. И наблюдая за Юрой и Ритой на протяжении всего этого вечера, я хочу сказать кое-что от себя.\n\nСмотреть на вас — это настоящее удовольствие. В вас нет ни капли наигранности. Только искренность, драйв и глубокое, настоящее уважение друг к другу. Вы — потрясающая команда.\n\nДавайте поднимем бокалы за то, чтобы эта легкость, этот огонь в глазах и это чувство юмора сопровождали вашу семью всю жизнь! За Юру и Риту! Горько!»"

                details: "Диджей-сет, свободная танцевальная программа."

        /* ===================================================
           3. UI RENDER ENGINE
           =================================================== */
        const mainContent = document.getElementById('main-content');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const stepCounter = document.getElementById('step-counter');
        const progressFill = document.getElementById('progress-fill');
        const hourTabsContainer = document.getElementById('hour-tabs-container');

        const btnOpenPin = document.getElementById('btn-open-pin');
        const pinModalOverlay = document.getElementById('pin-modal-overlay');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnSubmitPin = document.getElementById('btn-submit-pin');
        const pinInput = document.getElementById('pin-input');
        const pinIcon = document.getElementById('pin-icon');
        const pinStatusText = document.getElementById('pin-status-text');

        function updatePinUI() {
            if (isUnlocked) {
                btnOpenPin.classList.add('unlocked');
                pinIcon.textContent = "🔓";
                pinStatusText.textContent = "Открыто";
            } else {
                btnOpenPin.classList.remove('unlocked');
                pinIcon.textContent = "🔒";
                pinStatusText.textContent = "ПИН";
            }
        }

        function renderHourTabs() {
            let tabsHTML = '';
            const currentGroup = scenarioData[currentStepIndex].hourGroup;

            hourlyBlocks.forEach(hb => {
                const isActive = hb.id === currentGroup ? 'active' : '';
                tabsHTML += `
                    <button class="hour-tab-pill ${isActive}" onclick="jumpToHour(${hb.startIndex})">
                        ${hb.label}
                    </button>
                `;
            });
            hourTabsContainer.innerHTML = tabsHTML;
        }

        function jumpToHour(index) {
            currentStepIndex = index;
            renderStep(currentStepIndex);
        }

        // Returns speech HTML ONLY if unlocked, otherwise empty string (no DOM markup)
        function formatSpeechHTML(text) {
            if (!isUnlocked || !text) {
                return '';
            }
            return `
                <div class="speech-box">
                    <div class="speech-header">🎙️ Речь Богдана</div>
                    <div class="speech-content">${text.replace(/\n/g, '<br>')}</div>
                </div>
            `;
        }

        // Returns question HTML ONLY if unlocked, otherwise empty string (no DOM markup)
        function formatQuestionHTML(text) {
            if (!isUnlocked || !text) {
                return '';
            }
            return `
                <div class="question-box">
                    <div class="question-header">❓ Вопрос гостю</div>
                    <div class="section-text" style="font-weight: 600; color: #E8FFEA;">${text}</div>
                </div>
            `;
        }

        function renderStep(index) {
            const item = scenarioData[index];
            let html = `
                <div class="scenario-card">
                    <div class="time-badge-row">
                        <div class="time-badge">⏰ ${item.time}</div>
                        <div class="hour-badge">Блок ${item.hourGroup}</div>
                    </div>
                    <div class="block-title">${item.title}</div>
            `;

            if (item.type) {
                html += `
                    <div class="section-box">
                        <div class="section-label">Этап</div>
                        <div class="section-text">${item.type}</div>
                    </div>
                `;
            }

            if (item.details) {
                html += `
                    <div class="section-box">
                        <div class="section-label">Детали / Сценарий</div>
                        <div class="section-text">${item.details}</div>
                    </div>
                `;
            }

            if (item.purpose) {
                html += `
                    <div class="section-box">
                        <div class="section-label">Цель</div>
                        <div class="section-text">${item.purpose}</div>
                    </div>
                `;
            }

            if (item.emotion) {
                html += `
                    <div class="section-box">
                        <div class="section-label">Эмоция</div>
                        <div class="section-text">${item.emotion}</div>
                    </div>
                `;
            }

            if (item.speech) {
                html += formatSpeechHTML(item.speech);
            }

            if (item.question) {
                html += formatQuestionHTML(item.question);
            }

            // Render Friends Toasts List
            if (item.friendsList) {
                item.friendsList.forEach(f => {
                    const speechPart = formatSpeechHTML(f.speech);
                    const questionPart = formatQuestionHTML(f.question);

                    html += `
                        <div style="border-top: 1px solid rgba(255,255,255,0.12); padding-top: 12px; margin-top: 6px; display: flex; flex-direction: column; gap: 8px;">
                            <div style="font-size: 15px; font-weight: 700; color: var(--ios-accent);">👥 ${f.names}</div>
                            ${speechPart}
                            ${questionPart}
                        </div>
                    `;
                });
            }

            // Render Close Guests Toasts List
            if (item.experiencedList) {
                item.experiencedList.forEach(e => {
                    const speechPart = formatSpeechHTML(e.speech);
                    const questionPart = formatQuestionHTML(e.question);

                    html += `
                        <div style="border-top: 1px solid rgba(255,255,255,0.12); padding-top: 12px; margin-top: 6px; display: flex; flex-direction: column; gap: 8px;">
                            <div style="font-size: 15px; font-weight: 700; color: var(--ios-gold);">✨ ${e.names}</div>
                            ${speechPart}
                            ${questionPart}
                        </div>
                    `;
                });
            }

            html += `</div>`;
            mainContent.innerHTML = html;

            // Update Header & Controls State
            stepCounter.textContent = `${index + 1} из ${scenarioData.length}`;
            btnPrev.disabled = index === 0;
            btnNext.disabled = index === scenarioData.length - 1;
            
            const progressPercent = ((index + 1) / scenarioData.length) * 100;
            progressFill.style.width = `${progressPercent}%`;

            renderHourTabs();
            mainContent.scrollTop = 0;
        }

        /* ===================================================
           4. PIN LOGIC & PERSISTENCE
           =================================================== */
        function openPinModal() {
            pinModalOverlay.classList.add('active');
            pinInput.value = "";
            setTimeout(() => pinInput.focus(), 100);
        }

        function closePinModal() {
            pinModalOverlay.classList.remove('active');
            pinInput.blur();
        }

        function checkPin() {
            if (pinInput.value === SECRET_PIN) {
                isUnlocked = true;
                try {
                    localStorage.setItem(STORAGE_KEY, "true");
                } catch(e) {}
                updatePinUI();
                closePinModal();
                renderStep(currentStepIndex);
            } else {
                pinInput.style.borderColor = "var(--ios-red)";
                setTimeout(() => {
                    pinInput.style.borderColor = "rgba(255, 255, 255, 0.25)";
                }, 800);
            }
        }

        btnOpenPin.addEventListener('click', () => {
            if (isUnlocked) {
                if (confirm("Снова заблокировать речи ведущего и вопросы?")) {
                    isUnlocked = false;
                    try {
                        localStorage.removeItem(STORAGE_KEY);
                    } catch(e) {}
                    updatePinUI();
                    renderStep(currentStepIndex);
                }
            } else {
                openPinModal();
            }
        });

        btnCloseModal.addEventListener('click', closePinModal);
        btnSubmitPin.addEventListener('click', checkPin);

        pinInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                checkPin();
            }
        });

        /* ===================================================
           5. EVENT LISTENERS
           =================================================== */
        btnPrev.addEventListener('click', () => {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                renderStep(currentStepIndex);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStepIndex < scenarioData.length - 1) {
                currentStepIndex++;
                renderStep(currentStepIndex);
            }
        });

        // Initialize App
        updatePinUI();
        renderStep(0);
    </script>
