<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сценарий — Ситора & Сардор</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0b090a;
            --nude-main: #e0b8a0;
            --nude-accent: #f5ebe6;
            --nude-dark: #9e7b66;
            --text-light: #fdfbf7;
            --text-muted: #b8a69d;
            --card-bg: rgba(20, 16, 18, 0.78);
            --card-border: rgba(224, 184, 160, 0.32);
            --glow-color: rgba(224, 184, 160, 0.25);
            --glow-strong: rgba(245, 235, 230, 0.55);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-light);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ЛЕТАЮЩИЕ ЧАСТИЦЫ --- */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1000;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: var(--nude-accent);
            border-radius: 50%;
            opacity: 0.8;
            box-shadow: 0 0 12px var(--glow-strong);
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(105vh) scale(0.6); opacity: 0; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* СВЕЧЕНИЯ */
        .ambient-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--glow-color) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            animation: floatGlow 10s infinite ease-in-out alternate;
            z-index: 0;
            filter: blur(50px);
        }

        .glow-1 { top: -15%; left: -10%; animation-delay: 0s; }
        .glow-2 { bottom: -15%; right: -10%; animation-delay: -3s; }
        .glow-3 { top: 35%; right: 10%; width: 350px; height: 350px; animation-delay: -6s; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 50px) scale(1.2); }
            100% { transform: translate(-30px, 20px) scale(0.85); }
        }

        /* КАРТОЧКА */
        .container {
            width: 100%;
            max-width: 740px;
            padding: 20px;
            z-index: 1;
            position: relative;
        }

        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 28px;
            padding: 36px 32px 24px 32px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 20px var(--glow-color);
            position: relative;
            transition: border-color 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-card:hover {
            border-color: rgba(224, 184, 160, 0.55);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.95), 0 0 30px var(--glow-strong);
        }

        /* ХЕДЕР С НАВИГАЦИЕЙ */
        .header-nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header-title-block h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.1rem;
            font-weight: 600;
            color: var(--nude-accent);
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(245, 235, 230, 0.3);
            margin-bottom: 2px;
        }

        .header-title-block .subtitle {
            color: var(--nude-main);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .top-nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid var(--card-border);
        }

        .nav-arrow-btn {
            background: linear-gradient(135deg, var(--nude-main) 0%, var(--nude-dark) 100%);
            color: #0b090a;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px var(--glow-color);
        }

        .nav-arrow-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 0 18px var(--glow-strong);
            background: linear-gradient(135deg, var(--nude-accent) 0%, var(--nude-main) 100%);
        }

        .nav-arrow-btn:disabled {
            opacity: 0.25;
            cursor: not-allowed;
            box-shadow: none;
        }

        .slide-counter {
            font-size: 0.85rem;
            color: var(--nude-accent);
            letter-spacing: 1.5px;
            font-weight: 600;
            min-width: 42px;
            text-align: center;
        }

        .progress-bar {
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            width: 100%;
            margin-bottom: 22px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--nude-dark), var(--nude-accent));
            width: 0%;
            transition: width 0.4s ease;
            box-shadow: 0 0 10px var(--nude-main);
        }

        .time-tag {
            display: inline-block;
            background: rgba(224, 184, 160, 0.12);
            color: var(--nude-accent);
            padding: 5px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            border: 1px solid rgba(224, 184, 160, 0.3);
            box-shadow: 0 0 10px rgba(224, 184, 160, 0.1);
        }

        h3 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.6rem;
            color: var(--nude-accent);
            margin-bottom: 12px;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            line-height: 1.65;
            color: var(--text-light);
            font-weight: 300;
            margin-bottom: 14px;
        }

        .phrases-list {
            text-align: left;
            background: rgba(0, 0, 0, 0.38);
            border: 1px solid rgba(224, 184, 160, 0.25);
            padding: 14px 18px;
            border-radius: 14px;
            margin: 14px 0;
            font-size: 0.88rem;
            color: var(--nude-accent);
            line-height: 1.8;
            max-height: 240px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .phrases-list::-webkit-scrollbar {
            width: 6px;
        }
        .phrases-list::-webkit-scrollbar-thumb {
            background: var(--nude-dark);
            border-radius: 4px;
        }

        .mechanics-title {
            color: var(--nude-main);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.78rem;
            margin-bottom: 6px;
            display: block;
        }

        .btn-finish {
            background: linear-gradient(135deg, var(--nude-main) 0%, var(--nude-dark) 100%);
            color: #0b090a;
            border: none;
            padding: 15px 36px;
            border-radius: 40px;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(158, 123, 102, 0.4), 0 0 15px var(--glow-color);
            margin-top: 15px;
            width: 100%;
        }

        .btn-finish:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(224, 184, 160, 0.6), 0 0 25px var(--glow-strong);
            background: linear-gradient(135deg, var(--nude-accent) 0%, var(--nude-main) 100%);
        }

        .brand-footer {
            margin-top: 22px;
            padding-top: 12px;
            border-top: 1px solid rgba(224, 184, 160, 0.15);
            text-align: center;
            font-size: 0.72rem;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--nude-dark);
            font-weight: 600;
        }

        .brand-footer span {
            color: var(--nude-main);
        }

        #blackout {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000000;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #blackout.active {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <!-- ЧАСТИЦЫ -->
    <div class="particles-container">
        <div class="particle" style="width: 4px; height: 4px; left: 5%; animation-duration: 5s; animation-delay: 0s;"></div>
        <div class="particle" style="width: 6px; height: 6px; left: 12%; animation-duration: 7s; animation-delay: -2s;"></div>
        <div class="particle" style="width: 3px; height: 3px; left: 18%; animation-duration: 4.5s; animation-delay: -1s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 25%; animation-duration: 6s; animation-delay: -3.5s;"></div>
        <div class="particle" style="width: 7px; height: 7px; left: 32%; animation-duration: 8s; animation-delay: -4s;"></div>
        <div class="particle" style="width: 4px; height: 4px; left: 38%; animation-duration: 5.5s; animation-delay: -1.5s;"></div>
        <div class="particle" style="width: 3px; height: 3px; left: 45%; animation-duration: 4s; animation-delay: -2.5s;"></div>
        <div class="particle" style="width: 6px; height: 6px; left: 52%; animation-duration: 6.5s; animation-delay: -0.5s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 58%; animation-duration: 7.5s; animation-delay: -3s;"></div>
        <div class="particle" style="width: 4px; height: 4px; left: 65%; animation-duration: 5s; animation-delay: -4.5s;"></div>
        <div class="particle" style="width: 6px; height: 6px; left: 72%; animation-duration: 6s; animation-delay: -1.8s;"></div>
        <div class="particle" style="width: 3px; height: 3px; left: 78%; animation-duration: 4.8s; animation-delay: -2.2s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 85%; animation-duration: 7.2s; animation-delay: -3.8s;"></div>
        <div class="particle" style="width: 7px; height: 7px; left: 92%; animation-duration: 5.8s; animation-delay: -0.8s;"></div>
        <div class="particle" style="width: 4px; height: 4px; left: 8%; animation-duration: 6.2s; animation-delay: -2.7s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 22%; animation-duration: 4.2s; animation-delay: -3.1s;"></div>
        <div class="particle" style="width: 3px; height: 3px; left: 36%; animation-duration: 7.8s; animation-delay: -1.2s;"></div>
        <div class="particle" style="width: 6px; height: 6px; left: 50%; animation-duration: 5.1s; animation-delay: -4.1s;"></div>
        <div class="particle" style="width: 4px; height: 4px; left: 64%; animation-duration: 6.8s; animation-delay: -2.9s;"></div>
        <div class="particle" style="width: 5px; height: 5px; left: 80%; animation-duration: 4.9s; animation-delay: -0.3s;"></div>
    </div>

    <!-- СВЕЧЕНИЯ -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="container">
        <div class="glass-card">
            
            <div class="header-nav-row">
                <div class="header-title-block">
                    <h1>Ситора, с днём рождения!</h1>
                    <p class="subtitle">Сценарий вашего праздника</p>
                </div>
                <div class="top-nav-controls">
                    <button class="nav-arrow-btn" id="btn-prev" onclick="prevSlide()" title="Назад">←</button>
                    <span class="slide-counter" id="slide-counter">1 / 6</span>
                    <button class="nav-arrow-btn" id="btn-next" onclick="nextSlide()" title="Вперед">→</button>
                </div>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <div id="slide-content"></div>

            <div class="brand-footer">
                FAMILY STANDARD • <span>СИТОРА & САРДОР</span>
            </div>

        </div>
    </div>

    <div id="blackout"></div>

    <script>
        const slides = [
            {
                time: "19:30 – 20:00",
                title: "Сбор гостей & Атмосфера",
                desc: "Встречаем гостей под сбалансированное фоновое звучание, первые напитки и удобную рассадку. Все успевают обняться, сфотографироваться и плавно включиться в вечер. Официальный старт программы назначаем на 20:00."
            },
            {
                time: "20:00 – 20:20",
                title: "Нейромузыка (Угадай трек)",
                desc: "Азартный музыкальный интерактив за столом под первые тосты. Искусственный интеллект необычно перепел и зашифровал известные хиты. Гости угадывают треки со своих мест, задавая весёлый тон началу вечера."
            },
            {
                time: "20:20 – 20:45",
                title: "10 секунд на зашквар (What the hell)",
                desc: "Ведущий с микрофоном двигается вдоль стола. У участника есть ровно 10 секунд, чтобы выдать 3 быстрых ответа на один из каверзных вопросов. Кто затупил, замялся или не успел — моментально пьет штрафной шот!",
                questionsTitle: "Список вопросов для блица:",
                questions: [
                    "• Назови 3 вещи, которые являются правдой, но никто об этом не говорит.",
                    "• Назови 3 места, куда можно положить сосиску.",
                    "• Назови 3 вещи, которые можно разобрать и собрать обратно.",
                    "• Назови 3 простые вещи, которые легко украсть в магазине.",
                    "• Назови 3 причины начать курить.",
                    "• Назови 3 человека, которым по твоему мнению необходима пластическая операция.",
                    "• Назови 3 человека, которых ты хотел бы ударить.",
                    "• Назови 3 вещи, у которых почасовая оплата.",
                    "• Назови 3 самых распространённых комплекса у мужчин.",
                    "• Назови 3 причины носить одежду с открытым декольте.",
                    "• Назови 3 причины, по которым стоит жить в Северной Корее.",
                    "• Назови 3 липкие вещи.",
                    "• Назови 3 овоща, которые могут быть использованы не только в кулинарии.",
                    "• Назови 3 вещи, которые можно спрятать в подвале.",
                    "• Назови 3 занятия бездельника.",
                    "• Назови 3 аксессуара джентльмена.",
                    "• Назови 3 вещи, которые лучше делать обнажёнными.",
                    "• Назови 3 причины не носить трусы."
                ]
            },
            {
                time: "20:45 – 21:15",
                title: "Громкий разговор (Баттл на взаимопонимание)",
                desc: "Ведущий и Ситора вызывают 2 пары с максимальным уровнем взаимопонимания (это могут быть двое друзей, подруги или семейная пара). Один надевает наушники с громкой музыкой, второй без звука читает фразу по губам. Никаких секундомеров — гости сами аплодисментами выбирают, кто был самым быстрым, креативным и смешным. Победители получают официальный статус «Самые понимающие»!",
                phrases: "1. «Я хочу гавкать как грозный лев»<br>2. «Ты мои пять сантиметров счастья в кармане»<br>3. «Сяду тебе на лицо прямо во время фильма»<br>4. «I love Юру больше чем утренний кофе»<br>5. «Хочу замуж за твою голливудскую улыбку»<br>6. «Укради меня на море прямо с работы»"
            },
            {
                time: "21:15 – 21:45",
                title: "Угадай гостя (Авторская идея Ситоры)",
                desc: "Ситора или ведущий шепчут участнику прямо на ухо имя (кого именно нужно изобразить). А вот ситуацию происходящего участник выбирает вслепую — называет цифру от 1 до 6! Повторять ранее названные цифры нельзя.<br><br><b>СПИСОК ИМЁН:</b><br>Сарик, Каролина.<br><br><b>СПИСОК СИТУАЦИЙ (6 ВАРИАНТОВ):</b><br>1. Затупил у кассы в супермаркете и забыл пин-код.<br>2. Эмоционально доказывает ГАИшнику, что пил только минералку.<br>3. Застрял в огромной очереди в туалет и теряет терпение.<br>4. Пытается незаметно выбросить подгоревший шашлык на глазах у мангальщика.<br>5. Случайно зацепил бокалом скатерть за столом и делает вид, что так и надо.<br>6. Пытается вызвать такси в дождь и час пик с коэффициентом х5."
            },
            {
                time: "21:45 – 22:00",
                title: "Танцевальный Алфавит (Битва Чемпионов)",
                desc: "Ситора, мы знаем, что вы — абсолютный и непобедимый победитель этого конкурса! Мы оставляем его как резервный блок. Посмотрим, кто из гостей вообще осмелится бросить вызов чемпиону на вашем же поле!<br><br>Музыкальный сет строится исключительно на ваших любимых песнях, а ставит треки диджей.",
                isLast: true
            }
        ];

        let currentSlide = 0;

        function renderSlide() {
            const data = slides[currentSlide];
            const content = document.getElementById('slide-content');
            
            const progress = ((currentSlide + 1) / slides.length) * 100;
            document.getElementById('progress-fill').style.width = `${progress}%`;
            document.getElementById('slide-counter').innerText = `${currentSlide + 1} / ${slides.length}`;

            let phrasesHtml = data.phrases ? `<div class="phrases-list"><span class="mechanics-title">6 фраз для баттла пар:</span>${data.phrases}</div>` : '';
            
            let questionsHtml = '';
            if (data.questions) {
                const qList = data.questions.join('<br>');
                questionsHtml = `<div class="phrases-list"><span class="mechanics-title">${data.questionsTitle}</span>${qList}</div>`;
            }

            let finishButtonHtml = data.isLast 
                ? `<button class="btn-finish" onclick="triggerBlackout()">Завершить просмотр</button>` 
                : '';

            content.innerHTML = `
                <span class="time-tag">${data.time}</span>
                <h3>${data.title}</h3>
                <p>${data.desc}</p>
                ${questionsHtml}
                ${phrasesHtml}
                ${finishButtonHtml}
            `;

            document.getElementById('btn-prev').disabled = (currentSlide === 0);
            document.getElementById('btn-next').disabled = (currentSlide === slides.length - 1);
        }

        function nextSlide() {
            if (currentSlide < slides.length - 1) {
                currentSlide++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlide > 0) {
                currentSlide--;
                renderSlide();
            }
        }

        function triggerBlackout() {
            const blackout = document.getElementById('blackout');
            blackout.classList.add('active');
            
            setTimeout(() => {
                currentSlide = 0;
                renderSlide();
                blackout.classList.remove('active');
            }, 2000);
        }

        window.onload = () => {
            renderSlide();
        };
    </script>
</body>
</html>
