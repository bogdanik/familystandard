<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Свадебный Сценарий — Юра & Маргарита</title>
    <style>
        /* iOS Core Styles & Dark Romantic Glassmorphism Aesthetic */
        :root {
            --ios-bg-start: #1a0624;
            --ios-bg-end: #07010b;
            --ios-card-bg: rgba(255, 255, 255, 0.09);
            --ios-card-border: rgba(255, 255, 255, 0.22);
            --ios-accent: #FF2D55; /* Romantic Pink/Rose Accent */
            --ios-gold: #FFD60A;
            --ios-green: #30D158;
            --ios-red: #FF453A;
            --ios-text: #FFFFFF;
            --ios-text-secondary: rgba(255, 255, 255, 0.75);
            --ios-blur: blur(35px) saturate(200%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            /* ВСЁ ЖИРНОЕ ПО УМОЛЧАНИЮ */
            font-weight: 700 !important;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--ios-bg-start) 0%, var(--ios-bg-end) 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
            color: var(--ios-text);
        }

        /* Romantic Heart & Canvas Background */
        #canvas-romantic {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Main Container */
        .app-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 680px;
            margin: 0 auto;
            padding: 10px 12px 12px 12px;
            gap: 10px;
        }

        /* INTRO ANIMATION STATES */
        .top-nav-panel,
        .main-content {
            opacity: 0;
            pointer-events: none;
            transform: translateY(18px);
            transition: opacity 0.7s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.7s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* Active App State After Intro */
        .app-container.intro-active .top-nav-panel,
        .app-container.intro-active .main-content {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* INTRO OVERLAY TITLE (STARTS CENTERED) */
        .intro-title-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            z-index: 30;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            width: 90%;
            max-width: 500px;
        }

        .intro-title-overlay.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* Title when shifted to footer after intro */
        .intro-title-overlay.settled-footer {
            top: calc(100vh - 48px);
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            opacity: 1;
        }

        .couple-title-text {
            font-size: 26px;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #FFFFFF 0%, #FF2D55 50%, #FFD60A 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 45, 85, 0.6);
        }

        .couple-subtitle-text {
            font-size: 11px;
            color: var(--ios-text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 3px;
        }

        /* TOP NAVIGATION CONTROLS (ВЕРХНЯЯ ШАПКА) */
        .top-nav-panel {
            background: var(--ios-card-bg);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--ios-card-border);
            border-radius: 20px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .nav-buttons-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .btn-ios {
            flex: 1;
            height: 38px;
            border-radius: 14px;
            border: none;
            background: var(--ios-accent);
            color: #FFFFFF;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 45, 85, 0.35);
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .btn-ios:active {
            transform: scale(0.96);
            opacity: 0.85;
        }

        .btn-ios-secondary {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #FFFFFF;
            box-shadow: none;
        }

        .btn-ios:disabled {
            opacity: 0.3;
            pointer-events: none;
        }

        .step-counter-top {
            font-size: 11px;
            color: var(--ios-text-secondary);
            min-width: 65px;
            text-align: center;
            letter-spacing: 0.3px;
        }

        /* Hourly Jump Bar */
        .hour-tabs-scroll {
            display: flex;
            gap: 5px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }

        .hour-tabs-scroll::-webkit-scrollbar {
            display: none;
        }

        .hour-tab-pill {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: rgba(255, 255, 255, 0.85);
            padding: 4px 10px;
            border-radius: 9px;
            font-size: 11px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .hour-tab-pill.active {
            background: var(--ios-accent);
            border-color: var(--ios-accent);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(255, 45, 85, 0.4);
        }

        .progress-bar-wrap {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--ios-accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Main Scroll Content */
        .main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
            scrollbar-width: none;
            border-radius: 22px;
            margin-bottom: 50px; /* Space for settled bottom title */
        }

        .main-content::-webkit-scrollbar {
            display: none;
        }

        /* Scenario Card */
        .scenario-card {
            background: var(--ios-card-bg);
            backdrop-filter: var(--ios-blur);
            -webkit-backdrop-filter: var(--ios-blur);
            border: 1px solid var(--ios-card-border);
            border-radius: 22px;
            padding: 18px;
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: cardFadeIn 0.25s ease-out;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(8px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* CARD HEADER ROW WITH TIMER BADGE & PIN BUTTON */
        .timer-pin-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .time-badge {
            background: rgba(255, 45, 85, 0.25);
            border: 1px solid rgba(255, 45, 85, 0.5);
            color: #FFB3C1;
            font-size: 13px;
            padding: 5px 12px;
            border-radius: 10px;
            letter-spacing: 0.5px;
        }

        .btn-pin-toggle {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            padding: 5px 12px;
            border-radius: 10px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn-pin-toggle.unlocked {
            border-color: rgba(48, 209, 88, 0.6);
            color: var(--ios-green);
            background: rgba(48, 209, 88, 0.18);
        }

        .block-title {
            font-size: 18px;
            line-height: 1.35;
            color: #FFFFFF;
        }

        .section-box {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--ios-accent);
            padding: 10px 12px;
            border-radius: 0 12px 12px 0;
        }

        .section-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--ios-text-secondary);
            margin-bottom: 3px;
        }

        .section-text {
            font-size: 14px;
            line-height: 1.48;
            color: rgba(255, 255, 255, 0.95);
        }

        /* Speech Box */
        .speech-box {
            background: rgba(255, 214, 10, 0.14);
            border: 1px solid rgba(255, 214, 10, 0.5);
            border-radius: 14px;
            padding: 12px;
            animation: fadeInSpeech 0.3s ease;
        }

        @keyframes fadeInSpeech {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .speech-header {
            font-size: 11px;
            color: var(--ios-gold);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .speech-content {
            font-size: 14px;
            line-height: 1.5;
            color: #FFF8E7;
            font-style: italic;
        }

        /* Question Box */
        .question-box {
            background: rgba(48, 209, 88, 0.14);
            border: 1px solid rgba(48, 209, 88, 0.5);
            border-radius: 14px;
            padding: 12px;
            animation: fadeInSpeech 0.3s ease;
        }

        .question-header {
            font-size: 11px;
            color: var(--ios-green);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        /* PIN Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.78);
            backdrop-filter: blur(16px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .pin-modal {
            background: rgba(28, 14, 35, 0.92);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 45, 85, 0.3);
            border-radius: 24px;
            padding: 22px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            transform: scale(0.92);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .pin-modal {
            transform: scale(1);
        }

        .pin-modal h3 {
            font-size: 17px;
            margin-bottom: 5px;
        }

        .pin-modal p {
            font-size: 12px;
            color: var(--ios-text-secondary);
            margin-bottom: 14px;
        }

        .pin-input-field {
            width: 100%;
            height: 44px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 45, 85, 0.4);
            border-radius: 12px;
            color: #FFF;
            font-size: 20px;
            letter-spacing: 10px;
            text-align: center;
            outline: none;
            margin-bottom: 14px;
        }

        .pin-input-field:focus {
            border-color: var(--ios-accent);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
        }
    </style>
</head>
<body>

    <!-- Romantic Heart & Floating Sparks Canvas -->
    <canvas id="canvas-romantic"></canvas>

    <!-- CENTER INTRO OVERLAY TITLE (ANIMATES TO FOOTER) -->
    <div class="intro-title-overlay" id="intro-title-overlay">
        <div class="couple-title-text">Юра & Маргарита</div>
        <div class="couple-subtitle-text">Свадебный Сценарий</div>
    </div>

    <div class="app-container" id="app-container">
        
        <!-- TOP NAVIGATION CONTROLS (ШАПКА ВВЕРХУ) -->
        <div class="top-nav-panel">
            <div class="nav-buttons-top">
                <button class="btn-ios btn-ios-secondary" id="btn-prev">
                    ‹ Назад
                </button>
                <div class="step-counter-top" id="step-counter">1 из 23</div>
                <button class="btn-ios" id="btn-next">
                    Следующий этап ›
                </button>
            </div>

            <!-- Hour-by-Hour Fast Jump Tabs -->
            <div class="hour-tabs-scroll" id="hour-tabs-container">
                <!-- Dynamically injected hour pills -->
            </div>

            <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="progress-fill"></div>
            </div>
        </div>

        <!-- Main Scenario Card Area -->
        <main class="main-content" id="main-content">
            <!-- Active step rendered dynamically via JS -->
        </main>

    </div>

    <!-- PIN Modal -->
    <div class="modal-overlay" id="pin-modal-overlay">
        <div class="pin-modal">
            <h3>Доступ ведущего</h3>
            <p>Введите ПИН-код для отображения речей и вопросов гостям</p>
            <input type="password" id="pin-input" class="pin-input-field" maxlength="4" placeholder="••••" autocomplete="off" inputmode="numeric">
            <div class="modal-actions">
                <button class="btn-ios btn-ios-secondary" id="btn-close-modal">Отмена</button>
                <button class="btn-ios" id="btn-submit-pin">Войти</button>
            </div>
        </div>
    </div>

    <script>
        /* ===================================================
           1. INTRO ENGINE & ROMANTIC HEART PULSE ANIMATION
           =================================================== */
        const canvas = document.getElementById('canvas-romantic');
        const ctx = canvas.getContext('2d');
        const introOverlay = document.getElementById('intro-title-overlay');
        const appContainer = document.getElementById('app-container');

        let width, height, centerX, centerY;
        let animationStartTime = null;
        let pulsePhase = 0; // 0..3 pulse cycles
        let isIntroFinished = false;

        const sparks = [];
        const numSparks = 160;

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Spark {
            constructor() {
                this.reset();
            }

            reset() {
                const t = Math.random() * Math.PI * 2;
                const scale = (Math.min(width, height) * 0.015) * (0.8 + Math.random() * 0.4);
                
                // Parametric Heart Formula
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                this.x = centerX + hx * scale;
                this.y = centerY + hy * scale;

                const angle = Math.atan2(this.y - centerY, this.x - centerX) + (Math.random() - 0.5) * 0.6;
                const speed = 0.3 + Math.random() * 1.2; // Slow romantic floating
                
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                
                this.size = 1 + Math.random() * 2.8;
                this.alpha = 0.2 + Math.random() * 0.8;
                this.decay = 0.003 + Math.random() * 0.006;
                this.color = Math.random() > 0.35 ? '#FF2D55' : '#FFD60A';
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;

                if (this.alpha <= 0 || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.reset();
                }
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < numSparks; i++) {
            sparks.push(new Spark());
        }

        function drawHeart(scaleFactor, glowIntensity, flashAlpha = 0) {
            const baseScale = Math.min(width, height) * 0.016 * scaleFactor;

            ctx.save();
            ctx.translate(centerX, centerY);

            // Optional Flash Burst Overlay
            if (flashAlpha > 0) {
                const radGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, baseScale * 25);
                radGlow.addColorStop(0, `rgba(255, 45, 85, ${flashAlpha * 0.5})`);
                radGlow.addColorStop(0.5, `rgba(255, 214, 10, ${flashAlpha * 0.2})`);
                radGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
                ctx.fillStyle = radGlow;
                ctx.beginPath();
                ctx.arc(0, 0, baseScale * 25, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.beginPath();
            for (let t = 0; t <= Math.PI * 2; t += 0.02) {
                const hx = 16 * Math.pow(Math.sin(t), 3);
                const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                if (t === 0) ctx.moveTo(hx * baseScale, hy * baseScale);
                else ctx.lineTo(hx * baseScale, hy * baseScale);
            }
            ctx.closePath();

            ctx.strokeStyle = `rgba(255, 45, 85, ${0.7 + glowIntensity * 0.3})`;
            ctx.lineWidth = 3.5;
            ctx.shadowColor = '#FF2D55';
            ctx.shadowBlur = 15 + glowIntensity * 30;
            ctx.stroke();

            ctx.fillStyle = `rgba(255, 45, 85, ${0.05 + glowIntensity * 0.12})`;
            ctx.fill();

            ctx.restore();
        }

        function animate(timestamp) {
            if (!animationStartTime) animationStartTime = timestamp;
            const elapsed = timestamp - animationStartTime;

            ctx.clearRect(0, 0, width, height);

            let scaleFactor = 1;
            let glowIntensity = 0.5;
            let flashAlpha = 0;

            if (!isIntroFinished) {
                // Exactly 3 Pulses over ~2.8 seconds
                const pulseDuration = 900; // ms per pulse
                const currentPulseIndex = Math.floor(elapsed / pulseDuration);

                if (currentPulseIndex < 3) {
                    const progressInPulse = (elapsed % pulseDuration) / pulseDuration;
                    const sinVal = Math.sin(progressInPulse * Math.PI);
                    
                    scaleFactor = 1 + sinVal * 0.28; // Heart expands and contracts
                    glowIntensity = sinVal;
                    flashAlpha = Math.pow(sinVal, 3) * 0.6; // High intensity bursts at peak
                } else if (currentPulseIndex === 3) {
                    // Phase 2: Title Appears in Center
                    introOverlay.classList.add('visible');
                    scaleFactor = 1.05 + Math.sin((elapsed / 300)) * 0.03;
                }

                // Transition to Footer & Show Script UI at ~3.2 seconds
                if (elapsed >= 3200 && !introOverlay.classList.contains('settled-footer')) {
                    introOverlay.classList.remove('visible');
                    introOverlay.classList.add('settled-footer');
                    appContainer.classList.add('intro-active');
                    isIntroFinished = true;
                }
            } else {
                // Gentle continuous background breathing after intro
                const breathe = Math.sin(timestamp * 0.002);
                scaleFactor = 1 + breathe * 0.04;
                glowIntensity = 0.5 + breathe * 0.2;
            }

            // Draw Heart
            drawHeart(scaleFactor, glowIntensity, flashAlpha);

            // Draw Sparks
            for (let i = 0; i < sparks.length; i++) {
                sparks[i].update();
                sparks[i].draw();
            }

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // Allow instant tap to skip intro if host is in a rush
        document.body.addEventListener('click', () => {
            if (!isIntroFinished) {
                introOverlay.classList.remove('visible');
                introOverlay.classList.add('settled-footer');
                appContainer.classList.add('intro-active');
                isIntroFinished = true;
            }
        }, { once: true });

        /* ===================================================
           2. SCENARIO DATA & HOURLY TIMINGS
           =================================================== */
        const SECRET_PIN = "111";
        const STORAGE_KEY = "wedding_script_pin_unlocked_v1";
        
        let isUnlocked = localStorage.getItem(STORAGE_KEY) === "true";
        let currentStepIndex = 0;

        const hourlyBlocks = [
            { id: "17:00", label: "17:00 – 18:00", startIndex: 0 },
            { id: "18:00", label: "18:00 – 19:00", startIndex: 6 },
            { id: "19:00", label: "19:00 – 20:00", startIndex: 12 },
            { id: "20:00", label: "20:00 – 21:00", startIndex: 14 },
            { id: "21:00", label: "21:00 – 23:00", startIndex: 16 },
            { id: "23:00", label: "23:00 – 00:00", startIndex: 22 }
        ];

        const scenarioData = [
            // 17:00 Block (Indices 0..5)
            {
                hourGroup: "17:00",
                time: "17:00 – 17:30",
                title: "17:00 — Сбор гостей & Велком",
                type: "Велком & Брифинг (Одно помещение)",
                details: "Сбор гостей, легкая музыка, пирамида шампанского.",
                purpose: "Погружение гостей в праздничную атмосферу, знакомство, легкие напитки."
            },
            {
                hourGroup: "17:00",
                time: "17:20",
                title: "17:20 — Разогревающий брифинг Богдана",
                type: "Брифинг перед выездной регистрацией",
                details: "Инструктаж гостей перед выходом пары.",
                speech: "«Дорогие друзья, рад всех видеть! Буквально через 10 минут мы начинаем выездную регистрацию Юры и Риты. Просьба от меня лично: не стесняйтесь громких аплодисментов и искренних эмоций! Пусть ребят на выходе накроет настоящей волной нашей поддержки. Переводим телефоны в режим съемки и готовимся встречать нашу пару!»"
            },
            {
                hourGroup: "17:00",
                time: "17:30",
                title: "17:30 — Выход Юры и Маргариты",
                type: "Церемония Выездной Регистрации",

        /* ===================================================
           3. UI RENDER ENGINE & EVENT LISTENERS
           =================================================== */
        const mainContent = document.getElementById('main-content');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const stepCounter = document.getElementById('step-counter');
        const progressFill = document.getElementById('progress-fill');
        const hourTabsContainer = document.getElementById('hour-tabs-container');

        const pinModalOverlay = document.getElementById('pin-modal-overlay');
        const btnCloseModal = document.getElementById('btn-close-modal');
        const btnSubmitPin = document.getElementById('btn-submit-pin');
        const pinInput = document.getElementById('pin-input');

        function renderHourTabs() {
            let tabsHTML = '';
            const currentGroup = scenarioData[currentStepIndex].hourGroup;

            hourlyBlocks.forEach(hb => {
                const isActive = hb.id === currentGroup ? 'active' : '';
                tabsHTML += `
                    <button class="hour-tab-pill ${isActive}" onclick="jumpToHour(${hb.startIndex})">
                        ${hb.label}
                    </button>
                `;
            });
            hourTabsContainer.innerHTML = tabsHTML;
        }

        function jumpToHour(index) {
            currentStepIndex = index;
            renderStep(currentStepIndex);
        }

        // Returns speech HTML ONLY if unlocked, otherwise empty string (Omit from DOM)
        function formatSpeechHTML(text) {
            if (!isUnlocked || !text) return '';
            return `
                <div class="speech-box">
                    <div class="speech-header">🎙️ Речь Богдана</div>
                    <div class="speech-content">${text.replace(/\n/g, '<br>')}</div>
                </div>
            `;
        }

        // Returns question HTML ONLY if unlocked, otherwise empty string (Omit from DOM)
        function formatQuestionHTML(text) {
            if (!isUnlocked || !text) return '';
            return `
                <div class="question-box">
                    <div class="question-header">❓ Вопрос гостю</div>
                    <div class="section-text" style="font-weight: 700; color: #E8FFEA;">${text}</div>
                </div>
            `;
        }

        function renderStep(index) {
            const item = scenarioData[index];
            const pinBtnLabel = isUnlocked ? "🔓 Открыто" : "🔒 ПИН";
            const pinBtnClass = isUnlocked ? "btn-pin-toggle unlocked" : "btn-pin-toggle";

            let html = `
                <div class="scenario-card">
                    <!-- TIMER BADGE & PIN BUTTON IN ONE ROW -->
                    <div class="timer-pin-row">
                        <div class="time-badge">⏰ ${item.time}</div>
                        <button class="${pinBtnClass}" onclick="handlePinButtonClick()">
                            ${pinBtnLabel}
                        </button>
                    </div>

                    <div class="block-title">${item.title}</div>
            `;

            if (item.type) {
                html += `
                    <div class="section-box">
                        <div class="section-label">Этап</div>
                        <div class="section-text">${item.type}</div>
                    </div>
                `;
            }

            if (item.details) {
                html += `
                    <div class="section-box">
                        <div class="section-label">Детали / Сценарий</div>
                        <div class="section-text">${item.details}</div>
                    </div>
                `;
            }

            if (item.purpose) {
                html += `
                    <div class="section-box">
                        <div class="section-label">Цель</div>
                        <div class="section-text">${item.purpose}</div>
                    </div>
                `;
            }

            if (item.emotion) {
                html += `
                    <div class="section-box">
                        <div class="section-label">Эмоция</div>
                        <div class="section-text">${item.emotion}</div>
                    </div>
                `;
            }

            if (item.speech) {
                html += formatSpeechHTML(item.speech);
            }

            if (item.question) {
                html += formatQuestionHTML(item.question);
            }

            // Render Friends Toasts List
            if (item.friendsList) {
                item.friendsList.forEach(f => {
                    const speechPart = formatSpeechHTML(f.speech);
                    const questionPart = formatQuestionHTML(f.question);

                    html += `
                        <div style="border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; margin-top: 4px; display: flex; flex-direction: column; gap: 8px;">
                            <div style="font-size: 15px; font-weight: 800; color: #FF2D55;">👥 ${f.names}</div>
                            ${speechPart}
                            ${questionPart}
                        </div>
                    `;
                });
            }

            // Render Close Guests Toasts List
            if (item.experiencedList) {
                item.experiencedList.forEach(e => {
                    const speechPart = formatSpeechHTML(e.speech);
                    const questionPart = formatQuestionHTML(e.question);

                    html += `
                        <div style="border-top: 1px solid rgba(255,255,255,0.15); padding-top: 10px; margin-top: 4px; display: flex; flex-direction: column; gap: 8px;">
                            <div style="font-size: 15px; font-weight: 800; color: var(--ios-gold);">✨ ${e.names}</div>
                            ${speechPart}
                            ${questionPart}
                        </div>
                    `;
                });
            }

            html += `</div>`;
            mainContent.innerHTML = html;

            // Update Header & Controls State
            stepCounter.textContent = `${index + 1} из ${scenarioData.length}`;
            btnPrev.disabled = index === 0;
            btnNext.disabled = index === scenarioData.length - 1;
            
            const progressPercent = ((index + 1) / scenarioData.length) * 100;
            progressFill.style.width = `${progressPercent}%`;

            renderHourTabs();
            mainContent.scrollTop = 0;
        }

        /* ===================================================
           4. PIN LOGIC & PERSISTENCE
           =================================================== */
        function openPinModal() {
            pinModalOverlay.classList.add('active');
            pinInput.value = "";
            setTimeout(() => pinInput.focus(), 100);
        }

        function closePinModal() {
            pinModalOverlay.classList.remove('active');
            pinInput.blur();
        }

        function handlePinButtonClick() {
            if (isUnlocked) {
                if (confirm("Заблокировать речи ведущего и вопросы?")) {
                    isUnlocked = false;
                    try {
                        localStorage.removeItem(STORAGE_KEY);
                    } catch(e) {}
                    renderStep(currentStepIndex);
                }
            } else {
                openPinModal();
            }
        }

        function checkPin() {
            if (pinInput.value === SECRET_PIN) {
                isUnlocked = true;
                try {
                    localStorage.setItem(STORAGE_KEY, "true");
                } catch(e) {}
                closePinModal();
                renderStep(currentStepIndex);
            } else {
                pinInput.style.borderColor = "var(--ios-red)";
                setTimeout(() => {
                    pinInput.style.borderColor = "rgba(255, 45, 85, 0.4)";
                }, 800);
            }
        }

        btnCloseModal.addEventListener('click', closePinModal);
        btnSubmitPin.addEventListener('click', checkPin);

        pinInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                checkPin();
            }
        });

        /* ===================================================
           5. EVENT LISTENERS
           =================================================== */
        btnPrev.addEventListener('click', () => {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                renderStep(currentStepIndex);
            }
        });

        btnNext.addEventListener('click', () => {
            if (currentStepIndex < scenarioData.length - 1) {
                currentStepIndex++;
                renderStep(currentStepIndex);
            }
        });

        // Initialize App
        renderStep(0);
    </script>
