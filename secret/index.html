<!DOCTYPE html><html lang="ru"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Режиссерский Сценарий: Операция 36</title>
    <style>
        :root {
            --bg-gradient-start: #0a1128;
            --bg-gradient-end: #000411;
            --panel-bg: rgba(254, 254, 254, 0.03);
            --panel-border: rgba(212, 175, 55, 0.25);
            --royal-blue: #1e3a8a;
            --royal-blue-light: #3b82f6;
            --gold-main: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa7c11;
            --text-muted: #8c9fc2;
            --text-light: #f8fafc;
            
            --lbl-photo-bg: rgba(239, 68, 68, 0.15);
            --lbl-photo-text: #ef4444;
            --lbl-actor-bg: rgba(212, 175, 55, 0.15);
            --lbl-actor-text: #e5b82a;
            --lbl-tech-bg: rgba(59, 130, 246, 0.15);
            --lbl-tech-text: #3b82f6;
        }
 
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
            background-attachment: fixed;
            color: var(--text-light);
            line-height: 1.6;
            padding: 12px;
            margin: 0;
            -webkit-text-size-adjust: 100%;
        }
 
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: rgba(10, 17, 40, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }
 
        h1 {
            text-align: center;
            color: #ffffff;
            font-size: 1.4em;
            font-weight: 700;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, #ffffff, var(--gold-light), var(--gold-main));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
 
        h1::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: linear-gradient(to right, var(--royal-blue-light), var(--gold-main));
            margin: 8px auto 0 auto;
            border-radius: 2px;
        }

        .meta-info {
            text-align: center;
            font-size: 0.9em;
            color: var(--text-muted);
            margin-bottom: 30px;
        }
 
        h3 {
            font-size: 1em;
            font-weight: 600;
            color: var(--gold-main);
            margin-top: 0;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
 
        p {
            margin: 0 0 12px 0;
            font-size: 0.95em;
        }
 
        details {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin-bottom: 15px;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }
 
        details[open] {
            border-color: var(--panel-border);
            background: rgba(10, 17, 40, 0.4);
        }
 
        summary {
            padding: 16px;
            font-size: 1.02em;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            list-style: none;
            position: relative;
            background: linear-gradient(90deg, rgba(30, 58, 138, 0.2), rgba(0,0,0,0));
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
 
        summary::-webkit-details-marker {
            display: none;
        }
 
        summary::after {
            content: '➔';
            font-size: 0.8em;
            color: var(--gold-main);
            transition: transform 0.3s ease;
            transform: rotate(90deg);
        }
 
        details[open] summary::after {
            transform: rotate(-90deg);
        }
 
        .details-content {
            padding: 20px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            box-sizing: border-box;
        }
