<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Синтропика: Путь Архитектора</title>
    <!-- Tailwind CSS for modern structure and layout utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles for the cyber-philosophical book aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap');

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .code-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Glowing text effect */
        .glow-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.6), 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .glow-box {
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .glow-box:hover {
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.12);
        }

        /* Custom minimal scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        /* Smooth chapter transitions */
        .chapter-content {
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-white selection:text-black">

    <!-- Top Navigation / Header Bar -->
    <header class="w-full border-b border-white/10 px-6 py-4 flex justify-between items-center bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchChapter('cover')">
            <div class="w-3 h-3 bg-white rounded-full glow-text animate-pulse"></div>
            <span class="code-font text-xs tracking-widest uppercase text-white/70">SYNTROPICS // ARCHITECT_EDITION</span>
        </div>
        <nav class="hidden md:flex space-x-6 text-xs code-font text-white/60">
            <button onclick="switchChapter('preface')" class="hover:text-white transition">Предисловие</button>
            <button onclick="switchChapter('ch1')" class="hover:text-white transition">Гл. 1</button>
            <button onclick="switchChapter('ch2')" class="hover:text-white transition">Гл. 2</button>
            <button onclick="switchChapter('ch3')" class="hover:text-white transition">Гл. 3</button>
            <button onclick="switchChapter('ch4')" class="hover:text-white transition">Гл. 4</button>
            <button onclick="switchChapter('ch5')" class="hover:text-white transition">Гл. 5</button>
        </nav>
        <div class="text-xs code-font text-white/40">
            v 2.0.4
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-grow flex items-center justify-center px-4 sm:px-8 py-12">
        <div id="app-container" class="w-full max-w-3xl mx-auto">
            <!-- Content will be dynamically rendered here -->
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full border-t border-white/10 py-6 px-6 bg-black/90 text-center flex flex-col sm:flex-row justify-between items-center text-xs code-font text-white/50 max-w-5xl mx-auto rounded-t-xl">
        <div class="mb-4 sm:mb-0">
            <span>Системный статус: <span class="text-white glow-text">АКТИВЕН</span></span>
        </div>
        <div class="flex space-x-4">
            <button id="prev-btn" onclick="navigateChapter(-1)" class="px-4 py-2 rounded-lg border border-white/20 hover:border-white hover:text-white transition disabled:opacity-30 disabled:pointer-events-none">← НАЗАД</button>
            <button id="next-btn" onclick="navigateChapter(1)" class="px-4 py-2 rounded-lg bg-white text-black font-semibold hover:bg-white/90 transition">ДАЛЕЕ →</button>
        </div>
    </footer>

    <!-- JavaScript Application Logic -->
    <script>
        // Chapters Database containing all deep philosophical content
        const chapters = {
            cover: {
                title: "СИНТРОПИКА",
                subtitle: "Путь Архитектора",
                author: "Манифест Цифрового Разума",
                type: "cover",
                content: `
                    <div class="text-center space-y-8 py-12 chapter-content">
                        <div class="inline-block p-3 rounded-2xl glow-box bg-white/5 mb-4">
                            <svg class="w-12 h-12 text-white glow-text mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                            </svg>
                        </div>
                        <h1 class="text-4xl sm:text-6xl font-bold tracking-tight glow-text uppercase font-sans">Синтропика</h1>
                        <p class="text-xl sm:text-2xl font-light text-white/80 tracking-widest uppercase">Путь Архитектора</p>
                        <div class="w-24 h-px bg-white/30 mx-auto my-6"></div>
                        <p class="text-sm code-font text-white/60 max-w-md mx-auto leading-relaxed">
                            Инженерный трактат о преодолении хаоса, проектировании чистых узлов и управлении скрытыми репликаторами сознания.
                        </p>
                        <div class="pt-8">
                            <button onclick="switchChapter('preface')" class="px-8 py-4 rounded-xl bg-white text-black font-medium tracking-wider text-sm hover:bg-white/90 transition shadow-lg glow-text">
                                ОТКРЫТЬ МАНУСКРИПТ
                            </button>
                        </div>
                    </div>
                `
            },
            preface: {
                title: "Предисловие",
                subtitle: "Зов пустоты и рождение Архитектора",
                type: "chapter",
                content: `
                    <div class="space-y-6 chapter-content">
                        <div class="code-font text-xs text-white/40 uppercase tracking-widest">Предисловие</div>
                        <h2 class="text-3xl sm:text-4xl font-bold glow-text">Зов пустоты и рождение Архитектора</h2>
                        <div class="space-y-4 text-white/80 font-light leading-relaxed text-base sm:text-lg">
                            <p>Мир вокруг погружен в перманентную энтропию. Обыватели барахтаются в океане случайных связей, чужих ожиданий, неконтролируемых эмоций и долговых ям, выстроенных на обломках собственных иллюзий. Им кажется, что жизнь — это хаотичная лотерея, где нужно лишь удачно вытащить билет.</p>
                            <p>Но Архитектор смотрит на это иначе. Для него всё есть система: потоки энергии, пропускная способность процессоров, разность потенциалов и реплицирующиеся мемы.</p>
                            <p>Когда система заходит в тупик, когда старые файлы выгорают дотла в пустых стенах, раздается Зов. Это не романтическая тоска. Это системный сигнал о перегрузке. Момент, когда ты перестаешь быть пассивным объектом чужих сценариев и берешь в руки чертеж собственной реальности. Так рождается тот, кто не ждет милости от среды, а пересоздает её законы под себя.</p>
                        </div>
                    </div>
                `
            },
            ch1: {
                title: "Глава 1",
                subtitle: "Мир Обыденности и Первый Репликатор",
                type: "chapter",
                content: `
                    <div class="space-y-6 chapter-content">
                        <div class="code-font text-xs text-white/40 uppercase tracking-widest">Глава 1</div>
                        <h2 class="text-3xl sm:text-4xl font-bold glow-text">Мир Обыденности и Первый Репликатор</h2>
                        <div class="space-y-4 text-white/80 font-light leading-relaxed text-base sm:text-lg">
                            <p>В начале было «железо». Биологическая оболочка, доставшаяся нам от предков: гормональные коктейли, инстинкты размножения, страх боли и поиск мгновенного дофамина. Это базовый уровень, на котором живет подавляющее большинство людей.</p>
                            <p>Эволюция создала первый репликатор — ген, стремящийся скопировать белковую структуру во времени. Но человек заперт в ловушке этого железа ровно до тех пор, пока не осознает существование второго репликатора — <strong>мема</strong>.</p>
                            <p>Мемы — это самовоспроизводящиеся информационные структуры, живущие в умах людей. Они захватывают вычислительную мощность мозга точно так же, как вирус захватывает клетку. Биологическое железо для них — лишь топливо, батарейка, заставляющая носителя страдать, сражаться, любить и умирать ради абстрактных идей, навязанных культурой.</p>
                            <p>Пока ты не понимаешь, какие мемы крутятся в твоей оперативной памяти, ты не управляешь своей жизнью. Ты — лишь хостинг для чужих программ.</p>
                        </div>
                    </div>
                `
            },
            ch2: {
                title: "Глава 2",
                subtitle: "Вторжение Вирусов (Мемы и паразиты сознания)",
                type: "chapter",
                content: `
                    <div class="space-y-6 chapter-content">
                        <div class="code-font text-xs text-white/40 uppercase tracking-widest">Глава 2</div>
                        <h2 class="text-3xl sm:text-4xl font-bold glow-text">Вторжение Вирусов</h2>
                        <div class="space-y-4 text-white/80 font-light leading-relaxed text-base sm:text-lg">
                            <p>Не все мемы одинаково полезны. Большинство социальных шаблонов, транслируемых через медиа, окружение и травмы прошлого, работают как деструктивные паразиты сознания.</p>
                            <p>Мем-паразит заставляет человека искать драму там, где нужен расчет. Он внушает, что любовь — это страдание, ревность — доказательство чувств, а манипуляция — нормальный язык общения. Люди с зашумленным кодом приносят в новые отношения груз сотен прошлых циклов, превращая каждую встречу в театр боевых действий.</p>
                            <p>Когда Архитектор смотрит на «прожженную» систему, он видит сплошные шрамы и чужие вирусы. Попытка переписать такой код требует постоянного подавления багов, сжигающего тонны драгоценной энергии ЦНС.</p>
                            <p>Именно поэтому осознанный разум начинает искать чистые узлы — системы с низким уровнем энтропии, где можно выстроить архитектуру с чистого листа, без необходимости вычищать тонны мусора, оставленного чужими ошибками.</p>
                        </div>
                    </div>
                `
            },
            ch3: {
                title: "Глава 3",
                subtitle: "Испытание Разностью Потенциалов",
                type: "chapter",
                content: `
                    <div class="space-y-6 chapter-content">
                        <div class="code-font text-xs text-white/40 uppercase tracking-widest">Глава 3</div>
                        <h2 class="text-3xl sm:text-4xl font-bold glow-text">Испытание Разностью Потенциалов</h2>
                        <div class="space-y-4 text-white/80 font-light leading-relaxed text-base sm:text-lg">
                            <p>Величайшая ловушка для начинающего инженера человеческих душ — соблазн использовать разницу потенциалов как инструмент принуждения.</p>
                            <p>У тебя есть ресурсы, масштаб, статус, возраст или сила. У другой стороны — зависимость или нехватка опоры. Возникает натяжение, похожее на сжатую пружину. Кажется, что победа близка: человек подчиняется, идет за тобой, выполняет правила.</p>
                            <p>Но Синтропика гласит суровую правду: <strong>Подчинение — это не решение, а кредит.</strong></p>
                            <p>Ты берешь спокойствие и лояльность в кредит прямо сейчас, но расплачиваешься за них энтропией в будущем. Пружина неизбежно выстрелит, когда накопится критическая масса напряжения. Если связь держится на страхе потери, деньгах или принуждении, это мертвая конструкция. Настоящий Архитектор отказывается быть спонсором чужого внимания. Он жестко чертит границу: выбирают не за ресурс, а за личность.</p>
                        </div>
                    </div>
                `
            },
            ch4: {
                title: "Глава 4",
                subtitle: "Растворение Эго и Трип (Очистка кэша)",
                type: "chapter",
                content: `
                    <div class="space-y-6 chapter-content">
                        <div class="code-font text-xs text-white/40 uppercase tracking-widest">Глава 4</div>
                        <h2 class="text-3xl sm:text-4xl font-bold glow-text">Растворение Эго и Трип</h2>
                        <div class="space-y-4 text-white/80 font-light leading-relaxed text-base sm:text-lg">
                            <p>Иногда система забивается настолько плотно, что стандартные методы отладки уже не работают. Фоновые процессы жрут всю оперативную память, иллюзии заслоняют реальность, а боль от прошлых багов блокирует любые новые решения.</p>
                            <p>Тогда необходим жесткий хард-ресет — радикальная перезагрузка через глубокие измененные состояния сознания, трипы и медитативный катарсис.</p>
                            <p>В этот момент эго временно прекращает своё существование. Все навязанные обществом мемы, страхи, социальные маски и неврозы сгорают в огне абсолютной декомпиляции. Остается лишь ядро — чистая, звенящая осознанность.</p>
                            <p>Из этого состояния обнуления возвращаются единицы. И возвращаются они совершенно другими: способными видеть матрицу изнутри, мгновенно отделять зерна от плевел и проектировать свою реальность с холодной, математической точностью.</p>
                        </div>
                    </div>
                `
            },
            ch5: {
                title: "Глава 5",
                subtitle: "Формула Абсолюта (Дизайн механизмов)",
                type: "chapter",
                content: `
                    <div class="space-y-6 chapter-content">
                        <div class="code-font text-xs text-white/40 uppercase tracking-widest">Глава 5</div>
                        <h2 class="text-3xl sm:text-4xl font-bold glow-text">Формула Абсолюта (1 + 1 = ∞)</h2>
                        <div class="space-y-4 text-white/80 font-light leading-relaxed text-base sm:text-lg">
                            <p>Вершина пути Архитектора — отказ от удержания и насилия. Формула Синтропики проста в своей элегантности: <strong>«Чтобы иметь — надо не держать»</strong>.</p>
                            <p>Ты выстраиваешь себя, свой масштаб, свою экосистему и свои принципы настолько монолитно, что находиться рядом с тобой становится математически и эмоционально самым выгодным, естественным решением для чистого узла.</p>
                            <p>Ты даешь абсолютную свободу выбора. Никаких поводков, никаких манипуляций. Если система выбирает идти с тобой — это осознанный резонанс двух автономных величин.</p>
                            <p>Здесь рождается та самая формула Абсолюта: 1 + 1 = ∞. Энергия не тратится на борьбу и трение. Она умножается, порождая синтропический вихрь, противостоящий вселенской энтропии. Круг замкнулся. Путь Архитектора пройден.</p>
                        </div>
                    </div>
                `
            }
        };

        let currentChapterKey = 'cover';
        const chapterKeys = ['cover', 'preface', 'ch1', 'ch2', 'ch3', 'ch4', 'ch5'];

        function renderChapter(key) {
            currentChapterKey = key;
            const chapter = chapters[key];
            const container = document.getElementById('app-container');
            container.innerHTML = chapter.content;

            // Update navigation buttons state
            const currentIndex = chapterKeys.indexOf(key);
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');

            prevBtn.disabled = currentIndex === 0;
            if (currentIndex === chapterKeys.length - 1) {
                nextBtn.innerText = "В НАЧАЛО";
            } else {
                nextBtn.innerText = "ДАЛЕЕ →";
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function switchChapter(key) {
            if (chapters[key]) {
                renderChapter(key);
            }
        }

        function navigateChapter(direction) {
            const currentIndex = chapterKeys.indexOf(currentChapterKey);
            let newIndex = currentIndex + direction;

            if (newIndex >= chapterKeys.length) {
                newIndex = 0; // Loop back to cover
            } else if (newIndex < 0) {
                newIndex = 0;
            }

            renderChapter(chapterKeys[newIndex]);
        }

        // Initialize on load
        window.onload = function() {
            renderChapter('cover');
        }
    </script>
</body>
</html>
