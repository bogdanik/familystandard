<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Standard OS — Apple Photo Stack</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080503;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color: #fceade;
        }

        /* Canvas фон */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            will-change: transform;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* КРЕСТИК ЗАКРЫТИЯ В ВЕРХНЕМ УГЛУ */
        .top-close-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(40, 20, 12, 0.5);
            border: 1px solid rgba(224, 169, 109, 0.25);
            color: rgba(252, 234, 222, 0.75);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
        }

        .top-close-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .top-close-btn:hover {
            background: rgba(255, 59, 48, 0.88);
            border-color: #ff3b30;
            color: #ffffff;
            transform: scale3d(1.1, 1.1, 1);
            box-shadow: 0 0 25px rgba(255, 59, 48, 0.6);
        }

        /* МИНИМАЛИСТИЧНЫЙ СТАРТОВЫЙ ЭКРАН (ТОЛЬКО КНОПКА) */
        .splash-screen {
            position: absolute;
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale3d(0.88, 0.88, 1);
            visibility: hidden;
        }

        .start-btn {
            padding: 22px 58px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, rgba(224, 169, 109, 0.9), rgba(140, 66, 39, 0.9));
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 15px 45px rgba(224, 169, 109, 0.35), 0 0 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: scale3d(1.06, 1.06, 1);
            box-shadow: 0 20px 55px rgba(224, 169, 109, 0.65);
            background: linear-gradient(135deg, #f4a261, #a04928);
        }

        /* СЦЕНА КАРУСЕЛИ */
        .stage-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: none;
            background: transparent;
        }

        .image-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1400px;
        }

        .slide-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: fit-content;
            height: fit-content;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            overflow: hidden;
            background: rgba(18, 9, 5, 0.7);
            border: 3px solid rgba(224, 169, 109, 0.6);
            will-change: transform, opacity, filter, box-shadow;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            
            transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-img, .slide-video {
            display: block;
            max-height: 70vh;
            max-width: 46vw;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 19px;
            pointer-events: auto;
        }

        /* ПОЗИЦИОНИРОВАНИЕ */
        .pos-center {
            opacity: 1;
            z-index: 30;
            border-color: rgba(224, 169, 109, 0.95);
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.9), 0 0 45px 10px rgba(224, 169, 109, 0.55);
            filter: brightness(1);
            animation: frame130Zoom 10.5s linear forwards;
        }

        @keyframes frame130Zoom {
            0% { transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1) rotate(0deg); }
            100% { transform: translate3d(-50%, -50%, 0) scale3d(1.3, 1.3, 1) rotate(0deg); }
        }

        .pos-stack-1 {
            transform: translate3d(calc(-50% - 25vw), calc(-50% + 10px), -40px) scale3d(0.8, 0.8, 1) rotate(calc(var(--card-angle) - 3deg));
            opacity: 0.7;
            z-index: 20;
            border-color: rgba(224, 169, 109, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            filter: brightness(0.75);
        }

        .pos-stack-2 {
            transform: translate3d(calc(-50% - 32vw), calc(-50% + 22px), -80px) scale3d(0.72, 0.72, 1) rotate(calc(var(--card-angle) - 7deg));
            opacity: 0.5;
            z-index: 15;
            border-color: rgba(224, 169, 109, 0.25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            filter: brightness(0.55);
        }

        .pos-far-left {
            transform: translate3d(calc(-50% - 42vw), calc(-50% + 35px), -150px) scale3d(0.55, 0.55, 1) rotate(-12deg);
            opacity: 0;
            z-index: 1;
            filter: brightness(0.1);
        }

        .pos-right-1 {
            transform: translate3d(calc(-50% + 25vw), -50%, -40px) scale3d(0.8, 0.8, 1) rotate(calc(var(--card-angle) + 3deg));
            opacity: 0.7;
            z-index: 22;
            border-color: rgba(224, 169, 109, 0.4);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            filter: brightness(0.75);
        }

        .pos-right-2 {
            transform: translate3d(calc(-50% + 32vw), -50%, -80px) scale3d(0.72, 0.72, 1) rotate(calc(var(--card-angle) + 7deg));
            opacity: 0.5;
            z-index: 18;
            border-color: rgba(224, 169, 109, 0.25);
            filter: brightness(0.55);
        }

        .pos-far-right {
            transform: translate3d(calc(-50% + 42vw), -50%, -150px) scale3d(0.55, 0.55, 1) rotate(10deg);
            opacity: 0;
            z-index: 1;
            filter: brightness(0.1);
        }

        /* ПУЛЬТ ВЕДУЩЕГО */
        .admin-panel {
            position: absolute;
            bottom: 25px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            background: rgba(25, 13, 8, 0.88);
            border: 1px solid rgba(224, 169, 109, 0.35);
            border-radius: 24px;
            padding: 16px 28px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);

            opacity: 0;
            transform: translate3d(0, 40px, 0);
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .admin-panel.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
        }

        .panel-header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid rgba(224, 169, 109, 0.15);
            padding-bottom: 6px;
        }

        .slide-counter {
            font-size: 1.05rem;
            font-weight: 700;
            color: #e0a96d;
            letter-spacing: 1px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .ctrl-btn {
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            color: #fceade;
            border: 1px solid rgba(224, 169, 109, 0.22);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ctrl-btn:hover {
            background: rgba(224, 169, 109, 0.22);
            border-color: #e0a96d;
            color: #e0a96d;
        }

        .ctrl-btn.active {
            background: linear-gradient(135deg, #e0a96d, #8c4227);
            color: #fff;
            box-shadow: 0 0 18px rgba(224, 169, 109, 0.55);
            border-color: transparent;
        }

        .video-btn-group {
            display: flex;
            gap: 6px;
            margin-left: 8px;
            border-left: 1px solid rgba(224, 169, 109, 0.25);
            padding-left: 12px;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <button id="topCloseBtn" class="top-close-btn" title="Закрыть сессию и вернуться на старт">✖</button>

    <div class="main-container">

        <!-- ПРОСТАЯ КНОПКА СТАРТА ПОКАЗА -->
        <div id="splashScreen" class="splash-screen">
            <button id="startBtn" class="start-btn">▶ СТАРТ ПОКАЗА</button>
        </div>

        <div id="stageFrame" class="stage-frame">
            <div id="imageWrapper" class="image-wrapper"></div>
        </div>

        <!-- ПУЛЬТ ВЕДУЩЕГО -->
        <div id="adminPanel" class="admin-panel">
            <div class="panel-header">
                <span id="slideIndicator" class="slide-counter">ФОТО 1 / 20</span>
            </div>
            <div class="controls-row">
                <button id="prevBtn" class="ctrl-btn">◄ Назад</button>
                <button id="nextBtn" class="ctrl-btn">Вперед ►</button>
                <button id="autoBtn" class="ctrl-btn">Автопоказ (10 сек)</button>
                
                <div class="video-btn-group">
                    <button class="ctrl-btn video-direct-btn" data-video="1">🎬 Видео 1</button>
                    <button class="ctrl-btn video-direct-btn" data-video="2">🎬 Видео 2</button>
                    <button class="ctrl-btn video-direct-btn" data-video="3">🎬 Видео 3</button>
                    <button class="ctrl-btn video-direct-btn" data-video="4">🎬 Видео 4</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 55;
        const maxDistance = 140;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 50;
                this.vy = (Math.random() - 0.5) * 50;
                this.radius = Math.random() * 2.5 + 1;
                this.color = Math.random() > 0.5 ? '#e0a96d' : '#8c4227';
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        let lastTime = performance.now();
        function animateCanvas(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(dt);
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(224, 169, 109, ${1 - dist / maxDistance * 0.5})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        requestAnimationFrame(animateCanvas);

        const socket = io("https://pic-jj29.onrender.com", {
            transports: ['polling', 'websocket'],
            upgrade: true
        });

        const R2_BASE_URL = "https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/";

        let isAdmin = false;
        let currentSlideIndex = 0;
        let totalSlidesCount = 20;
        let isAutoPlay = false;
        let autoPlayTimer = null;
        let currentMediaType = 'photo'; // 'photo' или 'video'
        let currentVideoId = 1;

        let stackHistory = [];

        const splashScreen = document.getElementById('splashScreen');
        const startBtn = document.getElementById('startBtn');
        const topCloseBtn = document.getElementById('topCloseBtn');
        const imageWrapper = document.getElementById('imageWrapper');
        const adminPanel = document.getElementById('adminPanel');
        const slideIndicator = document.getElementById('slideIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const autoBtn = document.getElementById('autoBtn');

        socket.on('init_state', (data) => {
            currentSlideIndex = data.current_slide;
            totalSlidesCount = data.total_slides;
            isAdmin = data.is_admin;
            isAutoPlay = data.auto_play;
            currentMediaType = data.media_type || 'photo';
            currentVideoId = data.video_id || 1;

            updateUI();
            if (currentSlideIndex > 0 || currentMediaType === 'video') {
                updateStackView();
            }
        });

        startBtn.addEventListener('click', () => {
            socket.emit('start_session');
        });

        topCloseBtn.addEventListener('click', () => {
            socket.emit('reset_session');
        });

        socket.on('session_started', (data) => {
            currentSlideIndex = data.current_slide;
            currentMediaType = 'photo';
            if (socket.id === data.admin_sid) isAdmin = true;

            stackHistory = [];
            updateUI();
            updateStackView();
        });

        socket.on('slide_updated', (data) => {
            const oldIdx = currentSlideIndex;
            currentSlideIndex = data.current_slide;
            currentMediaType = data.media_type || 'photo';
            currentVideoId = data.video_id || 1;

            if (currentMediaType === 'photo' && oldIdx > 0 && oldIdx !== currentSlideIndex) {
                stackHistory.push(oldIdx);
                if (stackHistory.length > 4) stackHistory.shift();
            }

            updateUI();
            updateStackView();
        });

        function updateStackView() {
            if (currentMediaType === 'video') {
                imageWrapper.innerHTML = '';
                const card = document.createElement('div');
                card.className = 'slide-card pos-center';
                card.dataset.type = 'video';
                
                const video = document.createElement('video');
                video.className = 'slide-video';
                video.src = `${R2_BASE_URL}video${currentVideoId}.mp4`;
                video.controls = true;
                video.autoplay = true;
                
                card.appendChild(video);
                imageWrapper.appendChild(card);
                return;
            }

            if (currentSlideIndex < 1) {
                imageWrapper.innerHTML = '';
                return;
            }

            const total = totalSlidesCount;
            const centerIdx = currentSlideIndex;
            const right1Idx = centerIdx < total ? centerIdx + 1 : 1;
            const right2Idx = right1Idx < total ? right1Idx + 1 : 1;

            const stack1 = stackHistory.length >= 1 ? stackHistory[stackHistory.length - 1] : null;
            const stack2 = stackHistory.length >= 2 ? stackHistory[stackHistory.length - 2] : null;

            const neededMap = {};
            if (stack2) neededMap[stack2] = 'pos-stack-2';
            if (stack1) neededMap[stack1] = 'pos-stack-1';

            neededMap[centerIdx] = 'pos-center';
            neededMap[right1Idx] = 'pos-right-1';
            neededMap[right2Idx] = 'pos-right-2';

            const existingCards = {};
            imageWrapper.querySelectorAll('.slide-card').forEach(card => {
                if (card.dataset.type === 'video') {
                    card.remove();
                    return;
                }
                const num = parseInt(card.dataset.slide, 10);
                existingCards[num] = card;
            });

            Object.keys(existingCards).forEach(numStr => {
                const num = parseInt(numStr, 10);
                if (!neededMap[num]) {
                    const card = existingCards[num];
                    if (card.className.includes('stack') || card.className.includes('center')) {
                        card.className = 'slide-card pos-far-left';
                    } else {
                        card.className = 'slide-card pos-far-right';
                    }
                    setTimeout(() => {
                        if (card && card.parentNode) card.remove();
                    }, 850);
                }
            });

            Object.keys(neededMap).forEach(numStr => {
                const num = parseInt(numStr, 10);
                const targetClass = neededMap[num];
                let card = existingCards[num];

                if (card) {
                    card.className = `slide-card ${targetClass}`;
                } else {
                    card = document.createElement('div');
                    card.dataset.slide = num;
                    card.style.setProperty('--card-angle', `${(num * 3) % 7 - 3}deg`);

                    if (targetClass.includes('right')) card.className = 'slide-card pos-far-right';
                    else if (targetClass.includes('stack')) card.className = 'slide-card pos-far-left';
                    else card.className = 'slide-card pos-far-right';

                    const img = document.createElement('img');
                    img.className = 'slide-img';
                    img.src = `${R2_BASE_URL}pic${num}.jpg`;

                    card.appendChild(img);
                    imageWrapper.appendChild(card);

                    void card.offsetWidth;
                    card.className = `slide-card ${targetClass}`;
                }
            });
        }

        function updateUI() {
            if (currentSlideIndex > 0 || currentMediaType === 'video') {
                splashScreen.classList.add('hidden');
                topCloseBtn.classList.add('visible');

                if (isAdmin) {
                    adminPanel.classList.add('visible');
                    if (currentMediaType === 'video') {
                        slideIndicator.innerText = `ВИДЕО ${currentVideoId}`;
                    } else {
                        slideIndicator.innerText = `ФОТО ${currentSlideIndex} / ${totalSlidesCount}`;
                    }
                } else {
                    adminPanel.classList.remove('visible');
                }
            } else {
                splashScreen.classList.remove('hidden');
                topCloseBtn.classList.remove('visible');
                adminPanel.classList.remove('visible');
                imageWrapper.innerHTML = '';
            }

            if (isAutoPlay) autoBtn.classList.add('active');
            else autoBtn.classList.remove('active');
        }

        prevBtn.addEventListener('click', () => {
            if (isAdmin) socket.emit('change_slide', { action: 'prev' });
        });

        nextBtn.addEventListener('click', () => {
            if (isAdmin) socket.emit('change_slide', { action: 'next' });
        });

        autoBtn.addEventListener('click', () => {
            if (!isAdmin) return;
            isAutoPlay = !isAutoPlay;
            socket.emit('toggle_autoplay', { auto_play: isAutoPlay });
        });

        document.querySelectorAll('.video-direct-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                if (!isAdmin) return;
                const vId = parseInt(e.target.dataset.video, 10);
                socket.emit('change_slide', { media_type: 'video', video_id: vId });
            });
        });

        socket.on('autoplay_updated', (data) => {
            isAutoPlay = data.auto_play;
            updateUI();

            if (autoPlayTimer) clearInterval(autoPlayTimer);

            if (isAutoPlay && isAdmin) {
                autoPlayTimer = setInterval(() => {
                    socket.emit('change_slide', { action: 'next' });
                }, 10000);
            }
        });

        socket.on('session_reset', () => {
            currentSlideIndex = 0;
            isAdmin = false;
            isAutoPlay = false;
            currentMediaType = 'photo';
            stackHistory = [];
            if (autoPlayTimer) clearInterval(autoPlayTimer);
            updateUI();
        });
    </script>
</body>
</html>
