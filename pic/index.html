<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Standard OS — Галерея Карусель</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0f0704;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #fceade;
        }

        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            will-change: transform;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* КРЕСТИК ВВЕРХУ СПРАВА ДЛЯ СБРОСА */
        .top-close-btn {
            position: fixed;
            top: 22px;
            right: 22px;
            z-index: 100;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(30, 16, 10, 0.45);
            border: 1px solid rgba(224, 169, 109, 0.3);
            color: rgba(252, 234, 222, 0.7);
            font-size: 1.3rem;
            font-weight: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            opacity: 0;
            pointer-events: none;
        }

        .top-close-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .top-close-btn:hover {
            background: rgba(255, 59, 48, 0.85);
            border-color: #ff3b30;
            color: #ffffff;
            transform: scale3d(1.12, 1.12, 1);
            box-shadow: 0 0 25px rgba(255, 59, 48, 0.7);
        }

        .top-close-btn:active {
            transform: scale3d(0.95, 0.95, 1);
        }

        /* СТАРТОВЫЙ ЭКРАН */
        .splash-screen {
            position: absolute;
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 45px 65px;
            background: rgba(25, 13, 8, 0.85);
            border: 1px solid rgba(224, 169, 109, 0.35);
            border-radius: 28px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 50px rgba(140, 66, 39, 0.4);
            transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale3d(0.85, 0.85, 1);
            visibility: hidden;
        }

        .brand-title {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 20%, #e0a96d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(224, 169, 109, 0.3);
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 8px;
            color: #d4a373;
            text-transform: uppercase;
            margin-bottom: 35px;
        }

        .start-btn {
            padding: 20px 64px;
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #e0a96d, #8c4227);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 0 35px rgba(224, 169, 109, 0.5);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 3px;
        }

        .start-btn:hover {
            transform: scale3d(1.08, 1.08, 1);
            box-shadow: 0 0 55px rgba(224, 169, 109, 0.8);
            background: linear-gradient(135deg, #f4a261, #a04928);
        }

        /* СЦЕНА КАРУСЕЛИ */
        .stage-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: none;
            background: transparent;
        }

        .image-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1200px;
        }

        /* СТИЛИ КАРТОЧЕК В КАРУСЕЛИ */
        .slide-card {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 48vw;
            max-width: 680px;
            height: 72vh;
            max-height: 620px;
            border-radius: 20px;
            overflow: hidden;
            will-change: transform, opacity, filter, box-shadow;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                        opacity 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.85s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.85s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .slide-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            border-radius: 16px;
            will-change: transform;
        }

        /* ПОЗИЦИЯ 1: ЦЕНТРАЛЬНАЯ КАРТОЧКА В ФОКУСЕ */
        .card-center {
            transform: translate3d(0, 0, 0) scale3d(1, 1, 1);
            opacity: 1;
            z-index: 10;
            border: 3px solid rgba(224, 169, 109, 0.9);
            box-shadow: 
                0 0 35px 8px rgba(224, 169, 109, 0.65),
                0 0 80px 20px rgba(140, 66, 39, 0.5);
            filter: brightness(1);
        }

        .card-center .slide-img {
            animation: kenBurnsZoom 10.5s linear forwards;
        }

        @keyframes kenBurnsZoom {
            0% { transform: scale3d(1, 1, 1); }
            100% { transform: scale3d(1.22, 1.22, 1); }
        }

        /* ПОЗИЦИЯ 2: ЛЕВАЯ КАРТОЧКА */
        .card-left {
            transform: translate3d(-52vw, 0, -100px) scale3d(0.72, 0.72, 1);
            opacity: 0.45;
            z-index: 5;
            border: 2px solid rgba(224, 169, 109, 0.35);
            box-shadow: 0 0 20px rgba(140, 66, 39, 0.3);
            filter: brightness(0.55);
        }

        /* ПОЗИЦИЯ 3: ПРАВАЯ КАРТОЧКА */
        .card-right {
            transform: translate3d(52vw, 0, -100px) scale3d(0.72, 0.72, 1);
            opacity: 0.45;
            z-index: 5;
            border: 2px solid rgba(224, 169, 109, 0.35);
            box-shadow: 0 0 20px rgba(140, 66, 39, 0.3);
            filter: brightness(0.55);
        }

        /* СКРЫТЫЕ ПОЗИЦИИ ЗА ЭКРАНОМ ДЛЯ ВЪЕЗДА/ВЫЕЗДА */
        .card-far-left {
            transform: translate3d(-108vw, 0, -200px) scale3d(0.5, 0.5, 1);
            opacity: 0;
            z-index: 1;
            filter: brightness(0.3);
        }

        .card-far-right {
            transform: translate3d(108vw, 0, -200px) scale3d(0.5, 0.5, 1);
            opacity: 0;
            z-index: 1;
            filter: brightness(0.3);
        }

        /* ПУЛЬТ ВЕДУЩЕГО */
        .admin-panel {
            position: absolute;
            bottom: 25px;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(25, 13, 8, 0.92);
            border: 1px solid rgba(224, 169, 109, 0.4);
            border-radius: 20px;
            padding: 14px 24px;
            backdrop-filter: blur(18px);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.85);

            opacity: 0;
            transform: translate3d(0, 40px, 0);
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .admin-panel.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
        }

        .panel-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(224, 169, 109, 0.15);
            padding-bottom: 6px;
        }

        .slide-counter {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e0a96d;
            letter-spacing: 1px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ctrl-btn {
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            color: #fceade;
            border: 1px solid rgba(224, 169, 109, 0.25);
            transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .ctrl-btn:hover {
            background: rgba(224, 169, 109, 0.2);
            border-color: #e0a96d;
            color: #e0a96d;
        }

        .ctrl-btn.active {
            background: linear-gradient(135deg, #e0a96d, #8c4227);
            color: #fff;
            box-shadow: 0 0 15px rgba(224, 169, 109, 0.6);
            border-color: transparent;
        }

        .end-btn {
            background: linear-gradient(135deg, #ff3b30, #d32f2f);
            border: none;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <button id="topCloseBtn" class="top-close-btn" title="Закрыть сессию и вернуться на старт">✖</button>

    <div class="main-container">

        <div id="splashScreen" class="splash-screen">
            <h1 class="brand-title">FAMILY STANDARD OS</h1>
            <div class="brand-subtitle">ФОТО</div>
            <button id="startBtn" class="start-btn">▶ СТАРТ</button>
        </div>

        <div id="stageFrame" class="stage-frame">
            <div id="imageWrapper" class="image-wrapper"></div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <div class="panel-header">
                <span id="slideIndicator" class="slide-counter">ФОТО 1 / 20</span>
            </div>
            <div class="controls-row">
                <button id="prevBtn" class="ctrl-btn">◄ Назад</button>
                <button id="nextBtn" class="ctrl-btn">Вперед ►</button>
                <button id="randomBtn" class="ctrl-btn">🔀 Рандом</button>
                <button id="autoBtn" class="ctrl-btn">Автопоказ (10 сек)</button>
                <button id="endBtn" class="ctrl-btn end-btn">THE END</button>
            </div>
        </div>

    </div>

    <script>
        // 120 FPS CANVAS С ДЕЛЬТА-ТАЙМОМ
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 55;
        const maxDistance = 140;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 60;
                this.vy = (Math.random() - 0.5) * 60;
                this.radius = Math.random() * 2.5 + 1;
                this.color = Math.random() > 0.5 ? '#e0a96d' : '#8c4227';
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        let lastTime = performance.now();

        function animateCanvas(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(dt);
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(224, 169, 109, ${1 - dist / maxDistance * 0.6})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        requestAnimationFrame(animateCanvas);

        // ПОДКЛЮЧЕНИЕ К СЕРВЕРУ И ДИНАМИЧЕСКАЯ КАРУСЕЛЬ
        const socket = io("https://pic-jj29.onrender.com", {
            transports: ['polling', 'websocket'],
            upgrade: true
        });

        const R2_BASE_URL = "https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/";

        let isAdmin = false;
        let currentSlideIndex = 0;
        let totalSlidesCount = 20;
        let isAutoPlay = false;
        let isRandom = false;
        let autoPlayTimer = null;

        const splashScreen = document.getElementById('splashScreen');
        const startBtn = document.getElementById('startBtn');
        const topCloseBtn = document.getElementById('topCloseBtn');
        const stageFrame = document.getElementById('stageFrame');
        const imageWrapper = document.getElementById('imageWrapper');
        const adminPanel = document.getElementById('adminPanel');
        const slideIndicator = document.getElementById('slideIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const autoBtn = document.getElementById('autoBtn');
        const endBtn = document.getElementById('endBtn');

        // КЭШ ИЗОБРАЖЕНИЙ ДЛЯ ПРЕДЗАГРУЗКИ
        const persistentCache = {};
        function preloadImages() {
            for (let i = 1; i <= totalSlidesCount; i++) {
                const img = new Image();
                img.src = `${R2_BASE_URL}pic${i}.jpg`;
                persistentCache[i] = img;
            }
        }
        preloadImages();

        socket.on('init_state', (data) => {
            currentSlideIndex = data.current_slide;
            totalSlidesCount = data.total_slides;
            isAdmin = data.is_admin;
            isAutoPlay = data.auto_play;
            isRandom = data.is_random;

            updateUI();
            if (currentSlideIndex > 0) {
                updateCarousel(currentSlideIndex);
            }
        });

        startBtn.addEventListener('click', () => {
            socket.emit('start_session');
        });

        topCloseBtn.addEventListener('click', () => {
            socket.emit('reset_session');
        });

        socket.on('session_started', (data) => {
            currentSlideIndex = data.current_slide;
            if (socket.id === data.admin_sid) isAdmin = true;

            updateUI();
            updateCarousel(currentSlideIndex);
        });

        socket.on('slide_updated', (data) => {
            currentSlideIndex = data.current_slide;
            updateUI();
            updateCarousel(currentSlideIndex);
        });

        // ЛОГИКА 3D-КАРУСЕЛИ
        function updateCarousel(centerNum) {
            if (centerNum < 1) {
                imageWrapper.innerHTML = '';
                return;
            }

            const total = totalSlidesCount;
            const centerIdx = centerNum;
            const leftIdx = centerIdx > 1 ? centerIdx - 1 : total;
            const rightIdx = centerIdx < total ? centerIdx + 1 : 1;

            const neededMap = {
                [leftIdx]: 'card-left',
                [centerIdx]: 'card-center',
                [rightIdx]: 'card-right'
            };

            const existingCards = {};
            imageWrapper.querySelectorAll('.slide-card').forEach(card => {
                const num = parseInt(card.dataset.slide, 10);
                existingCards[num] = card;
            });

            // 1. Плавно удаляем карточки, которые больше не нужны
            Object.keys(existingCards).forEach(numStr => {
                const num = parseInt(numStr, 10);
                if (!neededMap[num]) {
                    const card = existingCards[num];
                    if (card.classList.contains('card-left') || card.classList.contains('card-center')) {
                        card.className = 'slide-card card-far-left';
                    } else {
                        card.className = 'slide-card card-far-right';
                    }
                    setTimeout(() => {
                        if (card && card.parentNode) card.remove();
                    }, 850);
                }
            });

            // 2. Обновляем или сдвигаем карточки Лево / Центр / Право
            [leftIdx, centerIdx, rightIdx].forEach(num => {
                const targetClass = neededMap[num];
                let card = existingCards[num];

                if (card) {
                    card.className = `slide-card ${targetClass}`;
                } else {
                    card = document.createElement('div');
                    card.dataset.slide = num;

                    if (targetClass === 'card-right') {
                        card.className = 'slide-card card-far-right';
                    } else if (targetClass === 'card-left') {
                        card.className = 'slide-card card-far-left';
                    } else {
                        card.className = 'slide-card card-far-right';
                    }

                    const img = document.createElement('img');
                    img.className = 'slide-img';
                    img.src = `${R2_BASE_URL}pic${num}.jpg`;
                    img.onerror = function() {
                        setTimeout(() => {
                            this.src = `${R2_BASE_URL}pic${num}.jpg?retry=${Date.now()}`;
                        }, 800);
                    };

                    card.appendChild(img);
                    imageWrapper.appendChild(card);

                    // Принудительный reflow для активации анимации входа
                    void card.offsetWidth;

                    card.className = `slide-card ${targetClass}`;
                }
            });
        }

        function updateUI() {
            if (currentSlideIndex > 0) {
                splashScreen.classList.add('hidden');
                topCloseBtn.classList.add('visible');

                if (isAdmin) {
                    adminPanel.classList.add('visible');
                    slideIndicator.innerText = `ФОТО ${currentSlideIndex} / ${totalSlidesCount}`;
                } else {
                    adminPanel.classList.remove('visible');
                }
            } else {
                splashScreen.classList.remove('hidden');
                topCloseBtn.classList.remove('visible');
                adminPanel.classList.remove('visible');
                imageWrapper.innerHTML = '';
            }

            if (isAutoPlay) autoBtn.classList.add('active');
            else autoBtn.classList.remove('active');

            if (isRandom) randomBtn.classList.add('active');
            else randomBtn.classList.remove('active');
        }

        prevBtn.addEventListener('click', () => {
            if (isAdmin) socket.emit('change_slide', { action: 'prev' });
        });

        nextBtn.addEventListener('click', () => {
            if (isAdmin) socket.emit('change_slide', { action: 'next' });
        });

        randomBtn.addEventListener('click', () => {
            if (!isAdmin) return;
            isRandom = !isRandom;
            socket.emit('toggle_random', { is_random: isRandom });
        });

        socket.on('random_updated', (data) => {
            isRandom = data.is_random;
            updateUI();
        });

        autoBtn.addEventListener('click', () => {
            if (!isAdmin) return;
            isAutoPlay = !isAutoPlay;
            socket.emit('toggle_autoplay', { auto_play: isAutoPlay });
        });

        socket.on('autoplay_updated', (data) => {
            isAutoPlay = data.auto_play;
            updateUI();

            if (autoPlayTimer) clearInterval(autoPlayTimer);

            if (isAutoPlay && isAdmin) {
                autoPlayTimer = setInterval(() => {
                    socket.emit('change_slide', { action: 'next' });
                }, 10000);
            }
        });

        endBtn.addEventListener('click', () => {
            if (isAdmin) socket.emit('reset_session');
        });

        socket.on('session_reset', () => {
            currentSlideIndex = 0;
            isAdmin = false;
            isAutoPlay = false;
            isRandom = false;
            if (autoPlayTimer) clearInterval(autoPlayTimer);
            updateUI();
        });
    </script>
</body>
</html>
