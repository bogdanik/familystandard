<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Standard OS — Apple Photo Stack</title>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #080503;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            color: #fceade;
        }

        /* Canvas фон */
        #bgCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            will-change: transform;
        }

        .main-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* КРЕСТИК ЗАКРЫТИЯ В ВЕРХНЕМ УГЛУ (APPLE STYLE) */
        .top-close-btn {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(40, 20, 12, 0.5);
            border: 1px solid rgba(224, 169, 109, 0.25);
            color: rgba(252, 234, 222, 0.75);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            opacity: 0;
            pointer-events: none;
        }

        .top-close-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .top-close-btn:hover {
            background: rgba(255, 59, 48, 0.88);
            border-color: #ff3b30;
            color: #ffffff;
            transform: scale3d(1.1, 1.1, 1);
            box-shadow: 0 0 25px rgba(255, 59, 48, 0.6);
        }

        /* СТАРТОВЫЙ ЭКРАН С БРЕНДИНГОМ APPLE OS */
        .splash-screen {
            position: absolute;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 50px 70px;
            background: rgba(28, 14, 8, 0.82);
            border: 1px solid rgba(224, 169, 109, 0.3);
            border-radius: 32px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.7), 0 0 40px rgba(140, 66, 39, 0.3);
            transition: all 0.65s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .splash-screen.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale3d(0.88, 0.88, 1);
            visibility: hidden;
        }

        .brand-title {
            font-size: 2.7rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 30%, #e0a96d 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(224, 169, 109, 0.25);
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 1.15rem;
            font-weight: 600;
            letter-spacing: 9px;
            color: #d4a373;
            text-transform: uppercase;
            margin-bottom: 38px;
        }

        .start-btn {
            padding: 20px 64px;
            font-size: 1.9rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, #e0a96d, #8c4227);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 10px 35px rgba(224, 169, 109, 0.45);
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            letter-spacing: 3px;
        }

        .start-btn:hover {
            transform: scale3d(1.06, 1.06, 1);
            box-shadow: 0 15px 45px rgba(224, 169, 109, 0.75);
            background: linear-gradient(135deg, #f4a261, #a04928);
        }

        /* СЦЕНА 3D-СТОПКИ */
        .stage-frame {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            pointer-events: none;
            background: transparent;
        }

        .image-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1400px;
        }

        /* КАРТОЧКА: СТРОГО ОБЛЕГАЕТ ФОТОГРАФИЮ (fit-content) */
        .slide-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: fit-content;
            height: fit-content;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            overflow: hidden;
            background: rgba(18, 9, 5, 0.7);
            border: 2px solid rgba(224, 169, 109, 0.6);
            will-change: transform, opacity, filter, box-shadow;
            backface-visibility: hidden;
            transform-style: preserve-3d;
            
            /* Физика плавного свайпа в стиле Apple */
            transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        box-shadow 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                        border-color 0.85s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .slide-img {
            display: block;
            max-height: 74vh;
            max-width: 50vw;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 20px;
            will-change: transform;
        }

        /* ================= 3D ПОЗИЦИИ APPLE STACK (СТОПКА) ================= */

        /* 1. ЦЕНТРАЛЬНАЯ АКТИВНАЯ ФОТОГРАФИЯ */
        .pos-center {
            transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1) rotate(0deg);
            opacity: 1;
            z-index: 30;
            border-color: rgba(224, 169, 109, 0.95);
            box-shadow: 
                0 25px 60px -10px rgba(0, 0, 0, 0.9),
                0 0 40px 8px rgba(224, 169, 109, 0.5);
            filter: brightness(1);
        }

        .pos-center .slide-img {
            animation: kenBurnsZoom 10.5s linear forwards;
        }

        @keyframes kenBurnsZoom {
            0% { transform: scale3d(1, 1, 1); }
            100% { transform: scale3d(1.18, 1.18, 1); }
        }

        /* 2. ЛЕВАЯ СТОПКА (STACK) - НАЛОЖЕНИЕ ДРУГ НА ДРУГА ВЕЕРОМ */
        
        /* Верхний слой стопки (последний свайпнутый) */
        .pos-stack-1 {
            transform: translate3d(calc(-50% - 32vw), calc(-50% + 12px), -40px) scale3d(0.82, 0.82, 1) rotate(-4deg);
            opacity: 0.8;
            z-index: 20;
            border-color: rgba(224, 169, 109, 0.4);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            filter: brightness(0.65);
        }

        /* Средний слой стопки */
        .pos-stack-2 {
            transform: translate3d(calc(-50% - 35vw), calc(-50% + 24px), -80px) scale3d(0.74, 0.74, 1) rotate(-8deg);
            opacity: 0.5;
            z-index: 10;
            border-color: rgba(224, 169, 109, 0.25);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
            filter: brightness(0.45);
        }

        /* Нижний крайний слой стопки */
        .pos-stack-3 {
            transform: translate3d(calc(-50% - 38vw), calc(-50% + 36px), -120px) scale3d(0.66, 0.66, 1) rotate(-12deg);
            opacity: 0.22;
            z-index: 5;
            border-color: rgba(224, 169, 109, 0.15);
            filter: brightness(0.25);
        }

        /* Уходящие из стопки в небытие */
        .pos-far-left {
            transform: translate3d(calc(-50% - 50vw), calc(-50% + 50px), -200px) scale3d(0.5, 0.5, 1) rotate(-16deg);
            opacity: 0;
            z-index: 1;
            filter: brightness(0.1);
        }

        /* 3. СПРАВА: ПОДГОТОВЛЕННОЕ ФОТО «ИЗ НИОТКУДА» */
        .pos-right-1 {
            transform: translate3d(calc(-50% + 38vw), -50%, -60px) scale3d(0.76, 0.76, 1) rotate(3deg);
            opacity: 0.4;
            z-index: 15;
            border-color: rgba(224, 169, 109, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            filter: brightness(0.5);
        }

        /* Рождение новой фотографии из глубины правого края */
        .pos-far-right {
            transform: translate3d(calc(-50% + 80vw), -50%, -160px) scale3d(0.45, 0.45, 1) rotate(10deg);
            opacity: 0;
            z-index: 1;
            filter: brightness(0.1);
        }

        /* ПУЛЬТ ВЕДУЩЕГО В СТИЛЕ APPLE UI */
        .admin-panel {
            position: absolute;
            bottom: 25px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(25, 13, 8, 0.88);
            border: 1px solid rgba(224, 169, 109, 0.35);
            border-radius: 24px;
            padding: 14px 26px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);

            opacity: 0;
            transform: translate3d(0, 40px, 0);
            pointer-events: none;
            transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .admin-panel.visible {
            opacity: 1;
            transform: translate3d(0, 0, 0);
            pointer-events: auto;
        }

        .panel-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(224, 169, 109, 0.15);
            padding-bottom: 6px;
        }

        .slide-counter {
            font-size: 1.05rem;
            font-weight: 700;
            color: #e0a96d;
            letter-spacing: 1px;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .ctrl-btn {
            padding: 10px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            color: #fceade;
            border: 1px solid rgba(224, 169, 109, 0.22);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ctrl-btn:hover {
            background: rgba(224, 169, 109, 0.22);
            border-color: #e0a96d;
            color: #e0a96d;
        }

        .ctrl-btn.active {
            background: linear-gradient(135deg, #e0a96d, #8c4227);
            color: #fff;
            box-shadow: 0 0 18px rgba(224, 169, 109, 0.55);
            border-color: transparent;
        }

        .end-btn {
            background: linear-gradient(135deg, #ff3b30, #d32f2f);
            border: none;
            color: #fff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <button id="topCloseBtn" class="top-close-btn" title="Закрыть сессию и вернуться на старт">✖</button>

    <div class="main-container">

        <div id="splashScreen" class="splash-screen">
            <h1 class="brand-title">FAMILY STANDARD OS</h1>
            <div class="brand-subtitle">ФОТО</div>
            <button id="startBtn" class="start-btn">▶ СТАРТ</button>
        </div>

        <div id="stageFrame" class="stage-frame">
            <div id="imageWrapper" class="image-wrapper"></div>
        </div>

        <div id="adminPanel" class="admin-panel">
            <div class="panel-header">
                <span id="slideIndicator" class="slide-counter">ФОТО 1 / 20</span>
            </div>
            <div class="controls-row">
                <button id="prevBtn" class="ctrl-btn">◄ Назад</button>
                <button id="nextBtn" class="ctrl-btn">Вперед ►</button>
                <button id="randomBtn" class="ctrl-btn">🔀 Рандом</button>
                <button id="autoBtn" class="ctrl-btn">Автопоказ (10 сек)</button>
                <button id="endBtn" class="ctrl-btn end-btn">THE END</button>
            </div>
        </div>

    </div>

    <script>
        // 120 FPS CANVAS С ДЕЛЬТА-ТАЙМОМ
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const particleCount = 55;
        const maxDistance = 140;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 50;
                this.vy = (Math.random() - 0.5) * 50;
                this.radius = Math.random() * 2.5 + 1;
                this.color = Math.random() > 0.5 ? '#e0a96d' : '#8c4227';
            }

            update(dt) {
                this.x += this.vx * dt;
                this.y += this.vy * dt;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < particleCount; i++) particles.push(new Particle());

        let lastTime = performance.now();

        function animateCanvas(currentTime) {
            let dt = (currentTime - lastTime) / 1000;
            if (dt > 0.1) dt = 0.1;
            lastTime = currentTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                particles[i].update(dt);
                particles[i].draw();

                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.strokeStyle = `rgba(224, 169, 109, ${1 - dist / maxDistance * 0.5})`;
                        ctx.lineWidth = 0.6;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animateCanvas);
        }
        requestAnimationFrame(animateCanvas);

        // ПОДКЛЮЧЕНИЕ К СЕРВЕРУ И APPLE STACK МЕХАНИКА
        const socket = io("https://pic-jj29.onrender.com", {
            transports: ['polling', 'websocket'],
            upgrade: true
        });

        const R2_BASE_URL = "https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/";

        let isAdmin = false;
        let currentSlideIndex = 0;
        let totalSlidesCount = 20;
        let isAutoPlay = false;
        let isRandom = false;
        let autoPlayTimer = null;

        // Хранение истории свайпов для реализации левой стопки (Stack)
        let stackHistory = [];

        const splashScreen = document.getElementById('splashScreen');
        const startBtn = document.getElementById('startBtn');
        const topCloseBtn = document.getElementById('topCloseBtn');
        const stageFrame = document.getElementById('stageFrame');
        const imageWrapper = document.getElementById('imageWrapper');
        const adminPanel = document.getElementById('adminPanel');
        const slideIndicator = document.getElementById('slideIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const randomBtn = document.getElementById('randomBtn');
        const autoBtn = document.getElementById('autoBtn');
        const endBtn = document.getElementById('endBtn');

        const persistentCache = {};
        function preloadImages() {
            for (let i = 1; i <= totalSlidesCount; i++) {
                const img = new Image();
                img.src = `${R2_BASE_URL}pic${i}.jpg`;
                persistentCache[i] = img;
            }
        }
        preloadImages();

        socket.on('init_state', (data) => {
            currentSlideIndex = data.current_slide;
            totalSlidesCount = data.total_slides;
            isAdmin = data.is_admin;
            isAutoPlay = data.auto_play;
            isRandom = data.is_random;

            updateUI();
            if (currentSlideIndex > 0) {
                updateStackView(currentSlideIndex);
            }
        });

        startBtn.addEventListener('click', () => {
            socket.emit('start_session');
        });

        topCloseBtn.addEventListener('click', () => {
            socket.emit('reset_session');
        });

        socket.on('session_started', (data) => {
            currentSlideIndex = data.current_slide;
            if (socket.id === data.admin_sid) isAdmin = true;

            stackHistory = []; // Очищаем историю стопки
            updateUI();
            updateStackView(currentSlideIndex);
        });

        socket.on('slide_updated', (data) => {
            const oldIdx = currentSlideIndex;
            currentSlideIndex = data.current_slide;

            // Добавляем старый слайд в историю стопки слева
            if (oldIdx > 0 && oldIdx !== currentSlideIndex) {
                stackHistory.push(oldIdx);
                if (stackHistory.length > 5) {
                    stackHistory.shift(); // Храним не более 5 элементов
                }
            }

            updateUI();
            updateStackView(currentSlideIndex);
        });

        // ОСНОВНАЯ ЛОГИКА 3D-СТОПКИ APPLE (STACK)
        function updateStackView(centerNum) {
            if (centerNum < 1) {
                imageWrapper.innerHTML = '';
                return;
            }

            const total = totalSlidesCount;
            const centerIdx = centerNum;
            const right1Idx = centerIdx < total ? centerIdx + 1 : 1;

            // Определяем до 3-х последних слайдов для левой стопки
            const stack1 = stackHistory.length >= 1 ? stackHistory[stackHistory.length - 1] : null;
            const stack2 = stackHistory.length >= 2 ? stackHistory[stackHistory.length - 2] : null;
            const stack3 = stackHistory.length >= 3 ? stackHistory[stackHistory.length - 3] : null;

            const neededMap = {};
            if (stack3) neededMap[stack3] = 'pos-stack-3';
            if (stack2) neededMap[stack2] = 'pos-stack-2';
            if (stack1) neededMap[stack1] = 'pos-stack-1';

            neededMap[centerIdx] = 'pos-center';
            neededMap[right1Idx] = 'pos-right-1';

            const existingCards = {};
            imageWrapper.querySelectorAll('.slide-card').forEach(card => {
                const num = parseInt(card.dataset.slide, 10);
                existingCards[num] = card;
            });

            // 1. Уводим в небытие уходящие слои стопки
            Object.keys(existingCards).forEach(numStr => {
                const num = parseInt(numStr, 10);
                if (!neededMap[num]) {
                    const card = existingCards[num];
                    if (card.className.includes('stack') || card.className.includes('center')) {
                        card.className = 'slide-card pos-far-left';
                    } else {
                        card.className = 'slide-card pos-far-right';
                    }
                    setTimeout(() => {
                        if (card && card.parentNode) card.remove();
                    }, 850);
                }
            });

            // 2. Обновляем и выстраиваем нужные карточки
            Object.keys(neededMap).forEach(numStr => {
                const num = parseInt(numStr, 10);
                const targetClass = neededMap[num];
                let card = existingCards[num];

                if (card) {
                    card.className = `slide-card ${targetClass}`;
                } else {
                    card = document.createElement('div');
                    card.dataset.slide = num;

                    if (targetClass === 'pos-right-1') {
                        card.className = 'slide-card pos-far-right';
                    } else if (targetClass.includes('stack')) {
                        card.className = 'slide-card pos-far-left';
                    } else {
                        card.className = 'slide-card pos-far-right';
                    }

                    const img = document.createElement('img');
                    img.className = 'slide-img';
                    img.src = `${R2_BASE_URL}pic${num}.jpg`;
                    img.onerror = function() {
                        setTimeout(() => {
                            this.src = `${R2_BASE_URL}pic${num}.jpg?retry=${Date.now()}`;
                        }, 800);
                    };

                    card.appendChild(img);
                    imageWrapper.appendChild(card);

                    // Reflow для включения CSS анимаций
                    void card.offsetWidth;

                    card.className = `slide-card ${targetClass}`;
                }
            });
        }

        function updateUI() {
            if (currentSlideIndex > 0) {
                splashScreen.classList.add('hidden');
                topCloseBtn.classList.add('visible');

                if (isAdmin) {
                    adminPanel.classList.add('visible');
                    slideIndicator.innerText = `ФОТО ${currentSlideIndex} / ${totalSlidesCount}`;
                } else {
                    adminPanel.classList.remove('visible');
                }
            } else {
                splashScreen.classList.remove('hidden');
                topCloseBtn.classList.remove('visible');
                adminPanel.classList.remove('visible');
                imageWrapper.innerHTML = '';
            }

            if (isAutoPlay) autoBtn.classList.add('active');
            else autoBtn.classList.remove('active');

            if (isRandom) randomBtn.classList.add('active');
            else randomBtn.classList.remove('active');
        }

        prevBtn.addEventListener('click', () => {
            if (isAdmin) socket.emit('change_slide', { action: 'prev' });
        });

        nextBtn.addEventListener('click', () => {
            if (isAdmin) socket.emit('change_slide', { action: 'next' });
        });

        randomBtn.addEventListener('click', () => {
            if (!isAdmin) return;
            isRandom = !isRandom;
            socket.emit('toggle_random', { is_random: isRandom });
        });

        socket.on('random_updated', (data) => {
            isRandom = data.is_random;
            updateUI();
        });

        autoBtn.addEventListener('click', () => {
            if (!isAdmin) return;
            isAutoPlay = !isAutoPlay;
            socket.emit('toggle_autoplay', { auto_play: isAutoPlay });
        });

        socket.on('autoplay_updated', (data) => {
            isAutoPlay = data.auto_play;
            updateUI();

            if (autoPlayTimer) clearInterval(autoPlayTimer);

            if (isAutoPlay && isAdmin) {
                autoPlayTimer = setInterval(() => {
                    socket.emit('change_slide', { action: 'next' });
                }, 10000);
            }
        });

        endBtn.addEventListener('click', () => {
            if (isAdmin) socket.emit('reset_session');
        });

        socket.on('session_reset', () => {
            currentSlideIndex = 0;
            isAdmin = false;
            isAutoPlay = false;
            isRandom = false;
            stackHistory = [];
            if (autoPlayTimer) clearInterval(autoPlayTimer);
            updateUI();
        });
    </script>
</body>
