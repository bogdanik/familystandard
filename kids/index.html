<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event OS - Kids</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-black: #030712;
            --glass-card: rgba(15, 23, 42, 0.88);
            --glass-border: rgba(255, 255, 255, 0.15);
            --gold-main: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.4);
            --green-active: #10b981;
            --red-accent: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.4);
            --pink-accent: #ec4899;
            --cyan-accent: #06b6d4;
            --font-main: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            width: 100%; 
            height: 100dvh; 
            background: var(--bg-black); 
            color: #f8fafc; 
            overflow: hidden; 
            position: relative;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100dvh;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 12px 10px 12px;
            position: relative;
            z-index: 10;
            gap: 8px;
        }

        /* 1. ВЕРХНЯЯ ПАНЕЛЬ */
        .top-panel {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .vol-row { display: flex; gap: 4px; }
        .btn-vol {
            flex: 1;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.7);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-vol.active {
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-main) 100%);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .track-display {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .track-title { font-size: 0.82rem; font-weight: 800; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; }
        .track-time { font-size: 0.75rem; font-weight: 800; color: var(--gold-main); font-family: monospace; }

        .player-row { display: flex; gap: 6px; }
        .btn-player {
            flex: 1;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .btn-player:active { transform: scale(0.96); }
        .btn-player.play-active {
            background: rgba(16, 185, 129, 0.25);
            border-color: var(--green-active);
            color: #34d399;
        }

        /* 2. ЦЕНТРАЛЬНАЯ ЗОНА С ЭКВАЛАЙЗЕРОМ */
        .center-display {
            flex: 1;
            position: relative;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            min-height: 110px;
        }

        .title-group {
            z-index: 10;
            text-align: center;
            padding: 0 10px;
            pointer-events: none;
        }
        .shimmer-title {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ffffff 0%, #fffbeb 25%, #f59e0b 50%, #e5e7eb 75%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            letter-spacing: 2px;
            line-height: 1.2;
        }
        @keyframes shine { to { background-position: 200% center; } }

        #eq-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            opacity: 0.85;
        }

        /* 3. СРЕДНИЙ БЛОК: ИГРА И СТАРТ/ТАЙМЕР */
        .main-action-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-game-giant {
            width: 100%;
            height: 58px;
            border-radius: 16px;
            border: 2px solid var(--gold-main);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.35) 0%, rgba(245, 158, 11, 0.1) 100%);
            color: #ffffff;
            font-size: 1.35rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px var(--gold-glow);
            transition: all 0.15s ease;
        }
        .btn-game-giant.active {
            background: var(--gold-main);
            color: #000;
            box-shadow: 0 0 35px var(--gold-main);
        }
        .btn-game-giant:active { transform: scale(0.97); }

        .btn-start-program {
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 2px solid var(--green-active);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.35) 0%, rgba(6, 78, 59, 0.2) 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            transition: all 0.15s ease;
        }
        .btn-start-program:active { transform: scale(0.96); background: var(--green-active); color: #000; }

        /* ТАЙМЕР, ЗАНИМАЮЩИЙ МЕСТО КНОПКИ СТАРТА */
        .timer-box-slot {
            display: none;
            width: 100%;
            height: 52px;
            border-radius: 14px;
            border: 2px solid var(--gold-main);
            background: rgba(15, 23, 42, 0.95);
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .countdown-timer {
            font-family: 'Cinzel', monospace;
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px var(--gold-glow);
            letter-spacing: 2px;
        }
        .countdown-timer.ending-warning {
            color: #ef4444;
            text-shadow: 0 0 20px var(--red-glow);
            animation: timerPulse 1s infinite alternate;
        }
        @keyframes timerPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        /* 4. НИЖНЯЯ ПАНЕЛЬ */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-spec {
            height: 48px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.7);
            color: #fff;
            font-size: 0.88rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .btn-spec:active { transform: scale(0.96); }

        .btn-spec.bg { border-color: var(--gold-main); background: rgba(245, 158, 11, 0.2); color: #fef08a; }
        .btn-spec.bg.active { background: var(--gold-main); color: #000; box-shadow: 0 0 20px var(--gold-glow); }

        .btn-spec.hb { border-color: var(--pink-accent); background: rgba(236, 72, 153, 0.2); color: #fbcfe8; }
        .btn-spec.hb.active { background: var(--pink-accent); color: #fff; box-shadow: 0 0 20px rgba(236, 72, 153, 0.6); }

        .btn-spec.bubbles {
            grid-column: span 2;
            height: 50px;
            border-color: var(--cyan-accent);
            background: rgba(6, 182, 212, 0.2);
            color: #cffafe;
        }
        .btn-spec.bubbles.active { background: var(--cyan-accent); color: #000; box-shadow: 0 0 20px rgba(6, 182, 212, 0.6); }

        .footer-branding {
            text-align: center;
            font-size: 0.72rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
            padding-top: 2px;
            text-transform: uppercase;
        }

        /* 5. МОДАЛЬНЫЕ ОВЕРЛЕИ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .setup-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 40px var(--gold-glow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .setup-title { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 900; color: #fff; letter-spacing: 2px; }
        .duration-label { font-size: 0.85rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .duration-row { display: flex; gap: 8px; }
        .btn-dur {
            flex: 1;
            height: 52px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-dur.active {
            background: var(--gold-main);
            color: #000;
            border-color: var(--gold-main);
            box-shadow: 0 0 15px var(--gold-glow);
        }
    </style>
</head>
<body>

    <!-- ВХОДНОЙ ОВЕРЛЕЙ: ВКЛЮЧИТЬ ПУЛЬТ (СРАЗУ ЗАПУСКАЕТ ФОН) -->
    <div id="init-overlay" class="modal-overlay">
        <button onclick="initAudioAndPlayBg()" class="btn-game-giant" style="height: 80px; width: 100%; max-width: 360px;">
            🔊 ВКЛЮЧИТЬ ПУЛЬТ
        </button>
    </div>

    <!-- МОДАЛКА ВЫБОРА ДЛИТЕЛЬНОСТИ ПРИ СТАРТЕ ПРОГРАММЫ -->
    <div id="duration-modal" class="modal-overlay" style="display: none;">
        <div class="setup-card">
            <div class="setup-title">СТАРТ ПРОГРАММЫ</div>
            <div>
                <div class="duration-label" style="margin-bottom: 12px;">Сколько минут длится праздник?</div>
                <div class="duration-row">
                    <button class="btn-dur" onclick="confirmProgramStart(20)">20 мин</button>
                    <button class="btn-dur active" onclick="confirmProgramStart(40)">40 мин</button>
                    <button class="btn-dur" onclick="confirmProgramStart(60)">60 мин</button>
                </div>
            </div>
            <button onclick="closeDurationModal()" style="background: transparent; color: #94a3b8; border: none; font-weight: 800; cursor: pointer;">
                Отмена
            </button>
        </div>
    </div>

    <div class="app-container">

        <!-- 1. ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="top-panel">
            <div class="vol-row">
                <button class="btn-vol" onclick="setVolume(0.03, this)">3%</button>
                <button class="btn-vol" onclick="setVolume(0.10, this)">10%</button>
                <button class="btn-vol active" onclick="setVolume(0.30, this)">30%</button>
                <button class="btn-vol" onclick="setVolume(0.60, this)">60%</button>
                <button class="btn-vol" onclick="setVolume(1.00, this)">100%</button>
            </div>

            <div class="track-display">
                <div class="track-title" id="track-name">Загрузка...</div>
                <div class="track-time" id="track-time">00:00 / 00:00</div>
            </div>

            <div class="player-row">
                <button class="btn-player" onclick="prevTrack()">⏮ Пред</button>
                <button class="btn-player play-active" id="btn-play-pause" onclick="togglePlayPause()">⏯ Пауза</button>
                <button class="btn-player" onclick="nextTrack()">След ⏭</button>
            </div>
        </div>

        <!-- 2. ЦЕНТРАЛЬНАЯ ЗОНА С ЭКВАЛАЙЗЕРОМ -->
        <div class="center-display">
            <canvas id="eq-canvas"></canvas>
            <div class="title-group">
                <h1 class="shimmer-title">EVENT OS - KIDS</h1>
            </div>
        </div>

        <!-- 3. СРЕДНИЙ БЛОК: ИГРА И СТАРТ / ТАЙМЕР -->
        <div class="main-action-block">
            <button class="btn-game-giant" id="btn-game" onclick="triggerMode('game')">
                🎮 ИГРА
            </button>

            <!-- КНОПКА СТАРТА ПРОГРАММЫ -->
            <button class="btn-start-program" id="btn-start-prog" onclick="openDurationModal()">
                🚀 СТАРТ ПРОГРАММЫ
            </button>

            <!-- БЛОК ТАЙМЕРА (ПОЯВЛЯЕТСЯ НА МЕСТЕ КНОПКИ СТАРТА) -->
            <div class="timer-box-slot" id="timer-slot">
                <div class="countdown-timer" id="timer-display">40:00</div>
            </div>
        </div>

        <!-- 4. НИЖНЯЯ ПАНЕЛЬ -->
        <div class="bottom-grid">
            <button class="btn-spec bg" id="btn-bg" onclick="triggerMode('bg')">
                🍃 Фон
            </button>
            <button class="btn-spec hb" id="btn-hb" onclick="triggerMode('hb')">
                🎂 Birthday
            </button>
            <button class="btn-spec bubbles" id="btn-bubbles" onclick="triggerMode('bubbles')">
                🫧 Пузыри
            </button>
        </div>

        <div class="footer-branding">EVENT OS - KIDS COMPANY 2026</div>

    </div>

    <audio id="main-audio" crossorigin="anonymous"></audio>

    <script>
        const socket = io();
        let config = null;

        const mainAudio = document.getElementById('main-audio');
        let currentVolume = 0.30;
        let currentMode = 'bg';

        let partyStarted = false;
        let partyRemainingSeconds = 2400;
        let partyTimerInterval = null;

        let fadeInterval = null;

        let audioCtx = null;
        let analyser = null;
        let dataArray = null;

        // --- УМНЫЙ РАНДОМ БЕЗ ПОВТОРОВ ---
        let shuffleStore = {
            bg: { queue: [], history: [] },
            game: { queue: [], history: [] },
            entrance: { queue: [], history: [] },
            hb: { queue: [], history: [] },
            bubbles: { queue: [], history: [] }
        };

        function shuffleArray(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getNextTrackIndex(mode) {
            const playlist = getPlaylist(mode);
            if (!playlist || playlist.length === 0) return 0;

            if (!shuffleStore[mode]) {
                shuffleStore[mode] = { queue: [], history: [] };
            }
            let st = shuffleStore[mode];

            if (st.queue.length === 0) {
                let indices = Array.from({length: playlist.length}, (_, i) => i);
                let newQueue = shuffleArray(indices);

                if (st.history.length > 0 && newQueue.length > 1) {
                    let lastIdx = st.history[st.history.length - 1];
                    if (newQueue[0] === lastIdx) {
                        let endPos = newQueue.length - 1;
                        [newQueue[0], newQueue[endPos]] = [newQueue[endPos], newQueue[0]];
                    }
                }
                st.queue = newQueue;
            }

            let nextIndex = st.queue.shift();
            st.history.push(nextIndex);
            return nextIndex;
        }

        function getPrevTrackIndex(mode) {
            const playlist = getPlaylist(mode);
            if (!playlist || playlist.length === 0) return 0;

            let st = shuffleStore[mode];
            if (st && st.history.length > 1) {
                let curr = st.history.pop();
                st.queue.unshift(curr);
                return st.history[st.history.length - 1];
            }
            return st ? (st.history[0] || 0) : 0;
        }

        // --- ИНИЦИАЛИЗАЦИЯ И СТАРТОВЫЙ ЗАПУСК ФОНА ---
        function initAudioAndPlayBg() {
            if (!audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtx();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const source = audioCtx.createMediaElementSource(mainAudio);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            document.getElementById('init-overlay').style.display = 'none';
            
            currentMode = 'bg';
            playCurrentModeTrack(true);
            drawEq();
        }

        // --- УПРАВЛЕНИЕ ТАЙМЕРОМ И МОДАЛКОЙ ---
        function openDurationModal() {
            document.getElementById('duration-modal').style.display = 'flex';
        }

        function closeDurationModal() {
            document.getElementById('duration-modal').style.display = 'none';
        }

        function confirmProgramStart(mins) {
            partyStarted = true;
            partyRemainingSeconds = mins * 60;
            updateTimerDisplay();

            // СКРЫВАЕМ КНОПКУ СТАРТА И ПОКАЗЫВАЕМ ТАЙМЕР НА ЕЁ МЕСТЕ
            document.getElementById('btn-start-prog').style.display = 'none';
            document.getElementById('timer-slot').style.display = 'flex';

            if (partyTimerInterval) clearInterval(partyTimerInterval);
            partyTimerInterval = setInterval(() => {
                if (partyRemainingSeconds > 0) {
                    partyRemainingSeconds--;
                    updateTimerDisplay();
                } else {
                    // ТАЙМЕР ЗАКОНЧИЛСЯ — ВОЗВРАЩАЕМ КНОПКУ СТАРТА
                    clearInterval(partyTimerInterval);
                    partyStarted = false;
                    document.getElementById('timer-slot').style.display = 'none';
                    document.getElementById('btn-start-prog').style.display = 'flex';
                }
            }, 1000);

            document.getElementById('duration-modal').style.display = 'none';

            // Громкость на 100%
            const vol100Btn = document.querySelectorAll('.btn-vol')[4];
            setVolume(1.00, vol100Btn);

            // Включаем трек Выхода (Фанфары)
            currentMode = 'entrance';
            playCurrentModeTrack(true);
        }

        function updateTimerDisplay() {
            if (!partyStarted) return;
            
            const m = Math.floor(partyRemainingSeconds / 60);
            const s = Math.floor(partyRemainingSeconds % 60);
            const str = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = str;

            if (partyRemainingSeconds <= 600) {
                timerEl.classList.add('ending-warning');
            } else {
                timerEl.classList.remove('ending-warning');
            }
        }

        socket.on('config_data', (data) => {
            config = data;
        });

        function getPlaylist(mode) {
            if (!config) return [];
            
            if (mode === 'bg') {
                // Если запущен праздник и осталось <= 10 минут, ставим концовочный фон
                if (partyStarted && partyRemainingSeconds <= 600 && config.ending_tracks && config.ending_tracks.length > 0) {
                    return config.ending_tracks;
                }
                return config.bg_tracks || [];
            }

            if (mode === 'game') return config.game_tracks || [];
            if (mode === 'entrance') return config.entrance_tracks || [];
            if (mode === 'hb') return config.happy_birthday_tracks || [];
            if (mode === 'bubbles') return config.bubbles_tracks || [];
            return config.bg_tracks || [];
        }

        function cancelFade() {
            if (fadeInterval) {
                clearInterval(fadeInterval);
                fadeInterval = null;
            }
            mainAudio.volume = currentVolume;
        }

        function smoothStopAll() {
            if (fadeInterval) clearInterval(fadeInterval);

            let steps = 10;
            let stepVol = mainAudio.volume / steps;

            fadeInterval = setInterval(() => {
                if (mainAudio.volume > stepVol) {
                    mainAudio.volume -= stepVol;
                } else {
                    mainAudio.volume = 0;
                    mainAudio.pause();
                    clearInterval(fadeInterval);
                    fadeInterval = null;
                    
                    mainAudio.volume = currentVolume;
                    
                    const btn = document.getElementById('btn-play-pause');
                    btn.classList.remove('play-active');
                    btn.innerText = "▶ Пуск";
                    
                    clearActiveHighlights();
                }
            }, 20);
        }

        function playCurrentModeTrack(forceNew = true) {
            cancelFade();
            if (!config) return;
            const playlist = getPlaylist(currentMode);
            if (!playlist || playlist.length === 0) return;

            let idx;
            let st = shuffleStore[currentMode];
            if (forceNew || !st || st.history.length === 0) {
                idx = getNextTrackIndex(currentMode);
            } else {
                idx = st.history[st.history.length - 1];
            }

            const filename = playlist[idx];
            const fullUrl = config.cdn_base_url + filename;

            document.getElementById('track-name').innerText = filename;
            updateUIState();

            if (!mainAudio.src.endsWith(filename)) {
                mainAudio.src = fullUrl;
                mainAudio.play().catch(e => console.log("Autoplay blocked:", e));
            } else {
                if (mainAudio.paused) mainAudio.play();
            }

            const btn = document.getElementById('btn-play-pause');
            btn.classList.add('play-active');
            btn.innerText = "⏯ Пауза";
        }

        mainAudio.onended = () => {
            playCurrentModeTrack(true);
        };

        mainAudio.ontimeupdate = () => {
            const cur = formatTime(mainAudio.currentTime);
            const dur = formatTime(mainAudio.duration);
            document.getElementById('track-time').innerText = `${cur} / ${dur}`;
        };

        function formatTime(s) {
            if (!s || isNaN(s)) return "00:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function setVolume(v, btn) {
            currentVolume = v;
            cancelFade();
            document.querySelectorAll('.btn-vol').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
        }

        function togglePlayPause() {
            const btn = document.getElementById('btn-play-pause');
            if (mainAudio.paused) {
                cancelFade();
                mainAudio.play();
                btn.classList.add('play-active');
                btn.innerText = "⏯ Пауза";
                updateUIState();
            } else {
                smoothStopAll();
            }
        }

        function nextTrack() {
            playCurrentModeTrack(true);
        }

        function prevTrack() {
            cancelFade();
            if (!config) return;
            const playlist = getPlaylist(currentMode);
            if (!playlist || playlist.length === 0) return;

            let idx = getPrevTrackIndex(currentMode);
            const filename = playlist[idx];
            const fullUrl = config.cdn_base_url + filename;

            document.getElementById('track-name').innerText = filename;
            updateUIState();

            mainAudio.src = fullUrl;
            mainAudio.play().catch(e => console.log("Autoplay blocked:", e));

            const btn = document.getElementById('btn-play-pause');
            btn.classList.add('play-active');
            btn.innerText = "⏯ Пауза";
        }

        function triggerMode(mode) {
            if (currentMode === mode && !mainAudio.paused) {
                nextTrack();
            } else {
                currentMode = mode;
                playCurrentModeTrack(true);
            }
        }

        function clearActiveHighlights() {
            document.getElementById('btn-bg').classList.remove('active');
            document.getElementById('btn-game').classList.remove('active');
            document.getElementById('btn-hb').classList.remove('active');
            document.getElementById('btn-bubbles').classList.remove('active');
        }

        function updateUIState() {
            clearActiveHighlights();
            if (currentMode === 'bg') document.getElementById('btn-bg').classList.add('active');
            else if (currentMode === 'game') document.getElementById('btn-game').classList.add('active');
            else if (currentMode === 'hb') document.getElementById('btn-hb').classList.add('active');
            else if (currentMode === 'bubbles') document.getElementById('btn-bubbles').classList.add('active');
        }

        // --- ЭКВАЛАЙЗЕР ---
        const eqCanvas = document.getElementById('eq-canvas');
        const eqCtx = eqCanvas.getContext('2d');
        const halfBars = 28;
        let eqBars = new Array(halfBars).fill(4);
        let idleTime = 0;

        function drawRoundedBar(ctx, x, y, w, h, r) {
            if (h < 1) return;
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        function drawEq() {
            requestAnimationFrame(drawEq);
            eqCanvas.width = eqCanvas.offsetWidth;
            eqCanvas.height = eqCanvas.offsetHeight;
            
            eqCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
            if (!eqCanvas.width || !eqCanvas.height) return;

            idleTime -= 0.04;
            const width = eqCanvas.width;
            const height = eqCanvas.height;
            const barSpacing = 2.5;
            const barWidth = ((width / 2) / halfBars);
            const actualBarWidth = Math.max(1.5, barWidth - barSpacing);

            let isAudioActive = analyser && !mainAudio.paused;

            if (isAudioActive) {
                analyser.getByteFrequencyData(dataArray);
            }

            let rawValues = new Float32Array(halfBars);
            for (let k = 0; k < halfBars; k++) {
                if (isAudioActive) {
                    let logIndex = Math.floor(Math.pow(k / halfBars, 1.2) * (dataArray.length * 0.6));
                    rawValues[k] = dataArray[logIndex] || 0;
                } else {
                    rawValues[k] = Math.sin(idleTime * 1.8 + k * 0.3) * 8 + 12;
                }
            }

            let smoothedValues = new Float32Array(halfBars);
            for (let k = 0; k < halfBars; k++) {
                let p2 = rawValues[Math.max(0, k - 2)];
                let p1 = rawValues[Math.max(0, k - 1)];
                let curr = rawValues[k];
                let n1 = rawValues[Math.min(halfBars - 1, k + 1)];
                let n2 = rawValues[Math.min(halfBars - 1, k + 2)];
                smoothedValues[k] = p2 * 0.08 + p1 * 0.24 + curr * 0.36 + n1 * 0.24 + n2 * 0.08;
            }

            for (let k = 0; k < halfBars; k++) {
                let targetH = (smoothedValues[k] / 255) * (height * 0.85);
                if (targetH < 3) targetH = 3;

                if (targetH > eqBars[k]) eqBars[k] += (targetH - eqBars[k]) * 0.25;
                else eqBars[k] += (targetH - eqBars[k]) * 0.09;

                let h = eqBars[k];
                let xLeft = k * barWidth + barSpacing / 2;
                let xRight = width - (k + 1) * barWidth + barSpacing / 2;

                let barGradient = eqCtx.createLinearGradient(0, height, 0, height - h);
                barGradient.addColorStop(0, 'rgba(3, 7, 18, 0.0)');
                barGradient.addColorStop(0.5, 'rgba(245, 158, 11, 0.25)');
                barGradient.addColorStop(0.85, 'rgba(245, 158, 11, 0.7)');
                barGradient.addColorStop(1, 'rgba(255, 255, 255, 1.0)');

                eqCtx.fillStyle = barGradient;

                drawRoundedBar(eqCtx, xLeft, height - h, actualBarWidth, h, 3);
                drawRoundedBar(eqCtx, xRight, height - h, actualBarWidth, h, 3);
            }
        }
    </script>
</body>
