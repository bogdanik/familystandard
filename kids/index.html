<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Event OS - Kids</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@800;900&family=Plus+Jakarta+Sans:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-black: #030712;
            --glass-card: rgba(15, 23, 42, 0.88);
            --glass-border: rgba(255, 255, 255, 0.15);
            --gold-main: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.4);
            --green-active: #10b981;
            --red-accent: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.4);
            --pink-accent: #ec4899;
            --cyan-accent: #06b6d4;
            --purple-accent: #a855f7;
            --font-main: -apple-system, BlinkMacSystemFont, "Plus Jakarta Sans", sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-main); user-select: none; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            width: 100%; 
            height: 100dvh; 
            background: var(--bg-black); 
            color: #f8fafc; 
            overflow: hidden; 
            position: relative;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100dvh;
            max-width: 500px;
            margin: 0 auto;
            padding: 10px 12px 10px 12px;
            position: relative;
            z-index: 10;
            gap: 8px;
        }

        /* 1. ВЕРХНЯЯ ПАНЕЛЬ */
        .top-panel {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .vol-row { display: flex; gap: 4px; }
        .btn-vol {
            flex: 1;
            height: 36px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.7);
            color: #fff;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-vol.active {
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-main) 100%);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .track-display {
            background: rgba(3, 7, 18, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .track-title { font-size: 0.82rem; font-weight: 800; color: #e2e8f0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%; }
        .track-time { font-size: 0.75rem; font-weight: 800; color: var(--gold-main); font-family: monospace; }

        .player-row { display: flex; gap: 6px; }
        .btn-player {
            flex: 1;
            height: 40px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            font-size: 0.9rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
        }
        .btn-player:active { transform: scale(0.96); }
        .btn-player.play-active {
            background: rgba(16, 185, 129, 0.25);
            border-color: var(--green-active);
            color: #34d399;
        }

        /* 2. ЦЕНТРАЛЬНАЯ ЗОНА */
        .center-display {
            flex: 1.1;
            position: relative;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.9) 0%, rgba(3, 7, 18, 0.95) 100%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
            min-height: 120px;
            padding: 12px;
            gap: 10px;
        }

        .center-content-slot {
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 8px;
        }

        .btn-start-program {
            width: 85%;
            height: 46px;
            border-radius: 14px;
            border: 2px solid var(--green-active);
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.4) 0%, rgba(6, 78, 59, 0.3) 100%);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            transition: all 0.15s ease;
        }
        .btn-start-program:active { transform: scale(0.96); background: var(--green-active); color: #000; }

        .timer-box-slot {
            display: none;
            width: 85%;
            height: 46px;
            border-radius: 14px;
            border: 2px solid var(--gold-main);
            background: rgba(3, 7, 18, 0.85);
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .countdown-timer {
            font-family: 'Cinzel', monospace;
            font-size: 2.1rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px var(--gold-glow);
            letter-spacing: 2px;
        }
        .countdown-timer.ending-warning {
            color: #ef4444;
            text-shadow: 0 0 20px var(--red-glow);
            animation: timerPulse 1s infinite alternate;
        }
        @keyframes timerPulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        .shimmer-title {
            font-family: 'Cinzel', serif;
            font-size: 1.6rem;
            font-weight: 900;
            background: linear-gradient(90deg, #ffffff 0%, #fffbeb 25%, #f59e0b 50%, #e5e7eb 75%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            letter-spacing: 2px;
            line-height: 1.1;
            pointer-events: none;
        }
        @keyframes shine { to { background-position: 200% center; } }

        #eq-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            opacity: 0.85;
        }

        /* 3. СРЕДНИЙ БЛОК: ФОН И ИГРА */
        .main-action-block {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn-main-giant {
            width: 100%;
            height: 54px;
            border-radius: 16px;
            font-size: 1.25rem;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.15s ease;
        }
        .btn-main-giant:active { transform: scale(0.97); }

        .btn-bg-giant {
            border: 2px solid var(--gold-main);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.35) 0%, rgba(245, 158, 11, 0.1) 100%);
            color: #ffffff;
            box-shadow: 0 0 20px var(--gold-glow);
        }
        .btn-bg-giant.active {
            background: var(--gold-main);
            color: #000;
            box-shadow: 0 0 35px var(--gold-main);
        }

        .btn-game-giant {
            border: 2px solid var(--cyan-accent);
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.35) 0%, rgba(6, 182, 212, 0.1) 100%);
            color: #ffffff;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
        }
        .btn-game-giant.active {
            background: var(--cyan-accent);
            color: #000;
            box-shadow: 0 0 35px var(--cyan-accent);
        }

        /* 4. НИЖНЯЯ ПАНЕЛЬ */
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn-spec {
            height: 46px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.7);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.15s ease;
        }
        .btn-spec:active { transform: scale(0.96); }

        .btn-spec.hb { border-color: var(--pink-accent); background: rgba(236, 72, 153, 0.2); color: #fbcfe8; }
        .btn-spec.hb.active { background: var(--pink-accent); color: #fff; box-shadow: 0 0 20px rgba(236, 72, 153, 0.6); }

        .btn-spec.bubbles { border-color: var(--cyan-accent); background: rgba(6, 182, 212, 0.2); color: #cffafe; }
        .btn-spec.bubbles.active { background: var(--cyan-accent); color: #000; box-shadow: 0 0 20px rgba(6, 182, 212, 0.6); }

        .btn-spec.flashmob { border-color: var(--purple-accent); background: rgba(168, 85, 247, 0.2); color: #f3e8ff; }
        .btn-spec.flashmob.active { background: var(--purple-accent); color: #fff; box-shadow: 0 0 20px rgba(168, 85, 247, 0.6); }

        /* МАЛЕНЬКАЯ КНОПКА ДЛЯ ФЛЕШМОБ ЗАДАНИЙ */
        .btn-spec.flashmob-sm {
            border-color: rgba(168, 85, 247, 0.6);
            background: rgba(168, 85, 247, 0.12);
            color: #e9d5ff;
            font-size: 0.76rem;
            padding: 0 4px;
        }
        .btn-spec.flashmob-sm.active { background: var(--purple-accent); color: #fff; box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }

        .footer-branding {
            text-align: center;
            font-size: 0.72rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 2px;
            padding-top: 2px;
            text-transform: uppercase;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .setup-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 28px 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 40px var(--gold-glow);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .setup-title { font-family: 'Cinzel', serif; font-size: 1.5rem; font-weight: 900; color: #fff; letter-spacing: 2px; }
        .duration-label { font-size: 0.85rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .duration-row { display: flex; gap: 8px; }
        .btn-dur {
            flex: 1;
            height: 52px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.8);
            color: #fff;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-dur.active {
            background: var(--gold-main);
            color: #000;
            border-color: var(--gold-main);
            box-shadow: 0 0 15px var(--gold-glow);
        }
    </style>
</head>
<body>

    <div id="init-overlay" class="modal-overlay">
        <button onclick="initAudioAndPlayBg()" class="btn-main-giant btn-bg-giant" style="height: 80px; width: 100%; max-width: 360px;">
            🔊 ВКЛЮЧИТЬ ПУЛЬТ
        </button>
    </div>

    <div id="duration-modal" class="modal-overlay" style="display: none;">
        <div class="setup-card">
            <div class="setup-title">СТАРТ ПРОГРАММЫ</div>
            <div>
                <div class="duration-label" style="margin-bottom: 12px;">Сколько минут длится праздник?</div>
                <div class="duration-row">
                    <button class="btn-dur" onclick="confirmProgramStart(20)">20 мин</button>
                    <button class="btn-dur active" onclick="confirmProgramStart(40)">40 мин</button>
                    <button class="btn-dur" onclick="confirmProgramStart(60)">60 мин</button>
                </div>
            </div>
            <button onclick="closeDurationModal()" style="background: transparent; color: #94a3b8; border: none; font-weight: 800; cursor: pointer;">
                Отмена
            </button>
        </div>
    </div>

    <div class="app-container">

        <!-- 1. ВЕРХНЯЯ ПАНЕЛЬ -->
        <div class="top-panel">
            <div class="vol-row">
                <button class="btn-vol" onclick="setMasterVolume(0.03, this)">3%</button>
                <button class="btn-vol" onclick="setMasterVolume(0.10, this)">10%</button>
                <button class="btn-vol active" onclick="setMasterVolume(0.30, this)">30%</button>
                <button class="btn-vol" onclick="setMasterVolume(0.60, this)">60%</button>
                <button class="btn-vol" onclick="setMasterVolume(1.00, this)">100%</button>
            </div>

            <div class="track-display">
                <div class="track-title" id="track-name">Загрузка...</div>
                <div class="track-time" id="track-time">00:00 / 00:00</div>
            </div>

            <div class="player-row">
                <button class="btn-player" onclick="prevTrack()">⏮ Пред</button>
                <button class="btn-player play-active" id="btn-play-pause" onclick="togglePlayPause()">⏯ Пауза</button>
                <button class="btn-player" onclick="nextTrack()">След ⏭</button>
            </div>
        </div>

        <!-- 2. ЦЕНТРАЛЬНАЯ ЗОНА С ЭКВАЛАЙЗЕРОМ И ТАЙМЕРОМ -->
        <div class="center-display">
            <canvas id="eq-canvas"></canvas>
            
            <div class="center-content-slot">
                <button class="btn-start-program" id="btn-start-prog" onclick="openDurationModal()">
                    🚀 СТАРТ ПРОГРАММЫ
                </button>

                <div class="timer-box-slot" id="timer-slot">
                    <div class="countdown-timer" id="timer-display">40:00</div>
                </div>

                <h1 class="shimmer-title">EVENT OS - KIDS</h1>
            </div>
        </div>

        <!-- 3. СРЕДНИЙ БЛОК: ФОН И ИГРА -->
        <div class="main-action-block">
            <button class="btn-main-giant btn-bg-giant" id="btn-bg" onclick="triggerMode('bg')">
                🍃 ФОН
            </button>
            <button class="btn-main-giant btn-game-giant" id="btn-game" onclick="triggerMode('game')">
                🎮 ИГРА
            </button>
        </div>

        <!-- 4. НИЖНЯЯ ПАНЕЛЬ -->
        <div class="bottom-grid">
            <button class="btn-spec hb" id="btn-hb" onclick="triggerMode('hb')">
                🎂 Birthday
            </button>
            <button class="btn-spec bubbles" id="btn-bubbles" onclick="triggerMode('bubbles')">
                🎗️ Ленты - 🫧 Пузыри
            </button>
            <button class="btn-spec flashmob" id="btn-fm1" onclick="triggerMode('flashmob1')">
                💃 Флешмоб
            </button>
            <button class="btn-spec flashmob-sm" id="btn-fm2" onclick="triggerMode('flashmob2')">
                🎯 Флешмоб задания
            </button>
        </div>

        <div class="footer-branding">EVENT OS - KIDS COMPANY 2026</div>

    </div>

    <audio id="bg-audio" crossorigin="anonymous"></audio>
    <audio id="sfx-audio" crossorigin="anonymous"></audio>

    <script>
        const socket = io("https://kids-aqxx.onrender.com");
        let config = null;

        const bgAudio = document.getElementById('bg-audio');
        const sfxAudio = document.getElementById('sfx-audio');

        let targetMasterVolume = 0.30;
        let currentMasterVolume = 0.30;
        let volumeRampInterval = null;
        let sfxFadeInterval = null;

        let currentMode = 'bg';
        let isGlobalPaused = false;

        let partyStarted = false;
        let partyRemainingSeconds = 2400;
        let partyTimerInterval = null;

        let audioCtx = null;
        let analyser = null;
        let dataArray = null;

        let shuffleStore = {
            bg: { queue: [], history: [] },
            game: { queue: [], history: [] },
            entrance: { queue: [], history: [] },
            hb: { queue: [], history: [] },
            hb_bg: { queue: [], history: [] },
            bubbles: { queue: [], history: [] },
            flashmob1: { queue: [], history: [] },
            flashmob2: { queue: [], history: [] }
        };

        function shuffleArray(arr) {
            let a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function getNextTrackIndex(mode) {
            const playlist = getPlaylist(mode);
            if (!playlist || playlist.length === 0) return 0;

            if (!shuffleStore[mode]) {
                shuffleStore[mode] = { queue: [], history: [] };
            }
            let st = shuffleStore[mode];

            if (st.queue.length === 0) {
                let indices = Array.from({length: playlist.length}, (_, i) => i);
                let newQueue = shuffleArray(indices);

                if (st.history.length > 0 && newQueue.length > 1) {
                    let lastIdx = st.history[st.history.length - 1];
                    if (newQueue[0] === lastIdx) {
                        let endPos = newQueue.length - 1;
                        [newQueue[0], newQueue[endPos]] = [newQueue[endPos], newQueue[0]];
                    }
                }
                st.queue = newQueue;
            }

            let nextIndex = st.queue.shift();
            st.history.push(nextIndex);
            return nextIndex;
        }

        function getPrevTrackIndex(mode) {
            const playlist = getPlaylist(mode);
            if (!playlist || playlist.length === 0) return 0;

            let st = shuffleStore[mode];
            if (st && st.history.length > 1) {
                let curr = st.history.pop();
                st.queue.unshift(curr);
                return st.history[st.history.length - 1];
            }
            return st ? (st.history[0] || 0) : 0;
        }

        function setMasterVolume(targetVol, btn) {
            targetMasterVolume = targetVol;
            document.querySelectorAll('.btn-vol').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');

            const duration = 1500;
            const startTime = performance.now();
            const startVol = currentMasterVolume;

            if (volumeRampInterval) cancelAnimationFrame(volumeRampInterval);

            function step(now) {
                const elapsed = now - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                currentMasterVolume = startVol + (targetMasterVolume - startVol) * progress;
                applyAudioVolumes();

                if (progress < 1) {
                    volumeRampInterval = requestAnimationFrame(step);
                }
            }
            volumeRampInterval = requestAnimationFrame(step);
        }

        function applyAudioVolumes() {
            if (isGlobalPaused) {
                bgAudio.volume = 0;
                sfxAudio.volume = 0;
                return;
            }

            if (currentMode === 'bg') {
                bgAudio.volume = currentMasterVolume;
                sfxAudio.volume = 0;
            } else {
                bgAudio.volume = Math.min(currentMasterVolume, 0.03);
                if (!sfxFadeInterval) {
                    sfxAudio.volume = currentMasterVolume;
                }
            }
        }

        function initAudioAndPlayBg() {
            if (!audioCtx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtx();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);

                const srcBg = audioCtx.createMediaElementSource(bgAudio);
                const srcSfx = audioCtx.createMediaElementSource(sfxAudio);

                srcBg.connect(analyser);
                srcSfx.connect(analyser);
                analyser.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            document.getElementById('init-overlay').style.display = 'none';
            
            currentMode = 'bg';
            playModeTrack('bg', true);
            drawEq();
        }

        function openDurationModal() {
            document.getElementById('duration-modal').style.display = 'flex';
        }

        function closeDurationModal() {
            document.getElementById('duration-modal').style.display = 'none';
        }

        function confirmProgramStart(mins) {
            partyStarted = true;
            partyRemainingSeconds = mins * 60;
            updateTimerDisplay();

            document.getElementById('btn-start-prog').style.display = 'none';
            document.getElementById('timer-slot').style.display = 'flex';

            if (partyTimerInterval) clearInterval(partyTimerInterval);
            partyTimerInterval = setInterval(() => {
                if (partyRemainingSeconds > 0) {
                    partyRemainingSeconds--;
                    updateTimerDisplay();
                } else {
                    clearInterval(partyTimerInterval);
                    partyStarted = false;
                    document.getElementById('timer-slot').style.display = 'none';
                    document.getElementById('btn-start-prog').style.display = 'flex';
                }
            }, 1000);

            document.getElementById('duration-modal').style.display = 'none';

            const vol100Btn = document.querySelectorAll('.btn-vol')[4];
            setMasterVolume(1.00, vol100Btn);

            triggerMode('entrance');
        }

        function updateTimerDisplay() {
            if (!partyStarted) return;
            
            const m = Math.floor(partyRemainingSeconds / 60);
            const s = Math.floor(partyRemainingSeconds % 60);
            const str = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            
            const timerEl = document.getElementById('timer-display');
            timerEl.innerText = str;

            if (partyRemainingSeconds <= 600) {
                timerEl.classList.add('ending-warning');
            } else {
                timerEl.classList.remove('ending-warning');
            }
        }

        socket.on('config_data', (data) => {
            config = data;
        });

        function getPlaylist(mode) {
            if (!config) return [];
            
            if (mode === 'bg') {
                if (partyStarted && partyRemainingSeconds <= 600 && config.ending_tracks && config.ending_tracks.length > 0) {
                    return config.ending_tracks;
                }
                return config.bg_tracks || [];
            }

            if (mode === 'game') return config.game_tracks || [];
            if (mode === 'entrance') return config.entrance_tracks || [];
            if (mode === 'hb') return config.happy_birthday_tracks || [];
            if (mode === 'hb_bg') return config.happy_birthday_bg_tracks || config.happy_birthday_tracks || [];
            if (mode === 'bubbles') return config.bubbles_tracks || [];
            if (mode === 'flashmob1') return config.flashmob1_tracks || [];
            if (mode === 'flashmob2') return config.flashmob2_tracks || [];
            return config.bg_tracks || [];
        }

        function playModeTrack(mode, forceNew = true) {
            if (!config) return;
            const playlist = getPlaylist(mode);
            if (!playlist || playlist.length === 0) return;

            let idx;
            let st = shuffleStore[mode];
            if (forceNew || !st || st.history.length === 0) {
                idx = getNextTrackIndex(mode);
            } else {
                idx = st.history[st.history.length - 1];
            }

            const filename = playlist[idx];
            const fullUrl = config.cdn_base_url + filename;

            document.getElementById('track-name').innerText = filename;
            updateUIState();

            isGlobalPaused = false;

            if (mode === 'bg') {
                if (!bgAudio.src.endsWith(filename)) bgAudio.src = fullUrl;
                bgAudio.play().catch(e => console.log(e));
            } else {
                if (!sfxAudio.src.endsWith(filename)) sfxAudio.src = fullUrl;

                if (mode === 'game') {
                    sfxAudio.currentTime = 15;
                    sfxAudio.volume = 0;

                    if (sfxFadeInterval) cancelAnimationFrame(sfxFadeInterval);

                    const fadeStart = performance.now();
                    function fadeSfxStep(now) {
                        const elapsed = now - fadeStart;
                        const progress = Math.min(elapsed / 2000, 1);
                        sfxAudio.volume = currentMasterVolume * progress;

                        if (progress < 1) {
                            sfxFadeInterval = requestAnimationFrame(fadeSfxStep);
                        } else {
                            sfxFadeInterval = null;
                        }
                    }

                    sfxAudio.play().then(() => {
                        sfxFadeInterval = requestAnimationFrame(fadeSfxStep);
                    }).catch(e => console.log(e));

                } else {
                    if (sfxFadeInterval) {
                        cancelAnimationFrame(sfxFadeInterval);
                        sfxFadeInterval = null;
                    }
                    sfxAudio.play().catch(e => console.log(e));
                }

                if (bgAudio.paused) bgAudio.play().catch(e => console.log(e));
            }

            applyAudioVolumes();

            const btn = document.getElementById('btn-play-pause');
            btn.classList.add('play-active');
            btn.innerText = "⏯ Пауза";
        }

        bgAudio.onended = () => {
            if (currentMode === 'bg') playModeTrack('bg', true);
        };

        // --- АВТО-ПЕРЕХОД ПОСЛЕ ВЫНОСА ТОРТА НА HAPPY BIRTHDAY ФОН ---
        sfxAudio.onended = () => {
            if (currentMode === 'hb') {
                currentMode = 'hb_bg';
                playModeTrack('hb_bg', true);
            } else if (currentMode === 'hb_bg') {
                playModeTrack('hb_bg', true);
            } else {
                currentMode = 'bg';
                sfxAudio.pause();
                applyAudioVolumes();
                updateUIState();
            }
        };

        bgAudio.ontimeupdate = () => {
            if (currentMode === 'bg') {
                const cur = formatTime(bgAudio.currentTime);
                const dur = formatTime(bgAudio.duration);
                document.getElementById('track-time').innerText = `${cur} / ${dur}`;
            }
        };

        sfxAudio.ontimeupdate = () => {
            if (currentMode !== 'bg') {
                const cur = formatTime(sfxAudio.currentTime);
                const dur = formatTime(sfxAudio.duration);
                document.getElementById('track-time').innerText = `${cur} / ${dur}`;
            }
        };

        function formatTime(s) {
            if (!s || isNaN(s)) return "00:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        function togglePlayPause() {
            const btn = document.getElementById('btn-play-pause');
            if (isGlobalPaused) {
                isGlobalPaused = false;
                bgAudio.play();
                if (currentMode !== 'bg') sfxAudio.play();
                applyAudioVolumes();
                btn.classList.add('play-active');
                btn.innerText = "⏯ Пауза";
                updateUIState();
            } else {
                isGlobalPaused = true;
                bgAudio.pause();
                sfxAudio.pause();
                applyAudioVolumes();
                btn.classList.remove('play-active');
                btn.innerText = "▶ Пуск";
                clearActiveHighlights();
            }
        }

        function nextTrack() {
            playModeTrack(currentMode, true);
        }

        function prevTrack() {
            if (!config) return;
            const playlist = getPlaylist(currentMode);
            if (!playlist || playlist.length === 0) return;

            let idx = getPrevTrackIndex(currentMode);
            const filename = playlist[idx];
            const fullUrl = config.cdn_base_url + filename;

            document.getElementById('track-name').innerText = filename;
            updateUIState();

            if (currentMode === 'bg') {
                bgAudio.src = fullUrl;
                bgAudio.play();
            } else {
                sfxAudio.src = fullUrl;
                if (currentMode === 'game') sfxAudio.currentTime = 15;
                sfxAudio.play();
            }
            applyAudioVolumes();
        }

        function triggerMode(mode) {
            if (currentMode === mode && !isGlobalPaused) {
                nextTrack();
            } else {
                currentMode = mode;
                if (mode === 'bg') {
                    sfxAudio.pause();
                }
                playModeTrack(mode, true);
            }
        }

        function clearActiveHighlights() {
            document.getElementById('btn-bg').classList.remove('active');
            document.getElementById('btn-game').classList.remove('active');
            document.getElementById('btn-hb').classList.remove('active');
            document.getElementById('btn-bubbles').classList.remove('active');
            document.getElementById('btn-fm1').classList.remove('active');
            document.getElementById('btn-fm2').classList.remove('active');
        }

        function updateUIState() {
            clearActiveHighlights();
            if (currentMode === 'bg') document.getElementById('btn-bg').classList.add('active');
            else if (currentMode === 'game') document.getElementById('btn-game').classList.add('active');
            else if (currentMode === 'hb' || currentMode === 'hb_bg') document.getElementById('btn-hb').classList.add('active');
            else if (currentMode === 'bubbles') document.getElementById('btn-bubbles').classList.add('active');
            else if (currentMode === 'flashmob1') document.getElementById('btn-fm1').classList.add('active');
            else if (currentMode === 'flashmob2') document.getElementById('btn-fm2').classList.add('active');
        }
