<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Музыка AI - Шоу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; background-color: #030303; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* Главный экран шоу (всегда строго по центру экрана, панель его не двигает) */
        #viewer-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; background: transparent; }
        
        canvas#equalizer-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }

        /* Центральный круг с надписью АИ музыка */
        #mystery-box { 
            position: relative; 
            z-index: 3; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: min(75vw, 280px); 
            height: min(75vw, 280px); 
            border-radius: 50%; 
            box-shadow: inset 0 0 60px rgba(212, 175, 55, 0.15), 0 0 30px rgba(0,0,0,0.8); 
            background: rgba(5, 5, 5, 0.85); 
            border: 3px solid rgba(212, 175, 55, 0.35); 
        }
        
        #mystery-mark { 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%; 
            height: 100%; 
            animation: breathe 2s ease-in-out infinite alternate; 
            text-align: center;
        }

        .ai-title {
            font-size: clamp(3.2rem, 13vw, 6rem);
            font-weight: 900;
            color: #d4af37;
            text-shadow: 0 0 35px rgba(212, 175, 55, 0.8);
            line-height: 0.9;
            letter-spacing: 2px;
        }

        .ai-sub {
            font-size: clamp(0.9rem, 3.5vw, 1.6rem);
            font-weight: 400;
            color: #c5a017;
            text-transform: lowercase;
            letter-spacing: 3px;
            margin-top: 6px;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }

        @keyframes breathe {
            from { transform: scale(0.95); filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); }
            to { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(212,175,55,0.9)); }
        }

        /* ПУЛЬТ УПРАВЛЕНИЯ: Эффект стекла (Glassmorphism) фиксирован снизу */
        #admin-panel { 
            position: fixed; 
            bottom: 0; 
            left: 0; 
            width: 100%; 
            background: rgba(10, 10, 10, 0.75); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px); 
            border-top: 1px solid rgba(212, 175, 55, 0.3); 
            z-index: 60; 
            padding: 12px 10px calc(12px + env(safe-area-inset-bottom)); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.6); 
        }
        
        .admin-header { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-bottom: 6px; color: #d4af37; font-weight: bold; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Индикатор таймера плеера */
        #audio-timer { color: #fff; font-family: monospace; font-size: 0.9rem; background: rgba(0,0,0,0.5); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(212,175,55,0.3); }

        /* Сетка выбора треков от 1 до 12 */
        .tracks-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 100%; max-width: 600px; margin-bottom: 8px; }
        .track-btn { padding: 6px 0; font-size: 0.85rem; font-weight: bold; background: rgba(30, 30, 30, 0.6); color: #aaa; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 5px; cursor: pointer; text-align: center; transition: 0.1s; }
        .track-btn.active { background: #d4af37; color: #000; border-color: #f3db74; box-shadow: 0 0 10px rgba(212,175,55,0.6); }

        .admin-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; max-width: 600px; }
        .btn { flex: 1 1 calc(50% - 5px); padding: 10px 4px; font-size: 0.9rem; cursor: pointer; border: none; border-radius: 6px; font-weight: 900; text-transform: uppercase; transition: transform 0.1s; letter-spacing: 1px; color: #111; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .btn:active { transform: scale(0.95); opacity: 0.9; }
        
        .btn-start { background: linear-gradient(135deg, #f3db74, #d4af37); flex-basis: 100%; padding: 12px 10px; font-size: 1rem; }
        .btn-play-aim { background: linear-gradient(135deg, #e6c27a, #c5a017); }
        .btn-play-orig { background: linear-gradient(135deg, #ffffff, #c0c0c0); }
        .btn-stop { background: linear-gradient(135deg, #880000, #440000); color: #fff; border: 1px solid #ff4444; }
        .btn-next { background: linear-gradient(135deg, #333, #111); color: #d4af37; border: 1px solid rgba(212,175,55,0.4); }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <!-- Главный экран шоу -->
    <div id="viewer-screen">
        <canvas id="equalizer-canvas"></canvas>
        <div id="mystery-box">
            <div id="mystery-mark">
                <span class="ai-title">АИ</span>
                <span class="ai-sub">музыка</span>
            </div>
        </div>
    </div>

    <!-- Пульт управления с эффектом стекла и таймером -->
    <div id="admin-panel">
        <div class="admin-header">
            <span id="status-track">Трек: 1 / 12</span>
            <span id="audio-timer">00:00 / 00:00</span>
        </div>
        
        <!-- Кнопки быстрого выбора треков от 1 до 12 -->
        <div class="tracks-grid" id="tracks-grid"></div>

        <div class="admin-controls">
            <button class="btn btn-start" id="btn-start" onclick="sendCommand('start')">🚀 Запустить шоу</button>
            <button class="btn btn-play-aim" onclick="sendCommand('play_aim')">▶ Загадка (АИ)</button>
            <button class="btn btn-play-orig" onclick="sendCommand('play_orig')">▶ Оригинал</button>
            <button class="btn btn-stop" onclick="sendCommand('stop')">⏹ Стоп</button>
            <button class="btn btn-next" onclick="nextTrack()">⏭ След. трек</button>
        </div>
    </div>

    <audio id="audio-player" preload="auto" crossorigin="anonymous"></audio>

    <script>
        const CONFIG = {
            baseUrl: 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/',
            tracks: Array.from({length: 12}, (_, i) => ({
                id: i + 1,
                aim: `aim${i + 1}.mp3`,
                orig: `m${i + 1}.mp3`
            }))
        };

        const socket = io('https://aim-d8ck.onrender.com');
        const audioEl = document.getElementById('audio-player');
        const mysteryMark = document.getElementById('mystery-mark');
        const mysteryBox = document.getElementById('mystery-box');
        
        let currentTrack = 1;
        let timeOffset = 0; 
        let isAudioContextInit = false;
        let audioCtx, analyser;

        // Генерация кнопок треков 1-12
        const tracksGrid = document.getElementById('tracks-grid');
        CONFIG.tracks.forEach(t => {
            let btn = document.createElement('button');
            btn.className = `track-btn ${t.id === 1 ? 'active' : ''}`;
            btn.innerText = t.id;
            btn.onclick = () => selectTrack(t.id);
            tracksGrid.appendChild(btn);
        });

        function highlightActiveTrack() {
            document.querySelectorAll('.track-btn').forEach(b => {
                b.classList.toggle('active', parseInt(b.innerText) === currentTrack);
            });
        }

        // Инициализация Web Audio API по клику на любую кнопку
        function initAudio() {
            if (isAudioContextInit) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtx();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; 

                let source = audioCtx.createMediaElementSource(audioEl);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                isAudioContextInit = true;
                startCircularEq();
            } catch (e) { console.error(e); }
        }

        // Форматирование времени для таймера (00:00)
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds < 0) return "00:00";
            let mins = Math.floor(seconds / 60);
            let secs = Math.floor(seconds % 60);
            return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        audioEl.addEventListener('timeupdate', () => {
            let current = formatTime(audioEl.currentTime);
            let duration = formatTime(audioEl.duration);
            document.getElementById('audio-timer').innerText = `${current} / ${duration}`;
        });

        function selectTrack(num) {
            initAudio();
            currentTrack = num;
            highlightActiveTrack();
            document.getElementById('status-track').innerText = `Трек: ${currentTrack} / 12`;
            socket.emit('command', { action: 'set_track', track: currentTrack });
        }

        function nextTrack() {
            initAudio();
            if (currentTrack < CONFIG.tracks.length) {
                currentTrack++;
            } else {
                currentTrack = 1;
            }
            highlightActiveTrack();
            document.getElementById('status-track').innerText = `Трек: ${currentTrack} / 12`;
            socket.emit('command', { action: 'set_track', track: currentTrack });
        }

        function sendCommand(action) {
            initAudio(); // Гарантированно разблокируем аудиоконтекст при нажатии любой кнопки
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (action === 'start') {
                document.getElementById('btn-start').style.display = 'none';
            }
            socket.emit('command', { action: action, track: currentTrack });
        }

        // --- СИНХРОНИЗАЦИЯ С СЕРВЕРОМ И ПЛЕЕР ---
        socket.on('sync', (data) => {
            timeOffset = (Date.now() / 1000) - data.server_time;
            applyState(data.state);
        });

        socket.on('update', (data) => {
            timeOffset = (Date.now() / 1000) - data.server_time;
            applyState(data.state);
        });

        function applyState(state) {
            currentTrack = state.track;
            highlightActiveTrack();
            document.getElementById('status-track').innerText = `Трек: ${currentTrack} / 12`;

            if (state.is_started) {
                document.getElementById('btn-start').style.display = 'none';
            }

            if (state.status === 'stop') {
                audioEl.pause();
                mysteryMark.innerHTML = `<span class="ai-title">АИ</span><span class="ai-sub">музыка</span>`;
                mysteryBox.style.borderColor = 'rgba(212,175,55,0.35)';
                document.getElementById('audio-timer').innerText = "00:00 / 00:00";
            } 
            else {
                let url = '';
                if (state.status === 'aim') {
                    url = CONFIG.baseUrl + CONFIG.tracks[currentTrack - 1].aim;
                    mysteryMark.innerHTML = `<span class="ai-title">АИ</span><span class="ai-sub">музыка</span>`;
                    mysteryBox.style.borderColor = 'rgba(212,175,55,0.7)';
                } else {
                    url = CONFIG.baseUrl + CONFIG.tracks[currentTrack - 1].orig;
                    mysteryMark.innerHTML = `<span style="font-size: 5rem; font-weight: 900; color: #e0e0e0;">✓</span>`;
                    mysteryBox.style.borderColor = 'rgba(224,224,224,0.7)';
                }

                if (audioEl.src !== url) {
                    audioEl.src = url;
                    audioEl.load();
                }

                let currentServerTime = (Date.now() / 1000) - timeOffset;
                let playPosition = currentServerTime - state.start_time;

                if (playPosition > 0 && Math.abs(audioEl.currentTime - playPosition) > 1.5) {
                    audioEl.currentTime = playPosition;
                }

                audioEl.play().catch(e => {
                    console.log("Ожидание действия пользователя для звука");
                });
            }
        }

        // --- КРУГОВОЙ ЭКВАЛАЙЗЕР ---
        function startCircularEq() {
            const canvas = document.getElementById('equalizer-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const bufferLength = analyser.frequencyBinCount;
            const activeBars = 80;
            const halfBars = activeBars / 2;
            const angleStep = (Math.PI * 2) / activeBars;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let centerX = canvas.width / 2;
                let centerY = canvas.height / 2;
                let baseRadius = Math.min(canvas.width, canvas.height) * 0.22;

                for (let i = 0; i < activeBars; i++) {
                    let dataIndex;
                    if (i < halfBars) {
                        dataIndex = Math.floor(i * (bufferLength * 0.6) / halfBars);
                    } else {
                        dataIndex = Math.floor((activeBars - i - 1) * (bufferLength * 0.6) / halfBars);
                    }
                    
                    let barHeight = dataArray[dataIndex] * 0.65; 
                    if (barHeight < 3) barHeight = 3; 
                    
                    let angle = i * angleStep - (Math.PI / 2);

                    let x1 = centerX + Math.cos(angle) * baseRadius;
                    let y1 = centerY + Math.sin(angle) * baseRadius;
                    let x2 = centerX + Math.cos(angle) * (baseRadius + barHeight);
                    let y2 = centerY + Math.sin(angle) * (baseRadius + barHeight);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    
                    if (mysteryMark.innerHTML.includes('✓')) {
                        ctx.strokeStyle = `rgba(224, 224, 224, ${barHeight/255 + 0.3})`; 
                    } else {
                        ctx.strokeStyle = `rgba(212, 175, 55, ${barHeight/255 + 0.3})`; 
                    }
                    ctx.stroke();
                }
            }
            draw();
        }

        // --- ЛЕТАЮЩИЕ ИСКРЫ ---
        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        
        function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeP);
        resizeP();
        
        for (let i = 0; i < 70; i++) {
            particles.push({ 
                x: Math.random() * pCanvas.width, 
                y: Math.random() * pCanvas.height, 
                size: Math.random() * 2.5 + 0.5, 
                speedY: Math.random() * 1.5 + 0.5, 
                speedX: (Math.random() - 0.5) * 0.5,
                colorType: Math.random() > 0.5 ? 'gold' : 'silver'
            });
        }
        
        function drawP() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => {
                p.y -= p.speedY;
                p.x += p.speedX;
                if (p.y < 0) {
                    p.y = pCanvas.height;
                    p.x = Math.random() * pCanvas.width;
                }
                
                if (p.colorType === 'gold') {
                    pCtx.fillStyle = `rgba(212, 175, 55, ${Math.random() * 0.5 + 0.3})`;
                } else {
                    pCtx.fillStyle = `rgba(220, 220, 220, ${Math.random() * 0.5 + 0.3})`;
                }
                
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                pCtx.fill();
            });
            requestAnimationFrame(drawP);
        }
        drawP();
    </script>
</body>
</html>
