<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Музыка - Винил</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: #050505; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        #gatekeeper { position: fixed; inset: 0; z-index: 10000; background: rgba(5,5,5,0.95); display: flex; justify-content: center; align-items: center; cursor: pointer; backdrop-filter: blur(10px); }
        .gate-btn { color: #d4af37; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 4px; animation: pulse 2s infinite; text-align: center; border: 1px solid rgba(212,175,55,0.5); padding: 20px 40px; border-radius: 12px; background: rgba(212,175,55,0.1); }
        @keyframes pulse { 0%, 100% { opacity: 0.7; box-shadow: 0 0 10px rgba(212,175,55,0.2); } 50% { opacity: 1; text-shadow: 0 0 20px #d4af37; box-shadow: 0 0 30px rgba(212,175,55,0.6); } }

        canvas#network-bg { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        #main-stage { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 5; padding-bottom: 90px; }
        canvas#eq-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        .vinyl-record { 
            position: relative; z-index: 10; width: 230px; height: 230px; border-radius: 50%;
            background: repeating-radial-gradient( #0a0a0a, #0a0a0a 4px, #161616 5px, #161616 6px );
            border: 2px solid rgba(212, 175, 55, 0.4);
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15), inset 0 0 20px rgba(0,0,0,1);
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
            animation: spin 3s linear infinite; animation-play-state: paused;
        }
        .vinyl-record.playing { 
            animation-play-state: running; border-color: rgba(212, 175, 55, 0.9);
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.8), inset 0 0 20px rgba(0,0,0,1);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .vinyl-label {
            width: 85px; height: 85px; border-radius: 50%;
            background: linear-gradient(135deg, #f3db74, #b8860b);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5), 0 0 10px rgba(0,0,0,0.8); color: #000;
        }
        .text-main { font-size: 2rem; font-weight: 900; line-height: 0.9; letter-spacing: 1px; }
        .text-sub { font-size: 0.65rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; margin-top: 3px; }

        #controls { position: fixed; bottom: 20px; left: 0; width: 100%; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .tracks-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 420px; padding: 0 15px; }
        .track-btn { 
            width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(10,10,10,0.8); color: #aaa; font-weight: bold; font-size: 1.2rem;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .track-btn.active { background: #d4af37; color: #000; border-color: #fff; box-shadow: 0 0 20px rgba(212, 175, 55, 0.8); transform: scale(1.1); }

        .action-row { display: flex; gap: 10px; padding: 0 15px; width: 100%; max-width: 420px; }
        .action-btn { 
            flex: 1; padding: 14px 0; border-radius: 12px; border: none; font-weight: 900; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            background: rgba(20, 20, 20, 0.85); color: #fff; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.1s;
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-aim { color: #d4af37; border-color: rgba(212, 175, 55, 0.5); }
        .btn-stop { color: #ff4444; border-color: rgba(255, 68, 68, 0.3); flex: 0.6; }
    </style>
</head>
<body>

    <div id="gatekeeper" onclick="startSystem()">
        <div class="gate-btn">Нажмите для старта</div>
    </div>

    <canvas id="network-bg"></canvas>

    <div id="main-stage">
        <canvas id="eq-canvas"></canvas>
        <div class="vinyl-record" id="vinyl">
            <div class="vinyl-label" id="vinyl-label">
                <div class="text-main" id="text-main">АИ</div>
                <div class="text-sub" id="text-sub">музыка</div>
            </div>
        </div>
    </div>

    <div id="controls">
        <div class="tracks-grid" id="tracks-grid"></div>
        <div class="action-row">
            <button class="action-btn btn-aim" onclick="sendCommand('play_aim')">▶ Загадка</button>
            <button class="action-btn" onclick="sendCommand('play_orig')">▶ Оригинал</button>
            <button class="action-btn btn-stop" onclick="sendCommand('stop')">⏹ Стоп</button>
        </div>
    </div>

    <!-- Атрибуты как в Event OS -->
    <audio id="audio-player" crossorigin="anonymous" preload="auto"></audio>

    <script>
        const CONFIG = {
            baseUrl: 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/',
            tracks: Array.from({length: 12}, (_, i) => ({ aim: `aim${i + 1}.mp3`, orig: `m${i + 1}.mp3` }))
        };

        const socket = io("https://aim-d8ck.onrender.com", { transports: ['websocket', 'polling'] });
        const audioEl = document.getElementById('audio-player');
        const vinyl = document.getElementById('vinyl');
        const tMain = document.getElementById('text-main');
        const tSub = document.getElementById('text-sub');
        
        let currentTrack = 1;
        let audioCtx, analyser, isInit = false;
        
        // --- УМНЫЙ АУДИО-МЕНЕДЖЕР (СПИЗЖЕНО ИЗ EVENT OS) ---
        let targetVolume = 1.0;      
        let isFadingToSeek = false;
        let pendingSeekTime = 0;
        let state_is_playing = false;

        // Вратарь - логика один-в-один из submitAuth() Event OS
        function startSystem() {
            document.getElementById('gatekeeper').style.display = 'none';
            
            audioEl.src = CONFIG.baseUrl + CONFIG.tracks[0].aim;
            audioEl.load();
            audioEl.play().then(() => audioEl.pause()).catch(()=>{});
            
            if (!isInit) {
                try {
                    const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioCtxClass();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256; 
                    let source = audioCtx.createMediaElementSource(audioEl);
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    isInit = true;
                    startEq();
                } catch (e) {}
            }
        }

        // Плавный фэйд на 25ms (Точная копия из Event OS)
        setInterval(() => {
            if (!audioEl) return;

            let bgVolTarget = state_is_playing ? targetVolume : 0;
            if (isFadingToSeek) bgVolTarget = 0;

            let diffBg = bgVolTarget - audioEl.volume;
            if (Math.abs(diffBg) > 0.02) {
                audioEl.volume += Math.sign(diffBg) * 0.02; 
            } else {
                audioEl.volume = bgVolTarget;
                if (bgVolTarget === 0) {
                    if (isFadingToSeek) {
                        audioEl.currentTime = pendingSeekTime; 
                        isFadingToSeek = false; 
                    } else if (!state_is_playing && !audioEl.paused) {
                        audioEl.pause();
                        vinyl.classList.remove('playing');
                    }
                }
            }
        }, 25);

        // Генерация кнопок
        const grid = document.getElementById('tracks-grid');
        for (let i = 1; i <= 12; i++) {
            let btn = document.createElement('div');
            btn.className = `track-btn ${i === 1 ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { currentTrack = i; sendCommand('set_track'); };
            grid.appendChild(btn);
        }

        function updateUI() {
            document.querySelectorAll('.track-btn').forEach((b, idx) => {
                b.classList.toggle('active', idx + 1 === currentTrack);
            });
        }

        function sendCommand(action) {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            socket.emit('command', { action: action, track: currentTrack });
        }

        // Обновление стейта с сервера (Логика Event OS)
        socket.on('state_update', state => {
            currentTrack = state.track_id;
            state_is_playing = state.is_playing;
            updateUI();

            if (!state.is_playing) {
                tMain.innerText = 'АИ';
                tSub.innerText = 'МУЗЫКА';
                return;
            } 
            
            // UI Обновление
            if (state.track_type === 'aim') {
                tMain.innerText = 'АИ';
                tSub.innerText = 'МУЗЫКА';
            } else {
                tMain.innerText = '✓';
                tSub.innerText = '';
            }

            // Логика подгрузки и перескока (Из Event OS: applyAudioState)
            let url = CONFIG.baseUrl + (state.track_type === 'aim' ? CONFIG.tracks[currentTrack-1].aim : CONFIG.tracks[currentTrack-1].orig);
            
            if (!audioEl.src.endsWith(url)) {
                audioEl.src = url;
                audioEl.currentTime = state.seek_position;
                if (state.is_playing) {
                    audioEl.volume = 0;
                    audioEl.play().then(() => vinyl.classList.add('playing')).catch(()=>{});
                }
            } else {
                let needsSeek = Math.abs(audioEl.currentTime - state.seek_position) > 2.5;
                if (needsSeek && state.is_playing) {
                    isFadingToSeek = true;
                    pendingSeekTime = state.seek_position;
                } else if (state.is_playing && audioEl.paused) {
                    audioEl.volume = 0; 
                    audioEl.play().then(() => vinyl.classList.add('playing')).catch(()=>{});
                }
            }
        });

        // --- ЭКВАЛАЙЗЕР ---
        let eqHeights = Array(80).fill(2); 
        function startEq() {
            const canvas = document.getElementById('eq-canvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            const bars = 80;
            const angleStep = (Math.PI * 2) / bars;

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let cx = canvas.width / 2;
                let cy = canvas.height / 2 - 45; 
                let baseRadius = 125; 

                for (let i = 0; i < bars; i++) {
                    let dataIndex = Math.floor(i * (dataArray.length * 0.5) / bars);
                    let targetH = state_is_playing ? dataArray[dataIndex] * 0.6 : 0;
                    
                    eqHeights[i] += (targetH - eqHeights[i]) * 0.2;
                    let h = Math.max(eqHeights[i], 3);

                    let angle = i * angleStep - (Math.PI / 2);
                    let x1 = cx + Math.cos(angle) * baseRadius;
                    let y1 = cy + Math.sin(angle) * baseRadius;
                    let x2 = cx + Math.cos(angle) * (baseRadius + h);
                    let y2 = cy + Math.sin(angle) * (baseRadius + h);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    
                    if (tMain.innerText === '✓') {
                        ctx.strokeStyle = `rgba(224, 224, 224, ${h/100 + 0.2})`;
                    } else {
                        ctx.strokeStyle = `rgba(212, 175, 55, ${h/100 + 0.2})`;
                    }
                    ctx.stroke();
                }
            }
            draw();
        }

        // --- ЧАСТИЦЫ ---
        const netCanvas = document.getElementById('network-bg');
        const netCtx = netCanvas.getContext('2d');
        let dots = [];
        
        function resizeNet() { netCanvas.width = window.innerWidth; netCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeNet); resizeNet();

        for(let i=0; i<60; i++) {
            dots.push({
                x: Math.random() * netCanvas.width, y: Math.random() * netCanvas.height,
                vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, radius: Math.random() * 2 + 1
            });
        }

        function drawNetwork() {
            netCtx.clearRect(0, 0, netCanvas.width, netCanvas.height);
            for(let i=0; i<dots.length; i++) {
                let p = dots[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > netCanvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > netCanvas.height) p.vy *= -1;

                netCtx.beginPath();
                netCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                netCtx.fillStyle = 'rgba(212, 175, 55, 0.6)';
                netCtx.fill();

                for(let j=i+1; j<dots.length; j++) {
                    let p2 = dots[j];
                    let dist = Math.sqrt((p.x - p2.x)**2 + (p.y - p2.y)**2);
                    if (dist < 130) {
                        netCtx.beginPath();
                        netCtx.moveTo(p.x, p.y);
                        netCtx.lineTo(p2.x, p2.y);
                        netCtx.strokeStyle = `rgba(212, 175, 55, ${1 - dist/130})`;
                        netCtx.lineWidth = 1;
                        netCtx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawNetwork);
        }
        drawNetwork();
    </script>
</body>
</html>
