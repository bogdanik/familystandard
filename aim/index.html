<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Музыка - Шоу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; background-color: #030303; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; overflow: hidden; }
        
        #particles-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

        /* ЭКРАН ШОУ - Строго по центру */
        #viewer-screen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 5; background: transparent; padding-bottom: 120px; }
        canvas#equalizer-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        #mystery-box { 
            position: relative; z-index: 3; display: flex; justify-content: center; align-items: center; 
            width: min(70vw, 260px); height: min(70vw, 260px); border-radius: 50%; 
            box-shadow: inset 0 0 50px rgba(212, 175, 55, 0.15), 0 0 30px rgba(0,0,0,0.8); 
            background: rgba(5, 5, 5, 0.8); border: 3px solid rgba(212, 175, 55, 0.5); 
            transition: border-color 0.5s;
        }
        
        #mystery-mark { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; animation: breathe 2s ease-in-out infinite alternate; text-align: center; }
        .ai-title { font-size: clamp(3rem, 12vw, 5.5rem); font-weight: 900; color: #d4af37; text-shadow: 0 0 35px rgba(212, 175, 55, 0.8); line-height: 0.9; letter-spacing: 2px; }
        .ai-sub { font-size: clamp(0.8rem, 3vw, 1.4rem); font-weight: 400; color: #c5a017; text-transform: lowercase; letter-spacing: 3px; margin-top: 6px; text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }

        @keyframes breathe {
            from { transform: scale(0.95); filter: drop-shadow(0 0 15px rgba(212,175,55,0.4)); }
            to { transform: scale(1.05); filter: drop-shadow(0 0 35px rgba(212,175,55,0.9)); }
        }

        /* СТЕКЛЯННЫЙ ПУЛЬТ УПРАВЛЕНИЯ ПОВЕРХ ЭКРАНА */
        #admin-panel { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(10, 10, 10, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border-top: 1px solid rgba(212, 175, 55, 0.2); z-index: 60; 
            padding: 15px 10px calc(15px + env(safe-area-inset-bottom)); 
            display: flex; flex-direction: column; align-items: center; box-shadow: 0 -10px 40px rgba(0,0,0,0.7); 
        }
        
        .admin-header { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-bottom: 5px; color: #d4af37; font-weight: bold; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .debug-bar { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-bottom: 8px; font-size: 0.75rem; font-family: monospace; }
        #debug-text { color: #888; }
        #audio-timer { color: #fff; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(212,175,55,0.3); }

        .tracks-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; width: 100%; max-width: 600px; margin-bottom: 10px; }
        .track-btn { padding: 8px 0; font-size: 0.9rem; font-weight: bold; background: rgba(30, 30, 30, 0.7); color: #aaa; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; cursor: pointer; text-align: center; }
        .track-btn.active { background: #d4af37; color: #000; border-color: #f3db74; box-shadow: 0 0 12px rgba(212,175,55,0.6); }

        .admin-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; max-width: 600px; }
        .btn { flex: 1 1 calc(33% - 6px); padding: 12px 4px; font-size: 0.85rem; cursor: pointer; border: none; border-radius: 6px; font-weight: 900; text-transform: uppercase; color: #111; box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
        .btn:active { transform: scale(0.95); opacity: 0.9; }
        
        .btn-play-aim { background: linear-gradient(135deg, #e6c27a, #c5a017); }
        .btn-play-orig { background: linear-gradient(135deg, #ffffff, #c0c0c0); }
        .btn-stop { background: linear-gradient(135deg, #880000, #440000); color: #fff; border: 1px solid #ff4444; }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div id="viewer-screen">
        <canvas id="equalizer-canvas"></canvas>
        <div id="mystery-box">
            <div id="mystery-mark">
                <span class="ai-title">АИ</span>
                <span class="ai-sub">музыка</span>
            </div>
        </div>
    </div>

    <!-- ПУЛЬТ (Всегда на экране снизу) -->
    <div id="admin-panel">
        <div class="admin-header">
            <span id="status-track">Трек: 1 / 12</span>
            <span>Пульт шоу</span>
        </div>
        
        <div class="debug-bar">
            <span id="debug-text">Ожидание команд...</span>
            <span id="audio-timer">00:00 / 00:00</span>
        </div>

        <div class="tracks-grid" id="tracks-grid"></div>

        <div class="admin-controls">
            <button class="btn btn-play-aim" onclick="sendCommand('play_aim')">▶ АИ Загадка</button>
            <button class="btn btn-play-orig" onclick="sendCommand('play_orig')">▶ Оригинал</button>
            <button class="btn btn-stop" onclick="sendCommand('stop')">⏹ Стоп</button>
        </div>
    </div>

    <audio id="audio-player" preload="auto" crossorigin="anonymous"></audio>

    <script>
        const CONFIG = {
            baseUrl: 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/',
            tracks: Array.from({length: 12}, (_, i) => ({
                id: i + 1,
                aim: `AIM${i + 1}.mp3`,
                orig: `M${i + 1}.mp3`
            }))
        };

        const socket = io();
        const audioEl = document.getElementById('audio-player');
        const mysteryMark = document.getElementById('mystery-mark');
        const mysteryBox = document.getElementById('mystery-box');
        const debugText = document.getElementById('debug-text');
        
        let currentTrack = 1;
        let serverTimeOffset = 0; 
        let audioCtx, analyser, isAudioUnlocked = false;

        // ГЕНИАЛЬНЫЙ ХАК ИЗ ТВОЕГО EVENT OS (Разблокировка аудио по первому тапу в пульте)
        document.getElementById('admin-panel').addEventListener('pointerdown', () => {
            if (!isAudioUnlocked) {
                audioEl.load();
                audioEl.play().then(() => {
                    audioEl.pause();
                    isAudioUnlocked = true;
                    debugText.innerText = 'Аудио система готова ✓';
                    debugText.style.color = '#00ff00';
                }).catch(e => {});

                try {
                    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContextClass();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 256; 
                    let source = audioCtx.createMediaElementSource(audioEl);
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    startCircularEq();
                } catch (e) {}
            }
        }, {once: true, capture: true});

        // Создание сетки треков 1-12
        const tracksGrid = document.getElementById('tracks-grid');
        CONFIG.tracks.forEach(t => {
            let btn = document.createElement('button');
            btn.className = `track-btn ${t.id === 1 ? 'active' : ''}`;
            btn.innerText = t.id;
            btn.onclick = () => {
                currentTrack = t.id;
                highlightActiveTrack();
                socket.emit('command', { action: 'set_track', track: currentTrack });
            };
            tracksGrid.appendChild(btn);
        });

        function highlightActiveTrack() {
            document.querySelectorAll('.track-btn').forEach(b => {
                b.classList.toggle('active', parseInt(b.innerText) === currentTrack);
            });
            document.getElementById('status-track').innerText = `Трек: ${currentTrack} / 12`;
        }

        // Таймер плеера
        function formatTime(s) {
            if (isNaN(s) || s < 0) return "00:00";
            let m = Math.floor(s / 60); let sec = Math.floor(s % 60);
            return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
        }
        audioEl.addEventListener('timeupdate', () => {
            document.getElementById('audio-timer').innerText = `${formatTime(audioEl.currentTime)} / ${formatTime(audioEl.duration)}`;
        });

        // Отправка команд на сервер
        function sendCommand(action) {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            socket.emit('command', { action: action, track: currentTrack });
        }

        // Логика приема состояния с сервера (Оптимизировано, чтобы не ломался src)
        socket.on('sync', (data) => {
            let offset = (Date.now() / 1000) - data.server_time;
            serverTimeOffset = serverTimeOffset === 0 ? offset : (serverTimeOffset * 0.9 + offset * 0.1);
            applyState(data.state);
        });

        function applyState(state) {
            currentTrack = state.track;
            highlightActiveTrack();

            if (state.status === 'stop') {
                audioEl.pause();
                mysteryMark.innerHTML = `<span class="ai-title">АИ</span><span class="ai-sub">музыка</span>`;
                mysteryBox.style.borderColor = 'rgba(212,175,55,0.5)';
                document.getElementById('audio-timer').innerText = "00:00 / 00:00";
                debugText.innerText = 'Остановлено';
                debugText.style.color = '#888';
                return;
            } 
            
            // Формирование ссылки
            let trackInfo = CONFIG.tracks[currentTrack - 1];
            let url = CONFIG.baseUrl + (state.status === 'aim' ? trackInfo.aim : trackInfo.orig);

            // Меняем интерфейс
            if (state.status === 'aim') {
                mysteryMark.innerHTML = `<span class="ai-title">АИ</span><span class="ai-sub">музыка</span>`;
                mysteryBox.style.borderColor = 'rgba(212,175,55,1)';
                debugText.innerText = 'Играет АИ Загадка ▶';
                debugText.style.color = '#d4af37';
            } else {
                mysteryMark.innerHTML = `<span style="font-size: 5.5rem; font-weight: 900; color: #e0e0e0;">✓</span>`;
                mysteryBox.style.borderColor = 'rgba(224,224,224,1)';
                debugText.innerText = 'Играет Оригинал ▶';
                debugText.style.color = '#e0e0e0';
            }

            // Защита от лишних перезагрузок трека
            if (!audioEl.src.endsWith(url)) {
                audioEl.src = url;
                audioEl.load();
            }

            // Синхронизация времени
            let currentServerTime = (Date.now() / 1000) - serverTimeOffset;
            let playPosition = currentServerTime - state.start_time;

            if (playPosition > 0 && Math.abs(audioEl.currentTime - playPosition) > 1.5) {
                audioEl.currentTime = playPosition;
            }

            audioEl.play().catch(e => {
                debugText.innerText = 'Ошибка автоплея. Нажмите на пульт еще раз.';
                debugText.style.color = '#ff4444';
            });
        }

        // Эквалайзер 
        function startCircularEq() {
            const canvas = document.getElementById('equalizer-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            const bufferLength = analyser ? analyser.frequencyBinCount : 128;
            const dataArray = new Uint8Array(bufferLength);
            const activeBars = 80; const halfBars = activeBars / 2;
            const angleStep = (Math.PI * 2) / activeBars;

            function draw() {
                requestAnimationFrame(draw);
                if (analyser) analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let centerX = canvas.width / 2; let centerY = canvas.height / 2;
                let baseRadius = Math.min(canvas.width, canvas.height) * 0.22;

                for (let i = 0; i < activeBars; i++) {
                    let dataIndex = i < halfBars ? Math.floor(i * (bufferLength * 0.6) / halfBars) : Math.floor((activeBars - i - 1) * (bufferLength * 0.6) / halfBars);
                    let barHeight = (dataArray[dataIndex] || 0) * 0.65; 
                    if (barHeight < 3) barHeight = 3; 
                    
                    let angle = i * angleStep - (Math.PI / 2);
                    let x1 = centerX + Math.cos(angle) * baseRadius; let y1 = centerY + Math.sin(angle) * baseRadius;
                    let x2 = centerX + Math.cos(angle) * (baseRadius + barHeight); let y2 = centerY + Math.sin(angle) * (baseRadius + barHeight);

                    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
                    ctx.lineWidth = 5; ctx.lineCap = 'round';
                    ctx.strokeStyle = mysteryMark.innerHTML.includes('✓') ? `rgba(224, 224, 224, ${barHeight/255 + 0.3})` : `rgba(212, 175, 55, ${barHeight/255 + 0.3})`;
                    ctx.stroke();
                }
            }
            draw();
        }

        // Частицы
        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeP); resizeP();
        
        for (let i = 0; i < 70; i++) {
            particles.push({ 
                x: Math.random() * pCanvas.width, y: Math.random() * pCanvas.height, 
                size: Math.random() * 2.5 + 0.5, speedY: Math.random() * 1.5 + 0.5, speedX: (Math.random() - 0.5) * 0.5, 
                colorType: Math.random() > 0.5 ? 'gold' : 'silver'
            });
        }
        
        function drawP() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => {
                p.y -= p.speedY; p.x += p.speedX;
                if (p.y < 0) { p.y = pCanvas.height; p.x = Math.random() * pCanvas.width; }
                pCtx.fillStyle = p.colorType === 'gold' ? `rgba(212, 175, 55, ${Math.random() * 0.5 + 0.3})` : `rgba(220, 220, 220, ${Math.random() * 0.5 + 0.3})`;
                pCtx.beginPath(); pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2); pCtx.fill();
            });
            requestAnimationFrame(drawP);
        }
        drawP();
    </script>
</body>
</html>
