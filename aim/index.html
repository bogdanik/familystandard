<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Нейромузыка - Шоу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; background-color: #030303; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        /* Заглавный экран (Лобби) */
        #splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: #030303; transition: opacity 0.5s; }
        .splash-title { font-size: clamp(2.5rem, 8vw, 7rem); font-weight: 900; letter-spacing: clamp(4px, 2vw, 15px); text-transform: uppercase; color: #fff; text-shadow: 0 0 20px #00ffff; text-align: center; padding: 0 20px; }
        .click-hint { margin-top: 30px; font-size: clamp(1rem, 4vw, 1.5rem); color: #888; animation: pulse-text 2s infinite; text-align: center; }
        @keyframes pulse-text { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        /* Ввод пин-кода (поверх сплеш-экрана) */
        #pin-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; z-index: 20; }
        .pin-btn { width: 100%; height: 100%; cursor: pointer; }

        /* Главный экран трансляции */
        #viewer-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; z-index: 5; background: radial-gradient(circle at center, #111 0%, #000 100%); }
        
        /* Неоновый символ загадки */
        #mystery-box { display: flex; justify-content: center; align-items: center; height: 60vh; width: 100%; margin-top: -10vh; }
        #mystery-mark { font-size: clamp(8rem, 35vw, 25rem); font-weight: 900; color: #00ffff; text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; animation: breathe 2s ease-in-out infinite alternate; transition: color 0.5s, text-shadow 0.5s; }
        @keyframes breathe {
            from { transform: scale(0.95); text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
            to { transform: scale(1.05); text-shadow: 0 0 30px #00ffff, 0 0 60px #00ffff, 0 0 100px #00ffff; }
        }

        /* Эквалайзер */
        #eq-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 30vh; min-height: 150px; z-index: 4; display: flex; align-items: flex-end; }
        canvas#equalizer-canvas { width: 100%; height: 100%; }

        /* Заглушка для автоплея браузера */
        #unlock-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(8px); cursor: pointer; }
        .unlock-btn { padding: 20px 40px; font-size: clamp(1.2rem, 5vw, 2rem); background: transparent; color: #00ffff; border: 2px solid #00ffff; border-radius: 12px; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 20px rgba(0,255,255,0.4), inset 0 0 20px rgba(0,255,255,0.4); animation: pulse-text 1.5s infinite; }

        /* Панель Админа */
        #admin-panel { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.98); border-top: 2px solid #00ffff; z-index: 60; padding: 15px 15px calc(15px + env(safe-area-inset-bottom)); flex-direction: column; align-items: center; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .admin-header { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-bottom: 12px; color: #00ffff; font-weight: bold; font-size: clamp(0.9rem, 4vw, 1.1rem); }
        .debug-info { font-size: 0.85rem; color: #888; text-align: center; margin-bottom: 12px; height: 18px; width: 100%; }
        
        .admin-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; max-width: 600px; }
        .btn { flex: 1 1 calc(50% - 8px); padding: 15px 5px; font-size: clamp(0.85rem, 3.5vw, 1rem); cursor: pointer; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; transition: transform 0.1s; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        
        .btn-start { background: #00ffff; color: #000; flex-basis: 100%; margin-bottom: 5px; padding: 18px 10px; font-size: clamp(1rem, 4.5vw, 1.2rem); }
        .btn-play-aim { background: #2d00f7; color: #fff; }
        .btn-play-orig { background: #00a896; color: #fff; }
        .btn-stop { background: #d90429; color: #fff; }
        .btn-next { background: #444; color: #fff; }
        
        body.show-running #splash-screen { display: none; }
        body.show-running #pin-grid { display: none; }
        body.show-running #viewer-screen { display: flex; }
    </style>
</head>
<body>

    <!-- Лобби -->
    <div id="splash-screen">
        <h1 class="splash-title">Нейромузыка</h1>
        <div class="click-hint">Ожидание старта программы...</div>
    </div>

    <!-- Ввод пинкода (1-5-9) -->
    <div id="pin-grid">
        <div class="pin-btn" data-val="1"></div><div class="pin-btn" data-val="2"></div><div class="pin-btn" data-val="3"></div>
        <div class="pin-btn" data-val="4"></div><div class="pin-btn" data-val="5"></div><div class="pin-btn" data-val="6"></div>
        <div class="pin-btn" data-val="7"></div><div class="pin-btn" data-val="8"></div><div class="pin-btn" data-val="9"></div>
    </div>

    <!-- Разблокировка звука (для тех, кто зашел с опозданием и браузер заблокировал звук) -->
    <div id="unlock-overlay" onclick="forceUnlockAudio()">
        <button class="unlock-btn">Включить звук</button>
    </div>

    <!-- Основной экран -->
    <div id="viewer-screen">
        <div id="mystery-box">
            <div id="mystery-mark">?</div>
        </div>
        <div id="eq-container">
            <canvas id="equalizer-canvas"></canvas>
        </div>
    </div>

    <!-- Пульт -->
    <div id="admin-panel">
        <div class="admin-header">
            <span>Управление</span>
            <span id="status-track">Трек: 1 / 12</span>
        </div>
        <div class="debug-info" id="debug-text">Режим админа: Звук приглушен</div>
        
        <div class="admin-controls">
            <button class="btn btn-start" id="btn-start" onclick="sendCommand('start')">🚀 Старт программы</button>
            <button class="btn btn-play-aim" onclick="sendCommand('play_aim')">▶ Загадка</button>
            <button class="btn btn-play-orig" onclick="sendCommand('play_orig')">▶ Оригинал</button>
            <button class="btn btn-stop" onclick="sendCommand('stop')">⏹ Стоп</button>
            <button class="btn btn-next" onclick="sendCommand('next')">⏭ След. трек</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const CONFIG = {
            baseUrl: 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/',
            tracks: [
                { id: 1, aim: 'aim1.mp3', orig: 'm1.mp3' },
                { id: 2, aim: 'aim2.mp3', orig: 'm2.mp3' },
                { id: 3, aim: 'aim3.mp3', orig: 'm3.mp3' },
                { id: 4, aim: 'aim4.mp3', orig: 'm4.mp3' },
                { id: 5, aim: 'aim5.mp3', orig: 'm5.mp3' },
                { id: 6, aim: 'aim6.mp3', orig: 'm6.mp3' },
                { id: 7, aim: 'aim7.mp3', orig: 'm7.mp3' },
                { id: 8, aim: 'aim8.mp3', orig: 'm8.mp3' },
                { id: 9, aim: 'aim9.mp3', orig: 'm9.mp3' },
                { id: 10, aim: 'aim10.mp3', orig: 'm10.mp3' },
                { id: 11, aim: 'aim11.mp3', orig: 'm11.mp3' },
                { id: 12, aim: 'aim12.mp3', orig: 'm12.mp3' }
            ]
        };

        const socket = io();
        const audioEl = document.getElementById('audio-player');
        const mysteryMark = document.getElementById('mystery-mark');
        const debugText = document.getElementById('debug-text');
        
        let isAdmin = false;
        let currentTrack = 1;
        let timeOffset = 0; // Разница между временем сервера и клиента
        let isAudioContextInit = false;

        let audioCtx, analyser;

        // Инициализация звукового контекста
        function initAudio() {
            if (isAudioContextInit) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtx();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;

                let source = audioCtx.createMediaElementSource(audioEl);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                isAudioContextInit = true;
                startEq();
            } catch (e) { console.error(e); }
        }

        // Любой клик по экрану разрешает работу со звуком
        window.addEventListener('click', () => {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }, { once: true });

        // --- ЛОГИКА АДМИНА ---
        let pinSequence = [];
        document.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); checkPin(e.target.dataset.val); });
            btn.addEventListener('click', (e) => { checkPin(e.target.dataset.val); });
        });

        function checkPin(val) {
            initAudio(); // Поднимаем контекст
            pinSequence.push(val);
            if (pinSequence.length > 3) pinSequence.shift();

            if (JSON.stringify(pinSequence) === JSON.stringify(['1', '5', '9'])) {
                isAdmin = true;
                audioEl.muted = true; // Глушим звук для админа навсегда
                document.getElementById('admin-panel').style.display = 'flex';
                document.getElementById('pin-grid').style.display = 'none';
            }
        }

        // Отправка команды
        function sendCommand(action) {
            if (action === 'next' && currentTrack < CONFIG.tracks.length) {
                currentTrack++;
            }
            socket.emit('command', { action: action, track: currentTrack });
        }

        // --- ПРИЕМ СИНХРОНИЗАЦИИ ---
        socket.on('sync', (data) => {
            // Вычисляем задержку часов
            timeOffset = (Date.now() / 1000) - data.server_time;
            applyState(data.state, true);
        });

        socket.on('update', (data) => {
            timeOffset = (Date.now() / 1000) - data.server_time;
            applyState(data.state, false);
        });

        function applyState(state, isInitialSync) {
            currentTrack = state.track;
            document.getElementById('status-track').innerText = `Трек: ${currentTrack} / 12`;

            if (state.is_started) {
                document.body.classList.add('show-running');
                document.getElementById('btn-start').style.display = 'none';
            }

            if (state.status === 'stop') {
                audioEl.pause();
                mysteryMark.innerText = '?';
                mysteryMark.style.color = '#00ffff';
                mysteryMark.style.textShadow = '0 0 20px #00ffff, 0 0 40px #00ffff';
                if(isAdmin) debugText.innerText = 'Остановлено';
            } 
            else {
                // Если играет aim или orig
                let url = '';
                if (state.status === 'aim') {
                    url = CONFIG.baseUrl + CONFIG.tracks[currentTrack - 1].aim;
                    mysteryMark.innerText = '?';
                    mysteryMark.style.color = '#00ffff';
                    mysteryMark.style.textShadow = '0 0 20px #00ffff, 0 0 40px #00ffff';
                } else {
                    url = CONFIG.baseUrl + CONFIG.tracks[currentTrack - 1].orig;
                    mysteryMark.innerText = '✓';
                    mysteryMark.style.color = '#00ff00';
                    mysteryMark.style.textShadow = '0 0 20px #00ff00, 0 0 40px #00ff00';
                }

                if (audioEl.src !== url) audioEl.src = url;

                // Вычисляем, на какой секунде должен играть трек прямо сейчас
                let currentServerTime = (Date.now() / 1000) - timeOffset;
                let playPosition = currentServerTime - state.start_time;

                if (playPosition > 0) {
                    audioEl.currentTime = playPosition;
                }

                // Пытаемся запустить
                let playPromise = audioEl.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        document.getElementById('unlock-overlay').style.display = 'none';
                        if(isAdmin) debugText.innerText = 'Трек играет (без звука)';
                    }).catch(error => {
                        // Если браузер заблокировал (пользователь не кликал по странице)
                        if (!isAdmin && isInitialSync) {
                            document.getElementById('unlock-overlay').style.display = 'flex';
                        }
                    });
                }
            }
        }

        // Кнопка принудительной разблокировки (для зрителей)
        function forceUnlockAudio() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            audioEl.play();
            document.getElementById('unlock-overlay').style.display = 'none';
        }

        // --- ЭКВАЛАЙЗЕР ---
        function startEq() {
            const canvas = document.getElementById('equalizer-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    let barHeight = dataArray[i]; 
                    
                    // Цвет зависит от статуса символа (Голубой или Зеленый)
                    if (mysteryMark.innerText === '✓') {
                        ctx.fillStyle = `rgb(0, ${Math.min(255, barHeight + 50)}, 0)`;
                    } else {
                        ctx.fillStyle = `rgb(0, ${Math.min(255, barHeight + 50)}, 255)`;
                    }
                    
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            draw();
        }
    </script>
</body>
</html>
