<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Музыка - Винил</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background: #050505; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        
        /* 1. ЭКРАН-ВРАТАРЬ (РАЗБЛОКИРОВКА ЗВУКА) */
        #gatekeeper { position: fixed; inset: 0; z-index: 10000; background: #000; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .gate-btn { color: #d4af37; font-size: 1.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 4px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; text-shadow: 0 0 20px #d4af37; } }

        /* 2. ФОНОВЫЕ СВЯЗАННЫЕ ЧАСТИЦЫ */
        canvas#network-bg { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

        /* 3. ОСНОВНОЙ ЭКРАН И ЭКВАЛАЙЗЕР */
        #main-stage { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 5; padding-bottom: 80px; }
        canvas#eq-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }

        /* 4. ВИНИЛОВАЯ ПЛАСТИНКА */
        .vinyl-record { 
            position: relative; z-index: 10; width: 220px; height: 220px; border-radius: 50%;
            /* Текстура винила */
            background: repeating-radial-gradient( #111, #111 4px, #1a1a1a 5px, #1a1a1a 6px );
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,1);
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #000;
            animation: spin 3s linear infinite;
            animation-play-state: paused; /* Изначально стоит */
        }
        .vinyl-record.playing { animation-play-state: running; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Центр винила (Яблоко) */
        .vinyl-label {
            width: 75px; height: 75px; border-radius: 50%;
            background: linear-gradient(135deg, #d4af37, #b8860b);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.5rem; font-weight: 900; color: #000;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            position: relative;
        }
        /* Дырка по центру */
        .vinyl-label::after {
            content: ''; position: absolute; width: 12px; height: 12px;
            background: #050505; border-radius: 50%;
        }
        .label-text { position: absolute; z-index: 2; font-size: 1.6rem; letter-spacing: 1px; }

        /* 5. МИНИМАЛИСТИЧНЫЕ КНОПКИ УПРАВЛЕНИЯ */
        #controls { position: fixed; bottom: 20px; left: 0; width: 100%; z-index: 50; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        
        .tracks-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; max-width: 400px; padding: 0 10px; }
        .track-btn { 
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid rgba(212, 175, 55, 0.3);
            background: rgba(0,0,0,0.6); color: #aaa; font-weight: bold; font-size: 1.1rem;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s;
        }
        .track-btn.active { background: #d4af37; color: #000; border-color: #fff; box-shadow: 0 0 15px rgba(212, 175, 55, 0.8); transform: scale(1.1); }

        .action-row { display: flex; gap: 10px; }
        .action-btn { 
            padding: 12px 20px; border-radius: 12px; border: none; font-weight: bold; 
            font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
            background: rgba(20, 20, 20, 0.7); color: #fff; border: 1px solid rgba(255,255,255,0.1);
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-aim { color: #d4af37; border-color: rgba(212, 175, 55, 0.4); }
        .btn-stop { color: #ff4444; }
    </style>
</head>
<body>

    <!-- Вратарь для легальной разблокировки аудио -->
    <div id="gatekeeper" onclick="startSystem()">
        <div class="gate-btn">Нажмите для старта шоу</div>
    </div>

    <canvas id="network-bg"></canvas>

    <div id="main-stage">
        <canvas id="eq-canvas"></canvas>
        <div class="vinyl-record" id="vinyl">
            <div class="vinyl-label">
                <span class="label-text" id="vinyl-text">АИ</span>
            </div>
        </div>
    </div>

    <!-- Чистый невидимый пульт -->
    <div id="controls">
        <div class="tracks-grid" id="tracks-grid"></div>
        <div class="action-row">
            <button class="action-btn btn-aim" onclick="sendCommand('play_aim')">▶ АИ Загадка</button>
            <button class="action-btn" onclick="sendCommand('play_orig')">▶ Оригинал</button>
            <button class="action-btn btn-stop" onclick="sendCommand('stop')">⏹ Стоп</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const CONFIG = {
            baseUrl: 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/',
            tracks: Array.from({length: 12}, (_, i) => ({ aim: `AIM${i + 1}.mp3`, orig: `M${i + 1}.mp3` }))
        };

        const socket = io();
        const audioEl = document.getElementById('audio-player');
        const vinyl = document.getElementById('vinyl');
        const vinylText = document.getElementById('vinyl-text');
        
        let currentTrack = 1;
        let timeOffset = 0;
        let audioCtx, analyser, isInit = false;
        let eqHeights = Array(80).fill(2); // Массив для плавности эквалайзера

        // 1. СТАРТ СИСТЕМЫ (Снятие всех блокировок браузера)
        function startSystem() {
            document.getElementById('gatekeeper').style.display = 'none';
            audioEl.load();
            audioEl.play().catch(()=>{});
            audioEl.pause();
            
            if (!isInit) {
                const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtxClass();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; 
                let source = audioCtx.createMediaElementSource(audioEl);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                isInit = true;
                startEq();
            }
        }

        // 2. ГЕНЕРАЦИЯ КНОПОК
        const grid = document.getElementById('tracks-grid');
        for (let i = 1; i <= 12; i++) {
            let btn = document.createElement('div');
            btn.className = `track-btn ${i === 1 ? 'active' : ''}`;
            btn.innerText = i;
            btn.onclick = () => { currentTrack = i; sendCommand('set_track'); };
            grid.appendChild(btn);
        }

        function updateUI() {
            document.querySelectorAll('.track-btn').forEach((b, idx) => {
                b.classList.toggle('active', idx + 1 === currentTrack);
            });
        }

        // 3. ОТПРАВКА И ПРИЕМ КОМАНД
        function sendCommand(action) {
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            socket.emit('command', { action: action, track: currentTrack });
        }

        socket.on('sync', data => {
            timeOffset = (Date.now() / 1000) - data.server_time;
            currentTrack = data.state.track;
            updateUI();

            if (data.state.status === 'stop') {
                audioEl.pause();
                vinyl.classList.remove('playing');
                vinylText.innerText = 'АИ';
                vinylText.style.color = '#000';
            } else {
                let url = CONFIG.baseUrl + (data.state.status === 'aim' ? CONFIG.tracks[currentTrack-1].aim : CONFIG.tracks[currentTrack-1].orig);
                
                vinylText.innerText = data.state.status === 'aim' ? 'АИ' : '✓';
                vinylText.style.color = data.state.status === 'aim' ? '#000' : '#fff';

                if (!audioEl.src.endsWith(url)) { audioEl.src = url; audioEl.load(); }

                let playPos = ((Date.now() / 1000) - timeOffset) - data.state.start_time;
                if (playPos > 0 && Math.abs(audioEl.currentTime - playPos) > 1.5) audioEl.currentTime = playPos;
                
                audioEl.play().then(() => vinyl.classList.add('playing')).catch(e => console.log("Ждем клика", e));
            }
        });

        // 4. КРУГОВОЙ ЭКВАЛАЙЗЕР С ПЛАВНОСТЬЮ (Вокруг винила)
        function startEq() {
            const canvas = document.getElementById('eq-canvas');
            const ctx = canvas.getContext('2d');
            function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            window.addEventListener('resize', resize); resize();

            const dataArray = new Uint8Array(analyser.frequencyBinCount);
            const bars = 80;
            const angleStep = (Math.PI * 2) / bars;

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let cx = canvas.width / 2;
                let cy = canvas.height / 2 - 40; // Смещение из-за нижнего меню
                let baseRadius = 120; // Чуть больше пластинки

                for (let i = 0; i < bars; i++) {
                    // Берем частоты плавно из массива
                    let dataIndex = Math.floor(i * (dataArray.length * 0.5) / bars);
                    let targetH = dataArray[dataIndex] * 0.6;
                    
                    // Формула плавности как в Event OS
                    eqHeights[i] += (targetH - eqHeights[i]) * 0.2;
                    let h = Math.max(eqHeights[i], 3);

                    let angle = i * angleStep - (Math.PI / 2);
                    let x1 = cx + Math.cos(angle) * baseRadius;
                    let y1 = cy + Math.sin(angle) * baseRadius;
                    let x2 = cx + Math.cos(angle) * (baseRadius + h);
                    let y2 = cy + Math.sin(angle) * (baseRadius + h);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineWidth = 4;
                    ctx.lineCap = 'round';
                    // Золотой свет
                    ctx.strokeStyle = `rgba(212, 175, 55, ${h/100 + 0.2})`;
                    ctx.stroke();
                }
            }
            draw();
        }

        // 5. ФОН: ЧАСТИЦЫ СО СВЯЗЯМИ (Constellation effect)
        const netCanvas = document.getElementById('network-bg');
        const netCtx = netCanvas.getContext('2d');
        let dots = [];
        
        function resizeNet() { netCanvas.width = window.innerWidth; netCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeNet); resizeNet();

        for(let i=0; i<60; i++) {
            dots.push({
                x: Math.random() * netCanvas.width, y: Math.random() * netCanvas.height,
                vx: (Math.random() - 0.5) * 1.5, vy: (Math.random() - 0.5) * 1.5, radius: Math.random() * 2 + 1
            });
        }

        function drawNetwork() {
            netCtx.clearRect(0, 0, netCanvas.width, netCanvas.height);
            
            for(let i=0; i<dots.length; i++) {
                let p = dots[i];
                p.x += p.vx; p.y += p.vy;
                
                if (p.x < 0 || p.x > netCanvas.width) p.vx *= -1;
                if (p.y < 0 || p.y > netCanvas.height) p.vy *= -1;

                netCtx.beginPath();
                netCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                netCtx.fillStyle = 'rgba(212, 175, 55, 0.6)';
                netCtx.fill();

                // Проверка связей с другими точками
                for(let j=i+1; j<dots.length; j++) {
                    let p2 = dots[j];
                    let dist = Math.sqrt((p.x - p2.x)**2 + (p.y - p2.y)**2);
                    if (dist < 130) {
                        netCtx.beginPath();
                        netCtx.moveTo(p.x, p.y);
                        netCtx.lineTo(p2.x, p2.y);
                        netCtx.strokeStyle = `rgba(212, 175, 55, ${1 - dist/130})`;
                        netCtx.lineWidth = 1;
                        netCtx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawNetwork);
        }
        drawNetwork();
    </script>
</body>
</html>
