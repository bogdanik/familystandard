<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Оптимизация под мобильные устройства: запрет зума при быстрых кликах -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Нейромузыка - Шоу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; background-color: #050505; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        #splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: #050505; transition: opacity 0.5s; }
        /* Адаптивный текст для сплеш-скрина */
        .splash-title { font-size: clamp(2.5rem, 8vw, 6rem); font-weight: 900; letter-spacing: clamp(4px, 2vw, 10px); text-transform: uppercase; color: #fff; text-shadow: 0 0 15px #00ffff; text-align: center; padding: 0 20px; }
        .click-hint { margin-top: 20px; font-size: clamp(1rem, 4vw, 1.2rem); color: #888; animation: pulse 1.5s infinite; text-align: center; padding: 0 15px; }
        @keyframes pulse { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        #viewer-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; z-index: 5; }
        
        /* Адаптивный винил */
        .record-container { position: relative; width: min(85vw, 380px); height: min(85vw, 380px); margin-top: -15vh; z-index: 6; }
        .record { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle, #1a1a1a 20%, #000 80%); border: 4px solid #333; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 40px rgba(0, 255, 255, 0.15); transition: transform 0.2s; }
        .record::before { content: ''; position: absolute; width: 95%; height: 95%; border-radius: 50%; border: 1px solid #222; }
        .record::after { content: ''; position: absolute; width: 85%; height: 85%; border-radius: 50%; border: 1px solid #111; }
        .record.spin { animation: spinning 3s linear infinite; }
        .record h2 { position: relative; z-index: 2; font-size: clamp(2rem, 10vw, 4rem); margin: 0; color: #fff; background: #111; width: 35%; height: 35%; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: 2px solid #00ffff; box-shadow: inset 0 0 15px rgba(0,255,255,0.5); }
        @keyframes spinning { 100% { transform: rotate(360deg); } }
        
        /* Адаптивный эквалайзер */
        #eq-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 25vh; min-height: 150px; z-index: 4; display: flex; align-items: flex-end; }
        canvas#equalizer-canvas { width: 100%; height: 100%; }

        #pin-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; z-index: 20; }
        .pin-btn { width: 100%; height: 100%; cursor: pointer; }

        /* Оптимизированная мобильная панель админа */
        #admin-panel { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(17, 17, 17, 0.95); border-top: 2px solid #00ffff; z-index: 30; padding: 15px 15px calc(15px + env(safe-area-inset-bottom)); flex-direction: column; align-items: center; box-shadow: 0 -10px 30px rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .admin-header { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-bottom: 12px; color: #00ffff; font-weight: bold; font-size: clamp(0.9rem, 4vw, 1.1rem); }
        .debug-info { font-size: 0.85rem; color: #aaa; text-align: center; margin-bottom: 12px; height: 18px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .admin-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; max-width: 600px; }
        .btn { flex: 1 1 calc(50% - 8px); padding: 14px 5px; font-size: clamp(0.85rem, 3.5vw, 1rem); cursor: pointer; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; transition: 0.1s; display: flex; justify-content: center; align-items: center; gap: 5px; white-space: nowrap; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        
        .btn-start { background: #00ffff; color: #000; flex-basis: 100%; margin-bottom: 5px; padding: 18px 10px; font-size: clamp(1rem, 4.5vw, 1.2rem); }
        .btn-play-aim { background: #2d00f7; color: #fff; }
        .btn-play-orig { background: #00a896; color: #fff; }
        .btn-stop { background: #d90429; color: #fff; }
        .btn-next { background: #444; color: #fff; }
        
        body.show-running #splash-screen { display: none; }
        body.show-running #pin-grid { display: none; }
        body.show-running #viewer-screen { display: flex; }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div id="splash-screen">
        <h1 class="splash-title">Нейромузыка</h1>
        <div class="click-hint">Коснитесь экрана перед вводом пароля</div>
    </div>

    <div id="pin-grid">
        <div class="pin-btn" data-val="1"></div><div class="pin-btn" data-val="2"></div><div class="pin-btn" data-val="3"></div>
        <div class="pin-btn" data-val="4"></div><div class="pin-btn" data-val="5"></div><div class="pin-btn" data-val="6"></div>
        <div class="pin-btn" data-val="7"></div><div class="pin-btn" data-val="8"></div><div class="pin-btn" data-val="9"></div>
    </div>

    <div id="viewer-screen">
        <div class="record-container">
            <div class="record" id="vinyl-disk">
                <h2 id="disk-label">Т-1</h2>
            </div>
        </div>
        <div id="eq-container">
            <canvas id="equalizer-canvas"></canvas>
        </div>
    </div>

    <div id="admin-panel">
        <div class="admin-header">
            <span>Управление Шоу</span>
            <span id="status-track">Трек: 1 / 12</span>
        </div>
        <div class="debug-info" id="debug-text">Готов к работе</div>
        
        <div class="admin-controls">
            <button class="btn btn-start" id="btn-start" onclick="emitAndExecute('start_show')">🚀 Старт программы</button>
            <button class="btn btn-play-aim" onclick="emitAndExecute('play_aim')">▶ Нейро</button>
            <button class="btn btn-play-orig" onclick="emitAndExecute('play_orig')">▶ Оригинал</button>
            <button class="btn btn-stop" onclick="emitAndExecute('stop_audio')">⏹ Стоп</button>
            <button class="btn btn-next" onclick="emitAndExecute('next_track')">⏭ След. трек</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        // ==========================================
        // РАБОЧАЯ ССЫЛКА НА CLOUDFLARE R2
        // ==========================================
        const CONFIG = {
            baseUrl: 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/',
            tracks: [
                { id: 1, aim: 'aim1.mp3', orig: 'm1.mp3' },
                { id: 2, aim: 'aim2.mp3', orig: 'm2.mp3' },
                { id: 3, aim: 'aim3.mp3', orig: 'm3.mp3' },
                { id: 4, aim: 'aim4.mp3', orig: 'm4.mp3' },
                { id: 5, aim: 'aim5.mp3', orig: 'm5.mp3' },
                { id: 6, aim: 'aim6.mp3', orig: 'm6.mp3' },
                { id: 7, aim: 'aim7.mp3', orig: 'm7.mp3' },
                { id: 8, aim: 'aim8.mp3', orig: 'm8.mp3' },
                { id: 9, aim: 'aim9.mp3', orig: 'm9.mp3' },
                { id: 10, aim: 'aim10.mp3', orig: 'm10.mp3' },
                { id: 11, aim: 'aim11.mp3', orig: 'm11.mp3' },
                { id: 12, aim: 'aim12.mp3', orig: 'm12.mp3' }
            ]
        };

        const socket = io();
        let currentTrack = 1; 

        const audioEl = document.getElementById('audio-player');
        const vinylEl = document.getElementById('vinyl-disk');
        const diskLabel = document.getElementById('disk-label');
        const debugText = document.getElementById('debug-text');
        const statusTrack = document.getElementById('status-track');

        audioEl.addEventListener('playing', () => { debugText.style.color = '#0f0'; debugText.innerText = 'Аудио играет ✓'; });
        audioEl.addEventListener('waiting', () => { debugText.style.color = '#ffaa00'; debugText.innerText = 'Буферизация (Загрузка)...'; });
        audioEl.addEventListener('error', () => { debugText.style.color = '#f00'; debugText.innerText = 'ОШИБКА ФАЙЛА (Проверьте наличие на сервере)'; });

        let audioCtx = null;
        let analyser = null;
        let sourceNode = null;

        function safeInitAudio() {
            try {
                if (!audioCtx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioCtx();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 128;

                    sourceNode = audioCtx.createMediaElementSource(audioEl);
                    sourceNode.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    
                    startEqualizer();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (err) {
                console.error("Ошибка Audio API:", err);
            }
        }

        window.addEventListener('click', safeInitAudio, { once: true });
        window.addEventListener('touchstart', safeInitAudio, { once: true });

        let pinHistory = [];
        document.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); handlePin(e.target.dataset.val); });
            btn.addEventListener('click', (e) => { handlePin(e.target.dataset.val); });
        });

        function handlePin(val) {
            safeInitAudio();
            pinHistory.push(val);
            if (pinHistory.length > 3) pinHistory.shift();

            if (JSON.stringify(pinHistory) === JSON.stringify(['1', '5', '9'])) {
                document.getElementById('admin-panel').style.display = 'flex';
                document.getElementById('pin-grid').style.display = 'none';
            }
        }

        function emitAndExecute(action) {
            safeInitAudio();
            executeCommand(action, currentTrack);
            socket.emit('admin_command', { action: action, trackNum: currentTrack });
        }

        socket.on('viewer_action', (data) => {
            safeInitAudio();
            executeCommand(data.action, data.trackNum);
        });

        function executeCommand(action, trackNum) {
            if (action === 'start_show') {
                document.body.classList.add('show-running');
                document.getElementById('btn-start').style.display = 'none'; 
            } 
            else if (action === 'next_track') {
                if (currentTrack < CONFIG.tracks.length) {
                    currentTrack++;
                }
                statusTrack.innerText = `Трек: ${currentTrack} / 12`;
                diskLabel.innerText = `Т-${currentTrack}`;
                diskLabel.style.color = '#fff';
                diskLabel.style.borderColor = '#00ffff';
                vinylEl.classList.remove('spin');
                audioEl.pause();
                debugText.innerText = 'Трек переключен. Нажмите Play.';
                debugText.style.color = '#aaa';
            } 
            else if (action === 'play_aim') {
                vinylEl.classList.add('spin');
                diskLabel.innerText = '?';
                diskLabel.style.color = '#00ffff';
                diskLabel.style.borderColor = '#00ffff';
                
                let trackInfo = CONFIG.tracks[currentTrack - 1];
                let url = CONFIG.baseUrl + trackInfo.aim;
                
                debugText.innerText = 'Запрос: ' + trackInfo.aim;
                if (audioEl.src !== url) audioEl.src = url;
                audioEl.play().catch(e => { debugText.innerText = 'Браузер блокирует звук!'; });
            } 
            else if (action === 'play_orig') {
                vinylEl.classList.add('spin');
                diskLabel.innerText = '✓';
                diskLabel.style.color = '#00ff00';
                diskLabel.style.borderColor = '#00ff00';
                
                let trackInfo = CONFIG.tracks[currentTrack - 1];
                let url = CONFIG.baseUrl + trackInfo.orig;
                
                debugText.innerText = 'Запрос: ' + trackInfo.orig;
                if (audioEl.src !== url) audioEl.src = url;
                audioEl.play().catch(e => { debugText.innerText = 'Браузер блокирует звук!'; });
            } 
            else if (action === 'stop_audio') {
                vinylEl.classList.remove('spin');
                audioEl.pause();
                debugText.innerText = 'Остановлено';
                debugText.style.color = '#aaa';
            }
        }

        function startEqualizer() {
            const eqCanvas = document.getElementById('equalizer-canvas');
            const eqCtx = eqCanvas.getContext('2d');
            
            function resizeEq() {
                eqCanvas.width = eqCanvas.offsetWidth;
                eqCanvas.height = eqCanvas.offsetHeight;
            }
            window.addEventListener('resize', resizeEq);
            resizeEq();

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function drawEq() {
                requestAnimationFrame(drawEq);
                analyser.getByteFrequencyData(dataArray);

                eqCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
                const barWidth = (eqCanvas.width / bufferLength) * 2.5;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    let barHeight = dataArray[i]; 
                    eqCtx.fillStyle = `rgb(0, ${Math.min(255, barHeight + 50)}, 255)`;
                    eqCtx.fillRect(x, eqCanvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            drawEq();
        }

        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];

        function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeP);
        resizeP();

        for (let i = 0; i < 70; i++) {
            particles.push({ x: Math.random() * pCanvas.width, y: Math.random() * pCanvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 0.5 + 0.2, op: Math.random() * 0.5 + 0.1 });
        }
        function drawP() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => {
                p.y -= p.speed;
                if (p.y < 0) p.y = pCanvas.height;
                pCtx.fillStyle = `rgba(0, 255, 255, ${p.op})`;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                pCtx.fill();
            });
            requestAnimationFrame(drawP);
        }
        drawP();
    </script>
</body>
</html>
