<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Нейромузыка - Шоу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; background-color: #050505; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* Заглавный экран */
        #splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: #050505; transition: opacity 0.5s; }
        .splash-title { font-size: clamp(2.5rem, 8vw, 6rem); font-weight: 900; letter-spacing: clamp(4px, 2vw, 10px); text-transform: uppercase; color: #fff; text-shadow: 0 0 15px #00ffff; text-align: center; }
        
        /* Кнопка синхронизации звука для новых зрителей (опоздавших) */
        #sync-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 50; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(5px); cursor: pointer; }
        .sync-btn { padding: 20px 40px; font-size: 1.5rem; background: #00ffff; color: #000; border-radius: 12px; font-weight: bold; border: none; text-transform: uppercase; box-shadow: 0 0 30px rgba(0,255,255,0.4); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Основной экран с вектором */
        #viewer-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; z-index: 5; }
        
        /* ВЕКТОРНАЯ ПЛАСТИНКА */
        .vector-disk-container { width: min(85vw, 400px); height: min(85vw, 400px); margin-top: -15vh; z-index: 6; filter: drop-shadow(0 0 20px rgba(0,255,255,0.2)); }
        .vector-disk { width: 100%; height: 100%; transition: transform 0.2s; }
        .vector-disk.spin { animation: spinning 3s linear infinite; }
        @keyframes spinning { 100% { transform: rotate(360deg); } }
        
        /* Эквалайзер */
        #eq-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 25vh; min-height: 150px; z-index: 4; }
        canvas#equalizer-canvas { width: 100%; height: 100%; }

        /* Ввод пин-кода (1 - 5 - 9) */
        #pin-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; z-index: 20; }
        .pin-btn { width: 100%; height: 100%; cursor: pointer; }

        /* ПАНЕЛЬ АДМИНА */
        #admin-panel { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(10, 10, 10, 0.95); border-top: 2px solid #00ffff; z-index: 60; padding: 15px 15px calc(15px + env(safe-area-inset-bottom)); flex-direction: column; align-items: center; box-shadow: 0 -10px 30px rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
        .admin-header { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-bottom: 12px; color: #00ffff; font-weight: bold; font-size: 1.1rem; }
        .debug-info { font-size: 0.9rem; color: #0f0; text-align: center; margin-bottom: 12px; height: 18px; width: 100%; }
        
        .admin-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; width: 100%; max-width: 600px; }
        .btn { flex: 1 1 calc(50% - 8px); padding: 15px 5px; font-size: 1rem; cursor: pointer; border: none; border-radius: 8px; font-weight: bold; text-transform: uppercase; display: flex; justify-content: center; align-items: center; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }
        
        .btn-start { background: #00ffff; color: #000; flex-basis: 100%; margin-bottom: 5px; padding: 18px 10px; font-size: 1.2rem; }
        .btn-play-aim { background: #2d00f7; color: #fff; }
        .btn-play-orig { background: #00a896; color: #fff; }
        .btn-stop { background: #d90429; color: #fff; }
        .btn-next { background: #444; color: #fff; }
        
        body.show-running #splash-screen { display: none; }
        body.show-running #pin-grid { display: none; }
        body.show-running #viewer-screen { display: flex; }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div id="splash-screen">
        <h1 class="splash-title">Нейромузыка</h1>
    </div>

    <!-- Защитный экран для тех, кто зашел позже старта -->
    <div id="sync-overlay" onclick="syncLateJoiner()">
        <button class="sync-btn">🎶 Войти в трансляцию</button>
    </div>

    <div id="pin-grid">
        <div class="pin-btn" data-val="1"></div><div class="pin-btn" data-val="2"></div><div class="pin-btn" data-val="3"></div>
        <div class="pin-btn" data-val="4"></div><div class="pin-btn" data-val="5"></div><div class="pin-btn" data-val="6"></div>
        <div class="pin-btn" data-val="7"></div><div class="pin-btn" data-val="8"></div><div class="pin-btn" data-val="9"></div>
    </div>

    <div id="viewer-screen">
        <div class="vector-disk-container">
            <!-- Чистый Векторный Диск -->
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="vector-disk" id="vinyl-disk">
                <circle cx="100" cy="100" r="98" fill="#111" stroke="#333" stroke-width="2"/>
                <circle cx="100" cy="100" r="88" fill="none" stroke="#222" stroke-width="1"/>
                <circle cx="100" cy="100" r="78" fill="none" stroke="#2a2a2a" stroke-width="1"/>
                <circle cx="100" cy="100" r="68" fill="none" stroke="#222" stroke-width="1"/>
                <circle cx="100" cy="100" r="58" fill="none" stroke="#2a2a2a" stroke-width="1"/>
                <circle cx="100" cy="100" r="48" fill="none" stroke="#222" stroke-width="1"/>
                
                <!-- Яблоко (Этикетка) -->
                <circle cx="100" cy="100" r="35" fill="#00ffff" id="disk-label-bg"/>
                <circle cx="100" cy="100" r="35" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="4,4"/>
                <circle cx="100" cy="100" r="5" fill="#050505"/>
                
                <text x="100" y="112" font-size="34" font-family="Arial, sans-serif" font-weight="900" fill="#000" text-anchor="middle" id="disk-label">?</text>
            </svg>
        </div>
        <div id="eq-container">
            <canvas id="equalizer-canvas"></canvas>
        </div>
    </div>

    <!-- Пульт админа -->
    <div id="admin-panel">
        <div class="admin-header">
            <span>Управление Шоу</span>
            <span id="status-track">Трек: 1 / 12</span>
        </div>
        <div class="debug-info" id="debug-text">Синхронизировано</div>
        
        <div class="admin-controls">
            <button class="btn btn-start" id="btn-start" onclick="emitAndExecute('start_show')">🚀 Старт программы</button>
            <button class="btn btn-play-aim" onclick="emitAndExecute('play_aim')">▶ Нейро</button>
            <button class="btn btn-play-orig" onclick="emitAndExecute('play_orig')">▶ Оригинал</button>
            <button class="btn btn-stop" onclick="emitAndExecute('stop_audio')">⏹ Стоп</button>
            <button class="btn btn-next" onclick="emitAndExecute('next_track')">⏭ След. трек</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const CONFIG = {
            baseUrl: 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/',
            tracks: [
                { id: 1, aim: 'aim1.mp3', orig: 'm1.mp3' },
                { id: 2, aim: 'aim2.mp3', orig: 'm2.mp3' },
                { id: 3, aim: 'aim3.mp3', orig: 'm3.mp3' },
                { id: 4, aim: 'aim4.mp3', orig: 'm4.mp3' },
                { id: 5, aim: 'aim5.mp3', orig: 'm5.mp3' },
                { id: 6, aim: 'aim6.mp3', orig: 'm6.mp3' },
                { id: 7, aim: 'aim7.mp3', orig: 'm7.mp3' },
                { id: 8, aim: 'aim8.mp3', orig: 'm8.mp3' },
                { id: 9, aim: 'aim9.mp3', orig: 'm9.mp3' },
                { id: 10, aim: 'aim10.mp3', orig: 'm10.mp3' },
                { id: 11, aim: 'aim11.mp3', orig: 'm11.mp3' },
                { id: 12, aim: 'aim12.mp3', orig: 'm12.mp3' }
            ]
        };

        const socket = io();
        let currentTrack = 1; 
        let isAdmin = false;

        const audioEl = document.getElementById('audio-player');
        const vinylEl = document.getElementById('vinyl-disk');
        const diskLabel = document.getElementById('disk-label');
        const diskLabelBg = document.getElementById('disk-label-bg');
        const debugText = document.getElementById('debug-text');
        const statusTrack = document.getElementById('status-track');

        let audioCtx = null;
        let analyser = null;

        // Инициализация звука
        function safeInitAudio() {
            if (isAdmin) return; // Админ физически отключен от воспроизведения
            try {
                if (!audioCtx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioCtx();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 128;

                    let sourceNode = audioCtx.createMediaElementSource(audioEl);
                    sourceNode.connect(analyser);
                    analyser.connect(audioCtx.destination);
                    startEqualizer();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch (err) { console.error(err); }
        }

        window.addEventListener('click', safeInitAudio, { once: true });

        // --- ЛОГИКА ПИН-КОДА (АДМИН) ---
        let pinHistory = [];
        document.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); handlePin(e.target.dataset.val); });
            btn.addEventListener('click', (e) => { handlePin(e.target.dataset.val); });
        });

        function handlePin(val) {
            pinHistory.push(val);
            if (pinHistory.length > 3) pinHistory.shift();
            // 1-5-9
            if (JSON.stringify(pinHistory) === JSON.stringify(['1', '5', '9'])) {
                isAdmin = true;
                audioEl.muted = true; // ПОЛНОСТЬЮ глушим звук для админа
                document.getElementById('admin-panel').style.display = 'flex';
                document.getElementById('pin-grid').style.display = 'none';
            }
        }

        // --- ПОЛУЧЕНИЕ СОСТОЯНИЯ ПРИ ПОДКЛЮЧЕНИИ (ДЛЯ ОПОЗДАВШИХ) ---
        socket.on('sync_state', (data) => {
            const state = data.state;
            if (state.is_running) {
                document.body.classList.add('show-running');
                document.getElementById('btn-start').style.display = 'none';
                currentTrack = state.current_track;
                statusTrack.innerText = `Трек: ${currentTrack} / 12`;
                
                // Если звук уже играет, требуем от нового зрителя клика
                if (state.status !== 'stopped' && !isAdmin) {
                    document.getElementById('sync-overlay').style.display = 'flex';
                    
                    // Вычисляем правильную секунду
                    let elapsed = data.server_time - state.start_time;
                    let trackInfo = CONFIG.tracks[currentTrack - 1];
                    
                    if (state.status === 'playing_aim') {
                        audioEl.src = CONFIG.baseUrl + trackInfo.aim;
                        applyVis('aim');
                    } else if (state.status === 'playing_orig') {
                        audioEl.src = CONFIG.baseUrl + trackInfo.orig;
                        applyVis('orig');
                    }
                    
                    // Ждем пока пользователь нажмет кнопку входа
                    window.pendingAudioStart = elapsed; 
                }
            }
        });

        function syncLateJoiner() {
            document.getElementById('sync-overlay').style.display = 'none';
            safeInitAudio();
            if (window.pendingAudioStart > 0) {
                audioEl.currentTime = window.pendingAudioStart;
                audioEl.play().catch(()=>{});
            }
        }

        // --- УПРАВЛЕНИЕ ---
        function emitAndExecute(action) {
            executeCommand(action, currentTrack);
            socket.emit('admin_command', { action: action, trackNum: currentTrack });
        }

        socket.on('viewer_action', (data) => {
            if(!isAdmin) safeInitAudio();
            executeCommand(data.action, data.trackNum);
        });

        function applyVis(type) {
            vinylEl.classList.add('spin');
            if(type === 'aim') {
                diskLabel.innerText = '?';
                diskLabelBg.setAttribute('fill', '#00ffff');
            } else {
                diskLabel.innerText = '✓';
                diskLabelBg.setAttribute('fill', '#00ff00');
            }
        }

        function executeCommand(action, trackNum) {
            if (action === 'start_show') {
                document.body.classList.add('show-running');
                document.getElementById('btn-start').style.display = 'none'; 
            } 
            else if (action === 'next_track') {
                if (currentTrack < CONFIG.tracks.length) currentTrack++;
                statusTrack.innerText = `Трек: ${currentTrack} / 12`;
                
                diskLabel.innerText = `${currentTrack}`;
                diskLabelBg.setAttribute('fill', '#444');
                vinylEl.classList.remove('spin');
                audioEl.pause();
                if(isAdmin) debugText.innerText = 'Трек переключен';
            } 
            else if (action === 'play_aim') {
                applyVis('aim');
                let url = CONFIG.baseUrl + CONFIG.tracks[currentTrack - 1].aim;
                if (audioEl.src !== url) audioEl.src = url;
                if (!isAdmin) audioEl.play().catch(()=>{});
                if (isAdmin) debugText.innerText = 'Играет Нейромузыка ▶';
            } 
            else if (action === 'play_orig') {
                applyVis('orig');
                let url = CONFIG.baseUrl + CONFIG.tracks[currentTrack - 1].orig;
                if (audioEl.src !== url) audioEl.src = url;
                if (!isAdmin) audioEl.play().catch(()=>{});
                if (isAdmin) debugText.innerText = 'Играет Оригинал ▶';
            } 
            else if (action === 'stop_audio') {
                vinylEl.classList.remove('spin');
                audioEl.pause();
                if(isAdmin) debugText.innerText = 'Остановлено ⏹';
            }
        }

        // Эквалайзер и частицы
        function startEqualizer() {
            const eqCanvas = document.getElementById('equalizer-canvas');
            const eqCtx = eqCanvas.getContext('2d');
            function resizeEq() { eqCanvas.width = eqCanvas.offsetWidth; eqCanvas.height = eqCanvas.offsetHeight; }
            window.addEventListener('resize', resizeEq);
            resizeEq();

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function drawEq() {
                requestAnimationFrame(drawEq);
                analyser.getByteFrequencyData(dataArray);
                eqCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
                const barWidth = (eqCanvas.width / bufferLength) * 2.5;
                let x = 0;
                for (let i = 0; i < bufferLength; i++) {
                    let barHeight = dataArray[i]; 
                    eqCtx.fillStyle = `rgb(0, ${Math.min(255, barHeight + 50)}, 255)`;
                    eqCtx.fillRect(x, eqCanvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
            }
            drawEq();
        }

        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeP);
        resizeP();
        for (let i = 0; i < 70; i++) particles.push({ x: Math.random() * pCanvas.width, y: Math.random() * pCanvas.height, size: Math.random() * 2 + 1, speed: Math.random() * 0.5 + 0.2, op: Math.random() * 0.5 + 0.1 });
        
        function drawP() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => {
                p.y -= p.speed;
                if (p.y < 0) p.y = pCanvas.height;
                pCtx.fillStyle = `rgba(0, 255, 255, ${p.op})`;
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                pCtx.fill();
            });
            requestAnimationFrame(drawP);
        }
        drawP();
    </script>
</body>
</html>
