<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Music Interactive</title>
    <!-- Подключение Socket.IO -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
        
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0a0a0a; font-family: 'Montserrat', sans-serif;
            overflow: hidden; color: white;
        }

        /* Индикатор подключения */
        #status-indicator {
            position: absolute; top: 12px; left: 15px;
            color: rgba(255,255,255,0.4); font-size: 12px; z-index: 1000;
            letter-spacing: 1px;
        }

        /* Канвасы для частичек и эквалайзера */
        #particles-canvas, #eq-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        #eq-canvas { z-index: 2; }

        /* Экран входа */
        #entry-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100;
        }

        /* Длинная полоска над HELLO для входа в Админку */
        #btn-admin-stripe {
            width: 220px; height: 6px;
            background: linear-gradient(90deg, transparent, #0055ff, transparent);
            border-radius: 4px; margin-bottom: 35px;
            cursor: pointer; box-shadow: 0 0 15px #0055ff;
            transition: all 0.4s ease;
        }
        #btn-admin-stripe:hover {
            width: 300px;
            background: linear-gradient(90deg, #0055ff, #ffffff, #0055ff);
            box-shadow: 0 0 25px #0055ff, 0 0 10px #ffffff;
        }

        #btn-hello {
            padding: 20px 65px; font-size: 32px; background: transparent;
            border: 3px solid white; color: white; border-radius: 50px;
            cursor: pointer; transition: all 0.3s ease; font-weight: 900;
            letter-spacing: 2px;
        }
        #btn-hello:hover { background: white; color: black; box-shadow: 0 0 30px rgba(255,255,255,0.5); }

        /* Главный экран интерактива */
        #main-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            z-index: 3; display: none;
        }

        /* Увеличенная центральная блямба (280px) */
        #center-circle {
            width: 280px; height: 280px;
            background: radial-gradient(circle, #001f4d 0%, #000a1a 100%);
            border: 5px solid #0055ff; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            font-size: 32px; font-weight: 900;
            box-shadow: 0 0 50px #0055ff, inset 0 0 30px #0055ff;
            text-align: center; line-height: 1.2; text-transform: uppercase;
            opacity: 0; transition: opacity 1s ease;
            position: relative;
        }

        /* Анимация вращения круга */
        @keyframes spinCircle {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spinning {
            animation: spinCircle 12s linear infinite;
        }

        .paused-spin {
            animation-play-state: paused;
        }

        /* Текст номера раунда */
        #round-title {
            position: absolute; font-size: 9vw; font-weight: 900;
            text-shadow: 0 0 40px rgba(0, 85, 255, 0.9); opacity: 0;
            pointer-events: none; z-index: 4;
        }
        
        .animate-round { animation: roundAnim 3s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        
        @keyframes roundAnim {
            0% { transform: scale(2) translateZ(0); opacity: 0; }
            20% { transform: scale(1) translateZ(0); opacity: 1; }
            70% { transform: scale(0.9) translateZ(0); opacity: 1; }
            100% { transform: scale(0.1) translateZ(0); opacity: 0; }
        }

        /* Адаптированная центрированная панель управления */
        #admin-panel {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10; display: none; flex-direction: column; align-items: center;
            background: rgba(5, 10, 25, 0.88);
            padding: 30px 40px; border-radius: 25px;
            border: 2px solid #0055ff; gap: 15px;
            box-shadow: 0 0 50px rgba(0, 85, 255, 0.5);
            backdrop-filter: blur(8px);
        }

        .admin-row {
            display: flex; gap: 15px; width: 100%; justify-content: center;
        }

        .admin-btn {
            padding: 15px 30px; font-size: 16px; font-weight: 900;
            cursor: pointer; border: none; border-radius: 12px;
            color: white; text-transform: uppercase; transition: all 0.2s ease;
            opacity: 0.5; pointer-events: none; letter-spacing: 1px;
        }
        #btn-ai { background: #0055ff; } 
        #btn-ai:hover { background: #3377ff; box-shadow: 0 0 15px #0055ff; }
        #btn-orig { background: #ffaa00; } 
        #btn-orig:hover { background: #ffcc33; box-shadow: 0 0 15px #ffaa00; }
        #btn-next { background: #333; width: 100%; border: 1px solid #555; opacity: 1; pointer-events: auto; }
        #btn-next:hover { background: #555; }
        
        .active-btn { box-shadow: 0 0 25px currentColor; transform: scale(1.05); opacity: 1 !important; }
    </style>
</head>
<body>

    <div id="status-indicator">Подключение к серверу...</div>

    <canvas id="particles-canvas"></canvas>
    <canvas id="eq-canvas"></canvas>

    <!-- Экран выбора роли -->
    <div id="entry-screen">
        <!-- Полоска входа в админку -->
        <div id="btn-admin-stripe" title="Режим управления"></div>
        <button id="btn-hello">HELLO</button>
    </div>

    <!-- Главная сцена -->
    <div id="main-screen">
        <div id="round-title">РАУНД 1</div>
        <div id="center-circle">AI<br>МУЗЫКА</div>
    </div>

    <!-- Пульт ведущего (по центру) -->
    <div id="admin-panel">
        <div class="admin-row">
            <button class="admin-btn" id="btn-ai">AI-музыка</button>
            <button class="admin-btn" id="btn-orig">Оригинал</button>
        </div>
        <button class="admin-btn" id="btn-next">НАЧАТЬ ИГРУ</button>
    </div>

    <!-- Аудиоплеер -->
    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const CLOUD_URL = 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/';
        const RENDER_URL = 'https://aim-d8ck.onrender.com';
        
        const socket = io(RENDER_URL);
        const statusInd = document.getElementById('status-indicator');

        socket.on('connect', () => { statusInd.innerText = '🟢 Сервер подключен'; });
        socket.on('disconnect', () => { statusInd.innerText = '🔴 Соединение потеряно'; });

        const entryScreen = document.getElementById('entry-screen');
        const mainScreen = document.getElementById('main-screen');
        const adminPanel = document.getElementById('admin-panel');
        const roundTitle = document.getElementById('round-title');
        const centerCircle = document.getElementById('center-circle');
        const audio = document.getElementById('audio-player');
        
        const btnAi = document.getElementById('btn-ai');
        const btnOrig = document.getElementById('btn-orig');
        const btnNext = document.getElementById('btn-next');

        let audioContext, analyser, dataArray;
        let localState = { round: 0, playing: false, track: null };
        let fadeInterval = null;
        let isAdmin = false;

        function initAudio() {
            if(!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaElementSource(audio);
                source.connect(analyser);
                analyser.connect(audioContext.destination);
                analyser.fftSize = 256;
                dataArray = new Uint8Array(analyser.frequencyBinCount);
            }
            if(audioContext.state === 'suspended') audioContext.resume();
        }

        // Вход зрителя
        document.getElementById('btn-hello').onclick = () => {
            isAdmin = false;
            initAudio();
            entryScreen.style.display = 'none';
            mainScreen.style.display = 'flex';
        };

        // Вход админа через верхнюю полоску
        document.getElementById('btn-admin-stripe').onclick = () => {
            isAdmin = true;
            entryScreen.style.display = 'none';
            mainScreen.style.display = 'flex';
            adminPanel.style.display = 'flex';
        };

        // Кнопки пульта
        btnAi.onclick = () => {
            let action = (localState.playing && localState.track === 'aim') ? 'pause' : 'play';
            socket.emit('admin_command', { action: action, track: 'aim' });
        };

        btnOrig.onclick = () => {
            let action = (localState.playing && localState.track === 'm') ? 'pause' : 'play';
            socket.emit('admin_command', { action: action, track: 'm' });
        };

        btnNext.onclick = () => {
            if (localState.round === 0) {
                socket.emit('admin_command', { action: 'start_game' });
            } else {
                socket.emit('admin_command', { action: 'next_round' });
            }
        };

        // Плавный запуск звука (Fade In)
        function smoothPlay(audioElement, duration = 400) {
            if (fadeInterval) clearInterval(fadeInterval);

            if (audioElement.paused) {
                audioElement.volume = 0;
                audioElement.play().catch(e => console.error("Ошибка запуска:", e));
            }

            const step = 0.05;
            const intervalTime = duration / (1 / step);

            fadeInterval = setInterval(() => {
                if (audioElement.volume < 1 - step) {
                    audioElement.volume += step;
                } else {
                    audioElement.volume = 1;
                    clearInterval(fadeInterval);
                    fadeInterval = null;
                }
            }, intervalTime);
        }

        // Плавная остановка звука (Fade Out)
        function smoothPause(audioElement, duration = 500) {
            if (fadeInterval) clearInterval(fadeInterval);

            if (audioElement.paused) return;

            const step = 0.05;
            const intervalTime = duration / (audioElement.volume / step);

            fadeInterval = setInterval(() => {
                if (audioElement.volume > step) {
                    audioElement.volume -= step;
                } else {
                    audioElement.volume = 0;
                    audioElement.pause();
                    clearInterval(fadeInterval);
                    fadeInterval = null;
                }
            }, intervalTime);
        }

        // Синхронизация состояний от сервера
        socket.on('state_update', (state) => {
            localState = state;

            if (state.round > 0) {
                btnNext.innerText = 'СЛЕДУЮЩИЙ РАУНД';
                btnAi.style.opacity = '1'; btnAi.style.pointerEvents = 'auto';
                btnOrig.style.opacity = '1'; btnOrig.style.pointerEvents = 'auto';
            } else {
                btnNext.innerText = 'НАЧАТЬ ИГРУ';
                centerCircle.style.opacity = 0;
            }

            btnAi.classList.remove('active-btn');
            btnOrig.classList.remove('active-btn');

            if (state.playing) {
                if (state.track === 'aim') btnAi.classList.add('active-btn');
                if (state.track === 'm') btnOrig.classList.add('active-btn');

                // Воспроизведение только на экране зрителя
                if (!isAdmin) {
                    let trackPrefix = state.track === 'aim' ? 'aim' : 'm';
                    let targetSrc = `${CLOUD_URL}${trackPrefix}${state.round}.mp3`;

                    if (audio.src !== targetSrc) {
                        audio.src = targetSrc;
                        audio.currentTime = 0;
                        smoothPlay(audio);
                    } else if (audio.paused || audio.volume < 1) {
                        smoothPlay(audio);
                    }
                }

                // Вращение круга при Play
                centerCircle.classList.add('spinning');
                centerCircle.classList.remove('paused-spin');
                centerCircle.style.opacity = 1;
            } else {
                if (!isAdmin) {
                    smoothPause(audio);
                }

                // Замораживаем вращение при Паузе
                centerCircle.classList.add('paused-spin');

                if (state.trigger_animation) centerCircle.style.opacity = 0;
            }

            // Анимация номера раунда и сброс круга
            if (state.trigger_animation) {
                centerCircle.style.opacity = 0; // Растворение круга
                centerCircle.classList.remove('spinning', 'paused-spin'); // Сброс вращения

                roundTitle.innerText = `РАУНД ${state.round}`;
                roundTitle.classList.remove('animate-round');
                void roundTitle.offsetWidth; 
                roundTitle.classList.add('animate-round');

                setTimeout(() => {
                    centerCircle.style.opacity = 1; // Плавное появление для нового раунда
                }, 2500);
            }
        });

        // --- АНИМАЦИЯ ЧАСТИЦ (КРУПНЫЕ СВЕТЯЩИЕСЯ ТОЧКИ) ---
        const canvasP = document.getElementById('particles-canvas');
        const ctxP = canvasP.getContext('2d');
        let particles = [];

        function resizeCanvases() {
            canvasP.width = window.innerWidth; canvasP.height = window.innerHeight;
            const eqCanvas = document.getElementById('eq-canvas');
            eqCanvas.width = window.innerWidth; eqCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvases);
        resizeCanvases();

        class Particle {
            constructor() {
                this.x = Math.random() * canvasP.width; 
                this.y = Math.random() * canvasP.height;
                this.vx = (Math.random() - 0.5) * 1.2; 
                this.vy = (Math.random() - 0.5) * 1.2;
                this.radius = Math.random() * 2 + 4; // Размер точек (4px - 6px)
            }
            update() {
                this.x += this.vx; this.y += this.vy;
                if(this.x < 0 || this.x > canvasP.width) this.vx *= -1;
                if(this.y < 0 || this.y > canvasP.height) this.vy *= -1;
            }
            draw() {
                ctxP.beginPath();
                ctxP.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctxP.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctxP.shadowBlur = 10;
                ctxP.shadowColor = '#0055ff';
                ctxP.fill();
            }
        }
        for(let i=0; i<50; i++) particles.push(new Particle());

        function animateParticles() {
            ctxP.clearRect(0, 0, canvasP.width, canvasP.height);
            for(let i=0; i<particles.length; i++) {
                particles[i].update(); 
                particles[i].draw();
                for(let j=i; j<particles.length; j++) {
                    let dx = particles[i].x - particles[j].x;
                    let dy = particles[i].y - particles[j].y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    if(dist < 130) {
                        ctxP.beginPath(); 
                        ctxP.strokeStyle = `rgba(0, 85, 255, ${1 - dist/130})`;
                        ctxP.lineWidth = 1; 
                        ctxP.moveTo(particles[i].x, particles[i].y);
                        ctxP.lineTo(particles[j].x, particles[j].y); 
                        ctxP.stroke();
                    }
                }
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- РАДИАЛЬНЫЙ ЭКВАЛАЙЗЕР ---
        const canvasEq = document.getElementById('eq-canvas');
        const ctxEq = canvasEq.getContext('2d');

        function animateEqualizer() {
            requestAnimationFrame(animateEqualizer);
            ctxEq.clearRect(0, 0, canvasEq.width, canvasEq.height);

            if(!isAdmin && analyser && localState.playing && !audio.paused) {
                analyser.getByteFrequencyData(dataArray);
                const cx = canvasEq.width / 2, cy = canvasEq.height / 2;
                const radius = 155; // Увеличенный радиус под круг 280px
                const bars = 64; 
                const step = (Math.PI * 2) / bars;

                for(let i=0; i<bars; i++) {
                    let value = dataArray[i * 2] / 2; 
                    let angle = i * step;
                    let x1 = cx + Math.cos(angle) * radius, y1 = cy + Math.sin(angle) * radius;
                    let x2 = cx + Math.cos(angle) * (radius + value), y2 = cy + Math.sin(angle) * (radius + value);

                    ctxEq.beginPath(); 
                    ctxEq.moveTo(x1, y1); 
                    ctxEq.lineTo(x2, y2);
                    ctxEq.strokeStyle = `rgba(0, 85, 255, ${value/100 + 0.3})`;
                    ctxEq.lineWidth = 4; 
                    ctxEq.lineCap = 'round'; 
                    ctxEq.stroke();
                }
            }
        }
        animateEqualizer();
    </script>
</body>
</html>
