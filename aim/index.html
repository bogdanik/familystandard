<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Музыка AI - Шоу</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }
        body, html { width: 100%; height: 100%; background-color: #030303; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; }
        
        #particles-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }

        /* Лобби с золотым градиентным текстом */
        #splash-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; background: transparent; }
        .splash-title { 
            font-size: clamp(3rem, 12vw, 8rem); 
            font-weight: 900; 
            text-transform: uppercase; 
            text-align: center; 
            padding: 0 10px;
            /* Золотой градиент для текста */
            background: linear-gradient(135deg, #f3db74 0%, #d4af37 50%, #aa8011 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Свечение вокруг текста */
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.4));
        }
        .click-hint { margin-top: 30px; font-size: clamp(1rem, 4vw, 1.5rem); color: #888; animation: pulse-text 2s infinite; text-align: center; font-weight: 300; }
        @keyframes pulse-text { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        #pin-grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; z-index: 20; }
        .pin-btn { width: 100%; height: 100%; cursor: pointer; }

        /* Экран шоу */
        #viewer-screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; flex-direction: column; justify-content: center; align-items: center; z-index: 5; background: transparent; }
        
        canvas#equalizer-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }

        #mystery-box { position: relative; z-index: 3; display: flex; justify-content: center; align-items: center; width: 220px; height: 220px; border-radius: 50%; box-shadow: inset 0 0 50px rgba(212, 175, 55, 0.1); background: rgba(0,0,0,0.7); border: 2px solid rgba(212, 175, 55, 0.2); }
        #mystery-mark { font-size: 8rem; font-weight: 900; color: #d4af37; text-shadow: 0 0 30px rgba(212, 175, 55, 0.8); animation: breathe 2s ease-in-out infinite alternate; transition: color 0.5s, text-shadow 0.5s; }
        @keyframes breathe {
            from { transform: scale(0.95); text-shadow: 0 0 20px rgba(212, 175, 55, 0.5); }
            to { transform: scale(1.05); text-shadow: 0 0 40px rgba(212, 175, 55, 1); }
        }

        #unlock-overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 50; flex-direction: column; justify-content: center; align-items: center; backdrop-filter: blur(8px); cursor: pointer; }
        .unlock-btn { padding: 20px 40px; font-size: 1.5rem; background: transparent; color: #d4af37; border: 2px solid #d4af37; border-radius: 12px; font-weight: bold; text-transform: uppercase; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); animation: pulse-text 1.5s infinite; }

        /* Пульт */
        #admin-panel { display: none; position: fixed; bottom: 0; left: 0; width: 100%; background: linear-gradient(to top, #0a0a0a, #1a1a1a); border-top: 2px solid #d4af37; z-index: 60; padding: 20px 15px calc(20px + env(safe-area-inset-bottom)); flex-direction: column; align-items: center; box-shadow: 0 -10px 40px rgba(0,0,0,0.9); }
        .admin-header { display: flex; justify-content: space-between; width: 100%; max-width: 600px; margin-bottom: 10px; color: #d4af37; font-weight: bold; font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; }
        .debug-info { font-size: 0.85rem; color: #888; text-align: center; margin-bottom: 15px; height: 18px; width: 100%; }
        
        .admin-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; max-width: 600px; }
        .btn { flex: 1 1 calc(50% - 10px); padding: 15px 5px; font-size: 1rem; cursor: pointer; border: none; border-radius: 8px; font-weight: 900; text-transform: uppercase; transition: transform 0.1s; letter-spacing: 1px; color: #111; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .btn:active { transform: scale(0.95); opacity: 0.9; }
        
        .btn-start { background: linear-gradient(135deg, #f3db74, #d4af37); flex-basis: 100%; padding: 20px 10px; font-size: 1.2rem; }
        .btn-play-aim { background: linear-gradient(135deg, #e6c27a, #c5a017); }
        .btn-play-orig { background: linear-gradient(135deg, #ffffff, #c0c0c0); }
        .btn-stop { background: linear-gradient(135deg, #660000, #330000); color: #fff; border: 1px solid #ff4444; }
        .btn-next { background: linear-gradient(135deg, #444, #111); color: #d4af37; border: 1px solid #d4af37; }
        
        /* Моментальное переключение экранов без задержек */
        body.show-running #splash-screen { display: none !important; }
        body.show-running #pin-grid { display: none !important; }
        body.show-running #viewer-screen { display: flex !important; }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div id="splash-screen">
        <h1 class="splash-title">Музыка AI</h1>
        <div class="click-hint">Ожидание подключения...</div>
    </div>

    <div id="pin-grid">
        <div class="pin-btn" data-val="1"></div><div class="pin-btn" data-val="2"></div><div class="pin-btn" data-val="3"></div>
        <div class="pin-btn" data-val="4"></div><div class="pin-btn" data-val="5"></div><div class="pin-btn" data-val="6"></div>
        <div class="pin-btn" data-val="7"></div><div class="pin-btn" data-val="8"></div><div class="pin-btn" data-val="9"></div>
    </div>

    <div id="unlock-overlay" onclick="forceUnlockAudio()">
        <button class="unlock-btn">Подключить звук</button>
    </div>

    <div id="viewer-screen">
        <canvas id="equalizer-canvas"></canvas>
        <div id="mystery-box">
            <div id="mystery-mark">?</div>
        </div>
    </div>

    <div id="admin-panel">
        <div class="admin-header">
            <span>Пульт</span>
            <span id="status-track">Трек: 1 / 12</span>
        </div>
        <div class="debug-info" id="debug-text">Режим пульта: Звук отключен</div>
        
        <div class="admin-controls">
            <button class="btn btn-start" id="btn-start" onclick="sendCommand('start')">🚀 Запустить шоу</button>
            <button class="btn btn-play-aim" onclick="sendCommand('play_aim')">▶ Загадка</button>
            <button class="btn btn-play-orig" onclick="sendCommand('play_orig')">▶ Оригинал</button>
            <button class="btn btn-stop" onclick="sendCommand('stop')">⏹ Стоп</button>
            <button class="btn btn-next" onclick="sendCommand('next')">⏭ След. трек</button>
        </div>
    </div>

    <audio id="audio-player" crossorigin="anonymous"></audio>

    <script>
        const CONFIG = {
            baseUrl: 'https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/',
            tracks: [
                { id: 1, aim: 'aim1.mp3', orig: 'm1.mp3' },
                { id: 2, aim: 'aim2.mp3', orig: 'm2.mp3' },
                { id: 3, aim: 'aim3.mp3', orig: 'm3.mp3' },
                { id: 4, aim: 'aim4.mp3', orig: 'm4.mp3' },
                { id: 5, aim: 'aim5.mp3', orig: 'm5.mp3' },
                { id: 6, aim: 'aim6.mp3', orig: 'm6.mp3' },
                { id: 7, aim: 'aim7.mp3', orig: 'm7.mp3' },
                { id: 8, aim: 'aim8.mp3', orig: 'm8.mp3' },
                { id: 9, aim: 'aim9.mp3', orig: 'm9.mp3' },
                { id: 10, aim: 'aim10.mp3', orig: 'm10.mp3' },
                { id: 11, aim: 'aim11.mp3', orig: 'm11.mp3' },
                { id: 12, aim: 'aim12.mp3', orig: 'm12.mp3' }
            ]
        };

        // Прямое подключение к твоему Render-серверу
        const socket = io('https://aim-d8ck.onrender.com');
        
        const audioEl = document.getElementById('audio-player');
        const mysteryMark = document.getElementById('mystery-mark');
        const mysteryBox = document.getElementById('mystery-box');
        const debugText = document.getElementById('debug-text');
        
        let isAdmin = false;
        let isProjector = false;
        let currentTrack = 1;
        let timeOffset = 0; 
        let isAudioContextInit = false;

        let audioCtx, analyser;

        function initAudio() {
            if (isAudioContextInit) return;
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioCtx();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; 

                let source = audioCtx.createMediaElementSource(audioEl);
                source.connect(analyser);
                analyser.connect(audioCtx.destination);
                
                isAudioContextInit = true;
                startCircularEq();
            } catch (e) { console.error(e); }
        }

        let pinSequence = [];
        document.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); checkPin(e.target.dataset.val); });
            btn.addEventListener('click', (e) => { checkPin(e.target.dataset.val); });
        });

        function checkPin(val) {
            pinSequence.push(val);
            if (pinSequence.length > 3) pinSequence.shift();
            
            let seqStr = JSON.stringify(pinSequence);

            // АДМИН ПУЛЬТ: 1 - 5 - 9
            if (seqStr === JSON.stringify(['1', '5', '9'])) {
                isAdmin = true;
                isProjector = false;
                audioEl.muted = true;
                document.getElementById('admin-panel').style.display = 'flex';
                document.getElementById('pin-grid').style.display = 'none';
                document.querySelector('.click-hint').innerText = 'ПУЛЬТ АКТИВИРОВАН';
                initAudio();
            }
            // ГЛАВНЫЙ ПРОЕКТОР: 3 - 5 - 7
            else if (seqStr === JSON.stringify(['3', '5', '7'])) {
                isAdmin = false;
                isProjector = true;
                audioEl.muted = false;
                document.getElementById('pin-grid').style.display = 'none';
                
                let hint = document.querySelector('.click-hint');
                hint.innerText = 'ПРОЕКТОР ГОТОВ. ЗВУК АКТИВИРОВАН.';
                hint.style.color = '#d4af37';
                
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            }
        }

        function sendCommand(action) {
            if (action === 'start') {
                document.body.classList.add('show-running');
                document.getElementById('btn-start').style.display = 'none';
            }
            if (action === 'next' && currentTrack < CONFIG.tracks.length) {
                currentTrack++;
                document.getElementById('status-track').innerText = `Трек: ${currentTrack} / 12`;
            }
            debugText.innerText = "Отправка команды...";
            
            socket.emit('command', { action: action, track: currentTrack });
        }

        socket.on('sync', (data) => {
            timeOffset = (Date.now() / 1000) - data.server_time;
            applyState(data.state, true);
        });

        socket.on('update', (data) => {
            timeOffset = (Date.now() / 1000) - data.server_time;
            applyState(data.state, false);
        });

        function applyState(state, isInitialSync) {
            currentTrack = state.track;
            document.getElementById('status-track').innerText = `Трек: ${currentTrack} / 12`;

            if (state.is_started) {
                document.body.classList.add('show-running');
                document.getElementById('btn-start').style.display = 'none';
            }

            if (state.status === 'stop') {
                audioEl.pause();
                mysteryMark.innerText = '?';
                mysteryMark.style.color = '#d4af37';
                mysteryMark.style.textShadow = '0 0 30px rgba(212,175,55,0.8)';
                mysteryBox.style.borderColor = 'rgba(212,175,55,0.2)';
                if(isAdmin) debugText.innerText = 'Остановлено ⏹';
            } 
            else {
                let url = '';
                if (state.status === 'aim') {
                    url = CONFIG.baseUrl + CONFIG.tracks[currentTrack - 1].aim;
                    mysteryMark.innerText = '?';
                    mysteryMark.style.color = '#d4af37';
                    mysteryMark.style.textShadow = '0 0 50px rgba(212,175,55,1)';
                    mysteryBox.style.borderColor = 'rgba(212,175,55,0.6)';
                } else {
                    url = CONFIG.baseUrl + CONFIG.tracks[currentTrack - 1].orig;
                    mysteryMark.innerText = '✓';
                    mysteryMark.style.color = '#e0e0e0'; 
                    mysteryMark.style.textShadow = '0 0 50px rgba(224,224,224,1)';
                    mysteryBox.style.borderColor = 'rgba(224,224,224,0.6)';
                }

                if (audioEl.src !== url) audioEl.src = url;

                let currentServerTime = (Date.now() / 1000) - timeOffset;
                let playPosition = currentServerTime - state.start_time;

                if (playPosition > 0) audioEl.currentTime = playPosition;

                let playPromise = audioEl.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        document.getElementById('unlock-overlay').style.display = 'none';
                        if(isAdmin) debugText.innerText = state.status === 'aim' ? 'Играет Нейромузыка ▶' : 'Играет Оригинал ▶';
                    }).catch(error => {
                        if (!isAdmin && !isProjector && isInitialSync) {
                            document.getElementById('unlock-overlay').style.display = 'flex';
                        }
                    });
                }
            }
        }

        function forceUnlockAudio() {
            initAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            audioEl.play();
            document.getElementById('unlock-overlay').style.display = 'none';
        }

        function startCircularEq() {
            const canvas = document.getElementById('equalizer-canvas');
            const ctx = canvas.getContext('2d');
            
            function resize() {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            const bufferLength = analyser.frequencyBinCount;
            const activeBars = 80;
            const halfBars = activeBars / 2;
            const angleStep = (Math.PI * 2) / activeBars;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);
                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                let centerX = canvas.width / 2;
                let centerY = canvas.height / 2;
                let baseRadius = 140; 

                for (let i = 0; i < activeBars; i++) {
                    let dataIndex;
                    if (i < halfBars) {
                        dataIndex = Math.floor(i * (bufferLength * 0.6) / halfBars);
                    } else {
                        dataIndex = Math.floor((activeBars - i - 1) * (bufferLength * 0.6) / halfBars);
                    }
                    
                    let barHeight = dataArray[dataIndex] * 0.7; 
                    if (barHeight < 3) barHeight = 3; 
                    
                    let angle = i * angleStep - (Math.PI / 2);

                    let x1 = centerX + Math.cos(angle) * baseRadius;
                    let y1 = centerY + Math.sin(angle) * baseRadius;
                    let x2 = centerX + Math.cos(angle) * (baseRadius + barHeight);
                    let y2 = centerY + Math.sin(angle) * (baseRadius + barHeight);

                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.lineWidth = 5;
                    ctx.lineCap = 'round';
                    
                    if (mysteryMark.innerText === '✓') {
                        ctx.strokeStyle = `rgba(224, 224, 224, ${barHeight/255 + 0.3})`; 
                    } else {
                        ctx.strokeStyle = `rgba(212, 175, 55, ${barHeight/255 + 0.3})`; 
                    }
                    ctx.stroke();
                }
            }
            draw();
        }

        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        
        function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeP);
        resizeP();
        
        for (let i = 0; i < 70; i++) {
            particles.push({ 
                x: Math.random() * pCanvas.width, 
                y: Math.random() * pCanvas.height, 
                size: Math.random() * 2.5 + 0.5, 
                speedY: Math.random() * 1.5 + 0.5, 
                speedX: (Math.random() - 0.5) * 0.5,
                colorType: Math.random() > 0.5 ? 'gold' : 'silver'
            });
        }
        
        function drawP() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            particles.forEach(p => {
                p.y -= p.speedY;
                p.x += p.speedX;
                if (p.y < 0) {
                    p.y = pCanvas.height;
                    p.x = Math.random() * pCanvas.width;
                }
                
                if (p.colorType === 'gold') {
                    pCtx.fillStyle = `rgba(212, 175, 55, ${Math.random() * 0.5 + 0.3})`;
                } else {
                    pCtx.fillStyle = `rgba(220, 220, 220, ${Math.random() * 0.5 + 0.3})`;
                }
                
                pCtx.beginPath();
                pCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                pCtx.fill();
            });
            requestAnimationFrame(drawP);
        }
        drawP();
    </script>
</body>
</html>
