<div style="width: 100%; max-width: 500px; text-align: center;">
    <h1 style="font-family: 'Cinzel', serif; font-size: 2.8rem; color: #fff; text-shadow: 0 0 25px rgba(245, 158, 11, 0.5);">FAMILY STANDARD OS</h1>
    <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 6px; letter-spacing: 2px;">УЧАСТНИКИ В ЛОББИ</p>

    <div id="lobby-users-list" style="margin-top: 25px; display: flex; flex-direction: column; gap: 10px; max-height: 380px; overflow-y: auto; padding-right: 5px;">
        <div style="color: #64748b; font-size: 0.9rem;">Загрузка участников...</div>
    </div>
</div>

<script>
    socket.on('users_list_update', (users) => {
        const listEl = document.getElementById('lobby-users-list');
        if (!listEl) return;
        listEl.innerHTML = '';

        if (users.length === 0) {
            listEl.innerHTML = '<div style="color: #64748b; font-size: 0.9rem;">Ожидание подключений...</div>';
            return;
        }

        users.forEach(u => {
            const isHost = u.role === 'HOST';
            const userCard = document.createElement('div');
            userCard.style.cssText = `
                padding: 14px 20px;
                border-radius: 16px;
                background: ${isHost ? 'rgba(245, 158, 11, 0.15)' : 'rgba(255, 255, 255, 0.05)'};
                border: 1px solid ${isHost ? 'var(--gold-main)' : 'rgba(255, 255, 255, 0.1)'};
                color: ${isHost ? 'var(--gold-light)' : '#ffffff'};
                font-weight: 800;
                font-size: 1rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
            `;
            userCard.innerHTML = `
                <span>${u.name}</span>
                <span style="font-size: 0.75rem; opacity: 0.8; text-transform: uppercase;">${isHost ? '👑 ВЕДУЩИЙ' : '👤 ГОСТЬ'}</span>
            `;
            listEl.appendChild(userCard);
        });
    });
</script>
