<div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;">
    <button onclick="socket.emit('host_trigger_sfx', { sfx: 'applause' })" style="padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(30,41,59,0.8); color: #fff; font-size: 0.8rem; font-weight: 800; cursor: pointer;">👏 Аплодисменты (1-5)</button>
    <button onclick="socket.emit('host_trigger_sfx', { sfx: 'fanfare' })" style="padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(30,41,59,0.8); color: #fff; font-size: 0.8rem; font-weight: 800; cursor: pointer;">🎉 Фанфары (1-5)</button>
    <button onclick="socket.emit('host_trigger_sfx', { sfx: 'correct' })" style="padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(30,41,59,0.8); color: #fff; font-size: 0.8rem; font-weight: 800; cursor: pointer;">✅ Тыдыщ! (1-5)</button>
    <button onclick="socket.emit('host_trigger_sfx', { sfx: 'wrong' })" style="padding: 12px; border-radius: 12px; border: 1px solid rgba(239,68,68,0.3); background: rgba(239,68,68,0.1); color: #fca5a5; font-size: 0.8rem; font-weight: 800; cursor: pointer;">❌ Ошибка (1-5)</button>
</div>
