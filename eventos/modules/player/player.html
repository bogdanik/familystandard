<div style="display: flex; flex-direction: column; gap: 12px; color: #fff;">
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="font-weight: 800; color: var(--gold-light);">🎵 ПЛЕЕР ФОНОВОЙ МУЗЫКИ</span>
        <button onclick="socket.emit('host_audio_control', { action: 'toggle' })" style="padding: 6px 16px; border-radius: 10px; border: none; background: var(--gold-main); font-weight: 800; cursor: pointer;">СТАРТ / ПАУЗА</button>
    </div>

    <div style="display: flex; gap: 6px;">
        <button onclick="socket.emit('host_audio_control', { emotion: 'lounge' })" style="flex:1; padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: #fff; font-size: 0.75rem; font-weight: 700; cursor: pointer;">🍃 Лаундж (3)</button>
        <button onclick="socket.emit('host_audio_control', { emotion: 'dinner' })" style="flex:1; padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: #fff; font-size: 0.75rem; font-weight: 700; cursor: pointer;">🕺 Банкет (3)</button>
        <button onclick="socket.emit('host_audio_control', { emotion: 'party' })" style="flex:1; padding: 10px; border-radius: 10px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: #fff; font-size: 0.75rem; font-weight: 700; cursor: pointer;">🎉 Движ (3)</button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 0.75rem; color: #94a3b8;">Громкость:</span>
        <button onclick="socket.emit('host_audio_control', { volume: 0 })" style="flex:1; padding: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #fff;">0%</button>
        <button onclick="socket.emit('host_audio_control', { volume: 0.4 })" style="flex:1; padding: 6px; border-radius: 8px; border: 1px solid var(--gold-main); background: rgba(245, 158, 11, 0.2); color: #fff;">40%</button>
        <button onclick="socket.emit('host_audio_control', { volume: 1.0 })" style="flex:1; padding: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #fff;">100%</button>
    </div>
</div>
