<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Standard OS</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-black: #030712; --gold-light: #fffbeb; --gold-main: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.4); --glass-card: rgba(15, 23, 42, 0.95);
            --glass-border: rgba(229, 231, 235, 0.2); --danger-red: #ef4444;
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            --top-bar-height: 145px; --bottom-bar-height: 95px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--ios-font); user-select: none; }
        body { background: var(--bg-black); color: #f8fafc; min-height: 100vh; overflow: hidden; position: relative; }

        /* ПУЛЬСИРУЮЩЕЕ СВЕЧЕНИЕ И ФОН */
        .bg-glow { position: fixed; inset: 0; z-index: 1; background: #000000; pointer-events: none; }
        
        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        }
        .center-glow { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vw; 
            background: radial-gradient(circle, rgba(245, 158, 11, 0.35) 0%, rgba(245, 158, 11, 0.08) 40%, transparent 70%); 
            pointer-events: none; z-index: 2; 
            animation: pulseGlow 5s ease-in-out infinite;
        }
        #particles-canvas { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

        /* БРЕНДИНГ */
        .footer-logo { 
            position: fixed; 
            bottom: 14px; 
            width: 100%; 
            text-align: center; 
            color: rgba(255, 255, 255, 0.4); 
            font-size: 1.3rem; 
            font-weight: 800; 
            letter-spacing: 4px; 
            z-index: 100; 
            pointer-events: none; 
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        /* АВТОРИЗАЦИЯ */
        #auth-overlay { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--glass-card); border: 1px solid var(--glass-border); padding: 36px 26px; border-radius: 24px; width: 100%; max-width: 360px; text-align: center; box-shadow: 0 0 50px var(--gold-glow); z-index: 10001; }
        .brand-header { font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, #ffffff 0%, #fffbeb 30%, #e5e7eb 65%, #f59e0b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-sub { color: #94a3b8; font-size: 0.8rem; font-weight: 600; margin: 8px 0 20px; letter-spacing: 1px; }
        .auth-input { width: 100%; padding: 16px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(3, 7, 18, 0.85); color: #fff; text-align: center; font-size: 1.2rem; font-weight: 800; outline: none; letter-spacing: 2px; user-select: text; }
        .btn-gold { width: 100%; padding: 16px; border-radius: 12px; border: none; background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 40%, var(--gold-main) 100%); color: #000; font-weight: 800; cursor: pointer; margin-top: 15px; }

        /* ПУЛЬТ: ВЕРХ */
        #host-top-bar { display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--top-bar-height); z-index: 500; background: rgba(15, 23, 42, 0.97); border-bottom: 1px solid var(--glass-border); padding: 12px; flex-direction: column; gap: 10px; justify-content: center; }
        .control-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .btn-control { flex: 1; height: 36px; border-radius: 8px; border: 1px solid rgba(229, 231, 235, 0.18); background: rgba(30, 41, 59, 0.7); color: #ffffff; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .btn-control.active { background: linear-gradient(135deg, #ffffff 0%, var(--gold-main) 100%); color: #000; border-color: #ffffff; }
        
        .seek-btn { flex: 1; height: 44px; border-radius: 10px; background: rgba(30, 41, 59, 0.85); color: #fff; font-size: 1.4rem; border: 1px solid var(--glass-border); display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
        .play-btn { flex: 1.5; background: rgba(245, 158, 11, 0.2); color: var(--gold-light); border-color: var(--gold-main); }
        .play-time { font-size: 0.65rem; font-weight: 800; opacity: 0.8; margin-top: 2px; letter-spacing: 0.5px; font-family: var(--ios-font); }

        /* ПУЛЬТ: НИЗ */
        #host-bottom-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-bar-height); z-index: 500; background: rgba(15, 23, 42, 0.98); border-top: 1px solid var(--glass-border); padding: 8px 12px; flex-direction: column; gap: 8px; justify-content: center; }
        .btn-action { flex: 1; height: 36px; border-radius: 8px; border: 1px solid var(--glass-border); font-weight: 800; font-size: 0.78rem; cursor: pointer; transition: all 0.2s; }
        .btn-action.gold { background: rgba(245, 158, 11, 0.2); color: var(--gold-light); border-color: var(--gold-main); }
        .btn-action.red { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: var(--danger-red); }
        .sfx-active { background: rgba(245, 158, 11, 0.4) !important; border-color: var(--gold-main) !important; box-shadow: 0 0 15px var(--gold-glow); }

        /* ЭКРАН И ОГРАНИЧЕННЫЙ ФРЕЙМ СЦЕНАРИЯ / ИНТЕРАКТИВА */
        #main-viewport { display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        
        #module-iframe { 
            display: none; 
            position: fixed; 
            inset: 0; 
            width: 100vw; 
            height: 100vh; 
            border: none; 
            z-index: 15; 
            background: #000; 
            opacity: 0; 
            transition: opacity 0.5s ease-in-out; 
        }

        /* КОМПАКТНЫЙ И УДОБНЫЙ ФРЕЙМ В РЕЖИМЕ ВЕДУЩЕГО */
        body.is-host #module-iframe { 
            top: calc(var(--top-bar-height) + 8px) !important; 
            height: calc(100vh - var(--top-bar-height) - var(--bottom-bar-height) - 16px) !important; 
            left: 10px !important;
            width: calc(100vw - 20px) !important;
            border-radius: 16px !important;
            border: 1px solid var(--glass-border) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6) !important;
            bottom: auto !important; 
        }
        
        #main-display-content { text-align: center; z-index: 10; transition: opacity 0.5s ease-in-out; opacity: 1; padding: 0 20px; }
        
        .shimmer-title { 
            font-family: 'Cinzel', serif; 
            font-size: 5rem; 
            font-weight: 900; 
            background: linear-gradient(90deg, #ffffff 0%, #fffbeb 25%, #f59e0b 50%, #e5e7eb 75%, #ffffff 100%); 
            background-size: 200% auto; 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            animation: shine 4s linear infinite; 
            line-height: 1.1;
            letter-spacing: 2px;
        }
        @keyframes shine { to { background-position: 200% center; } }
        
        .subtitle-text { 
            color: #cbd5e1; 
            font-size: 2rem; 
            font-weight: 700; 
            margin-top: 20px; 
            letter-spacing: 1.5px;
        }

        @media (max-width: 768px) {
            .shimmer-title { font-size: 2.8rem; }
            .subtitle-text { font-size: 1.2rem; }
            .footer-logo { font-size: 1rem; bottom: 10px; }
        }

        /* ТАЙМЕР */
        #full-screen-timer { display: none; position: fixed; inset: 0; z-index: 900; align-items: center; justify-content: center; transition: opacity 1s ease-in-out; opacity: 0; }
        .timer-huge-text { font-family: 'Cinzel', serif; font-size: 22vw; font-weight: 900; color: #ffffff; text-shadow: 0 0 40px var(--gold-glow); }

        /* ЭКВАЛАЙЗЕР */
        #eq-canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 200px; z-index: 5; pointer-events: none; opacity: 0.85; transition: opacity 0.5s; }

        /* МОДАЛКИ */
        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 20000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: var(--glass-card); padding: 24px; border-radius: 20px; width: 100%; max-width: 360px; border: 1px solid var(--glass-border); text-align: center; }
        .mod-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(30, 41, 59, 0.8); color: #fff; font-weight: 800; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="center-glow"></div>
    <canvas id="particles-canvas"></canvas>

    <div id="auth-overlay">
        <div class="auth-card" id="auth-card">
            <div class="brand-header">EVENT OS</div>
            <p class="auth-sub">СИСТЕМА УПРАВЛЕНИЯ</p>

    </div>

    <!-- ПУЛЬТ ВЕДУЩЕГО -->

            <button class="btn-control" onclick="setVol(0.1, this)">10%</button>
            <button class="btn-control active" onclick="setVol(0.3, this)">30%</button>
            <button class="btn-control" onclick="setVol(0.6, this)">60%</button>
            <button class="btn-control" onclick="setVol(1.0, this)">100%</button>
        </div>
        
        <div class="control-row">
            <button class="btn-control" onclick="setMood('lounge')">🍃 Лаундж</button>
            <button class="btn-control" onclick="setMood('active')">🕺 Банкет</button>

        <div class="control-row">
            <div class="seek-btn" onclick="seekRelative(-60)">⏪</div>
            <div class="seek-btn play-btn" id="btn-play-toggle" onclick="togglePlay()">
                <span id="play-icon" style="font-size: 1.1rem; line-height: 1;">⏯</span>

    <!-- ЭКРАН ПРОЕКТОРА / ЦЕНТРАЛЬНАЯ ЗОНА -->
    <div id="main-viewport">
        <canvas id="eq-canvas"></canvas>
        <div id="full-screen-timer"><div class="timer-huge-text" id="timer-val">00:00</div></div>
        
        <iframe id="module-iframe" src="about:blank"></iframe>
        
        <div id="main-display-content">
            <h1 class="shimmer-title" id="display-title">FAMILY STANDARD OS</h1>
            <p class="subtitle-text" id="display-subtitle">С праздником!</p>
        </div>
        
        <div class="footer-logo">FAMILY STANDARD OS 2026</div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ (ТОЛЬКО ДЛЯ ВЕДУЩЕГО / HOST) -->
    <div id="host-bottom-bar">
        <div class="control-row">
            <button class="btn-action gold" onclick="openLauncherModal()">ИНТЕРАКТИВ</button>
            <button class="btn-action red" onclick="handleCloseClick()">ЗАКРЫТЬ</button>
            <button class="btn-action gold" onclick="toggleScenario()" id="btn-scenario" style="flex: 0.8;">📜 СЦЕНАРИЙ</button>
            <button class="btn-action gold" onclick="socket.emit('add_timer_15s')" style="flex: 0.6;">+15 СЕК</button>
        </div>
        <div class="control-row">
            <button class="seek-btn" id="btn-jingle" onclick="socket.emit('host_toggle_jingle')" style="font-size:1.2rem">🎁</button>
            <button class="seek-btn" id="btn-sfx-applause" onclick="triggerSfx('applause')" style="font-size:1.2rem">👏</button>
            <button class="seek-btn" id="btn-sfx-correct" onclick="triggerSfx('correct')" style="font-size:1.2rem">✅</button>
            <button class="seek-btn" id="btn-sfx-wrong" onclick="triggerSfx('wrong')" style="font-size:1.2rem">❌</button>
        </div>
    </div>

    <!-- МОДАЛКИ -->
    <div class="modal-overlay" id="launcher-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light);">Интерактивы</h3>
            <div id="modules-list-box"></div>
            <button class="mod-btn" style="border-color: var(--gold-main); background: rgba(245,158,11,0.15); margin-top: 12px;" onclick="openEditEventModal()">✏ Настройки праздника</button>
            <button onclick="closeModal('launcher-modal')" style="background: transparent; color: #94a3b8; border: none; margin-top: 15px; font-weight: bold; cursor: pointer;">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="edit-event-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light);">Настройки праздника</h3>
            <input type="text" id="edit-title-input" class="auth-input" style="font-size: 1rem; letter-spacing: 1px; margin-top: 15px;" placeholder="Заголовок события">
            <input type="text" id="edit-subtitle-input" class="auth-input" style="font-size: 0.9rem; letter-spacing: 1px; margin-top: 10px;" placeholder="Подзаголовок">
            <input type="text" id="edit-scenario-input" class="auth-input" style="font-size: 0.9rem; letter-spacing: 1px; margin-top: 10px;" placeholder="Ссылка на сценарий (URL)">
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveEventInfo()" class="btn-gold" style="margin: 0; flex: 1;">Сохранить</button>
                <button onclick="closeModal('edit-event-modal')" style="flex: 1; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; border-radius: 12px;">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="end-event-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light);">Завершить праздник?</h3>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="confirmEnd()" class="btn-gold" style="margin: 0; background: var(--danger-red); color: #fff;">Завершить</button>
                <button onclick="closeModal('end-event-modal')" style="flex: 1; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; border-radius: 12px;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- АУДИО -->
    <audio id="bg-audio" loop crossorigin="anonymous"></audio>
    <audio id="sfx-audio" crossorigin="anonymous"></audio>

    <script>
        const socket = io("https://event-os-wqoa.onrender.com", { transports: ['websocket', 'polling'] });
        let CDN = "https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/";

        let myRole = 'GUEST';
        let timerInterval = null;
        let timerDelayTimeout = null;
        let overlayState = 'TITLE'; 
        
        let closeClickCount = 0;
        let closeClickTimer = null;

        let fanfareFiredForTimer = false;
        let scenarioUrl = "";
        let isScenarioOpen = false;

        // --- УМНЫЙ АУДИО-МЕНЕДЖЕР ---
        const bgAudio = document.getElementById('bg-audio');
        const sfxAudio = document.getElementById('sfx-audio');
        
        let targetVolume = 0.3;      
        let actualVolumeTarget = 0;  
        let isFadingToSeek = false;
        let pendingSeekTime = 0;
        
        let isSfxActive = false; 
        let sfxTargetVol = 0;

        let eqIsPlaying = false;
        let eqVolume = 0.3;

        let localHostSeekTime = 0;
        let hostTrackDuration = 0;
        let state_is_playing = false;

        // --- ЧАСТИЦЫ ---
        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        function resizePCanvas() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizePCanvas);
        resizePCanvas();
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * pCanvas.width; this.y = Math.random() * pCanvas.height; this.size = Math.random() * 2.5 + 0.5; this.speedX = (Math.random() - 0.5) * 0.4; this.speedY = (Math.random() - 0.5) * 0.4; this.alpha = Math.random() * 0.7 + 0.1; }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > pCanvas.width || this.y < 0 || this.y > pCanvas.height) this.reset(); }
            draw() { pCtx.fillStyle = `rgba(245, 158, 11, ${this.alpha})`; pCtx.beginPath(); pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); pCtx.fill(); }
        }
        for (let i = 0; i < 110; i++) particles.push(new Particle());
        function animateParticles() { pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
        requestAnimationFrame(animateParticles);

        // --- ШЕЛКОВИСТЫЙ ЭКВАЛАЙЗЕР С ЯРКОЙ ВСПЫШКОЙ НАВЕРХУ ---
        const eqCanvas = document.getElementById('eq-canvas');
        const eqCtx = eqCanvas.getContext('2d');
        function resizeEqCanvas() { eqCanvas.width = window.innerWidth; eqCanvas.height = 200; }
        window.addEventListener('resize', resizeEqCanvas);
        resizeEqCanvas();

        let audioCtx = null;
        let analyser = null;
        let dataArray = null;
        
        const halfBars = 40;
        let eqBars = new Array(halfBars).fill(4);
        let idleTime = 0;

        function drawRoundedBar(ctx, x, y, w, h, r) {
            if (h < 1) return;
            r = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h);
            ctx.lineTo(x, y + h);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
            ctx.fill();
        }

        function initWebAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                return;
            }
            try {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256; 
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);

                if (bgAudio) {
                    const sourceBg = audioCtx.createMediaElementSource(bgAudio);
                    sourceBg.connect(analyser);
                }
                if (sfxAudio) {
                    const sourceSfx = audioCtx.createMediaElementSource(sfxAudio);
                    sourceSfx.connect(analyser);
                }

                analyser.connect(audioCtx.destination);
            } catch (e) {
                console.warn("Web Audio Init Exception:", e);
            }
        }

        function drawEq() {
            requestAnimationFrame(drawEq);
            eqCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
            if (!eqCanvas.width || !eqCanvas.height) return;

            idleTime -= 0.03;
            const width = eqCanvas.width;
            const height = eqCanvas.height;
            const halfWidth = width / 2;
            const barSpacing = 3;
            const barWidth = (halfWidth / halfBars);
            const actualBarWidth = Math.max(1.5, barWidth - barSpacing);

            let isAudioActive = state_is_playing || isSfxActive || eqIsPlaying;

            if (analyser && dataArray && isAudioActive) {
                analyser.getByteFrequencyData(dataArray);
            }

            // 1. Считывание частот и мягкое дыхание в паузе
            let rawValues = new Float32Array(halfBars);
            for (let k = 0; k < halfBars; k++) {
                if (analyser && dataArray && isAudioActive) {
                    let logIndex = Math.floor(Math.pow(k / halfBars, 1.3) * (dataArray.length * 0.65));
                    rawValues[k] = dataArray[logIndex] || 0;
                } else {
                    rawValues[k] = Math.sin(idleTime * 1.8 + k * 0.25) * 10 + Math.cos(idleTime * 1.1 - k * 0.15) * 6 + 14;
                }
            }

            // 5-точечное сглаживание Гаусса
            let smoothedValues = new Float32Array(halfBars);
            for (let k = 0; k < halfBars; k++) {
                let p2 = rawValues[Math.max(0, k - 2)];
                let p1 = rawValues[Math.max(0, k - 1)];
                let curr = rawValues[k];
                let n1 = rawValues[Math.min(halfBars - 1, k + 1)];
                let n2 = rawValues[Math.min(halfBars - 1, k + 2)];
                smoothedValues[k] = p2 * 0.08 + p1 * 0.24 + curr * 0.36 + n1 * 0.24 + n2 * 0.08;
            }

            // 2. Столбцы эквалайзера с ярким акцентом на самом верху
            for (let k = 0; k < halfBars; k++) {
                let targetH = (smoothedValues[k] / 255) * (height * 0.82);
                if (targetH < 4) targetH = 4;

                if (targetH > eqBars[k]) {
                    eqBars[k] += (targetH - eqBars[k]) * 0.22;
                } else {
                    eqBars[k] += (targetH - eqBars[k]) * 0.08;
                }

                let h = eqBars[k];

                let xLeft = k * barWidth + barSpacing / 2;
                let xRight = width - (k + 1) * barWidth + barSpacing / 2;

                // Градиент: на 50% высоты ровно 20% яркости, низ - еле заметный, а самый верх — яркая вспышка 100%
                let barGradient = eqCtx.createLinearGradient(0, height, 0, height - h);
                barGradient.addColorStop(0, 'rgba(3, 7, 18, 0.05)');       // Низ практически полностью тёмный
                barGradient.addColorStop(0.5, 'rgba(245, 158, 11, 0.2)');   // 50% высоты: ровно 20% яркости
                barGradient.addColorStop(0.82, 'rgba(245, 158, 11, 0.65)'); // Нарастание
                barGradient.addColorStop(1, 'rgba(255, 255, 255, 1.0)');    // 100% яркая вспышка на вершине

                eqCtx.fillStyle = barGradient;

                drawRoundedBar(eqCtx, xLeft, height - h, actualBarWidth, h, 4);
                drawRoundedBar(eqCtx, xRight, height - h, actualBarWidth, h, 4);
            }
        }
        drawEq();

        // --- АВТОРИЗАЦИЯ ---
        function submitAuth() {
            const val = document.getElementById('auth-input').value.trim();
            if(!val) return;
            initWebAudio();
            bgAudio.load();
            sfxAudio.load();
            bgAudio.play().then(()=>bgAudio.pause()).catch(()=>{});
            sfxAudio.play().then(()=>sfxAudio.pause()).catch(()=>{});
            socket.emit('login', { pin: val });
        }

        socket.on('login_response', (res) => {
            if (res.success) {
                myRole = res.role;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-viewport').style.display = 'flex';

                if (myRole === 'HOST') {
                    document.body.classList.add('is-host');
                    document.getElementById('host-top-bar').style.display = 'flex';
                    document.getElementById('host-bottom-bar').style.display = 'flex';
                    bgAudio.remove(); sfxAudio.remove(); 
                } else if (myRole === 'SCREEN') {
                    document.body.classList.add('is-screen');
                    bgAudio.onloadedmetadata = () => socket.emit('sync_duration', { duration: bgAudio.duration });
                    setInterval(() => {
                        if(!bgAudio.paused && !isFadingToSeek) {
                            socket.emit('screen_sync_time', { current_time: bgAudio.currentTime });
                        }
                    }, 1000);
                }
            } else {
                alert('Неверный КОД ДОСТУПА');
            }
        });

        socket.on('modules_config_update', (modules) => {
            const box = document.getElementById('modules-list-box');
            box.innerHTML = '';
            modules.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'mod-btn';
                btn.innerText = m.name;
                btn.onclick = () => { socket.emit('switch_module', { module: m.path }); closeModal('launcher-modal'); };
                box.appendChild(btn);
            });
        });

        function formatTime(s) {
            if (!s || s < 0) return "00:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        setInterval(() => {
            if (myRole === 'HOST' && state_is_playing) {
                localHostSeekTime += 1;
                if (localHostSeekTime > hostTrackDuration) localHostSeekTime = hostTrackDuration;
                document.getElementById('play-time').innerText = formatTime(localHostSeekTime) + ' / ' + formatTime(hostTrackDuration);
            }
        }, 1000);

        if (sfxAudio) {
            sfxAudio.onended = () => {
                isSfxActive = false;
                sfxTargetVol = 0;
                socket.emit('sfx_ended'); 
            };
        }

        setInterval(() => {
            if (!bgAudio || !sfxAudio || myRole !== 'SCREEN') return;

            let desiredBgVol = state_is_playing ? targetVolume : 0;
            let bgVolTarget = (isSfxActive || sfxAudio.volume > 0.05) && state_is_playing ? 0.03 : desiredBgVol;
            
            if (isFadingToSeek) bgVolTarget = 0;

            let diffBg = bgVolTarget - bgAudio.volume;
            if (Math.abs(diffBg) > 0.02) {
                bgAudio.volume += Math.sign(diffBg) * 0.02; 
            } else {
                bgAudio.volume = bgVolTarget;
                if (bgVolTarget === 0) {
                    if (isFadingToSeek) {
                        bgAudio.currentTime = pendingSeekTime; 
                        isFadingToSeek = false;
                    } else if (!eqIsPlaying && !bgAudio.paused) {
                        bgAudio.pause();
                    }
                }
            }

            let diffSfx = sfxTargetVol - sfxAudio.volume;
            if (Math.abs(diffSfx) > 0.03) {
                sfxAudio.volume += Math.sign(diffSfx) * 0.03; 
            } else {
                sfxAudio.volume = sfxTargetVol;
                if (sfxTargetVol === 0 && !sfxAudio.paused) {
                    sfxAudio.pause();
                    socket.emit('sfx_ended');
                }
            }
        }, 25);

        function applyAudioState(state) {
            if (!bgAudio) return;
            state_is_playing = state.is_playing;
            let needsSeek = Math.abs(bgAudio.currentTime - state.seek_position) > 2.5;

            if (needsSeek && state.is_playing) {
                isFadingToSeek = true;
                pendingSeekTime = state.seek_position;
            } else if (state.is_playing && bgAudio.paused) {
                bgAudio.volume = 0; 
                bgAudio.play().catch(()=>{});
            }
        }

        socket.on('play_sfx_stream', (data) => {
            if (myRole === 'SCREEN') {
                sfxAudio.src = CDN + data.file;
                sfxAudio.volume = 0; 
                sfxAudio.play().catch(()=>{});
                isSfxActive = true;
                sfxTargetVol = 1.0; 
            }
        });

        socket.on('stop_sfx', () => {
            if (myRole === 'SCREEN') {
                isSfxActive = false;
                sfxTargetVol = 0; 
            }
        });

        socket.on('state_update', (state) => {
            if (state.cdn_base_url) CDN = state.cdn_base_url;
            if (state.scenario_url) scenarioUrl = state.scenario_url;

            document.getElementById('display-title').innerText = state.event_title;
            document.getElementById('display-subtitle').innerText = state.event_subtitle;
            
            state_is_playing = state.is_playing;
            targetVolume = state.audio_volume;

            if (myRole === 'HOST') {
                localHostSeekTime = state.seek_position;
                hostTrackDuration = state.track_duration;
                document.getElementById('play-time').innerText = formatTime(localHostSeekTime) + ' / ' + formatTime(hostTrackDuration);
                
                const jBtn = document.getElementById('btn-jingle');
                if (state.jingle_playing) jBtn.classList.add('sfx-active');
                else jBtn.classList.remove('sfx-active');

                ['applause', 'correct', 'wrong'].forEach(type => {
                    const btn = document.getElementById(`btn-sfx-${type}`);
                    if (btn) {
                        if (state.active_sfx === type) {
                            btn.classList.add('sfx-active');
                        } else {
                            btn.classList.remove('sfx-active');
                        }
                    }
                });

                document.getElementById('play-icon').innerText = state.is_playing ? '⏸' : '⏯';
            }

            eqIsPlaying = state.is_playing || state.jingle_playing;
            eqVolume = state.audio_volume;

            const isModule = state.active_module && state.active_module !== '';
            const isTimer = state.timer && state.timer.active;
            const remain = isTimer ? (state.timer.end_time - (Date.now() / 1000)) : 0;
            
            const dContent = document.getElementById('main-display-content');
            const tContainer = document.getElementById('full-screen-timer');
            const iframe = document.getElementById('module-iframe');

            if (isModule && myRole === 'SCREEN') {
                document.getElementById('eq-canvas').style.opacity = '0';
            } else if (myRole === 'SCREEN') {
                document.getElementById('eq-canvas').style.opacity = '0.85';
            }

            if (isModule) {
                if (isScenarioOpen) closeScenario();
                overlayState = 'MODULE';
                clearTimeout(timerDelayTimeout);
                
                dContent.style.opacity = '0';
                setTimeout(() => dContent.style.display = 'none', 500);
                tContainer.style.opacity = '0';
                setTimeout(() => tContainer.style.display = 'none', 500);

                if(!iframe.src.includes(state.active_module)) {
                    iframe.src = state.active_module.startsWith('http') ? state.active_module : `/${state.active_module}`;
                }
                if (iframe.style.display !== 'block') {
                    iframe.style.display = 'block';
                    void iframe.offsetWidth;
                    iframe.style.opacity = '1';
                }
            } else if (isTimer && remain > 0) {
                if (!isScenarioOpen && iframe.style.opacity === '1') {
                    iframe.style.opacity = '0';
                    setTimeout(() => { if (!isScenarioOpen) { iframe.style.display = 'none'; iframe.src = 'about:blank'; } }, 500);
                }

                if (overlayState === 'TITLE') {
                    fanfareFiredForTimer = false;
                    overlayState = 'WAITING_3S';
                    dContent.style.opacity = '0'; 
                    
                    timerDelayTimeout = setTimeout(() => {
                        if (overlayState === 'WAITING_3S') {
                            dContent.style.display = 'none';
                            overlayState = 'TIMER';
                            tContainer.style.display = 'flex';
                            void tContainer.offsetWidth; 
                            tContainer.style.opacity = '1'; 
                        }
                    }, 3000); 
                }

                if (overlayState === 'TIMER' || overlayState === 'WAITING_3S') {
                    if (!timerInterval) {
                        timerInterval = setInterval(() => {
                            const currentRemain = state.timer.end_time - (Date.now() / 1000);
                            
                            if (currentRemain <= 2.2 && !fanfareFiredForTimer && overlayState === 'TIMER') {
                                fanfareFiredForTimer = true;
                                if (myRole === 'SCREEN') {
                                    socket.emit('host_trigger_sfx', { sfx: 'fanfare' });
                                }
                            }
                            
                            if (currentRemain <= 0 && overlayState === 'TIMER') {
                                overlayState = 'FADING_TIMER';
                                clearInterval(timerInterval);
                                timerInterval = null;
                                tContainer.style.opacity = '0';
                                
                                setTimeout(() => {
                                    tContainer.style.display = 'none';
                                    overlayState = 'TITLE';
                                    if (!isScenarioOpen) {
                                        dContent.style.display = 'block';
                                        void dContent.offsetWidth;
                                        dContent.style.opacity = '1'; 
                                    }
                                    if (myRole === 'SCREEN') socket.emit('timer_done');
                                }, 1500); 
                            } else if (currentRemain > 0) {
                                document.getElementById('timer-val').innerText = formatTime(currentRemain);
                            }
                        }, 100);
                    }
                }
            } else {
                if (!isScenarioOpen && iframe.style.opacity === '1') {
                    iframe.style.opacity = '0';
                    setTimeout(() => { if (!isScenarioOpen) { iframe.style.display = 'none'; iframe.src = 'about:blank'; } }, 500);
                }

                clearTimeout(timerDelayTimeout);
                
                if (overlayState !== 'TITLE' && overlayState !== 'FADING_TIMER') {
                    overlayState = 'TITLE';
                    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                    tContainer.style.opacity = '0';
                    setTimeout(() => tContainer.style.display = 'none', 500);
                    
                    if (!isScenarioOpen) {
                        dContent.style.display = 'block';
                        void dContent.offsetWidth;
                        dContent.style.opacity = '1';
                    }
                }
            }

            if (myRole === 'SCREEN' && bgAudio) {
                const trackUrl = CDN + state.current_track;
                if (!bgAudio.src.endsWith(state.current_track)) {
                    bgAudio.src = trackUrl;
                    bgAudio.currentTime = state.seek_position;
                    if (state.is_playing) {
                        bgAudio.volume = 0;
                        bgAudio.play().catch(()=>{});
                    }
                } else {
                    applyAudioState(state);
                }
            }
        });

        // УПРАВЛЕНИЕ ВЕДУЩЕГО
        function setVol(v, btn) {
            document.querySelectorAll('.control-row:first-child .btn-control').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            socket.emit('host_audio_control', { volume: v });
        }
        function setMood(m) { socket.emit('host_audio_control', { mood: m }); }
        function togglePlay() { socket.emit('host_audio_control', { toggle_play: true }); }
        function seekRelative(sec) { socket.emit('host_audio_control', { seek_relative: sec }); }
        function triggerSfx(type) { socket.emit('host_trigger_sfx', { sfx: type }); }

        // УПРАВЛЕНИЕ СЦЕНАРИЕМ (ЛОКАЛЬНЫЙ IFRAME)
        function toggleScenario() {
            if (!scenarioUrl) {
                alert("Ссылка на сценарий не настроена в event_data.json");
                return;
            }

            const iframe = document.getElementById('module-iframe');
            const btnScenario = document.getElementById('btn-scenario');
            const dContent = document.getElementById('main-display-content');

            if (!isScenarioOpen) {
                isScenarioOpen = true;
                iframe.src = scenarioUrl;
                iframe.style.display = 'block';
                void iframe.offsetWidth;
                iframe.style.opacity = '1';
                dContent.style.opacity = '0';
                setTimeout(() => { if (isScenarioOpen) dContent.style.display = 'none'; }, 500);
                btnScenario.classList.add('sfx-active');
            } else {
                closeScenario();
            }
        }

        function closeScenario() {
            const iframe = document.getElementById('module-iframe');
            const btnScenario = document.getElementById('btn-scenario');
            const dContent = document.getElementById('main-display-content');

            isScenarioOpen = false;
            iframe.style.opacity = '0';
            btnScenario.classList.remove('sfx-active');
            
            setTimeout(() => {
                if (!isScenarioOpen) {
                    iframe.style.display = 'none';
                    iframe.src = 'about:blank';
                    dContent.style.display = 'block';
                    void dContent.offsetWidth;
                    dContent.style.opacity = '1';
                }
            }, 500);
        }

        function handleCloseClick() {
            if (isScenarioOpen) {
                closeScenario();
            }
            socket.emit('switch_module', { module: '' });
            closeClickCount++;
            clearTimeout(closeClickTimer);
            if (closeClickCount >= 3) { openModal('end-event-modal'); closeClickCount = 0; }
            else { closeClickTimer = setTimeout(() => { closeClickCount = 0; }, 1200); }
        }

        function openEditEventModal() {
            closeModal('launcher-modal');
            document.getElementById('edit-title-input').value = document.getElementById('display-title').innerText;
            document.getElementById('edit-subtitle-input').value = document.getElementById('display-subtitle').innerText;
            document.getElementById('edit-scenario-input').value = scenarioUrl || '';
            openModal('edit-event-modal');
        }

        function saveEventInfo() {
            const title = document.getElementById('edit-title-input').value.trim();
            const subtitle = document.getElementById('edit-subtitle-input').value.trim();
            const scenario = document.getElementById('edit-scenario-input').value.trim();
            if (title) {
                socket.emit('update_event_info', { event_title: title, event_subtitle: subtitle, scenario_url: scenario });
            }
            closeModal('edit-event-modal');
        }

        function openLauncherModal() {
            socket.emit('get_modules');
            openModal('launcher-modal');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function confirmEnd() { socket.emit('switch_module', { module: '' }); socket.emit('host_audio_control', { toggle_play: true }); location.reload(); }
    </script>
</body>
</html>
