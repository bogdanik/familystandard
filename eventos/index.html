<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Standard OS — Royal Blue Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-royal-deep: #000a1a;
            --bg-card: rgba(8, 25, 55, 0.88);
            --blue-glow: rgba(0, 119, 255, 0.45);
            --gold-light: #fff5d6;
            --gold-main: #f59e0b;
            --gold-accent: #e2c067;
            --gold-glow: rgba(245, 158, 11, 0.5);
            --glass-border: rgba(226, 192, 103, 0.35);
            --danger-red: #ef4444;
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            --top-bar-height: 165px;
            --bottom-bar-height: 105px;
        }

        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            font-family: var(--ios-font);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-royal-deep);
            color: #ffffff;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* КОРОЛЕВСКОЕ СВЕЧЕНИЕ */
        .bg-glow {
            position: fixed; inset: 0; z-index: 1;
            background: radial-gradient(circle at 50% 50%, #001f4d 0%, #000a1a 100%);
            pointer-events: none;
        }

        @keyframes pulseRoyal {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            50% { transform: translate(-50%, -50%) scale(1.12); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
        }

        .center-glow {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(0, 119, 255, 0.25) 0%, rgba(245, 158, 11, 0.12) 40%, transparent 70%);
            pointer-events: none; z-index: 2;
            animation: pulseRoyal 6s ease-in-out infinite;
        }

        #particles-canvas { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

        /* БРЕНДИНГ */
        .footer-logo {
            position: fixed; bottom: 10px; width: 100%; text-align: center;
            color: rgba(226, 192, 103, 0.4); font-size: 0.75rem; font-weight: 800;
            letter-spacing: 3px; z-index: 100; pointer-events: none; text-transform: uppercase;
        }

        /* АВТОРИЗАЦИЯ */
        #auth-overlay { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card {
            background: var(--bg-card);
            border: 2px solid var(--glass-border);
            padding: 40px 28px; border-radius: 28px; width: 100%; max-width: 370px; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), 0 0 50px var(--gold-glow);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 10001;
        }
        .brand-header {
            font-family: 'Cinzel', serif; font-size: 2.3rem; font-weight: 900;
            background: linear-gradient(135deg, #ffffff 10%, var(--gold-light) 40%, var(--gold-main) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.4);
        }
        .auth-sub { color: var(--gold-accent); font-size: 0.8rem; font-weight: 700; margin: 8px 0 22px; letter-spacing: 2px; text-transform: uppercase; }
        .auth-input {
            width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--glass-border);
            background: rgba(0, 10, 30, 0.85); color: #fff; text-align: center; font-size: 1.3rem; font-weight: 800;
            outline: none; letter-spacing: 3px; user-select: text; transition: all 0.3s ease;
        }
        .auth-input:focus { border-color: var(--gold-main); box-shadow: 0 0 25px var(--gold-glow); }
        .btn-gold {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--gold-main), var(--gold-accent));
            color: #000d26; font-weight: 900; font-size: 1rem; cursor: pointer; margin-top: 18px;
            letter-spacing: 2px; box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-gold:active { transform: scale(0.96); }

        /* АНИМИРОВАННЫЕ КНОПКИ ПУЛЬТА */
        .btn-anim {
            position: relative; overflow: hidden;
            border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(8, 25, 55, 0.75); color: #ffffff;
            font-weight: 800; cursor: pointer; transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        .btn-anim::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: linear-gradient(45deg, transparent, rgba(245, 158, 11, 0.25), transparent);
            transform: rotate(45deg); transition: 0.5s; opacity: 0;
        }
        .btn-anim:hover::before { opacity: 1; left: 100%; }
        .btn-anim:active { transform: scale(0.94); }

        /* ПУЛЬТ ВЕДУЩЕГО: ВЕРХ */
        #host-top-bar {
            display: none; position: fixed; top: 0; left: 0; right: 0;
            height: var(--top-bar-height); z-index: 500;
            background: rgba(0, 15, 40, 0.95);
            border-bottom: 1px solid var(--glass-border);
            padding: 10px 14px; flex-direction: column; gap: 8px; justify-content: center;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .host-eq-wrapper {
            width: 100%; height: 18px; position: relative; border-radius: 8px; overflow: hidden;
            background: rgba(0, 5, 20, 0.6); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
        }
        #host-eq-canvas { width: 100%; height: 100%; display: block; }

        .control-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .btn-control { flex: 1; height: 36px; font-size: 0.82rem; }
        .btn-control.active {
            background: linear-gradient(135deg, var(--gold-main), var(--gold-accent));
            color: #000a1a; border-color: #ffffff; box-shadow: 0 0 20px var(--gold-glow);
        }

        .seek-btn {
            flex: 1; height: 42px; border-radius: 12px; background: rgba(8, 25, 55, 0.85);
            color: #fff; font-size: 1.3rem; border: 1px solid var(--glass-border);
            display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer;
        }
        .play-btn {
            flex: 1.6; background: rgba(245, 158, 11, 0.2); color: var(--gold-light);
            border-color: var(--gold-main); box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }
        .play-time { font-size: 0.65rem; font-weight: 800; color: var(--gold-main); margin-top: 2px; }

        /* ПУЛЬТ ВЕДУЩЕГО: НИЗ */
        #host-bottom-bar {
            display: none; position: fixed; bottom: 0; left: 0; right: 0;
            height: var(--bottom-bar-height); z-index: 500;
            background: rgba(0, 15, 40, 0.96);
            border-top: 1px solid var(--glass-border);
            padding: 8px 14px; flex-direction: column; gap: 8px; justify-content: center;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }
        .btn-action { flex: 1; height: 38px; font-size: 0.8rem; letter-spacing: 0.5px; }
        .btn-action.gold { background: rgba(245, 158, 11, 0.22); color: var(--gold-light); border-color: var(--gold-main); }
        .btn-action.red { background: rgba(239, 68, 68, 0.22); color: #fca5a5; border-color: var(--danger-red); }
        .sfx-active {
            background: rgba(245, 158, 11, 0.5) !important;
            border-color: var(--gold-main) !important;
            box-shadow: 0 0 25px var(--gold-glow);
        }

        /* ЭКРАН ПРОЕКТОРА */
        #main-viewport {
            display: none; position: fixed; inset: 0; z-index: 10;
            flex-direction: column; align-items: center; justify-content: center;
        }
        
        body.is-host #module-iframe { 
            top: var(--top-bar-height) !important; 
            height: calc(100vh - var(--top-bar-height) - var(--bottom-bar-height)) !important; 
            bottom: auto !important; 
        }
        
        #module-iframe {
            display: block; position: fixed; inset: 0; width: 100vw; height: 100vh;
            border: none; z-index: 1; background: transparent; opacity: 0; pointer-events: none;
            transition: opacity 0.8s ease;
        }
        #module-iframe.active-module { z-index: 15; opacity: 1; pointer-events: auto; }

        #main-display-content { text-align: center; z-index: 10; transition: opacity 1s ease; opacity: 1; }
        
        /* КРУПНЫЙ ВЕЛИЧЕСТВЕННЫЙ ТЕКСТ */
        .shimmer-title {
            font-family: 'Cinzel', serif;
            font-size: 5vw; min-size: 3.8rem; font-weight: 900;
            background: linear-gradient(90deg, #ffffff 0%, var(--gold-light) 30%, var(--gold-main) 60%, #ffffff 100%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite; text-shadow: 0 0 45px rgba(245, 158, 11, 0.5);
            letter-spacing: 2px; line-height: 1.1;
        }
        @keyframes shine { to { background-position: 200% center; } }
        
        .subtitle-text {
            color: var(--gold-accent); font-size: 2vw; min-size: 1.6rem; font-weight: 700;
            margin-top: 16px; letter-spacing: 4px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(226, 192, 103, 0.4);
        }

        /* ТАЙМЕР */
        #full-screen-timer {
            display: none; position: fixed; inset: 0; z-index: 900; align-items: center; justify-content: center;
            transition: opacity 1s ease; opacity: 0;
        }
        .timer-huge-text {
            font-family: 'Cinzel', serif; font-size: 24vw; font-weight: 900; color: #ffffff;
            text-shadow: 0 0 60px var(--gold-glow), 0 0 25px var(--gold-main);
        }

        /* ЭКВАЛАЙЗЕР-ОВАЛ ОТ ЦЕНТРА */
        #eq-canvas {
            position: absolute; inset: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; opacity: 0.9; transition: opacity 0.5s;
        }

        /* МОДАЛКИ */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 20000;
            background: rgba(0, 5, 20, 0.88); align-items: center; justify-content: center; padding: 20px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        .modal-card {
            background: var(--bg-card); padding: 28px; border-radius: 24px; width: 100%; max-width: 400px;
            border: 2px solid var(--glass-border); text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }
        .mod-btn {
            width: 100%; padding: 14px; margin-top: 10px; font-size: 0.95rem;
        }
        
        /* СЦЕНАРИЙ ДЛЯ ВЕДУЩЕГО */
        #script-iframe { width: 100%; height: 70vh; border: none; border-radius: 16px; background: #0b0d12; }
        .modal-card.large { max-width: 650px; width: 100%; padding: 16px; }

        .prompt-desc { font-size: 0.85rem; color: var(--gold-light); margin-top: 12px; text-align: left; font-weight: 600; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="center-glow"></div>
    <canvas id="particles-canvas"></canvas>

    <!-- АВТОРИЗАЦИЯ -->
    <div id="auth-overlay">
        <div class="auth-card">
            <div class="brand-header">FAMILY STANDARD</div>
            <p class="auth-sub">EVENT OS • ПУЛЬТ ВЕДУЩЕГО</p>
            <input type="password" id="auth-input" class="auth-input" placeholder="КОД ДОСТУПА" autocomplete="off" onkeydown="if(event.key==='Enter') submitAuth()">
            <button onclick="submitAuth()" class="btn-gold">ВОЙТИ В СИСТЕМУ</button>
        </div>
    </div>

    <!-- ПУЛЬТ ВЕДУЩЕГО: ВЕРХ -->
    <div id="host-top-bar">
        <div class="host-eq-wrapper">
            <canvas id="host-eq-canvas"></canvas>
        </div>

        <div class="control-row">
            <button class="btn-anim btn-control" onclick="setVol(0.03, this)">3%</button>
            <button class="btn-anim btn-control" onclick="setVol(0.1, this)">10%</button>
            <button class="btn-anim btn-control active" onclick="setVol(0.3, this)">30%</button>
            <button class="btn-anim btn-control" onclick="setVol(0.6, this)">60%</button>
            <button class="btn-anim btn-control" onclick="setVol(1.0, this)">100%</button>
        </div>
        
        <div class="control-row">
            <button class="btn-anim btn-control" onclick="openMoodSelector('lounge')">🍃 Лаундж</button>
            <button class="btn-anim btn-control" onclick="openMoodSelector('active')">🕺 Банкет</button>
            <button class="btn-anim btn-control" onclick="openMoodSelector('party')">🎉 Движ</button>
        </div>

        <div class="control-row">
            <div class="seek-btn btn-anim" onclick="seekRelative(-60)">⏪</div>
            <div class="seek-btn play-btn btn-anim" id="btn-play-toggle" onclick="togglePlay()">
                <span id="play-icon" style="font-size: 1.1rem; line-height: 1;">⏯</span>
                <span class="play-time" id="play-time">00:00 / 00:00</span>
            </div>
            <div class="seek-btn btn-anim" onclick="seekRelative(60)">⏩</div>
        </div>
    </div>

    <!-- ЭКРАН ПРОЕКТОРА -->
    <div id="main-viewport">
        <!-- ОВАЛЬНЫЙ ЭКВАЛАЙЗЕР ОТ ЦЕНТРА -->
        <canvas id="eq-canvas"></canvas>
        <div id="full-screen-timer"><div class="timer-huge-text" id="timer-val">00:00</div></div>
        
        <iframe id="module-iframe" src="about:blank"></iframe>
        
        <div id="main-display-content">
            <h1 class="shimmer-title" id="display-title">ЦОЙ ИГОРЬ ГРИГОРЬЕВИЧ</h1>
            <p class="subtitle-text" id="display-subtitle">С ДНЕМ РОЖДЕНИЯ</p>
        </div>
        
        <div class="footer-logo">FAMILY STANDARD OS 2026</div>
    </div>

    <!-- ПУЛЬТ ВЕДУЩЕГО: НИЗ -->
    <div id="host-bottom-bar">
        <div class="control-row">
            <button class="btn-anim btn-action gold" onclick="openModal('launcher-modal')">ИНТЕРАКТИВЫ</button>
            <button class="btn-anim btn-action gold" onclick="openScriptModal()">СЦЕНАРИЙ</button>
            <button class="btn-anim btn-action red" onclick="handleCloseClick()">ЗАКРЫТЬ</button>
            <button class="btn-anim btn-action gold" onclick="socket.emit('add_timer_15s')" style="flex: 0.6;">+15 СЕК</button>
        </div>
        <div class="control-row">
            <button class="seek-btn btn-anim" id="btn-jingle" onclick="socket.emit('host_toggle_jingle')" style="font-size:1.2rem">🎁</button>
            <button class="seek-btn btn-anim" onclick="triggerSfx('applause')" style="font-size:1.2rem">👏</button>
            <button class="seek-btn btn-anim" onclick="triggerSfx('correct')" style="font-size:1.2rem">✅</button>
            <button class="seek-btn btn-anim" onclick="triggerSfx('wrong')" style="font-size:1.2rem">❌</button>
        </div>
    </div>

    <!-- МОДАЛКА ВЫБОРА ТРЕКОВ (1-5) -->
    <div class="modal-overlay" id="mood-selector-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif;" id="mood-modal-title">Выбор трека</h3>
            <div id="mood-tracks-list"></div>
            <button onclick="closeModal('mood-selector-modal')" class="btn-anim mod-btn" style="background: transparent; color: #94a3b8; border: none; margin-top: 15px;">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛКА СЦЕНАРИЯ (ТОЛЬКО ДЛЯ ВЕДУЩЕГО) -->
    <div class="modal-overlay" id="script-modal">
        <div class="modal-card large">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif; margin-bottom: 10px;">Сценарий мероприятия</h3>
            <iframe id="script-iframe" src="about:blank"></iframe>
            <button onclick="closeModal('script-modal')" class="btn-anim mod-btn btn-gold" style="margin-top: 10px;">Закрыть сценарий</button>
        </div>
    </div>

    <!-- МОДАЛКА ИНТЕРАКТИВОВ -->
    <div class="modal-overlay" id="launcher-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif;">Интерактивы</h3>
            <div id="modules-list-box"></div>
            <button class="btn-anim mod-btn" style="border-color: var(--gold-main); background: rgba(245,158,11,0.2); margin-top: 14px;" onclick="openEditEventModal()">✏️ Изменить заголовок</button>
            <button onclick="closeModal('launcher-modal')" style="background: transparent; color: #94a3b8; border: none; margin-top: 15px; font-weight: bold; cursor: pointer;">Отмена</button>
        </div>
    </div>

    <!-- МОДАЛКА ИЗМЕНЕНИЯ ЗАГОЛОВКА С ПОДСКАЗКАМИ -->
    <div class="modal-overlay" id="edit-event-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif;">Настройка праздника</h3>
            
            <div class="prompt-desc">Ну что, какой праздник празднуем сегодня?</div>
            <input type="text" id="edit-title-input" class="auth-input" style="font-size: 1rem; letter-spacing: 1px; margin-top: 5px;" placeholder="Имя / Заголовок события">
            
            <div class="prompt-desc">Расскажи поподробнее:</div>
            <input type="text" id="edit-subtitle-input" class="auth-input" style="font-size: 0.9rem; letter-spacing: 1px; margin-top: 5px;" placeholder="Подзаголовок / Повод">
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="saveEventInfo()" class="btn-anim btn-gold" style="margin: 0; flex: 1;">Сохранить</button>
                <button onclick="closeModal('edit-event-modal')" style="flex: 1; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; border-radius: 14px;">Отмена</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="end-event-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif;">Завершить праздник?</h3>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="confirmEnd()" class="btn-anim btn-gold" style="margin: 0; background: var(--danger-red); color: #fff;">Завершить</button>
                <button onclick="closeModal('end-event-modal')" style="flex: 1; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; border-radius: 14px;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- АУДИОСИСТЕМА C CROSSORIGIN="ANONYMOUS" ДЛЯ РАБОТЫ WEB AUDIO API -->
    <audio id="bg-audio" crossorigin="anonymous" loop></audio>
    <audio id="sfx-audio" crossorigin="anonymous"></audio>

    <script>
        const socket = io("https://event-os-wqoa.onrender.com", { transports: ['websocket', 'polling'] });
        let CDN = "https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/";

        let myRole = 'GUEST';
        let timerInterval = null;
        let timerDelayTimeout = null;
        let overlayState = 'TITLE'; 
        let scriptUrl = 'script.html';

        let closeClickCount = 0;
        let closeClickTimer = null;
        let fanfareFiredForTimer = false;

        const bgAudio = document.getElementById('bg-audio');
        const sfxAudio = document.getElementById('sfx-audio');
        
        let targetVolume = 0.3;      
        let isFadingToSeek = false;
        let pendingSeekTime = 0;
        let isSfxActive = false; 
        let sfxTargetVol = 0;

        let eqIsPlaying = false;
        let eqVolume = 0.3;

        let localHostSeekTime = 0;
        let hostTrackDuration = 0;
        let state_is_playing = false;

        // --- WEB AUDIO API & ANALYSER (ДЛЯ ЭКВАЛАЙЗЕРА) ---
        let audioCtx, analyser, dataArray;
        function initAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    analyser = audioCtx.createAnalyser();
                    analyser.fftSize = 128;
                    dataArray = new Uint8Array(analyser.frequencyBinCount);
                    const source = audioCtx.createMediaElementSource(bgAudio);
                    source.connect(analyser);
                    analyser.connect(audioCtx.destination);
                } catch(e) { console.error("Web Audio API error:", e); }
            }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }

        window.addEventListener('click', initAudioContext);
        window.addEventListener('touchstart', initAudioContext);

        // --- 1. ФИЗИКА ЧАСТИЦ С КОЛЛИЗИЯМИ И СПУТНИКАМИ ---
        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        let ellipseWobble = { x: 0, y: 0, vx: 0, vy: 0 };

        function resizePCanvas() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizePCanvas);
        resizePCanvas();

        class Particle {
            constructor() {
                this.r = Math.random() * 3 + 2;
                this.x = Math.random() * (pCanvas.width - this.r * 2) + this.r;
                this.y = Math.random() * (pCanvas.height - this.r * 2) + this.r;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.mass = this.r;
                this.satAngle = Math.random() * Math.PI * 2;
                this.satSpeed = (Math.random() - 0.5) * 0.05;
            }

            update() {
                this.x += this.vx; this.y += this.vy;
                this.satAngle += this.satSpeed;

                if (this.x - this.r < 0) { this.x = this.r; this.vx *= -1; }
                if (this.x + this.r > pCanvas.width) { this.x = pCanvas.width - this.r; this.vx *= -1; }
                if (this.y - this.r < 0) { this.y = this.r; this.vy *= -1; }
                if (this.y + this.r > pCanvas.height) { this.y = pCanvas.height - this.r; this.vy *= -1; }
            }

            draw() {
                pCtx.beginPath();
                pCtx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                pCtx.fillStyle = 'rgba(245, 158, 11, 0.75)';
                pCtx.shadowBlur = 10;
                pCtx.shadowColor = '#f59e0b';
                pCtx.fill();

                // Окружающие сателлиты
                let satX = this.x + Math.cos(this.satAngle) * (this.r + 10);
                let satY = this.y + Math.sin(this.satAngle) * (this.r + 10);
                pCtx.beginPath();
                pCtx.arc(satX, satY, 1.2, 0, Math.PI * 2);
                pCtx.fillStyle = 'rgba(226, 192, 103, 0.9)';
                pCtx.fill();
            }
        }

        for (let i = 0; i < 45; i++) particles.push(new Particle());

        function handleCollisions() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    let p1 = particles[i], p2 = particles[j];
                    let dx = p2.x - p1.x, dy = p2.y - p1.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < p1.r + p2.r) {
                        // Рассчёт коллизии
                        let normalX = dx / dist, normalY = dy / dist;
                        let relativeVelocityX = p1.vx - p2.vx, relativeVelocityY = p1.vy - p2.vy;
                        let speed = relativeVelocityX * normalX + relativeVelocityY * normalY;

                        if (speed > 0) {
                            let impulse = 2 * speed / (p1.mass + p2.mass);
                            p1.vx -= impulse * p2.mass * normalX;
                            p1.vy -= impulse * p2.mass * normalY;
                            p2.vx += impulse * p1.mass * normalX;
                            p2.vy += impulse * p1.mass * normalY;

                            // Смещение центрального эллипса от коллизии
                            ellipseWobble.vx += normalX * 0.15;
                            ellipseWobble.vy += normalY * 0.15;
                        }
                    }
                }
            }
        }

        function animateParticles() {
            pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            handleCollisions();

            particles.forEach(p => { p.update(); p.draw(); });

            // Отрисовка центрального реактивного эллипса
            ellipseWobble.x += ellipseWobble.vx;
            ellipseWobble.y += ellipseWobble.vy;
            ellipseWobble.vx *= 0.92;
            ellipseWobble.vy *= 0.92;

            let cx = pCanvas.width / 2 + ellipseWobble.x;
            let cy = pCanvas.height / 2 + ellipseWobble.y;

            pCtx.beginPath();
            pCtx.ellipse(cx, cy, 180, 100, 0, 0, Math.PI * 2);
            pCtx.strokeStyle = 'rgba(245, 158, 11, 0.15)';
            pCtx.lineWidth = 2;
            pCtx.stroke();

            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // --- 2. ОВАЛЬНЫЙ ЭКВАЛАЙЗЕР ОТ ЦЕНТРА С ЭФФЕКТОМ БОКЕ ---
        const eqCanvas = document.getElementById('eq-canvas');
        const eqCtx = eqCanvas.getContext('2d');
        function resizeEqCanvas() { eqCanvas.width = window.innerWidth; eqCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeEqCanvas);
        resizeEqCanvas();

        function drawOvalEqualizer() {
            requestAnimationFrame(drawOvalEqualizer);
            eqCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);

            const cx = eqCanvas.width / 2;
            const cy = eqCanvas.height / 2;
            const rx = 160; // Радиус овала по X
            const ry = 100; // Радиус овала по Y
            const bars = 64;

            if (analyser && eqIsPlaying) {
                analyser.getByteFrequencyData(dataArray);
            }

            for (let i = 0; i < bars; i++) {
                let angle = (i / bars) * Math.PI * 2;
                let val = (dataArray && eqIsPlaying) ? (dataArray[i % dataArray.length] * 0.6) : 4;

                let x1 = cx + Math.cos(angle) * rx;
                let y1 = cy + Math.sin(angle) * ry;
                let x2 = cx + Math.cos(angle) * (rx + val * 1.2);
                let y2 = cy + Math.sin(angle) * (ry + val * 0.8);

                eqCtx.beginPath();
                eqCtx.moveTo(x1, y1);
                eqCtx.lineTo(x2, y2);
                eqCtx.strokeStyle = `rgba(245, 158, 11, ${Math.min(1, val / 80 + 0.2)})`;
                eqCtx.lineWidth = 4;
                eqCtx.lineCap = 'round';
                eqCtx.stroke();
            }
        }
        drawOvalEqualizer();

        // --- ЭКВАЛАЙЗЕР ДЛЯ ПУЛЬТА ВЕДУЩЕГО ---
        const hostEqCanvas = document.getElementById('host-eq-canvas');
        const hostEqCtx = hostEqCanvas.getContext('2d');
        function resizeHostEq() {
            if (hostEqCanvas.parentNode) {
                hostEqCanvas.width = hostEqCanvas.parentNode.clientWidth;
                hostEqCanvas.height = hostEqCanvas.parentNode.clientHeight;
            }
        }
        window.addEventListener('resize', resizeHostEq);
        setTimeout(resizeHostEq, 500);

        let hostBars = Array.from({length: 40}, () => Math.random());
        function drawHostEq() {
            if (myRole === 'HOST' && hostEqCanvas.width > 0) {
                hostEqCtx.clearRect(0, 0, hostEqCanvas.width, hostEqCanvas.height);
                const barWidth = hostEqCanvas.width / hostBars.length;
                for (let i = 0; i < hostBars.length; i++) {
                    let targetH = eqIsPlaying ? (Math.random() * hostEqCanvas.height * (eqVolume + 0.2)) : 1.5;
                    hostBars[i] += (targetH - hostBars[i]) * 0.25;
                    let h = hostBars[i];
                    hostEqCtx.fillStyle = `rgba(245, 158, 11, ${Math.min(1, h / 10 + 0.3)})`;
                    hostEqCtx.fillRect(i * barWidth + 1, hostEqCanvas.height - h, barWidth - 2, h);
                }
            }
            requestAnimationFrame(drawHostEq);
        }
        drawHostEq();

        // --- АВТОРИЗАЦИЯ ---
        function submitAuth() {
            const val = document.getElementById('auth-input').value.trim();
            if(!val) return;
            initAudioContext();
            bgAudio.load(); sfxAudio.load();
            bgAudio.play().then(()=>bgAudio.pause()).catch(()=>{});
            sfxAudio.play().then(()=>sfxAudio.pause()).catch(()=>{});
            socket.emit('login', { pin: val });
        }

        socket.on('login_response', (res) => {
            if (res.success) {
                myRole = res.role;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-viewport').style.display = 'flex';

                if (myRole === 'HOST') {
                    document.body.classList.add('is-host');
                    document.getElementById('host-top-bar').style.display = 'flex';
                    document.getElementById('host-bottom-bar').style.display = 'flex';
                    resizeHostEq();
                    bgAudio.remove(); sfxAudio.remove(); 
                } else if (myRole === 'SCREEN') {
                    document.body.classList.add('is-screen');
                    bgAudio.onloadedmetadata = () => socket.emit('sync_duration', { duration: bgAudio.duration });
                    setInterval(() => {
                        if(!bgAudio.paused && !isFadingToSeek) {
                            socket.emit('screen_sync_time', { current_time: bgAudio.currentTime });
                        }
                    }, 1000);
                }
            } else { alert('Неверный КОД ДОСТУПА'); }
        });

        socket.on('modules_config_update', (data) => {
            if (data.script_url) scriptUrl = data.script_url;
            const box = document.getElementById('modules-list-box');
            box.innerHTML = '';
            (data.modules || []).forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'btn-anim mod-btn btn-gold';
                btn.innerText = m.name;
                btn.onclick = () => { socket.emit('switch_module', { module: m.path }); closeModal('launcher-modal'); };
                box.appendChild(btn);
            });
        });

        function formatTime(s) {
            if (!s || s < 0) return "00:00";
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        setInterval(() => {
            if (myRole === 'HOST' && state_is_playing) {
                localHostSeekTime += 1;
                if (localHostSeekTime > hostTrackDuration) localHostSeekTime = hostTrackDuration;
                document.getElementById('play-time').innerText = formatTime(localHostSeekTime) + ' / ' + formatTime(hostTrackDuration);
            }
        }, 1000);

        if (sfxAudio) {
            sfxAudio.onended = () => {
                isSfxActive = false; sfxTargetVol = 0;
                socket.emit('sfx_ended'); 
            };
        }

        setInterval(() => {
            if (!bgAudio || !sfxAudio || myRole !== 'SCREEN') return;

            let desiredBgVol = state_is_playing ? targetVolume : 0;
            let bgVolTarget = (isSfxActive || sfxAudio.volume > 0.05) && state_is_playing ? 0.03 : desiredBgVol;
            if (isFadingToSeek) bgVolTarget = 0;

            let diffBg = bgVolTarget - bgAudio.volume;
            if (Math.abs(diffBg) > 0.02) { bgAudio.volume += Math.sign(diffBg) * 0.02; }
            else {
                bgAudio.volume = bgVolTarget;
                if (bgVolTarget === 0) {
                    if (isFadingToSeek) { bgAudio.currentTime = pendingSeekTime; isFadingToSeek = false; }
                    else if (!eqIsPlaying && !bgAudio.paused) { bgAudio.pause(); }
                }
            }

            let diffSfx = sfxTargetVol - sfxAudio.volume;
            if (Math.abs(diffSfx) > 0.03) { sfxAudio.volume += Math.sign(diffSfx) * 0.03; }
            else {
                sfxAudio.volume = sfxTargetVol;
                if (sfxTargetVol === 0 && !sfxAudio.paused) { sfxAudio.pause(); socket.emit('sfx_ended'); }
            }
        }, 25);

        function applyAudioState(state) {
            if (!bgAudio) return;
            state_is_playing = state.is_playing;
            let needsSeek = Math.abs(bgAudio.currentTime - state.seek_position) > 2.5;

            if (needsSeek && state.is_playing) { isFadingToSeek = true; pendingSeekTime = state.seek_position; }
            else if (state.is_playing && bgAudio.paused) { bgAudio.volume = 0; bgAudio.play().catch(()=>{}); }
        }

        socket.on('play_sfx_stream', (data) => {
            if (myRole === 'SCREEN') {
                sfxAudio.src = CDN + data.file;
                sfxAudio.volume = 0; sfxAudio.play().catch(()=>{});
                isSfxActive = true; sfxTargetVol = 0.6; 
            }
        });

        socket.on('stop_sfx', () => { if (myRole === 'SCREEN') { isSfxActive = false; sfxTargetVol = 0; } });

        socket.on('state_update', (state) => {
            if (state.cdn_base_url) CDN = state.cdn_base_url;

            document.getElementById('display-title').innerText = state.event_title;
            document.getElementById('display-subtitle').innerText = state.event_subtitle;
            
            state_is_playing = state.is_playing;
            targetVolume = state.audio_volume;

            if (myRole === 'HOST') {
                localHostSeekTime = state.seek_position;
                hostTrackDuration = state.track_duration;
                document.getElementById('play-time').innerText = formatTime(localHostSeekTime) + ' / ' + formatTime(hostTrackDuration);
                
                const jBtn = document.getElementById('btn-jingle');
                if (state.jingle_playing) jBtn.classList.add('sfx-active');
                else jBtn.classList.remove('sfx-active');

                document.getElementById('play-icon').innerText = state.is_playing ? '⏸' : '⏯';
            }

            eqIsPlaying = state.is_playing || state.jingle_playing;
            eqVolume = state.audio_volume;

            const isModule = state.active_module && state.active_module !== '';
            const isTimer = state.timer && state.timer.active;
            const remain = isTimer ? (state.timer.end_time - (Date.now() / 1000)) : 0;
            
            const dContent = document.getElementById('main-display-content');
            const tContainer = document.getElementById('full-screen-timer');
            const iframe = document.getElementById('module-iframe');

            if (isModule) {
                overlayState = 'MODULE';
                clearTimeout(timerDelayTimeout);
                dContent.style.opacity = '0';
                setTimeout(() => dContent.style.display = 'none', 800);
                tContainer.style.opacity = '0';
                setTimeout(() => tContainer.style.display = 'none', 800);

                if(!iframe.src.includes(state.active_module)) {
                    iframe.src = state.active_module.startsWith('http') ? state.active_module : `/${state.active_module}`;
                }
                iframe.classList.add('active-module');
            } else if (isTimer && remain > 0) {
                iframe.classList.remove('active-module');

                if (overlayState === 'TITLE') {
                    fanfareFiredForTimer = false;
                    overlayState = 'WAITING_3S';
                    dContent.style.opacity = '0'; 
                    
                    timerDelayTimeout = setTimeout(() => {
                        if (overlayState === 'WAITING_3S') {
                            dContent.style.display = 'none';
                            overlayState = 'TIMER';
                            tContainer.style.display = 'flex';
                            void tContainer.offsetWidth; 
                            tContainer.style.opacity = '1'; 
                        }
                    }, 3000); 
                }

                if (overlayState === 'TIMER' || overlayState === 'WAITING_3S') {
                    if (!timerInterval) {
                        timerInterval = setInterval(() => {
                            const currentRemain = state.timer.end_time - (Date.now() / 1000);
                            
                            // ЗВУК ЗА 0.5 СЕКУНДЫ ДО КОНЦА ТАЙМЕРА (СИНХРОННО)
                            if (currentRemain <= 0.5 && !fanfareFiredForTimer && overlayState === 'TIMER') {
                                fanfareFiredForTimer = true;
                                if (myRole === 'SCREEN') { socket.emit('host_trigger_sfx', { sfx: 'fanfare' }); }
                            }
                            
                            if (currentRemain <= 0 && overlayState === 'TIMER') {
                                overlayState = 'FADING_TIMER';
                                clearInterval(timerInterval);
                                timerInterval = null;
                                tContainer.style.opacity = '0';
                                
                                setTimeout(() => {
                                    tContainer.style.display = 'none';
                                    overlayState = 'TITLE';
                                    dContent.style.display = 'block';
                                    void dContent.offsetWidth;
                                    dContent.style.opacity = '1'; 
                                    if (myRole === 'SCREEN') socket.emit('timer_done');
                                }, 1500); 
                            } else if (currentRemain > 0) {
                                document.getElementById('timer-val').innerText = formatTime(currentRemain);
                            }
                        }, 100);
                    }
                }
            } else {
                iframe.classList.remove('active-module');
                clearTimeout(timerDelayTimeout);
                
                if (overlayState !== 'TITLE' && overlayState !== 'FADING_TIMER') {
                    overlayState = 'TITLE';
                    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                    tContainer.style.opacity = '0';
                    setTimeout(() => tContainer.style.display = 'none', 800);
                    
                    dContent.style.display = 'block';
                    void dContent.offsetWidth;
                    dContent.style.opacity = '1';
                }
            }

            if (myRole === 'SCREEN' && bgAudio) {
                const trackUrl = CDN + state.current_track;
                if (!bgAudio.src.endsWith(state.current_track)) {
                    bgAudio.src = trackUrl;
                    bgAudio.currentTime = state.seek_position;
                    if (state.is_playing) { bgAudio.volume = 0; bgAudio.play().catch(()=>{}); }
                } else { applyAudioState(state); }
            }
        });

        // УПРАВЛЕНИЕ ВЕДУЩЕГО И ВЫБОР ИЗ 5 ТРЕКОВ
        function openMoodSelector(mood) {
            const names = { lounge: '🍃 Лаундж', active: '🕺 Банкет', party: '🎉 Движ' };
            document.getElementById('mood-modal-title').innerText = names[mood];
            const box = document.getElementById('mood-tracks-list');
            box.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const btn = document.createElement('button');
                btn.className = 'btn-anim mod-btn btn-gold';
                btn.innerText = `${names[mood]} — Трек ${i}`;
                btn.onclick = () => {
                    socket.emit('host_audio_control', { track_file: `${mood}${i}.mp3` });
                    closeModal('mood-selector-modal');
                };
                box.appendChild(btn);
            }
            openModal('mood-selector-modal');
        }

        function openScriptModal() {
            document.getElementById('script-iframe').src = scriptUrl;
            openModal('script-modal');
        }

        function setVol(v, btn) {
            document.querySelectorAll('.control-row:nth-child(2) .btn-control').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            socket.emit('host_audio_control', { volume: v });
        }

        function togglePlay() { socket.emit('host_audio_control', { toggle_play: true }); }
        function seekRelative(sec) { socket.emit('host_audio_control', { seek_relative: sec }); }
        function triggerSfx(type) { socket.emit('host_trigger_sfx', { sfx: type }); }

        function handleCloseClick() {
            socket.emit('switch_module', { module: '' });
            closeClickCount++;
            clearTimeout(closeClickTimer);
            if (closeClickCount >= 3) { openModal('end-event-modal'); closeClickCount = 0; }
            else { closeClickTimer = setTimeout(() => { closeClickCount = 0; }, 1200); }
        }

        function openEditEventModal() {
            closeModal('launcher-modal');
            document.getElementById('edit-title-input').value = document.getElementById('display-title').innerText;
            document.getElementById('edit-subtitle-input').value = document.getElementById('display-subtitle').innerText;
            openModal('edit-event-modal');
        }

        function saveEventInfo() {
            const title = document.getElementById('edit-title-input').value.trim();
            const subtitle = document.getElementById('edit-subtitle-input').value.trim();
            if (title) { socket.emit('update_event_info', { event_title: title, event_subtitle: subtitle }); }
            closeModal('edit-event-modal');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function confirmEnd() { socket.emit('switch_module', { module: '' }); socket.emit('host_audio_control', { toggle_play: true }); location.reload(); }
    </script>
</body>
