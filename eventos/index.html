<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Event OS — Control Center</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-black: #030712;
            --gold-main: #f59e0b;
            --gold-light: #fff3a1;
            --glass-card: rgba(15, 23, 42, 0.92);
            --glass-border: rgba(245, 158, 11, 0.3);
            --text-main: #f8fafc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* --- 1. АВТОРИЗАЦИЯ --- */
        #view-login {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
            padding: 20px;
        }

        .login-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            padding: 32px 24px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
        }

        .login-card h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.8rem;
            margin-bottom: 6px;
        }

        .login-card p {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 22px;
        }

        input.input-field {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            background: rgba(3, 7, 18, 0.8);
            color: #ffffff;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
            text-align: center;
        }

        button.btn-primary {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-main));
            color: #030712;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }

        /* --- 2. ЭКРАН ПРОЕКТОРА (ПИН 222) --- */
        #view-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            text-align: center;
            padding: 40px;
        }

        .screen-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .screen-title {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.5);
        }

        /* --- 3. ПУЛЬТ ВЕДУЩЕГО (ПИН 111) --- */
        #view-host {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
        }

        .host-interactive {
            pointer-events: auto;
        }

        /* 3A. ВЕРХНИЙ БЛОК: МУЗЫКА И НАСТРОЕНИЕ */
        #host-top-music {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 95px;
            background: rgba(3, 7, 18, 0.96);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 110;
        }

        .music-controls-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
        }

        .btn-vol {
            flex: 1;
            padding: 10px 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(30, 41, 59, 0.7);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }

        .btn-vol.active {
            background: var(--gold-main);
            color: #030712;
            border-color: var(--gold-light);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        .emotion-select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.95);
            color: var(--gold-light);
            font-size: 0.8rem;
            font-weight: 700;
            outline: none;
        }

        /* 3B. ПРАВЫЙ БЛОК: САУНДБОРД (3 ТАПА ЗАЩИТЫ) */
        #host-right-soundboard {
            position: fixed;
            top: 95px;
            right: 0;
            bottom: 0;
            width: 115px;
            background: rgba(3, 7, 18, 0.94);
            border-left: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 110;
        }

        .sfx-btn {
            width: 100%;
            padding: 14px 6px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .sfx-btn .tap-counter {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--gold-main);
        }

        .sfx-btn.tap-1 {
            border-color: #f59e0b;
            background: rgba(245, 158, 11, 0.3);
        }

        .sfx-btn.tap-2 {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.45);
        }

        /* 3C. ЦЕНТРАЛЬНАЯ СЕТКА МОДУЛЕЙ */
        #host-modules-container {
            position: fixed;
            top: 100px;
            left: 10px;
            right: 125px;
            bottom: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }

        /* --- 4. РЕЖИМ ГОСТЯ --- */
        #view-guest {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- 1. АВТОРИЗАЦИЯ -->
    <div id="view-login">
        <div class="login-card">
            <h1>EVENT OS</h1>
            <p>Система режиссуры мероприятий</p>
            <input type="password" id="input-pin" class="input-field" placeholder="ПИН-код (111 / 222)" autocomplete="off">
            <input type="text" id="input-name" class="input-field" placeholder="Ваше имя (для гостей)" autocomplete="off">
            <button class="btn-primary" onclick="submitLogin()">ВОЙТИ</button>
        </div>
    </div>

    <!-- 2. ЭКРАН ПРОЕКТОРА (ПИН 222) -->
    <div id="view-screen">
        <div class="screen-badge" id="screen-badge">Заставка</div>
        <div class="screen-title" id="screen-title">Загрузка...</div>
    </div>

    <!-- 3. ПУЛЬТ ВЕДУЩЕГО (ПИН 111) -->
    <div id="view-host">
        
        <!-- СВЕРХУ: МУЗЫКАЛЬНЫЙ БЛОК -->
        <div id="host-top-music" class="host-interactive">
            <div class="music-controls-row">
                <span style="font-size: 0.75rem; color: var(--gold-light); font-weight: 800;">🔊 ГРОМКОСТЬ:</span>
                <button class="btn-vol" onclick="setVolume(0, this)">0%</button>
                <button class="btn-vol active" onclick="setVolume(0.4, this)">40%</button>
                <button class="btn-vol" onclick="setVolume(0.7, this)">70%</button>
                <button class="btn-vol" onclick="setVolume(1.0, this)">100%</button>
            </div>
            <select class="emotion-select" onchange="setEmotion(this.value)">
                <option value="lounge">🍃 Настроение: Лаундж / Встреча</option>
                <option value="dinner">🕺 Настроение: Повеселее / Банкет</option>
                <option value="party">🎉 Настроение: Движ / Конкурсы</option>
            </select>
        </div>

        <!-- СПРАВА: САУНДБОРД (3 ТАПА) -->
        <div id="host-right-soundboard" class="host-interactive">
            <div class="sfx-btn" onclick="handleSfxTap('applause', this)">
                <span>👏 Аплодисменты</span>
                <span class="tap-counter">0/3</span>
            </div>
            <div class="sfx-btn" onclick="handleSfxTap('fanfare', this)">
                <span>🎉 Фанфары</span>
                <span class="tap-counter">0/3</span>
            </div>
            <div class="sfx-btn" onclick="handleSfxTap('correct', this)">
                <span>✅ Тыдыщ!</span>
                <span class="tap-counter">0/3</span>
            </div>
            <div class="sfx-btn" onclick="handleSfxTap('wrong', this)">
                <span>❌ Ошибка</span>
                <span class="tap-counter">0/3</span>
            </div>
        </div>

        <!-- ЦЕНТР: СЕТКА БУДУЩИХ МОДУЛЕЙ -->
        <div id="host-modules-container" class="host-interactive"></div>
    </div>

    <!-- 4. ЭКРАН ГОСТЯ -->
    <div id="view-guest">
        <h2 style="color: var(--gold-light); margin-top: 40px;">Добро пожаловать!</h2>
        <p style="color: #94a3b8; margin-top: 10px;">Ожидайте запуска интерактивов от Ведущего.</p>
    </div>

    <script>
        const socket = io();
        let currentRole = null;

        const sfxTaps = {};
        const sfxTimers = {};

        function submitLogin() {
            const pin = document.getElementById('input-pin').value;
            const name = document.getElementById('input-name').value;
            socket.emit('login', { pin: pin, name: name });
        }

        socket.on('login_response', (data) => {
            if (data.success) {
                document.getElementById('view-login').style.display = 'none';
                currentRole = data.role;

                if (currentRole === 'HOST') {
                    document.getElementById('view-screen').style.display = 'flex';
                    document.getElementById('view-host').style.display = 'block';
                } else if (currentRole === 'SCREEN') {
                    document.getElementById('view-screen').style.display = 'flex';
                } else {
                    document.getElementById('view-guest').style.display = 'block';
                }
            }
        });

        socket.on('state_update', (state) => {
            document.getElementById('screen-title').innerText = state.screen_text;
            document.getElementById('screen-badge').innerText = state.screen_badge;
        });

        // --- ЛОГИКА МУЗЫКИ ---
        function setVolume(vol, btn) {
            document.querySelectorAll('.btn-vol').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            socket.emit('host_audio_control', { volume: vol });
        }

        function setEmotion(emotion) {
            socket.emit('host_audio_control', { emotion: emotion });
        }

        // --- ЗАЩИТА 3-Х ТАПОВ СAУНДБОРДА ---
        function handleSfxTap(sfxType, btnEl) {
            if (!sfxTaps[sfxType]) sfxTaps[sfxType] = 0;
            
            sfxTaps[sfxType]++;
            const counterEl = btnEl.querySelector('.tap-counter');
            
            clearTimeout(sfxTimers[sfxType]);

            if (sfxTaps[sfxType] === 1) {
                btnEl.classList.add('tap-1');
                counterEl.innerText = '1/3';
            } else if (sfxTaps[sfxType] === 2) {
                btnEl.classList.remove('tap-1');
                btnEl.classList.add('tap-2');
                counterEl.innerText = '2/3';
            } else if (sfxTaps[sfxType] >= 3) {
                // 3-й ТАП: Отправка сигнала!
                socket.emit('host_trigger_sfx', { sfx: sfxType });
                
                sfxTaps[sfxType] = 0;
                btnEl.classList.remove('tap-1', 'tap-2');
                counterEl.innerText = '0/3';
                return;
            }

            // Таймер 1.5 секунды на повторный тап
            sfxTimers[sfxType] = setTimeout(() => {
                sfxTaps[sfxType] = 0;
                btnEl.classList.remove('tap-1', 'tap-2');
                counterEl.innerText = '0/3';
            }, 1500);
        }

        socket.on('play_sfx_on_screen', (data) => {
            if (currentRole === 'SCREEN' || currentRole === 'HOST') {
                console.log("🔊 Воспроизведение SFX:", data.sfx);
            }
        });
    </script>
</body>
</html>
