<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Standard OS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-black: #030712;
            --gold-light: #fff3a1;
            --gold-main: #f59e0b;
            --gold-dark: #b45309;
            --glass-card: rgba(15, 23, 42, 0.94);
            --glass-border: rgba(245, 158, 11, 0.35);
            --danger-red: #ef4444;
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            --top-height: 110px;
            --bottom-height: 115px;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; font-family: var(--ios-font);
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }

        body { background: var(--bg-black); color: #f8fafc; min-height: 100vh; overflow: hidden; position: relative; }

        /* CANVAS PARTICLES (120 FPS) */
        #particles-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .bg-glow { position: fixed; inset: 0; z-index: 2; background: radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.12) 0%, rgba(3, 7, 18, 0.96) 75%, #000000 100%); pointer-events: none; }

        /* FLASH EFFECT */
        #flash-overlay { position: fixed; inset: 0; z-index: 99998; background: #ffffff; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }

        /* AUTH CARD */
        #auth-overlay { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card {
            background: var(--glass-card); border: 1px solid var(--glass-border); padding: 36px 28px;
            border-radius: 28px; width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 0 60px rgba(245, 158, 11, 0.25), 0 20px 40px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(25px); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .auth-card.shake { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; border-color: var(--danger-red); }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
            40%, 60% { transform: translate3d(7px, 0, 0); }
        }

        .brand-header {
            font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #fff3a1 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px rgba(245, 158, 11, 0.4);
            cursor: pointer; display: inline-block; transition: transform 0.2s ease, opacity 0.3s ease;
        }
        .brand-header:active { transform: scale(0.92); }

        .auth-sub { color: #94a3b8; font-size: 0.85rem; margin: 12px 0 0; }
        
        #pin-container { 
            max-height: 0; opacity: 0; overflow: hidden; 
            transition: max-height 0.4s ease, opacity 0.4s ease, margin-top 0.4s ease; 
        }
        #pin-container.active { max-height: 200px; opacity: 1; margin-top: 20px; }

        .auth-input {
            width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--glass-border);
            background: rgba(3, 7, 18, 0.8); color: #fff; text-align: center; font-size: 1.2rem; font-weight: 800; outline: none; letter-spacing: 6px;
            user-select: text; -webkit-user-select: text;
        }
        .btn-gold {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-main) 100%);
            color: #000; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 12px;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3); transition: transform 0.15s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-gold:active { transform: scale(0.97); }

        /* HOST TOP CONTROL BAR */
        #host-top-bar {
            display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--top-height); z-index: 500;
            background: rgba(15, 23, 42, 0.96); border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px); padding: 8px 14px; flex-direction: column; gap: 6px; justify-content: center;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .btn-control {
            flex: 1; height: 36px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(30, 41, 59, 0.7); color: #ffffff; font-size: 0.78rem; font-weight: 800; cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-control:active { transform: scale(0.95); }
        .btn-control.active { background: var(--gold-main); color: #000; border-color: var(--gold-light); box-shadow: 0 0 12px rgba(245, 158, 11, 0.4); }

        .seek-container { display: flex; align-items: center; gap: 8px; width: 100%; margin: 1px 0; }
        .seek-bar {
            flex: 1; -webkit-appearance: none; height: 5px; border-radius: 3px;
            background: rgba(255, 255, 255, 0.15); outline: none; cursor: pointer;
        }
        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
            background: var(--gold-main); cursor: pointer; box-shadow: 0 0 8px var(--gold-main);
        }

        .eq-bar-container { display: flex; align-items: flex-end; gap: 3px; height: 14px; }
        .eq-bar { width: 3px; background: var(--gold-main); border-radius: 2px; animation: eqAnim 1s ease-in-out infinite alternate; }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes eqAnim { 0% { height: 3px; } 100% { height: 14px; } }

        /* HOST BOTTOM BAR */
        #host-bottom-bar {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-height); z-index: 500;
            background: rgba(15, 23, 42, 0.98); border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(20px); padding: 8px 14px; flex-direction: column; gap: 6px; justify-content: center;
        }
        .launcher-row { display: flex; gap: 6px; width: 100%; }
        .btn-launch-trigger {
            flex: 1; height: 42px; border-radius: 12px; border: 1px solid var(--gold-main);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25) 0%, rgba(180, 83, 9, 0.25) 100%);
            color: var(--gold-light); font-weight: 800; font-size: 0.85rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-close-interactive {
            display: inline-flex; flex: 1; height: 42px; border-radius: 12px; border: 1px solid var(--danger-red);
            background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-weight: 800; font-size: 0.85rem; cursor: pointer;
            align-items: center; justify-content: center; gap: 6px;
        }

        .sfx-grid { display: flex; gap: 6px; width: 100%; }
        .sfx-btn {
            flex: 1; height: 42px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(30, 41, 59, 0.8); color: #fff; font-size: 0.78rem; font-weight: 800; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 4px;
            transition: transform 0.15s ease;
        }
        .sfx-btn:active { transform: scale(0.95); }
        .btn-logout {
            width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.15); color: #fca5a5; font-size: 1rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        /* MODALS */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 20000;
            background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(20px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-card {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 26px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.9);
        }
        .modules-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
        .mod-btn {
            padding: 15px; border-radius: 14px; border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.8); color: #fff; font-size: 0.92rem; font-weight: 800; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }

        /* MAIN VIEWPORT (FULLSCREEN GEOMETRY) */
        #main-viewport {
            position: fixed; inset: 0; z-index: 10; width: 100vw; height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* HOST SPECIFIC IFRAME GEOMETRY */
        body.is-host #module-iframe {
            position: fixed;
            top: var(--top-height) !important;
            bottom: var(--bottom-height) !important;
            left: 0 !important; right: 0 !important;
            width: 100vw !important;
            height: calc(100vh - var(--top-height) - var(--bottom-height)) !important;
        }

        #module-iframe {
            display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; border: none; z-index: 15; background: #000;
        }

        #main-display-content {
            text-align: center; max-width: 600px; width: 100%; padding: 20px; z-index: 10;
        }
        .shimmer-title {
            font-family: 'Cinzel', serif; font-size: 3.2rem; font-weight: 900;
            background: linear-gradient(90deg, #fff3a1 0%, #f59e0b 30%, #ffffff 50%, #f59e0b 70%, #fff3a1 100%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite; text-shadow: 0 0 35px rgba(245, 158, 11, 0.4);
        }
        @keyframes shine { to { background-position: 200% center; } }

        .subtitle-text { color: #94a3b8; font-size: 1.15rem; font-weight: 600; margin-top: 14px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <!-- PARTICLES & GLOW -->
    <canvas id="particles-canvas"></canvas>
    <div class="bg-glow"></div>
    <div id="flash-overlay"></div>

    <!-- AUTH CARD -->
    <div id="auth-overlay">
        <div class="auth-card" id="auth-card">
            <div class="brand-header" id="brand-logo" onclick="handleLogoTap()">FAMILY STANDARD</div>
            <p class="auth-sub" id="auth-sub">Нажмите 3 раза для активации OS</p>

            <div id="pin-container">
                <input type="password" id="auth-input" class="auth-input" placeholder="ПИН-КОД" maxlength="6" autocomplete="off" onkeydown="if(event.key==='Enter') submitAuth()">
                <button onclick="submitAuth()" class="btn-gold">ВОЙТИ В УПРАВЛЕНИЕ</button>
            </div>
        </div>
    </div>

    <!-- HOST TOP CONTROL BAR -->
    <div id="host-top-bar">
        <div class="control-row">
            <div class="eq-bar-container">
                <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
            </div>
            <span style="font-size: 0.72rem; color: var(--gold-light); font-weight: 800; margin-right: auto; margin-left: 6px;">ГРОМКОСТЬ:</span>
            <button class="btn-control" onclick="setVolumeSmooth(0.1, this)">10%</button>
            <button class="btn-control" onclick="setVolumeSmooth(0.2, this)">20%</button>
            <button class="btn-control active" onclick="setVolumeSmooth(0.3, this)">30%</button>
            <button class="btn-control" onclick="setVolumeSmooth(0.6, this)">60%</button>
            <button class="btn-control" onclick="setVolumeSmooth(1.0, this)">100%</button>
        </div>

        <div class="seek-container">
            <span style="font-size: 0.68rem; color: #94a3b8; font-weight: 700;">ПЕРЕМОТКА:</span>
            <input type="range" id="host-seek-bar" class="seek-bar" min="0" max="180" value="0" onchange="seekAudioTrack(this.value)">
        </div>

        <div class="control-row">
            <button class="btn-control" onclick="setMood('lounge')">🍃 Лаундж</button>
            <button class="btn-control" onclick="setMood('active')">🕺 Банкет</button>
            <button class="btn-control" onclick="setMood('party')">🎉 Движ</button>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div id="main-viewport">
        <iframe id="module-iframe" src="about:blank"></iframe>
        
        <div id="main-display-content">
            <h1 class="shimmer-title" id="display-title">FAMILY STANDARD OS</h1>
            <p class="subtitle-text" id="display-subtitle">С праздником!</p>
        </div>
    </div>

    <!-- LAUNCHER MODAL -->
    <div class="modal-overlay" id="launcher-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 1.3rem;">➕ Выбор интерактива</h3>
            <div class="modules-grid" id="modules-list-box"></div>
            <button onclick="closeLauncherModal()" style="width: 100%; padding: 12px; border-radius: 12px; border: none; background: transparent; color: #94a3b8; margin-top: 14px; cursor: pointer; font-weight: 700;">Закрыть</button>
        </div>
    </div>

    <!-- LOGOUT CONFIRM MODAL -->
    <div class="modal-overlay" id="logout-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 1.2rem;">🚪 Завершение сессии</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 10px;">Завершить рабочую сессию и выйти из пульта управления?</p>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="confirmLogout()" class="btn-gold" style="margin: 0; background: var(--danger-red); color: #fff;">Завершить</button>
                <button onclick="closeLogoutModal()" style="flex: 1; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #fff; font-weight: 700; cursor: pointer;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- HOST BOTTOM BAR -->
    <div id="host-bottom-bar">
        <div class="launcher-row">
            <button class="btn-launch-trigger" onclick="openLauncherModal()">
                <span>➕</span><span>ВЫБРАТЬ ИНТЕРАКТИВ</span>
            </button>
            <button class="btn-close-interactive" onclick="closeActiveInteractive()">
                <span>❌</span><span>ЗАКРЫТЬ ИНТЕРАКТИВ</span>
            </button>
        </div>
        <div class="sfx-grid">
            <button class="sfx-btn" onclick="triggerSfx('applause')"><span>👏</span><span>Аплодисменты</span></button>
            <button class="sfx-btn" onclick="triggerSfx('correct')"><span>✅</span><span>Тыдыщ!</span></button>
            <button class="sfx-btn" onclick="triggerSfx('wrong')"><span>❌</span><span>Ошибка</span></button>
            <button class="btn-logout" onclick="openLogoutModal()" title="Завершить сессию">🚪</button>
        </div>
    </div>

    <!-- DUAL AUDIO PLAYERS -->
    <audio id="audio-a" loop></audio>
    <audio id="audio-b" loop></audio>

    <script>
        const RENDER_SERVER_URL = "https://event-os-wqoa.onrender.com";

        const socket = io(RENDER_SERVER_URL, { 
            transports: ['polling', 'websocket'],
            reconnection: true,
            reconnectionAttempts: 10
        });

        let tapCount = 0, tapTimer = null;
        let myRole = 'GUEST';
        let currentLoadedModule = '';
        let availableModules = [];
        let activePin = '';

        const audioA = document.getElementById('audio-a');
        const audioB = document.getElementById('audio-b');
        let activeAudio = audioA;
        let inactiveAudio = audioB;
        let masterVolume = 0.3;
        let volumeFadeInterval = null;

        // --- 1. PARTICLES (120 FPS) ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.6 + 0.1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(245, 158, 11, ${this.alpha})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < 45; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        // --- 2. AUTO SESSION RESTORE ---
        socket.on('connect', () => {
            const savedSession = localStorage.getItem('eventos_active_session');
            if (savedSession) {
                try {
                    const sessData = JSON.parse(savedSession);
                    if (sessData.pin) {
                        activePin = sessData.pin;
                        socket.emit('login', { pin: sessData.pin });
                    }
                } catch(e) {}
            }
        });

        // --- 3. 3 TAPS BURST & LOGIC ---
        function handleLogoTap() {
            tapCount++; clearTimeout(tapTimer);
            const logo = document.getElementById('brand-logo');
            
            if (logo) logo.style.transform = `scale(${1 + tapCount * 0.08})`;

            if (tapCount >= 3) {
                const flash = document.getElementById('flash-overlay');
                if (flash) {
                    flash.style.opacity = '0.9';
                    setTimeout(() => flash.style.opacity = '0', 300);
                }
                
                logo.style.opacity = '0';
                setTimeout(() => {
                    logo.innerText = 'EVENT OS';
                    logo.style.opacity = '1';
                }, 150);

                document.getElementById('auth-sub').innerText = 'Введите PIN-код для входа';
                document.getElementById('pin-container').classList.add('active');
                document.getElementById('auth-input').focus();

                tapCount = 0;
            } else { 
                tapTimer = setTimeout(() => { 
                    tapCount = 0; 
                    if (logo) logo.style.transform = 'scale(1)';
                }, 1200); 
            }
        }

        function triggerErrorShake() {
            const card = document.getElementById('auth-card');
            if (card) {
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function submitAuth() {
            const input = document.getElementById('auth-input');
            const val = input ? input.value.trim() : '';

            if (!val) {
                triggerErrorShake();
                return;
            }

            activePin = val;
            socket.emit('login', { pin: val });
        }

        // --- 4. SOCKET RESPONSES & SESSION SAVE ---
        socket.on('login_response', (res) => {
            if (res.success) {
                myRole = res.role;
                
                localStorage.setItem('eventos_active_session', JSON.stringify({
                    role: myRole,
                    pin: activePin
                }));

                document.getElementById('auth-overlay').style.display = 'none';

                if (myRole === 'HOST') {
                    document.body.classList.add('is-host');
                    document.getElementById('host-top-bar').style.display = 'flex';
                    document.getElementById('host-bottom-bar').style.display = 'flex';
                } else if (myRole === 'SCREEN') {
                    document.body.classList.add('is-screen');
                }
            } else {
                localStorage.removeItem('eventos_active_session');
                triggerErrorShake();
                alert(res.message || 'Ошибка доступа');
            }
        });

        socket.on('modules_config_update', (modules) => {
            availableModules = modules;
            renderModulesList();
        });

        function renderModulesList() {
            const box = document.getElementById('modules-list-box');
            if (!box) return;
            box.innerHTML = '';
            availableModules.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'mod-btn';
                btn.innerText = m.name;
                btn.onclick = () => {
                    socket.emit('switch_module', { module: m.path });
                    closeLauncherModal();
                };
                box.appendChild(btn);
            });
        }

        socket.on('state_update', (state) => {
            if (state.event_title) document.getElementById('display-title').innerText = state.event_title;
            if (state.event_subtitle) document.getElementById('display-subtitle').innerText = state.event_subtitle;

            if (masterVolume !== state.audio_volume) {
                applySmoothVolumeTransition(state.audio_volume);
            }

            if (state.active_module !== undefined && currentLoadedModule !== state.active_module) {
                loadModuleIframe(state.active_module);
            }

            if (myRole === 'SCREEN') {
                const trackUrl = RENDER_SERVER_URL + state.current_track;
                const targetTime = state.seek_position || 0;

                if (activeAudio.src !== trackUrl || Math.abs(activeAudio.currentTime - targetTime) > 3) {
                    performAudioCrossfade(trackUrl, targetTime);
                } else {
                    if (state.is_playing && activeAudio.paused) activeAudio.play().catch(() => {});
                }
            }
        });

        function applySmoothVolumeTransition(targetVol) {
            masterVolume = targetVol;
            if (myRole !== 'SCREEN') return;

            clearInterval(volumeFadeInterval);
            const startVol = activeAudio.volume;
            const diff = targetVol - startVol;
            let step = 0;
            const steps = 20;

            volumeFadeInterval = setInterval(() => {
                step++;
                const currentStepVol = Math.max(0, Math.min(1, startVol + (diff * (step / steps))));
                activeAudio.volume = currentStepVol;

                if (step >= steps) {
                    clearInterval(volumeFadeInterval);
                    activeAudio.volume = targetVol;
                }
            }, 25);
        }

        function performAudioCrossfade(newTrackUrl, targetTime) {
            inactiveAudio.src = newTrackUrl;
            inactiveAudio.volume = 0;
            inactiveAudio.currentTime = targetTime;

            inactiveAudio.play().then(() => {
                let step = 0;
                const steps = 24;
                const crossfadeInterval = setInterval(() => {
                    step++;
                    const progress = step / steps;
                    
                    activeAudio.volume = Math.max(0, masterVolume * (1 - progress));
                    inactiveAudio.volume = Math.min(masterVolume, masterVolume * progress);

                    if (step >= steps) {
                        clearInterval(crossfadeInterval);
                        activeAudio.pause();
                        
                        const temp = activeAudio;
                        activeAudio = inactiveAudio;
                        inactiveAudio = temp;
                    }
                }, 50);
            }).catch(() => {});
        }

        socket.on('play_sfx_stream', (data) => {
            if (myRole === 'SCREEN') {
                const sfxAudio = new Audio(RENDER_SERVER_URL + data.file);
                sfxAudio.volume = data.volume;
                sfxAudio.play().catch(() => {});
            }
        });

        function loadModuleIframe(modulePath) {
            currentLoadedModule = modulePath;
            const iframe = document.getElementById('module-iframe');
            const displayContent = document.getElementById('main-display-content');

            if (modulePath && modulePath.length > 0) {
                iframe.src = modulePath.startsWith('http') ? modulePath : `/${modulePath}`;
                iframe.style.display = 'block';
                displayContent.style.display = 'none';
            } else {
                iframe.style.display = 'none';
                iframe.src = 'about:blank';
                displayContent.style.display = 'block';
            }
        }

        // --- 5. HOST CONTROLS & LOGOUT ---
        function setVolumeSmooth(vol, btn) {
            document.querySelectorAll('#host-top-bar .btn-control').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            socket.emit('host_audio_control', { volume: vol });
        }

        function setMood(mood) { socket.emit('host_audio_control', { mood: mood }); }
        function seekAudioTrack(seekTimeSeconds) { socket.emit('host_audio_control', { seek: seekTimeSeconds }); }
        function triggerSfx(sfxType) { socket.emit('host_trigger_sfx', { sfx: sfxType }); }
        function closeActiveInteractive() { socket.emit('switch_module', { module: '' }); }

        function openLauncherModal() { document.getElementById('launcher-modal').style.display = 'flex'; }
        function closeLauncherModal() { document.getElementById('launcher-modal').style.display = 'none'; }
        
        function openLogoutModal() { document.getElementById('logout-modal').style.display = 'flex'; }
        function closeLogoutModal() { document.getElementById('logout-modal').style.display = 'none'; }
        
        function confirmLogout() {
            localStorage.removeItem('eventos_active_session');
            location.reload();
        }
    </script>
</body>
</html>
