<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Standard OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-black: #030712; --gold-light: #fffbeb; --gold-main: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.4); --glass-card: rgba(15, 23, 42, 0.95);
            --glass-border: rgba(229, 231, 235, 0.2); --danger-red: #ef4444;
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            --top-bar-height: 145px; --bottom-bar-height: 95px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--ios-font); user-select: none; }
        body { background: var(--bg-black); color: #f8fafc; min-height: 100vh; overflow: hidden; position: relative; }

        /* ФОН, ЦЕНТРАЛЬНОЕ СВЕЧЕНИЕ И ЧАСТИЦЫ */
        .bg-glow { position: fixed; inset: 0; z-index: 1; background: #000000; pointer-events: none; }
        .center-glow { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 70vw; height: 70vw; 
            background: radial-gradient(circle, rgba(245, 158, 11, 0.25) 0%, rgba(245, 158, 11, 0.05) 40%, transparent 70%); 
            pointer-events: none; z-index: 2; 
        }
        #particles-canvas { position: fixed; inset: 0; z-index: 3; pointer-events: none; }

        /* АВТОРИЗАЦИЯ */
        #auth-overlay { position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: var(--glass-card); border: 1px solid var(--glass-border); padding: 32px 26px; border-radius: 24px; width: 100%; max-width: 350px; text-align: center; box-shadow: 0 0 40px var(--gold-glow); z-index: 10001; }
        .brand-header { font-family: 'Cinzel', serif; font-size: 2.2rem; font-weight: 900; background: linear-gradient(135deg, #ffffff 0%, #fffbeb 30%, #e5e7eb 65%, #f59e0b 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .auth-input { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(3, 7, 18, 0.85); color: #fff; text-align: center; font-size: 1.2rem; font-weight: 800; margin: 15px 0; outline: none; letter-spacing: 6px; user-select: text; }
        .btn-gold { width: 100%; padding: 15px; border-radius: 12px; border: none; background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 40%, var(--gold-main) 100%); color: #000; font-weight: 800; cursor: pointer; }

        /* ПУЛЬТ: ВЕРХ */
        #host-top-bar { display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--top-bar-height); z-index: 500; background: rgba(15, 23, 42, 0.97); border-bottom: 1px solid var(--glass-border); padding: 12px; flex-direction: column; gap: 10px; justify-content: center; }
        .control-row { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
        .btn-control { flex: 1; height: 36px; border-radius: 8px; border: 1px solid rgba(229, 231, 235, 0.18); background: rgba(30, 41, 59, 0.7); color: #ffffff; font-size: 0.85rem; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .btn-control.active { background: linear-gradient(135deg, #ffffff 0%, var(--gold-main) 100%); color: #000; border-color: #ffffff; }
        
        .seek-btn { flex: 1; height: 42px; border-radius: 10px; background: rgba(30, 41, 59, 0.85); color: #fff; font-size: 1.4rem; border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .play-btn { flex: 1.5; background: rgba(245, 158, 11, 0.2); color: var(--gold-light); border-color: var(--gold-main); }

        /* ПУЛЬТ: НИЗ */
        #host-bottom-bar { display: none; position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-bar-height); z-index: 500; background: rgba(15, 23, 42, 0.98); border-top: 1px solid var(--glass-border); padding: 8px 12px; flex-direction: column; gap: 8px; justify-content: center; }
        .btn-action { flex: 1; height: 36px; border-radius: 8px; border: 1px solid var(--glass-border); font-weight: 800; font-size: 0.78rem; cursor: pointer; }
        .btn-action.gold { background: rgba(245, 158, 11, 0.2); color: var(--gold-light); border-color: var(--gold-main); }
        .btn-action.red { background: rgba(239, 68, 68, 0.2); color: #fca5a5; border-color: var(--danger-red); }

        /* ЭКРАН ПРОЕКТОРА */
        #main-viewport { display: none; position: fixed; inset: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        
        /* Плавное исчезновение/появление Iframe */
        body.is-host #module-iframe { top: var(--top-bar-height) !important; bottom: var(--bottom-bar-height) !important; height: calc(100vh - var(--top-bar-height) - var(--bottom-bar-height)) !important; }
        #module-iframe { display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; border: none; z-index: 15; background: #000; opacity: 0; transition: opacity 1s ease-in-out; }
        
        #main-display-content { text-align: center; z-index: 10; transition: opacity 1s ease-in-out; opacity: 1; }
        .shimmer-title { font-family: 'Cinzel', serif; font-size: 3.2rem; font-weight: 900; background: linear-gradient(90deg, #ffffff 0%, #fffbeb 25%, #f59e0b 50%, #e5e7eb 75%, #ffffff 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 4s linear infinite; }
        @keyframes shine { to { background-position: 200% center; } }
        .subtitle-text { color: #94a3b8; font-size: 1.15rem; font-weight: 600; margin-top: 10px; }

        /* ТАЙМЕР */
        #full-screen-timer { display: none; position: fixed; inset: 0; z-index: 900; align-items: center; justify-content: center; transition: opacity 1s ease-in-out; opacity: 0; }
        .timer-huge-text { font-family: 'Cinzel', serif; font-size: 22vw; font-weight: 900; color: #ffffff; text-shadow: 0 0 40px var(--gold-glow); }

        /* ЭКВАЛАЙЗЕР */
        #eq-canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 160px; z-index: 5; pointer-events: none; opacity: 0.7; }

        /* МОДАЛКИ */
        .modal-overlay { display: none; position: fixed; inset: 0; z-index: 20000; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 20px; }
        .modal-card { background: var(--glass-card); padding: 24px; border-radius: 20px; width: 100%; max-width: 360px; border: 1px solid var(--glass-border); text-align: center; }
        .mod-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(30, 41, 59, 0.8); color: #fff; font-weight: 800; margin-top: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>
    <div class="center-glow"></div>
    <canvas id="particles-canvas"></canvas>

    <div id="auth-overlay">
        <div class="auth-card" id="auth-card">
            <div class="brand-header">EVENT OS</div>
            <input type="password" id="auth-input" class="auth-input" placeholder="ПИН-КОД">
            <button onclick="submitAuth()" class="btn-gold">ВОЙТИ</button>
        </div>
    </div>

    <!-- ПУЛЬТ ВЕДУЩЕГО -->
    <div id="host-top-bar">
        <div class="control-row">
            <!-- Изменено 0% на 3% -->
            <button class="btn-control" onclick="setVol(0.03, this)">3%</button>
            <button class="btn-control" onclick="setVol(0.1, this)">10%</button>
            <button class="btn-control active" onclick="setVol(0.3, this)">30%</button>
            <button class="btn-control" onclick="setVol(0.6, this)">60%</button>
            <button class="btn-control" onclick="setVol(1.0, this)">100%</button>
        </div>
        
        <div class="control-row">
            <button class="btn-control" onclick="setMood('lounge')">🍃 Лаундж</button>
            <button class="btn-control" onclick="setMood('active')">🕺 Банкет</button>
            <button class="btn-control" onclick="setMood('party')">🎉 Движ</button>
        </div>

        <div class="control-row">
            <div class="seek-btn" onclick="seekRelative(-60)">⏪</div>
            <div class="seek-btn play-btn" id="btn-play-toggle" onclick="togglePlay()">⏯</div>
            <div class="seek-btn" onclick="seekRelative(60)">⏩</div>
        </div>
    </div>

    <!-- ЭКРАН ПРОЕКТОРА -->
    <div id="main-viewport">
        <canvas id="eq-canvas"></canvas>
        <div id="full-screen-timer"><div class="timer-huge-text" id="timer-val">00:00</div></div>
        
        <!-- Iframe для интерактивов с opacity -->
        <iframe id="module-iframe" src="about:blank"></iframe>
        
        <div id="main-display-content">
            <h1 class="shimmer-title" id="display-title">FAMILY STANDARD OS</h1>
            <p class="subtitle-text" id="display-subtitle">С праздником!</p>
        </div>
    </div>

    <!-- НИЖНЯЯ ПАНЕЛЬ -->
    <div id="host-bottom-bar">
        <div class="control-row">
            <button class="btn-action gold" onclick="openModal('launcher-modal')">ИНТЕРАКТИВ</button>
            <button class="btn-action red" onclick="handleCloseClick()">ЗАКРЫТЬ</button>
            <button class="btn-action gold" onclick="socket.emit('add_timer_10s')" style="flex: 0.6;">+10 СЕК</button>
        </div>
        <div class="control-row">
            <!-- Заменили fanfare на Джингл (Подарки) 🎁 -->
            <button class="seek-btn" onclick="triggerSfx('jingle')" style="font-size:1.2rem">🎁</button>
            <button class="seek-btn" onclick="triggerSfx('applause')" style="font-size:1.2rem">👏</button>
            <button class="seek-btn" onclick="triggerSfx('correct')" style="font-size:1.2rem">✅</button>
            <button class="seek-btn" onclick="triggerSfx('wrong')" style="font-size:1.2rem">❌</button>
        </div>
    </div>

    <!-- МОДАЛКИ -->
    <div class="modal-overlay" id="launcher-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light);">Интерактивы</h3>
            <div id="modules-list-box"></div>
            <button onclick="closeModal('launcher-modal')" style="background: transparent; color: #94a3b8; border: none; margin-top: 15px; font-weight: bold; cursor: pointer;">Отмена</button>
        </div>
    </div>

    <div class="modal-overlay" id="end-event-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light);">Завершить праздник?</h3>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="confirmEnd()" class="btn-gold" style="margin: 0; background: var(--danger-red); color: #fff;">Завершить</button>
                <button onclick="closeModal('end-event-modal')" style="flex: 1; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; border-radius: 12px;">Отмена</button>
            </div>
        </div>
    </div>

    <audio id="bg-audio" loop></audio>

    <script>
        const socket = io("https://event-os-wqoa.onrender.com", { transports: ['websocket', 'polling'] });
        const CDN = "https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/";

        let myRole = 'GUEST';
        let timerInterval = null;
        let timerDelayTimeout = null;
        let overlayState = 'TITLE'; // 'TITLE', 'WAITING_3S', 'TIMER', 'FADING_TIMER', 'MODULE'
        
        let closeClickCount = 0;
        let closeClickTimer = null;

        // --- Улучшенный Плавный Аудио-движок ---
        const bgAudio = document.getElementById('bg-audio');
        let targetVolume = 0.3;      
        let actualVolumeTarget = 0;  
        let isFadingToSeek = false;
        let pendingSeekTime = 0;
        
        let eqIsPlaying = false;
        let eqVolume = 0.3;

        // --- ЧАСТИЦЫ (Увеличено до 100) ---
        const pCanvas = document.getElementById('particles-canvas');
        const pCtx = pCanvas.getContext('2d');
        let particles = [];
        function resizePCanvas() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
        window.addEventListener('resize', resizePCanvas);
        resizePCanvas();
        class Particle {
            constructor() { this.reset(); }
            reset() { this.x = Math.random() * pCanvas.width; this.y = Math.random() * pCanvas.height; this.size = Math.random() * 2.5 + 0.5; this.speedX = (Math.random() - 0.5) * 0.4; this.speedY = (Math.random() - 0.5) * 0.4; this.alpha = Math.random() * 0.7 + 0.1; }
            update() { this.x += this.speedX; this.y += this.speedY; if (this.x < 0 || this.x > pCanvas.width || this.y < 0 || this.y > pCanvas.height) this.reset(); }
            draw() { pCtx.fillStyle = `rgba(245, 158, 11, ${this.alpha})`; pCtx.beginPath(); pCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2); pCtx.fill(); }
        }
        for (let i = 0; i < 100; i++) particles.push(new Particle());
        function animateParticles() { pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height); particles.forEach(p => { p.update(); p.draw(); }); requestAnimationFrame(animateParticles); }
        requestAnimationFrame(animateParticles);

        // --- ЭКВАЛАЙЗЕР (Выше и чувствительнее) ---
        const eqCanvas = document.getElementById('eq-canvas');
        const eqCtx = eqCanvas.getContext('2d');
        function resizeEqCanvas() { eqCanvas.width = window.innerWidth; }
        window.addEventListener('resize', resizeEqCanvas);
        resizeEqCanvas();
        let eqBars = Array.from({length: 70}, () => Math.random());
        function drawEq() {
            eqCtx.clearRect(0, 0, eqCanvas.width, eqCanvas.height);
            const barWidth = eqCanvas.width / eqBars.length;
            for(let i = 0; i < eqBars.length; i++) {
                // Более чувствительная реакция: умножаем на 200 и добавляем 0.2 к громкости базы
                let targetH = eqIsPlaying ? (Math.random() * 220 * (eqVolume + 0.15)) : 2;
                eqBars[i] += (targetH - eqBars[i]) * 0.2; 
                let h = eqBars[i];
                eqCtx.fillStyle = 'rgba(245, 158, 11, 0.4)';
                eqCtx.fillRect(i * barWidth + 1, eqCanvas.height - h, barWidth - 2, h);
            }
            setTimeout(() => requestAnimationFrame(drawEq), 40);
        }
        drawEq();

        // --- АВТОРИЗАЦИЯ ---
        function submitAuth() {
            const val = document.getElementById('auth-input').value.trim();
            if(!val) return;
            bgAudio.load();
            bgAudio.play().then(()=>bgAudio.pause()).catch(()=>{});
            socket.emit('login', { pin: val });
        }

        socket.on('login_response', (res) => {
            if (res.success) {
                myRole = res.role;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-viewport').style.display = 'flex';

                if (myRole === 'HOST') {
                    document.body.classList.add('is-host');
                    document.getElementById('host-top-bar').style.display = 'flex';
                    document.getElementById('host-bottom-bar').style.display = 'flex';
                    bgAudio.remove(); 
                } else if (myRole === 'SCREEN') {
                    document.body.classList.add('is-screen');
                    bgAudio.onloadedmetadata = () => socket.emit('sync_duration', { duration: bgAudio.duration });
                    setInterval(() => {
                        if(!bgAudio.paused) socket.emit('screen_sync_time', { current_time: bgAudio.currentTime });
                    }, 1000);
                }
            } else {
                alert('Неверный PIN-код');
            }
        });

        socket.on('modules_config_update', (modules) => {
            const box = document.getElementById('modules-list-box');
            box.innerHTML = '';
            modules.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'mod-btn';
                btn.innerText = m.name;
                btn.onclick = () => { socket.emit('switch_module', { module: m.path }); closeModal('launcher-modal'); };
                box.appendChild(btn);
            });
        });

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
        }

        // --- СВЕРХПЛАВНЫЙ АУДИО-ДВИЖОК (25ms цикл, шаг 0.02) ---
        setInterval(() => {
            if (!bgAudio || myRole !== 'SCREEN') return;

            let curr = bgAudio.volume;
            let diff = actualVolumeTarget - curr;

            if (Math.abs(diff) > 0.02) {
                bgAudio.volume += Math.sign(diff) * 0.02;
            } else {
                bgAudio.volume = actualVolumeTarget;

                if (actualVolumeTarget === 0) {
                    if (isFadingToSeek) {
                        bgAudio.currentTime = pendingSeekTime; 
                        isFadingToSeek = false;
                        actualVolumeTarget = targetVolume; // Плавно нарастает обратно
                    } else if (!eqIsPlaying && !bgAudio.paused) {
                        bgAudio.pause(); // Ставим паузу только когда звук полностью затух
                    }
                }
            }
        }, 25);

        function applyAudioState(state) {
            if (!bgAudio) return;
            let desiredVolume = state.is_playing ? targetVolume : 0;
            let needsSeek = Math.abs(bgAudio.currentTime - state.seek_position) > 2.5;

            if (needsSeek && state.is_playing) {
                isFadingToSeek = true;
                pendingSeekTime = state.seek_position;
                actualVolumeTarget = 0; // Начинаем фейд вниз
            } else if (!isFadingToSeek) {
                actualVolumeTarget = desiredVolume;
                
                if (state.is_playing && bgAudio.paused) {
                    bgAudio.volume = 0; 
                    bgAudio.play().catch(()=>{});
                }
            }
        }

        socket.on('state_update', (state) => {
            document.getElementById('display-title').innerText = state.event_title;
            document.getElementById('display-subtitle').innerText = state.event_subtitle;
            eqIsPlaying = state.is_playing;
            targetVolume = state.audio_volume;

            const isModule = state.active_module && state.active_module !== '';
            const isTimer = state.timer && state.timer.active;
            const remain = isTimer ? (state.timer.end_time - (Date.now() / 1000)) : 0;
            const dContent = document.getElementById('main-display-content');
            const tContainer = document.getElementById('full-screen-timer');
            const iframe = document.getElementById('module-iframe');

            // --- ПЛАВНЫЕ ИНТЕРАКТИВЫ И ТАЙМЕРЫ ---
            if (isModule) {
                overlayState = 'MODULE';
                clearTimeout(timerDelayTimeout);
                
                // Плавно гасим заголовок
                dContent.style.opacity = '0';
                setTimeout(() => dContent.style.display = 'none', 1000);
                
                tContainer.style.opacity = '0';
                setTimeout(() => tContainer.style.display = 'none', 1000);

                // Загружаем и плавно показываем iframe
                if(!iframe.src.includes(state.active_module)) {
                    iframe.src = state.active_module.startsWith('http') ? state.active_module : `/${state.active_module}`;
                }
                
                if (iframe.style.display !== 'block') {
                    iframe.style.display = 'block';
                    void iframe.offsetWidth; // Reflow
                    iframe.style.opacity = '1';
                }

            } else if (isTimer && remain > 0) {
                // Если был открыт модуль - гасим его
                if (iframe.style.opacity === '1') {
                    iframe.style.opacity = '0';
                    setTimeout(() => { iframe.style.display = 'none'; iframe.src = 'about:blank'; }, 1000);
                }

                if (overlayState === 'TITLE') {
                    overlayState = 'WAITING_3S';
                    dContent.style.opacity = '0'; 
                    
                    timerDelayTimeout = setTimeout(() => {
                        if (overlayState === 'WAITING_3S') {
                            dContent.style.display = 'none';
                            overlayState = 'TIMER';
                            tContainer.style.display = 'flex';
                            void tContainer.offsetWidth; 
                            tContainer.style.opacity = '1'; 
                        }
                    }, 3000); 
                }

                if (overlayState === 'TIMER' || overlayState === 'WAITING_3S') {
                    if (!timerInterval) {
                        timerInterval = setInterval(() => {
                            const currentRemain = state.timer.end_time - (Date.now() / 1000);
                            
                            if (currentRemain <= 0 && overlayState === 'TIMER') {
                                overlayState = 'FADING_TIMER';
                                clearInterval(timerInterval);
                                timerInterval = null;
                                
                                tContainer.style.opacity = '0';
                                
                                setTimeout(() => {
                                    tContainer.style.display = 'none';
                                    overlayState = 'TITLE';
                                    dContent.style.display = 'block';
                                    void dContent.offsetWidth;
                                    dContent.style.opacity = '1'; 
                                    
                                    if (myRole === 'SCREEN') {
                                        socket.emit('host_trigger_sfx', { sfx: 'jingle' });
                                        socket.emit('timer_done');
                                    }
                                }, 1500); 
                            } else if (currentRemain > 0) {
                                document.getElementById('timer-val').innerText = formatTime(currentRemain);
                            }
                        }, 100);
                    }
                }
            } else {
                // ВОЗВРАТ НА ГЛАВНУЮ ЭКРАН (Все закрыто)
                if (iframe.style.opacity === '1') {
                    iframe.style.opacity = '0';
                    setTimeout(() => { iframe.style.display = 'none'; iframe.src = 'about:blank'; }, 1000);
                }

                clearTimeout(timerDelayTimeout);
                
                if (overlayState !== 'TITLE' && overlayState !== 'FADING_TIMER') {
                    overlayState = 'TITLE';
                    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
                    tContainer.style.opacity = '0';
                    setTimeout(() => tContainer.style.display = 'none', 1000);
                    
                    dContent.style.display = 'block';
                    void dContent.offsetWidth;
                    dContent.style.opacity = '1';
                }
            }

            // --- ОБНОВЛЕНИЕ ПУЛЬТА ---
            if (myRole === 'HOST') {
                document.getElementById('btn-play-toggle').innerText = state.is_playing ? '⏸' : '⏯';
            }

            // --- ОБНОВЛЕНИЕ МУЗЫКИ НА ЭКРАНЕ ---
            if (myRole === 'SCREEN' && bgAudio) {
                const trackUrl = CDN + state.current_track;
                if (!bgAudio.src.endsWith(state.current_track)) {
                    bgAudio.src = trackUrl;
                    bgAudio.currentTime = state.seek_position;
                    if (state.is_playing) {
                        bgAudio.volume = 0;
                        bgAudio.play().catch(()=>{});
                    }
                } else {
                    applyAudioState(state);
                }
            }
        });

        // --- ВОСПРОИЗВЕДЕНИЕ SFX С ДИНАМИЧЕСКОЙ ГРОМКОСТЬЮ ---
        socket.on('play_sfx_stream', (data) => {
            if (myRole === 'SCREEN') {
                const s = new Audio(CDN + data.file);
                // Громкость джингла берется прямо с индикатора! 
                // Но если громкость 3%, делаем чуть громче, чтобы было слышно.
                s.volume = targetVolume > 0.1 ? targetVolume : 0.6;
                s.play().catch(()=>{});
            }
        });

        function setVol(v, btn) {
            document.querySelectorAll('.control-row:first-child .btn-control').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            socket.emit('host_audio_control', { volume: v });
        }
        function setMood(m) { socket.emit('host_audio_control', { mood: m }); }
        function togglePlay() { socket.emit('host_audio_control', { toggle_play: true }); }
        function seekRelative(sec) { socket.emit('host_audio_control', { seek_relative: sec }); }
        function triggerSfx(type) { socket.emit('host_trigger_sfx', { sfx: type }); }

        function handleCloseClick() {
            socket.emit('switch_module', { module: '' });
            closeClickCount++;
            clearTimeout(closeClickTimer);
            if (closeClickCount >= 3) { openModal('end-event-modal'); closeClickCount = 0; }
            else { closeClickTimer = setTimeout(() => { closeClickCount = 0; }, 1200); }
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function confirmEnd() { socket.emit('switch_module', { module: '' }); socket.emit('host_audio_control', { toggle_play: true }); location.reload(); }
    </script>
</body>
</html>
