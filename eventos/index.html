<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Family Standard OS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

    <style>
        :root {
            --bg-black: #030712;
            --silver-light: #f3f4f6;
            --silver-main: #e5e7eb;
            --gold-light: #fffbeb;
            --gold-main: #f59e0b;
            --gold-glow: rgba(245, 158, 11, 0.4);
            --silver-glow: rgba(229, 231, 235, 0.35);
            --glass-card: rgba(15, 23, 42, 0.94);
            --glass-border: rgba(229, 231, 235, 0.25);
            --danger-red: #ef4444;
            --ios-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Plus Jakarta Sans", sans-serif;
            --top-height: 125px;
            --bottom-height: 110px;
        }

        * { 
            box-sizing: border-box; margin: 0; padding: 0; font-family: var(--ios-font);
            user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        }

        body { background: var(--bg-black); color: #f8fafc; min-height: 100vh; overflow: hidden; position: relative; }

        /* PARTICLES & GLOW */
        #particles-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .bg-glow { position: fixed; inset: 0; z-index: 2; background: radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.1) 0%, rgba(3, 7, 18, 0.96) 75%, #000000 100%); pointer-events: none; }

        /* HELLO OVERLAY (ПОКАЗЫВАЕТСЯ ТОЛЬКО ПОСЛЕ ВХОДА) */
        #hello-overlay {
            display: none; position: fixed; inset: 0; z-index: 99999; background: #000000;
            align-items: center; justify-content: center; opacity: 1; transition: opacity 0.6s ease;
        }
        .hello-title {
            font-family: 'Cinzel', serif; font-size: 4rem; font-weight: 900;
            background: linear-gradient(135deg, #ffffff 0%, #fffbeb 40%, #f59e0b 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px var(--gold-glow), 0 0 20px var(--silver-glow);
            animation: helloPulse 1.2s ease forwards;
        }
        @keyframes helloPulse { 0% { opacity: 0; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }

        /* AUTH CARD (ВСЕГДА ВИДНА ДО ВХОДА) */
        #auth-overlay { 
            position: fixed; inset: 0; z-index: 10000; 
            display: flex; align-items: center; justify-content: center; padding: 20px; 
        }
        .auth-card {
            background: var(--glass-card); border: 1px solid var(--glass-border); padding: 36px 28px;
            border-radius: 28px; width: 100%; max-width: 360px; text-align: center;
            box-shadow: 0 0 50px var(--gold-glow), 0 0 30px var(--silver-glow);
            backdrop-filter: blur(25px);
        }
        .auth-card.shake { animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; border-color: var(--danger-red); }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-7px, 0, 0); }
            40%, 60% { transform: translate3d(7px, 0, 0); }
        }

        .brand-header {
            font-family: 'Cinzel', serif; font-size: 2.3rem; font-weight: 900; letter-spacing: 2px;
            background: linear-gradient(135deg, #ffffff 0%, #fffbeb 30%, #e5e7eb 65%, #f59e0b 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 25px var(--gold-glow);
        }

        .auth-sub { color: #94a3b8; font-size: 0.88rem; margin: 10px 0 20px; }

        .auth-input {
            width: 100%; padding: 16px; border-radius: 14px; border: 1px solid var(--glass-border);
            background: rgba(3, 7, 18, 0.85); color: #fff; text-align: center; font-size: 1.25rem; font-weight: 800; outline: none; letter-spacing: 6px;
            user-select: text; -webkit-user-select: text;
        }
        .btn-gold {
            width: 100%; padding: 16px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-light) 40%, var(--gold-main) 100%);
            color: #000; font-weight: 800; font-size: 0.95rem; cursor: pointer; margin-top: 14px;
            box-shadow: 0 0 20px var(--gold-glow); transition: transform 0.15s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-gold:active { transform: scale(0.97); }

        /* HOST TOP BAR (AUDIO CONTROL + TRACK SOUNDBAR) */
        #host-top-bar {
            display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--top-height); z-index: 500;
            background: rgba(15, 23, 42, 0.96); border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px); padding: 8px 14px; flex-direction: column; gap: 6px; justify-content: center;
        }
        .control-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
        .btn-control {
            flex: 1; height: 34px; border-radius: 10px; border: 1px solid rgba(229, 231, 235, 0.18);
            background: rgba(30, 41, 59, 0.7); color: #ffffff; font-size: 0.78rem; font-weight: 800; cursor: pointer;
            transition: all 0.2s ease; display: inline-flex; align-items: center; justify-content: center;
        }
        .btn-control:active { transform: scale(0.95); }
        .btn-control.active { 
            background: linear-gradient(135deg, #ffffff 0%, var(--gold-main) 100%); color: #000; 
            border-color: #ffffff; box-shadow: 0 0 15px var(--gold-glow); 
        }

        /* SOUNDBAR TRACK DISPLAY */
        .track-info-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(3, 7, 18, 0.6); border: 1px solid rgba(245, 158, 11, 0.2);
            border-radius: 8px; padding: 4px 10px; font-size: 0.75rem; color: var(--gold-light); font-weight: 700;
        }

        .seek-container { display: flex; align-items: center; gap: 8px; width: 100%; margin: 1px 0; }
        .btn-play-pause {
            width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--glass-border);
            background: rgba(245, 158, 11, 0.2); color: var(--gold-light); font-size: 0.9rem;
            display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .seek-bar {
            flex: 1; -webkit-appearance: none; height: 5px; border-radius: 3px;
            background: rgba(255, 255, 255, 0.15); outline: none; cursor: pointer;
        }
        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
            background: var(--gold-main); cursor: pointer; box-shadow: 0 0 10px var(--gold-main);
        }

        .eq-bar-container { display: flex; align-items: flex-end; gap: 3px; height: 12px; }
        .eq-bar { width: 3px; background: var(--gold-main); border-radius: 2px; animation: eqAnim 1s ease-in-out infinite alternate; }
        .eq-bar:nth-child(2) { animation-delay: 0.2s; }
        .eq-bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes eqAnim { 0% { height: 3px; } 100% { height: 12px; } }

        /* HOST BOTTOM BAR */
        #host-bottom-bar {
            display: none; position: fixed; bottom: 0; left: 0; right: 0; height: var(--bottom-height); z-index: 500;
            background: rgba(15, 23, 42, 0.98); border-top: 1px solid var(--glass-border);
            backdrop-filter: blur(20px); padding: 8px 14px; flex-direction: column; gap: 6px; justify-content: center;
        }
        .launcher-row { display: flex; gap: 6px; width: 100%; }
        .btn-launch-trigger {
            flex: 1; height: 40px; border-radius: 12px; border: 1px solid var(--gold-main);
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25) 0%, rgba(229, 231, 235, 0.15) 100%);
            color: var(--gold-light); font-weight: 800; font-size: 0.82rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-close-interactive {
            display: inline-flex; flex: 1; height: 40px; border-radius: 12px; border: 1px solid var(--danger-red);
            background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-weight: 800; font-size: 0.82rem; cursor: pointer;
            align-items: center; justify-content: center; gap: 6px;
        }
        .btn-timer-add {
            padding: 0 12px; height: 40px; border-radius: 12px; border: 1px solid var(--gold-main);
            background: rgba(245, 158, 11, 0.2); color: var(--gold-light); font-weight: 800; font-size: 0.82rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex-shrink: 0;
        }

        .sfx-grid { display: flex; gap: 6px; width: 100%; }
        .sfx-btn {
            flex: 1; height: 38px; border-radius: 12px; border: 1px solid rgba(229, 231, 235, 0.2);
            background: rgba(30, 41, 59, 0.85); color: #fff; font-size: 1.2rem; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease;
        }
        .sfx-btn:active { transform: scale(0.92); }

        /* MODALS */
        .modal-overlay {
            display: none; position: fixed; inset: 0; z-index: 20000;
            background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(20px);
            align-items: center; justify-content: center; padding: 20px;
        }
        .modal-card {
            background: var(--glass-card); border: 1px solid var(--glass-border);
            border-radius: 28px; padding: 26px; width: 100%; max-width: 380px; text-align: center;
            box-shadow: 0 0 50px var(--gold-glow);
        }
        .modules-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
        .mod-btn {
            padding: 15px; border-radius: 14px; border: 1px solid var(--glass-border);
            background: rgba(30, 41, 59, 0.8); color: #fff; font-size: 0.92rem; font-weight: 800; cursor: pointer;
        }

        /* MAIN VIEWPORT */
        #main-viewport {
            display: none; position: fixed; inset: 0; z-index: 10; width: 100vw; height: 100vh;
            flex-direction: column; align-items: center; justify-content: center;
        }

        body.is-host #module-iframe {
            position: fixed;
            top: var(--top-height) !important;
            bottom: var(--bottom-height) !important;
            left: 0 !important; right: 0 !important;
            width: 100vw !important;
            height: calc(100vh - var(--top-height) - var(--bottom-height)) !important;
        }

        #module-iframe {
            display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; border: none; z-index: 15; background: #000;
        }

        #main-display-content {
            text-align: center; max-width: 600px; width: 100%; padding: 20px; z-index: 10;
        }
        .shimmer-title {
            font-family: 'Cinzel', serif; font-size: 3.2rem; font-weight: 900;
            background: linear-gradient(90deg, #ffffff 0%, #fffbeb 25%, #f59e0b 50%, #e5e7eb 75%, #ffffff 100%);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite; text-shadow: 0 0 35px var(--gold-glow);
        }
        @keyframes shine { to { background-position: 200% center; } }

        .subtitle-text { color: #94a3b8; font-size: 1.15rem; font-weight: 600; margin-top: 14px; letter-spacing: 1px; }

        /* MAIN DISPLAY COUNTDOWN TIMER BADGE */
        #main-timer-badge {
            display: none; position: fixed; top: 135px; z-index: 100;
            background: rgba(15, 23, 42, 0.92); border: 2px solid var(--gold-main);
            color: var(--gold-light); padding: 12px 28px; border-radius: 20px;
            font-family: 'Cinzel', serif; font-size: 2rem; font-weight: 900;
            box-shadow: 0 0 35px var(--gold-glow); backdrop-filter: blur(15px);
            animation: timerGlow 1s ease-in-out infinite alternate;
        }
        @keyframes timerGlow { 0% { box-shadow: 0 0 15px var(--gold-glow); } 100% { box-shadow: 0 0 35px var(--gold-glow); } }
    </style>
</head>
<body>

    <!-- PARTICLES & GLOW -->
    <canvas id="particles-canvas"></canvas>
    <div class="bg-glow"></div>

    <!-- HELLO OVERLAY (ПОКАЗЫВАЕТСЯ ТОЛЬКО ПОСЛЕ УСПЕШНОГО ВХОДА) -->
    <div id="hello-overlay"><div class="hello-title">Hello</div></div>

    <!-- AUTH CARD (ВСЕГДА ВИДНА ДО ВХОДА) -->
    <div id="auth-overlay">
        <div class="auth-card" id="auth-card">
            <div class="brand-header">EVENT OS</div>
            <p class="auth-sub">Введите PIN-код для входа</p>

            <input type="password" id="auth-input" class="auth-input" placeholder="ПИН-КОД" maxlength="6" autocomplete="off" onkeydown="if(event.key==='Enter') submitAuth()">
            <button onclick="submitAuth()" class="btn-gold">ВОЙТИ В УПРАВЛЕНИЕ</button>
        </div>
    </div>

    <!-- HOST TOP CONTROL BAR -->
    <div id="host-top-bar">
        <div class="track-info-bar">
            <div style="display: flex; align-items: center; gap: 6px;">
                <div class="eq-bar-container">
                    <div class="eq-bar"></div><div class="eq-bar"></div><div class="eq-bar"></div>
                </div>
                <span id="host-track-name">🍃 Лаундж (lounge.mp3)</span>
            </div>
            <span id="host-time-display">00:00 / 00:00</span>
        </div>

        <div class="seek-container">
            <button class="btn-play-pause" id="btn-play-toggle" onclick="togglePlayPause()">⏸</button>
            <input type="range" id="host-seek-bar" class="seek-bar" min="0" max="100" value="0" oninput="isUserSeeking=true" onchange="seekAudioTrack(this.value)">
        </div>

        <div class="control-row">
            <span style="font-size: 0.7rem; color: var(--gold-light); font-weight: 800; margin-right: 4px;">ГРОМКОСТЬ:</span>
            <button class="btn-control" onclick="setVolumeSmooth(0.1, this)">10%</button>
            <button class="btn-control" onclick="setVolumeSmooth(0.2, this)">20%</button>
            <button class="btn-control active" onclick="setVolumeSmooth(0.3, this)">30%</button>
            <button class="btn-control" onclick="setVolumeSmooth(0.6, this)">60%</button>
            <button class="btn-control" onclick="setVolumeSmooth(1.0, this)">100%</button>
        </div>

        <div class="control-row">
            <button class="btn-control" onclick="setMood('lounge')">🍃 Лаундж</button>
            <button class="btn-control" onclick="setMood('active')">🕺 Банкет</button>
            <button class="btn-control" onclick="setMood('party')">🎉 Движ</button>
        </div>
    </div>

    <!-- MAIN VIEWPORT -->
    <div id="main-viewport">
        <!-- COUNTDOWN TIMER BADGE ON MAIN DISPLAY -->
        <div id="main-timer-badge">⏱️ <span id="timer-val">00:10</span></div>

        <iframe id="module-iframe" src="about:blank"></iframe>
        
        <div id="main-display-content">
            <h1 class="shimmer-title" id="display-title">FAMILY STANDARD OS</h1>
            <p class="subtitle-text" id="display-subtitle">С праздником!</p>
        </div>
    </div>

    <!-- LAUNCHER MODAL -->
    <div class="modal-overlay" id="launcher-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 1.3rem;">➕ Выбор интерактива</h3>
            <div class="modules-grid" id="modules-list-box"></div>
            <button onclick="closeLauncherModal()" style="width: 100%; padding: 12px; border-radius: 12px; border: none; background: transparent; color: #94a3b8; margin-top: 14px; cursor: pointer; font-weight: 700;">Закрыть</button>
        </div>
    </div>

    <!-- END EVENT CONFIRM MODAL -->
    <div class="modal-overlay" id="end-event-modal">
        <div class="modal-card">
            <h3 style="color: var(--gold-light); font-family: 'Cinzel', serif; font-size: 1.2rem;">🏁 Завершить весь праздник?</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-top: 10px;">Сбросить управление, закрыть интерактивы и выйти?</p>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button onclick="confirmEndEvent()" class="btn-gold" style="margin: 0; background: var(--danger-red); color: #fff;">Завершить</button>
                <button onclick="closeEndEventModal()" style="flex: 1; padding: 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #fff; font-weight: 700; cursor: pointer;">Отмена</button>
            </div>
        </div>
    </div>

    <!-- HOST BOTTOM BAR -->
    <div id="host-bottom-bar">
        <div class="launcher-row">
            <button class="btn-launch-trigger" onclick="openLauncherModal()">
                <span>➕</span><span>ИНТЕРАКТИВ</span>
            </button>
            <button class="btn-close-interactive" onclick="handleCloseInteractiveClick()">
                <span>❌</span><span>ЗАКРЫТЬ</span>
            </button>
            <button class="btn-timer-add" onclick="addTimer10s()">
                <span>⏱️</span><span>+10 СЕК</span>
            </button>
        </div>
        <div class="sfx-grid">
            <button class="sfx-btn" onclick="triggerSfx('applause')" title="Аплодисменты">👏</button>
            <button class="sfx-btn" onclick="triggerSfx('fanfare')" title="Фанфары">🎉</button>
            <button class="sfx-btn" onclick="triggerSfx('correct')" title="Тыдыщ / Правильно">✅</button>
            <button class="sfx-btn" onclick="triggerSfx('wrong')" title="Ошибка / Неправильно">❌</button>
        </div>
    </div>

    <!-- DUAL AUDIO PLAYERS FOR CROSSFADE -->
    <audio id="audio-a" loop></audio>
    <audio id="audio-b" loop></audio>

    <script>
        const RENDER_SERVER_URL = "https://event-os-wqoa.onrender.com";
        const CDN_BASE_URL = "https://pub-372ba5f717cf4a8694558f47682d65d9.r2.dev/";

        const socket = io(RENDER_SERVER_URL, { 
            transports: ['polling', 'websocket'],
            reconnection: true,
            reconnectionAttempts: 10
        });

        let myRole = 'GUEST';
        let currentLoadedModule = '';
        let availableModules = [];
        let timerInterval = null;

        let closeClickCount = 0;
        let closeClickTimer = null;
        let isUserSeeking = false;

        const audioA = document.getElementById('audio-a');
        const audioB = document.getElementById('audio-b');
        let activeAudio = audioA;
        let inactiveAudio = audioB;
        let musicVolume = 0.3;
        let volumeFadeInterval = null;
        let playPauseFadeInterval = null;

        // --- 1. PARTICLES (120 FPS) ---
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.alpha = Math.random() * 0.6 + 0.1;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(245, 158, 11, ${this.alpha})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }
        for (let i = 0; i < 45; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        requestAnimationFrame(animateParticles);

        // --- 2. МГНОВЕННОЕ СКАТИВАНИЕ (КЭШИРОВАНИЕ) ВСЕХ ТРЕКОВ НА ЭКРАНЕ ПРОЕКТОРА ---
        function preloadAllTracks() {
            const tracks = ['lounge.mp3', 'active.mp3', 'party.mp3'];
            tracks.forEach(track => {
                const a = new Audio();
                a.src = CDN_BASE_URL + track;
                a.preload = 'auto';
                a.crossOrigin = 'anonymous';
            });
        }

        function triggerErrorShake() {
            const card = document.getElementById('auth-card');
            if (card) {
                card.classList.remove('shake');
                void card.offsetWidth;
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            }
            if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }

        function submitAuth() {
            const input = document.getElementById('auth-input');
            const val = input ? input.value.trim() : '';

            if (!val) {
                triggerErrorShake();
                return;
            }

            socket.emit('login', { pin: val });
        }

        // --- 3. SOCKET RESPONSES & HELLO OVERLAY ---
        socket.on('login_response', (res) => {
            if (res.success) {
                myRole = res.role;

                // СКАТИВАЕМ МУЗЫКУ ДЛЯ ЭКРАНА
                if (myRole === 'SCREEN') {
                    preloadAllTracks();
                }

                // ПОКАЗЫВАЕМ ПЛАВНЫЙ ЭКРАН "HELLO"
                const hello = document.getElementById('hello-overlay');
                document.getElementById('auth-overlay').style.display = 'none';
                hello.style.display = 'flex';

                setTimeout(() => {
                    hello.style.opacity = '0';
                    setTimeout(() => {
                        hello.style.display = 'none';
                        document.getElementById('main-viewport').style.display = 'flex';

                        if (myRole === 'HOST') {
                            document.body.classList.add('is-host');
                            document.getElementById('host-top-bar').style.display = 'flex';
                            document.getElementById('host-bottom-bar').style.display = 'flex';
                            startHostAudioTimer();
                        } else if (myRole === 'SCREEN') {
                            document.body.classList.add('is-screen');
                        }
                    }, 500);
                }, 1000);

            } else {
                triggerErrorShake();
                alert(res.message || 'Неверный PIN-код');
            }
        });

        socket.on('modules_config_update', (modules) => {
            availableModules = modules;
            renderModulesList();
        });

        function renderModulesList() {
            const box = document.getElementById('modules-list-box');
            if (!box) return;
            box.innerHTML = '';
            availableModules.forEach(m => {
                const btn = document.createElement('button');
                btn.className = 'mod-btn';
                btn.innerText = m.name;
                btn.onclick = () => {
                    socket.emit('switch_module', { module: m.path });
                    closeLauncherModal();
                };
                box.appendChild(btn);
            });
        }

        function formatTime(secs) {
            if (isNaN(secs) || secs < 0) return "00:00";
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
        }

        function startHostAudioTimer() {
            setInterval(() => {
                if (myRole === 'HOST' && activeAudio) {
                    const cur = activeAudio.currentTime || 0;
                    const dur = activeAudio.duration || 180;
                    document.getElementById('host-time-display').innerText = `${formatTime(cur)} / ${formatTime(dur)}`;
                    
                    if (!isUserSeeking) {
                        const seekBar = document.getElementById('host-seek-bar');
                        seekBar.max = Math.floor(dur);
                        seekBar.value = Math.floor(cur);
                    }
                }
            }, 500);
        }

        socket.on('state_update', (state) => {
            if (state.event_title) document.getElementById('display-title').innerText = state.event_title;
            if (state.event_subtitle) document.getElementById('display-subtitle').innerText = state.event_subtitle;

            if (musicVolume !== state.audio_volume) {
                applySmoothVolumeTransition(state.audio_volume);
            }

            if (state.active_module !== undefined && currentLoadedModule !== state.active_module) {
                loadModuleIframe(state.active_module);
            }

            // ОБНОВЛЕНИЕ ИНФОРМАЦИИ О ТРЕКЕ У ВЕДУЩЕГО
            const trackTitles = { "lounge.mp3": "🍃 Лаундж", "active.mp3": "🕺 Банкет", "party.mp3": "🎉 Движ" };
            const titleEl = document.getElementById('host-track-name');
            if (titleEl) titleEl.innerText = `${trackTitles[state.current_track] || 'Музыка'} (${state.current_track})`;

            // ОБРАБОТКА ТАЙМЕРА НА ГЛАВНОМ ЭКРАНЕ
            const timerBadge = document.getElementById('main-timer-badge');
            if (state.timer && state.timer.active) {
                timerBadge.style.display = 'block';
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                    const remaining = Math.max(0, Math.round(state.timer.end_time - (Date.now() / 1000)));
                    document.getElementById('timer-val').innerText = formatTime(remaining);
                    if (remaining <= 0) {
                        clearInterval(timerInterval);
                        if (myRole === 'SCREEN') triggerSfx('fanfare');
                    }
                }, 1000);
            } else {
                clearInterval(timerInterval);
                timerBadge.style.display = 'none';
                document.getElementById('timer-val').innerText = '00:10';
            }

            // ЗВУК И ПЕРЕМОТКА НА ЭКРАНЕ
            if (myRole === 'SCREEN') {
                const trackUrl = CDN_BASE_URL + state.current_track;
                const targetTime = state.seek_position || 0;

                const btnPlay = document.getElementById('btn-play-toggle');
                if (btnPlay) btnPlay.innerText = state.is_playing ? '⏸' : '▶';

                if (activeAudio.src !== trackUrl) {
                    performAudioCrossfade(trackUrl, targetTime);
                } else {
                    if (Math.abs(activeAudio.currentTime - targetTime) > 2) {
                        activeAudio.currentTime = targetTime;
                    }
                    if (state.is_playing && activeAudio.paused) smoothFadePlay();
                    else if (!state.is_playing && !activeAudio.paused) smoothFadePause();
                }
            }
        });

        function setMood(mood) {
            socket.emit('host_audio_control', {
                mood: mood,
                current_time: activeAudio.currentTime || 0
            });
        }

        function seekAudioTrack(val) {
            isUserSeeking = false;
            socket.emit('host_audio_control', { seek: parseFloat(val) });
        }

        function performAudioCrossfade(newTrackUrl, targetTime) {
            inactiveAudio.src = newTrackUrl;
            inactiveAudio.crossOrigin = "anonymous";
            inactiveAudio.preload = "auto";
            inactiveAudio.volume = 0;

            const startPlayback = () => {
                if (targetTime > 0 && inactiveAudio.duration && targetTime < inactiveAudio.duration) {
                    inactiveAudio.currentTime = targetTime;
                }
                inactiveAudio.play().then(() => {
                    let step = 0; const steps = 20;
                    const crossfadeInterval = setInterval(() => {
                        step++;
                        const progress = step / steps;
                        activeAudio.volume = Math.max(0, musicVolume * (1 - progress));
                        inactiveAudio.volume = Math.min(musicVolume, musicVolume * progress);

                        if (step >= steps) {
                            clearInterval(crossfadeInterval);
                            activeAudio.pause();
                            const temp = activeAudio;
                            activeAudio = inactiveAudio;
                            inactiveAudio = temp;
                        }
                    }, 40);
                }).catch(() => {});
            };

            if (inactiveAudio.readyState >= 1) {
                startPlayback();
            } else {
                inactiveAudio.onloadedmetadata = () => {
                    startPlayback();
                    inactiveAudio.onloadedmetadata = null;
                };
            }
        }

        function smoothFadePlay() {
            clearInterval(playPauseFadeInterval);
            activeAudio.volume = 0;
            activeAudio.play().then(() => {
                let step = 0; const steps = 20;
                playPauseFadeInterval = setInterval(() => {
                    step++;
                    activeAudio.volume = Math.min(musicVolume, musicVolume * (step / steps));
                    if (step >= steps) clearInterval(playPauseFadeInterval);
                }, 40);
            }).catch(() => {});
        }

        function smoothFadePause() {
            clearInterval(playPauseFadeInterval);
            let step = 0; const steps = 20;
            const startVol = activeAudio.volume;
            playPauseFadeInterval = setInterval(() => {
                step++;
                activeAudio.volume = Math.max(0, startVol * (1 - step / steps));
                if (step >= steps) {
                    clearInterval(playPauseFadeInterval);
                    activeAudio.pause();
                }
            }, 40);
        }

        function applySmoothVolumeTransition(targetVol) {
            musicVolume = targetVol;
            if (myRole !== 'SCREEN') return;

            clearInterval(volumeFadeInterval);
            const startVol = activeAudio.volume;
            const diff = targetVol - startVol;
            let step = 0; const steps = 20;

            volumeFadeInterval = setInterval(() => {
                step++;
                activeAudio.volume = Math.max(0, Math.min(1, startVol + (diff * (step / steps))));
                if (step >= steps) {
                    clearInterval(volumeFadeInterval);
                    activeAudio.volume = targetVol;
                }
            }, 25);
        }

        socket.on('play_sfx_stream', (data) => {
            if (myRole === 'SCREEN') {
                const sfxAudio = new Audio(CDN_BASE_URL + data.file);
                sfxAudio.volume = 0.6;
                sfxAudio.play().catch(() => {});
            }
        });

        function loadModuleIframe(modulePath) {
            currentLoadedModule = modulePath;
            const iframe = document.getElementById('module-iframe');
            const displayContent = document.getElementById('main-display-content');

            if (modulePath && modulePath.length > 0) {
                iframe.src = modulePath.startsWith('http') ? modulePath : `/${modulePath}`;
                iframe.style.display = 'block';
                displayContent.style.display = 'none';
            } else {
                iframe.style.display = 'none';
                iframe.src = 'about:blank';
                displayContent.style.display = 'block';
            }
        }

        function handleCloseInteractiveClick() {
            socket.emit('switch_module', { module: '' });

            closeClickCount++;
            clearTimeout(closeClickTimer);

            if (closeClickCount >= 3) {
                openEndEventModal();
                closeClickCount = 0;
            } else {
                closeClickTimer = setTimeout(() => { closeClickCount = 0; }, 1500);
            }
        }

        function setVolumeSmooth(vol, btn) {
            document.querySelectorAll('#host-top-bar .btn-control').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            socket.emit('host_audio_control', { volume: vol });
        }

        function togglePlayPause() { socket.emit('host_audio_control', { toggle_play: true }); }
        function triggerSfx(sfxType) { socket.emit('host_trigger_sfx', { sfx: sfxType }); }
        function addTimer10s() { socket.emit('add_timer_10s'); }

        function openLauncherModal() { document.getElementById('launcher-modal').style.display = 'flex'; }
        function closeLauncherModal() { document.getElementById('launcher-modal').style.display = 'none'; }
        
        function openEndEventModal() { document.getElementById('end-event-modal').style.display = 'flex'; }
        function closeEndEventModal() { document.getElementById('end-event-modal').style.display = 'none'; }
        
        function confirmEndEvent() {
            socket.emit('switch_module', { module: '' });
            socket.emit('host_audio_control', { volume: 0 });
            location.reload();
        }
    </script>
</body>
</html>
