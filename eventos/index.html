<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Event OS — Control Center</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Загружаем Socket.IO напрямую с нашего сервера без сторонних CDN -->
    <script src="/socket.io/socket.io.js"></script>

    <style>
        :root {
            --bg-black: #030712;
            --gold-light: #fff3a1;
            --gold-main: #f59e0b;
            --gold-dark: #b45309;
            --glass-card: rgba(15, 23, 42, 0.85);
            --glass-border: rgba(245, 158, 11, 0.3);
            --text-main: #f8fafc;
            --danger-red: #ef4444;
            --success-green: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            background: var(--bg-black);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- SPLASH SCREEN --- */
        #view-splash {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #000000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .splash-title {
            font-family: 'Cinzel', serif;
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff3a1 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(245, 158, 11, 0.5);
            animation: flicker 1.2s ease-in-out infinite alternate;
        }

        .splash-sub {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-top: 15px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes flicker {
            0% { opacity: 0.8; transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1.02); }
        }

        /* --- LOGIN FORM --- */
        #view-login {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #0f172a 0%, var(--bg-black) 100%);
        }

        .server-status-dot {
            font-size: 0.8rem;
            color: #ef4444;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            justify-content: center;
            font-weight: 700;
        }

        .login-card {
            background: var(--glass-card);
            border: 1px solid var(--glass-border);
            padding: 36px 28px;
            border-radius: 28px;
            width: 100%;
            max-width: 390px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(245, 158, 11, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .login-card.shake {
            animation: shake 0.4s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            border-color: var(--danger-red);
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .brand-logo {
            font-family: 'Cinzel', serif;
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 3px;
            margin-bottom: 6px;
            cursor: pointer;
            user-select: none;
            display: inline-block;
            background: linear-gradient(135deg, #fff3a1 0%, #f59e0b 50%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
            transition: transform 0.15s ease;
        }

        .brand-logo:active { transform: scale(0.92); }

        .card-subtitle {
            color: #94a3b8;
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        .admin-badge {
            display: none;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .input-group { margin-bottom: 14px; }

        input.input-field {
            width: 100%;
            padding: 18px 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            background: rgba(3, 7, 18, 0.8);
            color: #ffffff;
            font-size: 1.05rem;
            font-weight: 600;
            outline: none;
            text-align: center;
        }

        input.input-field:focus {
            border-color: var(--gold-main);
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.3);
        }

        .error-toast {
            color: var(--danger-red);
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: none;
        }

        button.btn-primary {
            width: 100%;
            padding: 18px;
            border-radius: 16px;
            border: none;
            background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-main) 100%);
            color: #030712;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(245, 158, 11, 0.3);
        }

        button.btn-primary:active { transform: scale(0.97); }

        /* --- VIEWS --- */
        #view-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000000;
            text-align: center;
            padding: 40px;
        }

        .screen-badge {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--gold-main);
            color: var(--gold-light);
            padding: 8px 24px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .screen-title {
            font-family: 'Cinzel', serif;
            font-size: 3.8rem;
            color: #ffffff;
            text-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
        }

        #view-host {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            pointer-events: none;
        }

        .host-interactive { pointer-events: auto; }

        #host-top-music {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 95px;
            background: rgba(3, 7, 18, 0.96);
            border-bottom: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 110;
        }

        .music-controls-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
        }

        .btn-vol {
            flex: 1;
            padding: 10px 4px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(30, 41, 59, 0.7);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
        }

        .btn-vol.active {
            background: var(--gold-main);
            color: #030712;
            border-color: var(--gold-light);
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.4);
        }

        .emotion-select {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            background: rgba(15, 23, 42, 0.95);
            color: var(--gold-light);
            font-size: 0.8rem;
            font-weight: 700;
            outline: none;
        }

        #host-right-soundboard {
            position: fixed;
            top: 95px; right: 0; bottom: 0;
            width: 115px;
            background: rgba(3, 7, 18, 0.94);
            border-left: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 110;
        }

        .sfx-btn {
            width: 100%;
            padding: 14px 6px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 800;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .sfx-btn .tap-counter {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--gold-main);
        }

        .sfx-btn.tap-1 { border-color: #f59e0b; background: rgba(245, 158, 11, 0.3); }
        .sfx-btn.tap-2 { border-color: #ef4444; background: rgba(239, 68, 68, 0.45); }

        #host-modules-container {
            position: fixed;
            top: 100px; left: 10px; right: 125px; bottom: 20px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 10px;
        }

        #view-guest {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 50;
            padding: 20px;
            text-align: center;
            background: radial-gradient(circle at center, #0f172a 0%, var(--bg-black) 100%);
        }
    </style>
</head>
<body>

    <div id="view-splash">
        <div class="splash-title" id="splash-title">EVENT OS</div>
        <div class="splash-sub" id="splash-sub">ПРИВЕТСТВУЕТ ВАС</div>
    </div>

    <div id="view-login">
        <div class="login-card" id="login-card">
            <div class="server-status-dot" id="server-status">
                <span id="status-icon">🔴</span> <span id="status-text">Соединение с сервером...</span>
            </div>
            
            <div id="admin-badge" class="admin-badge">Режим управления</div>
            <div class="brand-logo" id="brand-logo" onclick="handleLogoTap()">EVENT OS</div>
            <p class="card-subtitle" id="card-subtitle">Введите имя для входа в лобби</p>
            
            <div class="input-group">
                <input type="text" id="main-input" class="input-field" placeholder="Ваше имя" autocomplete="off" maxlength="25" onkeydown="if(event.key==='Enter') submitEntry()">
            </div>
            
            <div id="error-toast" class="error-toast">Пожалуйста, используйте корректное имя</div>

            <button class="btn-primary" id="btn-submit" onclick="submitEntry()">ВОЙТИ</button>
        </div>
    </div>

    <div id="view-screen">
        <div class="screen-badge" id="screen-badge">Заставка</div>
        <div class="screen-title" id="screen-title">Загрузка...</div>
    </div>

    <div id="view-host">
        <div id="host-top-music" class="host-interactive">
            <div class="music-controls-row">
                <span style="font-size: 0.75rem; color: var(--gold-light); font-weight: 800;">🔊 ГРОМКОСТЬ:</span>
                <button class="btn-vol" onclick="setVolume(0, this)">0%</button>
                <button class="btn-vol active" onclick="setVolume(0.4, this)">40%</button>
                <button class="btn-vol" onclick="setVolume(0.7, this)">70%</button>
                <button class="btn-vol" onclick="setVolume(1.0, this)">100%</button>
            </div>
            <select class="emotion-select" onchange="setEmotion(this.value)">
                <option value="lounge">🍃 Настроение: Лаундж / Встреча</option>
                <option value="dinner">🕺 Настроение: Повеселее / Банкет</option>
                <option value="party">🎉 Настроение: Движ / Конкурсы</option>
            </select>
        </div>

        <div id="host-right-soundboard" class="host-interactive">
            <div class="sfx-btn" onclick="handleSfxTap('applause', this)">
                <span>👏 Аплодисменты</span>
                <span class="tap-counter">0/3</span>
            </div>
            <div class="sfx-btn" onclick="handleSfxTap('fanfare', this)">
                <span>🎉 Фанфары</span>
                <span class="tap-counter">0/3</span>
            </div>
            <div class="sfx-btn" onclick="handleSfxTap('correct', this)">
                <span>✅ Тыдыщ!</span>
                <span class="tap-counter">0/3</span>
            </div>
            <div class="sfx-btn" onclick="handleSfxTap('wrong', this)">
                <span>❌ Ошибка</span>
                <span class="tap-counter">0/3</span>
            </div>
        </div>

        <div id="host-modules-container" class="host-interactive"></div>
    </div>

    <div id="view-guest">
        <h2 style="color: var(--gold-light); margin-top: 60px; font-family: 'Cinzel', serif; font-size: 2.2rem;">EVENT OS</h2>
        <p style="color: #94a3b8; margin-top: 15px; font-size: 1.1rem;" id="guest-welcome-msg">Ожидайте запуска интерактивов от Ведущего.</p>
    </div>

    <script>
        let socket = null;

        function updateStatus(isOk, text) {
            const icon = document.getElementById('status-icon');
            const label = document.getElementById('status-text');
            const container = document.getElementById('server-status');
            if (icon && label && container) {
                icon.innerText = isOk ? '🟢' : '🔴';
                label.innerText = text;
                container.style.color = isOk ? '#22c55e' : '#ef4444';
            }
        }

        try {
            if (typeof io !== 'undefined') {
                socket = io({
                    transports: ['polling', 'websocket'],
                    reconnection: true,
                    reconnectionDelay: 1000
                });

                socket.on('connect', () => {
                    updateStatus(true, 'Сервер онлайн');
                });

                socket.on('disconnect', () => {
                    updateStatus(false, 'Переподключение...');
                });

                socket.on('connect_error', () => {
                    updateStatus(false, 'Ошибка подключения к серверу');
                });

                socket.on('login_response', (data) => {
                    if (data.success) {
                        document.getElementById('view-login').style.display = 'none';
                        const currentRole = data.role;

                        const splash = document.getElementById('view-splash');
                        const splashSub = document.getElementById('splash-sub');
                        if (splash) splash.style.display = 'flex';

                        setTimeout(() => {
                            if (splashSub) splashSub.innerText = 'HELLO';
                        }, 900);

                        setTimeout(() => {
                            if (splash) splash.style.display = 'none';

                            if (currentRole === 'HOST') {
                                document.getElementById('view-screen').style.display = 'flex';
                                document.getElementById('view-host').style.display = 'block';
                            } else if (currentRole === 'SCREEN') {
                                document.getElementById('view-screen').style.display = 'flex';
                            } else {
                                document.getElementById('view-guest').style.display = 'block';
                                if (data.name) {
                                    document.getElementById('guest-welcome-msg').innerText = `Привет, ${data.name}! Вы в лобби вечера.`;
                                }
                            }
                        }, 1800);

                    } else {
                        showError(data.message || 'Неверный код доступа');
                    }
                });

                socket.on('state_update', (state) => {
                    if (state.screen_text) document.getElementById('screen-title').innerText = state.screen_text;
                    if (state.screen_badge) document.getElementById('screen-badge').innerText = state.screen_badge;
                });

                socket.on('play_sfx_on_screen', (data) => {
                    console.log("🔊 SFX:", data.sfx);
                });

            } else {
                updateStatus(false, 'Скрипт сокетов не загружен');
            }
        } catch (e) {
            console.error("Socket error:", e);
            updateStatus(false, 'Ошибка инициализации');
        }

        const PROFANITY_REGEX = /хуй|пизд|еба|еб|бля|сук|чмо|говн|урод|шлюх|пидор|гандон|fuck|shit|bitch|asshole|cunt/i;

        let logoTapCount = 0;
        let logoTapTimer = null;
        let isAdminMode = false;

        function handleLogoTap() {
            logoTapCount++;
            clearTimeout(logoTapTimer);

            const logo = document.getElementById('brand-logo');
            if (logo) logo.style.transform = `scale(${1 + logoTapCount * 0.04})`;

            if (logoTapCount >= 5) {
                toggleAdminMode();
                logoTapCount = 0;
                if (logo) logo.style.transform = 'scale(1)';
            } else {
                logoTapTimer = setTimeout(() => {
                    logoTapCount = 0;
                    if (logo) logo.style.transform = 'scale(1)';
                }, 1800);
            }
        }

        function toggleAdminMode() {
            isAdminMode = !isAdminMode;
            const cardSubtitle = document.getElementById('card-subtitle');
            const mainInput = document.getElementById('main-input');
            const adminBadge = document.getElementById('admin-badge');
            const errorToast = document.getElementById('error-toast');

            if (errorToast) errorToast.style.display = 'none';
            if (mainInput) mainInput.value = '';

            if (isAdminMode) {
                if (adminBadge) adminBadge.style.display = 'inline-block';
                if (cardSubtitle) {
                    cardSubtitle.innerText = 'Режим управления';
                    cardSubtitle.style.color = '#f59e0b';
                }
                if (mainInput) {
                    mainInput.placeholder = 'Код доступа';
                    mainInput.type = 'password';
                }
            } else {
                if (adminBadge) adminBadge.style.display = 'none';
                if (cardSubtitle) {
                    cardSubtitle.innerText = 'Введите имя для входа в лобби';
                    cardSubtitle.style.color = '#94a3b8';
                }
                if (mainInput) {
                    mainInput.placeholder = 'Ваше имя';
                    mainInput.type = 'text';
                }
            }
        }

        function submitEntry() {
            const inputVal = document.getElementById('main-input').value.trim();

            if (!inputVal) {
                showError('Поле не может быть пустым');
                return;
            }

            const payload = isAdminMode ? { pin: inputVal } : { name: inputVal };

            if (!isAdminMode && PROFANITY_REGEX.test(inputVal)) {
                showError('Пожалуйста, используйте корректное имя');
                return;
            }

            if (socket && socket.connected) {
                socket.emit('login', payload);
            } else if (socket) {
                showError('Соединяемся с сервером... Попробуйте через секунду');
                socket.connect();
            } else {
                showError('Сокет недоступен');
            }
        }

        function showError(msg) {
            const errorToast = document.getElementById('error-toast');
            const loginCard = document.getElementById('login-card');

            if (errorToast) {
                errorToast.innerText = msg;
                errorToast.style.display = 'block';
            }

            if (loginCard) {
                loginCard.classList.remove('shake');
                void loginCard.offsetWidth;
                loginCard.classList.add('shake');

                setTimeout(() => {
                    loginCard.classList.remove('shake');
                }, 500);
            }
        }

        function setVolume(vol, btn) {
            document.querySelectorAll('.btn-vol').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            if (socket) socket.emit('host_audio_control', { volume: vol });
        }

        function setEmotion(emotion) {
            if (socket) socket.emit('host_audio_control', { emotion: emotion });
        }

        const sfxTaps = {};
        const sfxTimers = {};

        function handleSfxTap(sfxType, btnEl) {
            if (!sfxTaps[sfxType]) sfxTaps[sfxType] = 0;
            sfxTaps[sfxType]++;
            const counterEl = btnEl ? btnEl.querySelector('.tap-counter') : null;
            clearTimeout(sfxTimers[sfxType]);

            if (sfxTaps[sfxType] === 1) {
                if (btnEl) btnEl.classList.add('tap-1');
                if (counterEl) counterEl.innerText = '1/3';
            } else if (sfxTaps[sfxType] === 2) {
                if (btnEl) {
                    btnEl.classList.remove('tap-1');
                    btnEl.classList.add('tap-2');
                }
                if (counterEl) counterEl.innerText = '2/3';
            } else if (sfxTaps[sfxType] >= 3) {
                if (socket) socket.emit('host_trigger_sfx', { sfx: sfxType });
                sfxTaps[sfxType] = 0;
                if (btnEl) btnEl.classList.remove('tap-1', 'tap-2');
                if (counterEl) counterEl.innerText = '0/3';
                return;
            }

            sfxTimers[sfxType] = setTimeout(() => {
                sfxTaps[sfxType] = 0;
                if (btnEl) btnEl.classList.remove('tap-1', 'tap-2');
                if (counterEl) counterEl.innerText = '0/3';
            }, 1500);
        }
    </script>
</body>
</html>
